synchronization:
  input:
    Block use/break use actual submitted token+received BlockChangedAck. Other
    submission-only verbs still fence with two unique received /tell replies at20-tick
    pacing; this40tick fence is NOT suitable for short cooldown, invulnerability or
    precise timing clauses, which remain explicitly partial.
  world:
    ensure_loaded received chunk fence; arena y180 avoids deployed economy y60..100
    zone.
  boundary: ctx.boundary called once after first behavioral check.
death_lanes:
  vanilla:
    Exact @vanilla profile excludes graves; compare inventory+armor+offhand+cursor
    ground custody, XP drop/reset.
  live:
    Exact @live full set; <=27 distinct stacks become grave barrel custody without
    ground duplicate; XP retention per deployed code/README.
  selection:
    ctx.factors.plugin_profile checked against actual enabled_plugins; canonical
    shared runner validates plugin_set.
  execution:
    Historical exact @vanilla/@live keep_inventory_false rows blocked on
    old component capability, not rerun here. New supplemental keep_inventory_true
    passes7 actual custody/respawn/level checks with all10 deployed plugins; does
    not prove graves capture or vanillaXP drop/multiplicity.
