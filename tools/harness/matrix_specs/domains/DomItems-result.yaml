      Warden sonic attack reports minecraft:magic, not minecraft:sonic_boom. Six
      required damage identities absent; not claiming every physical mechanism absent.
    report: damage-bugs.md
  - subjects:
      - items.totem_of_undying
    evidence: deploy-final/crates/mc-core/src/tick/damage.rs:258-259,332-339
    repro:
      Lethal instant_damage with held totem directly reaches death path without
      totem interception. /kill and void are intentionally not used as totem tests.
    report: items-bugs.md
  - subjects:
      - death_respawn.death_message
    evidence: deploy-final/crates/mc-core/src/tick/damage.rs:393-438
    repro:
      /kill emits English death text instead of death.attack.genericKill translation.
      show_death_messages=false suppresses the dying player Died event too.
    report: death_respawn-bugs.md
