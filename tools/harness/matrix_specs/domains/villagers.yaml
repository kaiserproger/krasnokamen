schema: krasnokamen-domain-spec-1
domain: villagers
minecraft_version: 26.1.2
executable_interface: tools/harness/matrix_api.py; plain Python adapters; this YAML is specification only, not an
  interpreter/runner
server_source_root: /run/media/kaiserroman/games/solaris-work/wt/deploy-final/
vanilla_data_root: /run/media/kaiserroman/games/solaris-work/solaris/data/vanilla/
query_capabilities:
  data_get_entity: /run/media/kaiserroman/games/solaris-work/wt/deploy-final/crates/mc-core/src/command_blocks.rs:245-259
    (absent in original frozen server; DataCommands implementation pending)
  data_get_block: /run/media/kaiserroman/games/solaris-work/wt/deploy-final/crates/mc-core/src/command_blocks.rs:282-287
    (only command-block NBT in original frozen server)
  execute_store: /run/media/kaiserroman/games/solaris-work/wt/deploy-final/crates/mc-core/src/command_context.rs:473
  execute_if_entity: /run/media/kaiserroman/games/solaris-work/wt/deploy-final/crates/mc-core/src/command_context.rs:217
  execute_if_block: /run/media/kaiserroman/games/solaris-work/wt/deploy-final/crates/mc-core/src/command_context.rs:218-230
  settlement_economy_snapshot: /run/media/kaiserroman/games/solaris-work/wt/deploy-final/crates/mc-core/src/settlements/economy_commands.rs:84-104
    (only aggregate status counts exposed, not job/quote/payroll/shipment fields)
context_contract:
- Driver applies every matrix context factor before setup.
- Do not override selected mode,dimension,op level,difficulty in fixtures; explicit tested difficulty transition
  is action.
- Every real adapter invokes ctx.boundary once after acknowledgement.
- Only live receipt checks establish coverage; presence of spec or adapter never sets pass.
- Random-spawn observation with no positive sample remains inconclusive unless fixture proves every admission precondition.
- Fixtures use Y200 outside full-set shop auto-open Y60..100; driver residency is fenced by actual received chunks.
subjects:
- subject: villagers.profession_Armorer
  scenario_ids:
  - pw:villagers.profession_Armorer/fabric_krasnokamen_loader/adventure/overworld/easy/2/disconnect_during_menu/hot_backup_during_action/op_1
  preconditions:
  - &id001
    console: execute in ${dimension} run fill -16 199 -16 16 199 16 stone
  - &id002
    console: execute in ${dimension} run fill -16 200 -16 16 215 16 air
  - &id003
    console: execute in ${dimension} run tp ${actor} 0.5 200 0.5
  - console: summon villager 3 200 0 {CustomName:"MatrixVillager",VillagerData:{profession:"minecraft:armorer",level:1,type:"minecraft:plains"}}
  - console: setblock 4 200 0 blast_furnace
  - console: time set 2000
  - console: give ${actor} emerald 64
  actions:
  - verb: interact_entity
    target: MatrixVillager
  - verb: select_trade
    index: 0
  - verb: click_slot
    kind: pickup
    slot: 2
    button: 0
  - verb: close_container
  oracle:
  - name: profession
    query: data get entity @e[name=MatrixVillager,limit=1] VillagerData.profession
    operator: equals
    expected: minecraft:armorer
    source: https://minecraft.wiki/w/Villager#Professions
  - name: trade_table
    query: data get entity @e[name=MatrixVillager,limit=1] Offers.Recipes
    operator: all_in
    expected: 26.1.2 novice Armorer trades
    source: https://minecraft.wiki/w/Trading#Armorer
  - name: exact_custody
    query: actor inventory after-before and offer.uses after-before
    operator: equals
    expected: selected input1/input2 debited once; selected output credited once; uses incremented1
    source: https://minecraft.wiki/w/Trading
  required_capabilities:
  - data_get_entity
  - interact_entity
  - inventory_snapshot
  - merchant_offers
  - select_trade
  source:
  - https://minecraft.wiki/w/Villager#Professions
  server_gap:
  - QUERY-ENTITY-DATA
  adapter: tools/harness/matrix_domains/villagers.py
  status: adapter_requires_live_validation
  adapter_completeness: real_but_partial
  remaining_oracle_clauses:
  - Exact vanilla trade-table identity and work-loop evidence; server-advertised recipe custody alone is not the
    full oracle.
