schema: solaris-domain-spec-1
domain: mobs
minecraft_version: 26.1.2
executable_interface: tools/harness/matrix_api.py; plain Python adapters; this YAML is specification only, not an
  interpreter/runner
server_source_root: /run/media/kaiserroman/games/solaris-work/wt/deploy-final/
vanilla_data_root: /run/media/kaiserroman/games/solaris-work/solaris/data/vanilla/
query_capabilities:
  data_get_entity: /run/media/kaiserroman/games/solaris-work/wt/deploy-final/crates/mc-core/src/command_blocks.rs:245-259
    (absent in original frozen server; DataCommands implementation pending)
  data_get_block: /run/media/kaiserroman/games/solaris-work/wt/deploy-final/crates/mc-core/src/command_blocks.rs:282-287
    (only command-block NBT in original frozen server)
  execute_store: /run/media/kaiserroman/games/solaris-work/wt/deploy-final/crates/mc-core/src/command_context.rs:473
  execute_if_entity: /run/media/kaiserroman/games/solaris-work/wt/deploy-final/crates/mc-core/src/command_context.rs:217
  execute_if_block: /run/media/kaiserroman/games/solaris-work/wt/deploy-final/crates/mc-core/src/command_context.rs:218-230
  settlement_economy_snapshot: /run/media/kaiserroman/games/solaris-work/wt/deploy-final/crates/mc-core/src/settlements/economy_commands.rs:84-104
    (only aggregate status counts exposed, not job/quote/payroll/shipment fields)
context_contract:
- Driver applies every matrix context factor before setup.
- Do not override selected mode,dimension,op level,difficulty in fixtures; explicit tested difficulty transition
  is action.
- Every real adapter invokes ctx.boundary once after acknowledgement.
- Only live receipt checks establish coverage; presence of spec or adapter never sets pass.
- Random-spawn observation with no positive sample remains inconclusive unless fixture proves every admission precondition.
- Fixtures use Y200 outside full-set shop auto-open Y60..100; driver residency is fenced by actual received chunks.
subjects:
- subject: mobs.allay
  scenario_ids:
  - pw:mobs.allay/fabric_distant_horizons/spectator/the_end/hard/N8/normal/save_all_checkpoint/op_4
  preconditions:
  - &id001
    console: execute in ${dimension} run fill -16 199 -16 16 199 16 stone
  - &id002
    console: execute in ${dimension} run fill -16 200 -16 16 215 16 air
  - &id003
    console: execute in ${dimension} run tp ${actor} 0.5 200 0.5
  - console: gamerule doMobSpawning false
  - console: time set midnight
  - console: weather clear
  - console: execute in ${dimension} run summon minecraft:allay 6.5 200 0.5 {CustomName:"MatrixMob",PersistenceRequired:1b}
  actions:
  - verb: wait_ticks
    ticks: 600
    clock: dashboard.simulation_tick
    collect:
    - entity position samples
    - actor health
    - projectile spawn events
    - entity metadata
  - verb: look_at
    target: MatrixMob
  - verb: attack
    target: MatrixMob
    when: actor is not spectator
  - verb: wait_ticks
    ticks: 100
    clock: dashboard.simulation_tick
  - verb: attack
    target: MatrixMob
    repeat_until: entity death observed
    when: actor can damage entity
    maximum_ticks: 600
  - verb: teleport_to
    position: last observed death position
    when: actor can pick up drops
  - verb: wait_ticks
    ticks: 40
    clock: dashboard.simulation_tick
  oracle:
  - name: summon_type
    query: execute if entity @e[type=minecraft:allay,name=MatrixMob] run say MatrixMobPresent
    operator: marker_present
    expected: true
    source: https://minecraft.wiki/w/Allay
  - name: movement_policy
    query: maximum horizontal displacement of the same UUID over600 ticks, after initial gravity settlement
    operator: greater_than
    expected: 0.2
    source: https://minecraft.wiki/w/Allay
    coverage_limit: Positive trajectory witnesses the named movement family; habitat/flight/pathfinding detail needs
      received on_ground, fluid occupancy and collision samples. A no-motion stochastic timeout is not proof of
      a server bug.
  - name: combat_policy
    query: received attack damage / species projectile events against an eligible target (protected player modes
      use no-damage negative oracle)
    operator: event_count
    expected: 0
    source: https://minecraft.wiki/w/Allay
  - name: loot_table
    query: item entity stacks plus actor inventory delta after kill; no environmental fire; empty equipment; player-kill
      condition from actual attacker
    operator: matches_vanilla_loot_table
    expected:
      path: /run/media/kaiserroman/games/solaris-work/solaris/data/vanilla/data/minecraft/loot_table/entities/allay.json
      sha256: 7b9094a5a6219f59024e36c508633acaecb0302bd5032d2ad76e063b6fe16b60
      direct_item_ids: []
    source: /run/media/kaiserroman/games/solaris-work/solaris/data/vanilla/data/minecraft/loot_table/entities/allay.json
    coverage_limit: Adapter validates no-looting,nonburning,adult fixture item-count bounds from exact26.1.2 JSON
      and conservation, not RNG probabilities or every item component.
  required_capabilities:
  - dashboard:simulation_tick
  - entity_combat_events
  - entity_identity
  - entity_trajectory
  - item_entity_stacks
  - snapshot:entities
  - snapshot:entities.item
  - snapshot:entities.health
  - snapshot:entities.spawn_position
  source:
  - https://minecraft.wiki/w/Allay
  - /run/media/kaiserroman/games/solaris-work/solaris/data/vanilla/data/minecraft/loot_table/entities/allay.json
  server_gap: []
  matrix_oracle_corrections: []
  context_rules:
    peaceful: If the vanilla species despawns in peaceful, assert absence instead of motion/combat; neutral persistent
      species are not inferred from MobCategory alone.
    creative_spectator: No player targeting/damage; attack by spectator has no effect.
    cross_dimension_conversion: 'piglin/piglin_brute/hoglin in overworld or end: assert zombification after 300
      ticks, track replacement identity rather than require original to survive.'
    loot_rng: Zero drops valid only if every applicable pool permits zero. Never demand one rare drop or accept
      arbitrary item IDs.
    random_motion: 'Wander absence alone is not a deterministic failure: need positive trajectory with preserved
      input seed or a bounded statistical receipt; absence must not pass.'
  adapter: tools/harness/matrix_domains/mobs.py
  status: adapter_requires_live_validation
  adapter_completeness: real_but_partial
  remaining_oracle_clauses:
  - Species navigation/hazard/obstacle policy, attribute-speed/cadence and causal combat trace require received
    entity trajectory/rotation/velocity/combat observations; generic displacement or projectile presence is insufficient.
