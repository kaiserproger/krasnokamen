newly_complete_authored_subjects:
  farming:
    kelp_seagrass: Kelp reaches age 25 and stops; seagrass grows underwater outside the shop fixture.
    sweet_berries_cocoa_glow_berries: Berry and cocoa maturation; use-harvest resets berry and cave-vine state.
    shear_sheep_wool_regrow: One to three wool across received dropped stacks and inventory; sheared state and grass-mediated regrowth.
    bees_pollinate: Hive honey rises and crops advance with random ticks disabled before planting.
    taming: Exact owner UUID, applicable sit/stand/follow behaviour, horse/llama taming and newborn fox trust; species metadata still gates execution.
  redstone:
    comparator_modes: Empty and partial/full chest signals, cake, eight frame rotations and subtraction.
    pressure_plates_buttons: Living/item trigger rules, wood-versus-stone arrow activation, light/heavy count thresholds and saturation.
    dispenser_behaviours: All named item families, returned/consumed stock, exact spawned counts, three honeycombs and shears wear, armor destination.
    daylight_target_bulb_lamp: Overworld noon/midnight, non-inverted Nether/End zero, and retained versus non-retained output over two pulses.
    sculk_sensor_signal: Ordinary/calibrated distance strength, accepted/rejected frequency, persistent pulse latches; live probe fails and root cause is not isolated.
  portals_dimensions:
    nether_portal_build_light: All six minimum-frame and 441 maximum-frame cells, 24-wide rejection, broken-frame collapse and refusal.
additional_partial_clause_work:
  entities_misc.experience_orbs: Received XP pickup delta and mending damage are checked; merge-by-value and exact pickup cooldown are not covered.
  redstone.command_block: Impulse/chain/repeat and relative execution origin are checked; operator-output cursor remains explicitly unavailable.
remaining_capability_boundaries:
  - Authoritative mutation/transfer timestamps, not packet arrival or SetTime.
  - Original-binary entity NBT and arbitrary block-entity queries, including absent-versus-present optional paths.
  - Species ownership, sitting, baby/trust, equipment, passengers, pose and velocity observations.
  - Consumed physics/vehicle/entity-use inputs and all-participant concurrent custody receipts.
  - Verified biome/weather, movement correction/peak-height and dimension transition observations.
  - Command-block output with operator-chat and console cursors.
  - XP-orb merge count/value and authoritative pickup-cooldown observations.
