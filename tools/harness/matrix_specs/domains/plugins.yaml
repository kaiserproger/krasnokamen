        - p.response(ctx,'login Matrix26520New',r'(?i)logged|вошли|успеш')
        - p.check(ctx,'no secret echo '+str(actor),any(password in e or 'Matrix26520New' in e for e in p.observe(ctx,'events',actor)),False)
