schema: krasnokamen-domain-spec-1
domain: spawning
minecraft_version: 26.1.2
executable_interface: tools/harness/matrix_api.py; plain Python adapters; this YAML is specification only, not an
  interpreter/runner
server_source_root: /run/media/kaiserroman/games/solaris-work/wt/deploy-final/
vanilla_data_root: /run/media/kaiserroman/games/solaris-work/solaris/data/vanilla/
query_capabilities:
  data_get_entity: /run/media/kaiserroman/games/solaris-work/wt/deploy-final/crates/mc-core/src/command_blocks.rs:245-259
    (absent in original frozen server; DataCommands implementation pending)
  data_get_block: /run/media/kaiserroman/games/solaris-work/wt/deploy-final/crates/mc-core/src/command_blocks.rs:282-287
    (only command-block NBT in original frozen server)
  execute_store: /run/media/kaiserroman/games/solaris-work/wt/deploy-final/crates/mc-core/src/command_context.rs:473
  execute_if_entity: /run/media/kaiserroman/games/solaris-work/wt/deploy-final/crates/mc-core/src/command_context.rs:217
  execute_if_block: /run/media/kaiserroman/games/solaris-work/wt/deploy-final/crates/mc-core/src/command_context.rs:218-230
  settlement_economy_snapshot: /run/media/kaiserroman/games/solaris-work/wt/deploy-final/crates/mc-core/src/settlements/economy_commands.rs:84-104
    (only aggregate status counts exposed, not job/quote/payroll/shipment fields)
context_contract:
- Driver applies every matrix context factor before setup.
- Do not override selected mode,dimension,op level,difficulty in fixtures; explicit tested difficulty transition
  is action.
- Every real adapter invokes ctx.boundary once after acknowledgement.
- Only live receipt checks establish coverage; presence of spec or adapter never sets pass.
- Random-spawn observation with no positive sample remains inconclusive unless fixture proves every admission precondition.
- Fixtures use Y200 outside full-set shop auto-open Y60..100; driver residency is fenced by actual received chunks.
subjects:
- subject: spawning.despawn_rules
  scenario_ids:
  - pw:spawning.despawn_rules/native_windows/creative/the_end/hard/2/reconnect_mid_action/clean_restart_mid_action/op_2
  - tr.restart_x_inflight.clean_restart_mid_action:spawning.despawn_rules/vanilla_java_26_1_2/survival/overworld/normal/1/normal/clean_restart_mid_action/non_op_0
  - tr.restart_x_inflight.crash_kill9_wal_replay:spawning.despawn_rules/native_linux/survival/overworld/normal/1/normal/crash_kill9_wal_replay/non_op_0
  preconditions:
  - &id001
    console: execute in ${dimension} run fill -16 199 -16 16 199 16 stone
  - &id002
    console: execute in ${dimension} run fill -16 200 -16 16 215 16 air
  - &id003
    console: execute in ${dimension} run tp ${actor} 0.5 200 0.5
  - console: summon zombie 40 200 0 {NoAI:1b}
  - console: summon zombie 42 200 0 {CustomName:"Keep",NoAI:1b,PersistenceRequired:1b}
  actions:
  - console: tp ${actor} 180 200 0
  - verb: wait_ticks
    ticks: 40
    clock: dashboard.simulation_tick
  oracle:
  - name: ordinary_removed
    query: execute unless entity @e[type=zombie,name=!Keep] run say Removed
    operator: marker_present
    expected: true
    source: https://minecraft.wiki/w/Mob_spawning#Despawning
  - name: persistent_kept
    query: execute if entity @e[name=Keep] run say Kept
    operator: marker_present
    expected: true
    source: https://minecraft.wiki/w/Mob_spawning#Despawning
  required_capabilities:
  - all_players_position
  - loaded_entity_count
  source:
  - https://minecraft.wiki/w/Mob_spawning#Despawning
  server_gap: []
  adapter: tools/harness/matrix_domains/spawning.py
  status: adapter_requires_live_validation
  adapter_completeness: complete_subject_oracle
- subject: spawning.mob_cap
  scenario_ids:
  - pw:spawning.mob_cap/neoforge_krasnokamen_loader/spectator/overworld/normal/1/malformed_or_stale_packet/crash_kill9_wal_replay/op_3
  preconditions:
  - *id001
  - *id002
  - *id003
  - console: gamerule doMobSpawning true
  - console: time set midnight
  - console: summon zombie 40 200 0 {NoAI:1b}
    repeat: 70
    note: No PersistenceRequired/name tag; distribute inside spawning chunks; floor and roof spawnproof everywhere
      except test pad.
  actions:
  - verb: wait_ticks
    ticks: 600
    clock: dashboard.simulation_tick
  oracle:
  - name: cap
    query: count newly naturally spawned monster UUIDs
    operator: equals
    expected: 0
    source: https://minecraft.wiki/w/Mob_spawning#Java_Edition_mob_cap
  - name: global_cap_formula
    query: category global count and eligible spawning chunk count
    operator: less_or_equal
    expected: floor(70*eligible_chunks/289), allowing preloaded fixtures above cap
    source: https://minecraft.wiki/w/Mob_spawning#Java_Edition_mob_cap
  required_capabilities:
  - eligible_spawn_chunks
  - entity_count
  - spawn_reason
  source:
  - https://minecraft.wiki/w/Mob_spawning#Java_Edition_mob_cap
  server_gap: []
  adapter: null
  status: blocked_missing_observation_or_fixture_capability
  adapter_completeness: spec_only
