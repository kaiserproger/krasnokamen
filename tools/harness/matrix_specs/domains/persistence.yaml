domain: persistence
phase: executable specification; adapters use shared matrix_api, this file is NOT a runner DSL
target_release: 26.1.2
source_tree: /run/media/kaiserroman/games/solaris-work/wt/deploy-final
ports:
  - 26540
  - 26559
execution_contract:
  context:
    Driver applies every row factor before setup; no overriding mode/dimension/permissions. All matrix_rows
    must execute; unsupported combination is blocked, never substituted.
  setup:
    Commands run as server fixture authority, in actor dimension using execute in; subject player actions retain
    row permission.
  synchronization:
    Received packets, exact console predicates, and pushed dashboard tick events only. No sleeps.
    Feedback fence proves only ordering.
  references:
    Vanilla mechanics reference minecraft.wiki; Solaris extensions/SLOs explicitly separate. No claim
    that Solaris WAL/hot backup/anti-xray are vanilla features.
  temporal_snapshots:
    Freeze or record exact simulation tick; compare timers relative to ticks, not literal after
    arbitrary elapsed time.
  oracles:
    A missing field/query is MissingCapability, not an empty value or success. Require non-empty Check list
    and observed causality.
  permission:
    Subject minimum permission is a POSITIVE minimum, not a context override. Below minimum, execute actor
    command unchanged and require hidden root + refusal + unchanged state. Console authority only creates fixtures
    unless context.permission == console.
  boundary:
    Adapter invokes shared MatrixContext.boundary() exactly once after first acknowledged subject action.
    Driver owns all context network/lifecycle operations.
  scope_status:
    Specifications cover all subjects/rows. Registered unavailable adapters raise exact MissingCapability
    before mutation; they are blocked, NOT completed execution.
  plugin_profiles:
    Use shared select_plugin_profile and plugin_set_fingerprint. No adapter-wide exclusions or fabricated
    plugin fingerprints. Missing client observations remain blocked in both profiles.
context_overlays:
  duplicate_login:
    actions:
      - connect second session same identity while original owns custody
      - wait new Play and old disconnect; old socket cannot mutate
    checks:
      - old_session_connected: false
      - new_session_connected: true
      - UUID_live_owner_count: 1
      - custody_total: unchanged
    reference: owner decision 2026-10-24; vanilla newcomer replaces old session; ServerFixes owns implementation
  crash_kill9_wal_replay:
    actions:
      - capture durable tick and atomic custody ledger
      - kill9_restart before next checkpoint
      - reconnect; query recovered state
    checks:
      - recovered_tick: last durably committed WAL tick, not last sent input
      - custody_total: conserved; each transaction wholly before or wholly after
    capabilities:
      - server_kill9_wal_replay
      - observe:durable_tick
      - observe:atomic_custody
  clean_restart_mid_action:
    actions:
      - capture state at stop boundary
      - clean_restart same directory and identity
      - reconnect
    checks:
      - persistent_state: equals committed pre-stop snapshot
    capabilities:
      - server_clean_restart
  hot_backup_during_action:
    actions:
      - hot_backup
      - restore_backup into separate world
      - query frozen backup image
    checks:
      - backup_tick: manifest recoverable tick
      - custody_total: conserved in single image
    capabilities:
      - server_backup_restore
  pause_when_empty_resume:
    actions:
      - all clients disconnect
      - await explicit pause transition event
      - record ticks at pause and next independent liveness event; no sleep or wait-for-tick deadlock
      - reconnect and await newer tick
    checks:
      - tick_while_paused: unchanged
      - tick_after_join: greater than pause tick
      - inflight_state: unchanged while paused
    capabilities:
      - server_pause_empty
      - observe:pause_transition
  save_all_checkpoint:
    actions:
      - save_all; await durable checkpoint acknowledgment
    checks:
      - checkpoint_committed: true
  reconnect_mid_action:
    actions:
      - disconnect after first state-changing received action
      - reconnect same identity
      - continue subject action
    checks:
      - custody_total: unchanged
      - stale_old_connection_mutations: 0
  disconnect_during_menu:
    actions:
      - capture inventory+container+cursor single image
      - disconnect while menu open
      - reconnect and reopen container
    checks:
      - menu_old_id_reused: false
      - custody_total: exact initial total including resolved cursor
    capabilities:
      - observe:atomic_custody
  slow_reader_backpressure:
    actions:
      - throttle only designated reader; normal observer continues
      - restore reader; await authoritative resync
    checks:
      - normal_observer_progress: true
      - resumed_reader_final_state: equals authoritative state
    capabilities:
      - slow_reader_backpressure
  malformed_or_stale_packet:
    actions:
      - send stale menu state or malformed packet at subject mutation boundary
    checks:
      - unauthorized_state_changes: 0
      - process_alive: true
    capabilities:
      - malformed_packet_injection
server_query_support:
  execute_if_block_entity_score: implemented command_context.rs:215-288
  data_queries:
    - id: data_get_entity
      evidence: crates/mc-core/src/command_context.rs:495-503 -> datapacks.rs:503-505 -> command_blocks.rs:258,283
      repro: data get entity <online-player> Inventory
      expected: NBT inventory payload
      observed_source:
        Dedicated data dispatcher supports command blocks only; not general entity/block NBT. Live
        frozen-binary receipt DomLifecycle/20261024T032808-protocol-matrix-u4kezcpd/server.log:24 confirms restriction.
    - id: data_get_block
      evidence: crates/mc-core/src/command_context.rs:495-503 -> datapacks.rs:503-505 -> command_blocks.rs:258,283
      repro: setblock 0 65 0 chest; data get block 0 65 0
      expected: Chest NBT payload
      observed_source:
        Dedicated data dispatcher supports command blocks only; not general entity/block NBT. Live
        frozen-binary receipt DomLifecycle/20261024T032808-protocol-matrix-u4kezcpd/server.log:24 confirms restriction.
    - id: execute_store
      evidence: crates/mc-core/src/command_context.rs:473
      repro: execute store result score n lc run data get entity <player> Health
      expected: Store numeric query result
      observed_source: Explicit not implemented error
  clean_restart: Shared ProtocolServer.clean_restart implemented; payload fixture/readback gaps remain distinct.
subjects:
  persistence.player_data_roundtrip:
    preconditions:
      - give actor diamond 7; experience set actor 5 levels; effect give actor speed infinite 0; spawnpoint actor
        at safe current position
      - setblock near actor ender_chest; quick_move all 7 diamonds into ender chest; close_container; give actor emerald
        3
      - Capture Inventory, EnderItems, XpLevel, XpTotal, XpP, active_effects, respawn, playerGameType; infinite effect
        avoids timer drift
      - "Crash-consistency branch only: require empty baseline EnderItems, receive seven diamonds, capture stable
        player fields, then save_all the SETUP baseline before the transfer experiment"
    actions:
      - Open ender chest; quick_move the single seven-diamond stack; await received Ender custody; close; give three
        emeralds as the subsequent transaction
      - "Crash row: invoke shared ctx.boundary SIGKILL immediately without waiting for WAL publication; query recovered
        player fields and open restored ender chest before any extra save/restart"
      - "Non-crash supported row: capture persistent fields; invoke context boundary; save_all and clean restart;
        reconnect and query restored fields/custody"
    checks:
      - observation: "non-crash: all captured persistent fields"
        operator: equals_capture
        expected: pre-stop committed state
      - observation: diamond total inventory+ender
        operator: equals
        expected: 7
      - observation: "unfenced crash: (inventory diamonds, Ender diamonds, emeralds)"
        operator: one_of
        expected:
          - - 7
            - 0
            - 0
          - - 0
            - 7
            - 0
          - - 0
            - 7
            - 3
      - observation: "unfenced crash: XP/effects/respawn/game mode"
        operator: equals_capture
        expected: durable SETUP baseline
      - observation: "unfenced crash: restored cursor"
        operator: equals
        expected: null
      - observation: "unfenced crash: unexpected item types"
        operator: equals
        expected: []
    reference:
      scope: vanilla_26.1.2
      source: https://minecraft.wiki/w/Player.dat_format
    missing_capabilities:
      - data_get_entity
      - server:restored_player_data (hot-backup context)
    server_gap: []
    source_modules:
      - crates/mc-core/src/native_checkpoint.rs
      - crates/mc-core/src/journal.rs
      - crates/mc-core/src/hot_backup.rs
    matrix_rows:
      - id: pw:persistence.player_data_roundtrip/fabric_distant_horizons/creative/the_end/peaceful/1/reconnect_mid_action/clean_restart_mid_action/op_3
        context:
          client_kind: fabric_distant_horizons
          game_mode: creative
          dimension: the_end
          difficulty: peaceful
          player_count: "1"
          network_condition: reconnect_mid_action
          server_lifecycle: clean_restart_mid_action
          permission: op_3
        driver: loader_java_mcp
        context_oracle:
          - "reference: identical after restart"
          - "creative: placements/uses do not debit items; creative break yields no drops"
          - after reconnect the client receives exactly the server-committed state; the interrupted action is either
            fully applied or not at all; item totals across player/containers/entities unchanged except by the committed
            part
          - after /stop + restart the world, block entities, entities (same UUIDs), player inventories/positions and
            partially finished processes equal the last committed pre-stop state; no duplication or loss
          - holds in the_end (dimension-isolated world)
          - "conservation: item totals over inventories/containers/item entities as expected (no dupe, no loss)"
      - id: tr.restart_x_inventory.clean_restart_mid_action:persistence.player_data_roundtrip/protocol_bot/survival/overworld/normal/1/normal/clean_restart_mid_action/non_op_0
        context:
          client_kind: protocol_bot
          game_mode: survival
          dimension: overworld
          difficulty: normal
          player_count: "1"
          network_condition: normal
          server_lifecycle: clean_restart_mid_action
          permission: non_op_0
        driver: protocol_bot
        context_oracle:
          - "reference: identical after restart"
          - after /stop + restart the world, block entities, entities (same UUIDs), player inventories/positions and
            partially finished processes equal the last committed pre-stop state; no duplication or loss
          - "conservation: item totals over inventories/containers/item entities as expected (no dupe, no loss)"
      - id: tr.restart_x_inventory.crash_kill9_wal_replay:persistence.player_data_roundtrip/vanilla_java_26_1_2/survival/overworld/normal/1/normal/crash_kill9_wal_replay/non_op_0
        context:
          client_kind: vanilla_java_26_1_2
          game_mode: survival
          dimension: overworld
          difficulty: normal
          player_count: "1"
          network_condition: normal
          server_lifecycle: crash_kill9_wal_replay
          permission: non_op_0
        driver: java_mcp
        context_oracle:
          - "reference: identical after restart"
          - "after SIGKILL + restart (no wait for a published WAL fence) the world equals a consistent prefix of the
            committed transactions: every transaction is all-or-nothing (no torn/split/half-moved stacks), no item duplication,
            nothing that was durable before the action (setup baseline) is lost, and later transactions only appear
            after earlier ones; surviving every pre-kill ACK is NOT required (latest-ACK durability needs a separate
            fenced proof); world opens or fails closed on corruption (never silently reset); where the reference says
            'identical/restored after restart', read it as identical to that recovered prefix"
          - "conservation: item totals over inventories/containers/item entities as expected (no dupe, no loss)"
      - id: tr.restart_x_inventory.hot_backup_during_action:persistence.player_data_roundtrip/native_linux/survival/overworld/normal/1/normal/hot_backup_during_action/non_op_0
        context:
          client_kind: native_linux
          game_mode: survival
          dimension: overworld
          difficulty: normal
          player_count: "1"
          network_condition: normal
          server_lifecycle: hot_backup_during_action
          permission: non_op_0
        driver: native_mcp
        context_oracle:
          - "reference: identical after restart"
          - server keeps ticking during backup; the backup restores to a single consistent tick (no torn state between
            player and containers)
          - "conservation: item totals over inventories/containers/item entities as expected (no dupe, no loss)"
    minimum_tested_action_permission: 0
    implementation:
      class: real_but_partial
      adapter: tools/harness/matrix_domains/persistence.py
      not_a_live_pass: true
      remaining_clause:
        Hot-backup row requires restored-world player readback; current complete normal/clean/WAL
        path must not substitute.
    crash_proof_separation:
      mid_action:
        "No mutation-publication wait. Recover an atomic ordered prefix: loss of an unpublished tail transfer
        or grant is allowed; split/duplicate/lost durable baseline or a grant without its preceding transfer fails."
      durable_state:
        Separate proof must await actual published journal/batch-lo-hi.bin with hi >= the admitted
        mutation tick before killing; not claimed by this adapter.
      tail_bound_evidence:
        Main documents 128 queued + 1 draining. core.rs:214-233 uses tick_lo=tick_hi=tick for
        a live Append. Current facade exposes neither recovered nor admitted/mutation tick; this adapter does not
        claim a measured tail bound from PID/checkpoint hash/ACK.
      validation: Focused oracle/control-flow tests only; frozen release general NBT blocker is unchanged.
