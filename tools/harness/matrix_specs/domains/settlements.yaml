  - name: unauthorized_write
    query: same mutation from separate nonowner nonop; authoritative query after
    operator: equals
    expected: before unauthorized attempt
    source: /run/media/kaiserroman/games/solaris-work/wt/deploy-final/crates/mc-core/src/command_execution.rs:1337-1546
  required_capabilities:
  - clean_restart
