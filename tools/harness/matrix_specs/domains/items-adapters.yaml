schema: krasnokamen-matrix-shared-adapter-manifest/1
vanilla_version: 26.1.2
interface: tools.harness.matrix_api.Adapter
runner: python3 -m tools.harness run protocol-matrix
note:
  Plain Python executable specs. This YAML indexes shared-interface callables;
  it is not a second runner or interpreted action DSL. Registration is not live scenario
  coverage.
domains:
  inventory:
    - subject: inventory.click_pickup
      class: real_but_partial
      setup:
        symbol: tools.harness.matrix_domains._items.setup
        source: tools/harness/matrix_domains/_items.py:157
      act:
        symbol: tools.harness.matrix_domains.inventory.pickup
        source: tools/harness/matrix_domains/inventory.py:11
      oracle:
        symbol: tools.harness.matrix_domains._items.oracle
        source: tools/harness/matrix_domains/_items.py:150
      matrix_rows: 1
      oracle_clauses:
        - "reference: vanilla cursor semantics; totals conserved"
        - server tick (MSPT) and other players unaffected; slow client either catches
          up with consistent state or is disconnected by bounded queue/timeout; no unbounded
          memory growth
        - save-all completes without stalling the tick; post-save state equals pre-save
          state
        - "conservation: item totals over inventories/containers/item entities as expected
          (no dupe, no loss)"
      deferred_context_clauses:
        - server tick (MSPT) and other players unaffected; slow client either catches
          up with consistent state or is disconnected by bounded queue/timeout; no unbounded
          memory growth
        - save-all completes without stalling the tick; post-save state equals pre-save
          state
      context_capabilities:
        - concurrent_subject_actors (N8 or explicit concurrent triples only)
        - same_tick_admission_fence (explicit same-tick triples only)
        - composite_origin_oracle (explicit origin)
        - received observer equipment/entity/state on ordinary N2
        - server:restore_proof / data_get_entity / data_get_block for complete persistence
          state
    - subject: inventory.click_quick_move
