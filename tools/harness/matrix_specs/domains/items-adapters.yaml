classification_contract:
  unit:
    distinct assigned subject, all clauses of current curated matrix rows; no
    claim for the full Cartesian expansion
  spec_only: no adapter registration
  registered_stub: registration without real action+behavioral oracle
  complete_adapter:
    full current subject oracle implemented; can still be blocked
    on declared capabilities or fail a product bug
  real_but_partial:
    real action+checks, but omitted reference or context clauses explicitly
    listed; not counted complete
  executed_in_ledger_pass_fail:
    distinct exact row IDs with observed pass/fail receipts;
    orthogonal to implementation classes; blocked excluded
