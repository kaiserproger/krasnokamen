      matrix_rows: 1
      oracle_clauses:
        - "reference: moves to first fitting slots; remainder stays; no loss"
        - out-of-reach/illegal/malformed input is rejected (BlockChangedAck + block update
          / correction teleport / protocol disconnect) without state change; a stale container
          state_id is applied once and followed by a full-state resync (vanilla handleContainerClick);
          never duplicated; server keeps running
        - "after SIGKILL + restart the WAL replays to the last committed tick: every transaction
          is all-or-nothing (no half-moved stacks), no item duplication, world opens or
          fails closed on corruption (never silently reset)"
        - "8 concurrent actors: results conserved, server MSPT stays below 50 ms, no correction
          storms or protocol errors"
        - "conservation: item totals over inventories/containers/item entities as expected
          (no dupe, no loss)"
      deferred_context_clauses:
        - out-of-reach/illegal/malformed input is rejected (BlockChangedAck + block update
          / correction teleport / protocol disconnect) without state change; a stale container
          state_id is applied once and followed by a full-state resync (vanilla handleContainerClick);
          never duplicated; server keeps running
        - "after SIGKILL + restart the WAL replays to the last committed tick: every transaction
          is all-or-nothing (no half-moved stacks), no item duplication, world opens or
          fails closed on corruption (never silently reset)"
        - "8 concurrent actors: results conserved, server MSPT stays below 50 ms, no correction
          storms or protocol errors"
      context_capabilities:
        - concurrent_subject_actors (N8 or explicit concurrent triples only)
        - same_tick_admission_fence (explicit same-tick triples only)
        - composite_origin_oracle (explicit origin)
        - received observer equipment/entity/state on ordinary N2
