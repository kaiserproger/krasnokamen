domain: load
phase: executable specification; adapters use shared matrix_api, this file is NOT a runner DSL
target_release: 26.1.2
source_tree: /run/media/kaiserroman/games/solaris-work/wt/deploy-final
ports:
  - 26540
  - 26559
execution_contract:
  context:
    Driver applies every row factor before setup; no overriding mode/dimension/permissions. All matrix_rows
    must execute; unsupported combination is blocked, never substituted.
  setup:
    Commands run as server fixture authority, in actor dimension using execute in; subject player actions retain
    row permission.
  synchronization:
    Received packets, exact console predicates, and pushed dashboard tick events only. No sleeps.
    Feedback fence proves only ordering.
  references:
    Vanilla mechanics reference minecraft.wiki; Krasnokamen extensions/SLOs explicitly separate. No claim
    that Krasnokamen WAL/hot backup/anti-xray are vanilla features.
  temporal_snapshots:
    Freeze or record exact simulation tick; compare timers relative to ticks, not literal after
    arbitrary elapsed time.
  oracles:
    A missing field/query is MissingCapability, not an empty value or success. Require non-empty Check list
    and observed causality.
  permission:
    Subject minimum permission is a POSITIVE minimum, not a context override. Below minimum, execute actor
    command unchanged and require hidden root + refusal + unchanged state. Console authority only creates fixtures
    unless context.permission == console.
  boundary:
    Adapter invokes shared MatrixContext.boundary() exactly once after first acknowledged subject action.
    Driver owns all context network/lifecycle operations.
  scope_status:
    Specifications cover all subjects/rows. Registered unavailable adapters raise exact MissingCapability
    before mutation; they are blocked, NOT completed execution.
  plugin_profiles:
    Use shared select_plugin_profile and plugin_set_fingerprint. No adapter-wide exclusions or fabricated
    plugin fingerprints. Missing client observations remain blocked in both profiles.
context_overlays:
  duplicate_login:
    actions:
      - connect second session same identity while original owns custody
      - wait new Play and old disconnect; old socket cannot mutate
    checks:
      - old_session_connected: false
      - new_session_connected: true
      - UUID_live_owner_count: 1
      - custody_total: unchanged
    reference: owner decision 2026-10-24; vanilla newcomer replaces old session; ServerFixes owns implementation
  crash_kill9_wal_replay:
    actions:
      - capture durable tick and atomic custody ledger
      - kill9_restart before next checkpoint
      - reconnect; query recovered state
    checks:
      - recovered_tick: last durably committed WAL tick, not last sent input
      - custody_total: conserved; each transaction wholly before or wholly after
    capabilities:
      - server_kill9_wal_replay
      - observe:durable_tick
      - observe:atomic_custody
  clean_restart_mid_action:
    actions:
      - capture state at stop boundary
      - clean_restart same directory and identity
      - reconnect
    checks:
      - persistent_state: equals committed pre-stop snapshot
    capabilities:
      - server_clean_restart
  hot_backup_during_action:
    actions:
      - hot_backup
      - restore_backup into separate world
      - query frozen backup image
    checks:
      - backup_tick: manifest recoverable tick
      - custody_total: conserved in single image
    capabilities:
      - server_backup_restore
  pause_when_empty_resume:
    actions:
      - all clients disconnect
      - await explicit pause transition event
      - record ticks at pause and next independent liveness event; no sleep or wait-for-tick deadlock
      - reconnect and await newer tick
    checks:
      - tick_while_paused: unchanged
      - tick_after_join: greater than pause tick
      - inflight_state: unchanged while paused
    capabilities:
      - server_pause_empty
      - observe:pause_transition
  save_all_checkpoint:
    actions:
      - save_all; await durable checkpoint acknowledgment
    checks:
      - checkpoint_committed: true
  reconnect_mid_action:
    actions:
      - disconnect after first state-changing received action
      - reconnect same identity
      - continue subject action
    checks:
      - custody_total: unchanged
      - stale_old_connection_mutations: 0
  disconnect_during_menu:
    actions:
      - capture inventory+container+cursor single image
      - disconnect while menu open
      - reconnect and reopen container
    checks:
      - menu_old_id_reused: false
      - custody_total: exact initial total including resolved cursor
    capabilities:
      - observe:atomic_custody
  slow_reader_backpressure:
    actions:
      - throttle only designated reader; normal observer continues
      - restore reader; await authoritative resync
    checks:
      - normal_observer_progress: true
      - resumed_reader_final_state: equals authoritative state
    capabilities:
      - slow_reader_backpressure
  malformed_or_stale_packet:
    actions:
      - send stale menu state or malformed packet at subject mutation boundary
    checks:
      - unauthorized_state_changes: 0
      - process_alive: true
    capabilities:
      - malformed_packet_injection
server_query_support:
  execute_if_block_entity_score: implemented command_context.rs:215-288
  data_queries:
    - id: data_get_entity
      evidence: crates/mc-core/src/command_context.rs:495-503 -> datapacks.rs:503-505 -> command_blocks.rs:258,283
      repro: data get entity <online-player> Inventory
      expected: NBT inventory payload
      observed_source:
        Dedicated data dispatcher supports command blocks only; not general entity/block NBT. Live
        frozen-binary receipt DomLifecycle/20261024T032808-protocol-matrix-u4kezcpd/server.log:24 confirms restriction.
    - id: data_get_block
      evidence: crates/mc-core/src/command_context.rs:495-503 -> datapacks.rs:503-505 -> command_blocks.rs:258,283
      repro: setblock 0 65 0 chest; data get block 0 65 0
      expected: Chest NBT payload
      observed_source:
        Dedicated data dispatcher supports command blocks only; not general entity/block NBT. Live
        frozen-binary receipt DomLifecycle/20261024T032808-protocol-matrix-u4kezcpd/server.log:24 confirms restriction.
    - id: execute_store
      evidence: crates/mc-core/src/command_context.rs:473
      repro: execute store result score n lc run data get entity <player> Health
      expected: Store numeric query result
      observed_source: Explicit not implemented error
  clean_restart: Shared ProtocolServer.clean_restart implemented; payload fixture/readback gaps remain distinct.
subjects:
  load.dense-hostile:
    preconditions:
      - canonical_fixture:
          kind: legacy-offline-overlay
          description:
            1024 zombies/husks on one 15x15-chunk flat arena; ordinary AI, collisions and survival players
            at night, no NoAI/invulnerability.
          required_native_bridge:
            Validated native fixture authored/readback recipe preserving entities, inventory,
            POIs, simulation clock and pending ticks before run; never inject legacy checkpoint as native.
      - setup_commands: &id001
          - gamemode survival
          - time set 18000
          - gamerule do_daylight_cycle false
      - Freeze binary/config/plugin hashes; Main GO required for measurement; exact matrix cohort and context, never
        substitute N=10 for N8
    actions:
      - canonical_schedule:
          clock: monotonic_wall_time
          epoch: stdin run after every requested client is ready; preflight/setup excluded and separately timed
          steady:
            duration: --steady-seconds
            movement_hz_per_client: 20
            edit_hz_per_client: 0
            command_hz_bot0: 0
            default_duration_seconds: 20
          burst:
            duration: --burst-seconds
            movement_hz_per_client: 20
            edit_hz_per_client: 0
            command_hz_bot0: 0
            default_duration_seconds: 10
          recovery:
            duration: --recovery-seconds
            movement_hz_per_client: 0
            edit_hz_per_client: 0
            command_hz_bot0: 0
            chat_hz_per_client: 0
            rule:
              No new gameplay or repair stimulus; keep readers and mandatory protocol liveness responses active.
              Autonomous simulation is not forcibly disabled.
            default_duration_seconds: 20
          offer_accounting:
            Compute scheduled slots from elapsed wall time, client count and declared rates, independently
            of responses/TPS. Keep offered, transport-admitted, skipped/dropped, actual server admission when observable,
            completed and client-observed separate; never call sent movement/command completion.
          internal_deadlines:
            Legacy persisted fluid/button/TNT deadlines are simulation ticks, separately recorded;
            wall windows never extend until those deadlines complete.
          duration_policy:
            20/10/20 seconds are executable control defaults, not catalog acceptance durations; long-session
            and mixed-survival-long must select explicit longer wall time. Smoke combined measurement windows<=120seconds;
            never label smoke performance/capacity evidence.
      - client_actions:
          stimulus:
            All requested survival players walk; natural hostile chases/attacks/deaths/respawns. Preserve
            command setup and client args from control config.
          client_args:
            - --no-edits
            - --survival
            - --respawn
          setup_commands: *id001
          commands_are_administrative_fixture_assistance: true
      - Drive canonical catalog-load through cmd_run; reuse native recipe and final-state validator
    checks:
      - observation: classified outcome
        operator: equals
        expected: PASS
      - observation: correctness_failures
        operator: equals
        expected: 0
      - observation: protocol_errors
        operator: equals
        expected: 0
      - observation: subject work proof
        operator: satisfies
        expected:
          legacy_requirements:
            - source: bots
              path: health_damage_received
              minimum_delta: 1
            - source: bots
              path: entity_moves_received
              minimum_delta: 10
            - source: bots
              path: movements_sent
              minimum_delta: 100
            - source: saved_world
              path: activity_samples.entity_positions
              comparison: changed
          required:
            - Observed health damage and entity movement; persisted UUID positions change. Record active population
              and natural deaths, not just initial1024.
          scope:
            Per-wall-window bot evidence; fixture final readback spans setup/warmup/run and is not measurement-only
            throughput.
      - observation: subject final invariants
        operator: satisfies
        expected:
          contract:
            Explicit Krasnokamen control contract, pinned26.1.2 mechanics only where a dedicated expected-state
            oracle exists. catalog_ids show related risks, not equivalence to all catalog cases.
          required:
            - No duplicate entity identity; survival health/death/respawn causality; no stale entity after removal.
          unavailable_means: INFRA_BLOCKED
          diagnostic_completion: null
      - observation: effective performance thresholds
        operator: satisfies
        expected:
          source: explicit_operator_instruction_2026-10-13_not_catalog
          defaults:
            min_sustained_tps: 19.5
            max_tick_p99_ms: 50
            max_tick_max_ms: 250
            correctness_failures: 0
            max_rss_mb: 3072
          overrides:
            "--min-tps,--max-tick-p99-ms,--max-tick-max-ms,--max-rss-mb: all effective values recorded in
            receipt, defaults explicitly supplied by operator/Main, not by catalog."
          evaluation:
            Full per-window tick telemetry required; never combine stage percentiles. Smoke is non-performance
            evidence. Missing mandatory oracle/telemetry is INFRA_BLOCKED, never PASS.
          work_floors:
            Legacy activity minima below are nonzero-work control checks, not capacity or performance SLOs;
            saved_world deltas include setup/warmup unless same-window snapshots are available.
    reference:
      scope: krasnokamen_operator_SLO_not_vanilla_numeric_guarantee
      source:
        - tools/harness/catalog_load_scenarios.json#scenarios/dense-hostile
        - tools/harness/catalog_controls.py
        - crates/mc-test-harness/src/bin/player_scale_bots_mechanics.rs
