# Harness fixture: a legacy API 0.6.0 package, never deployable.
#
# The component host refuses this directory before any guest runs, at manifest
# validation: `UnsupportedScriptApiVersion` (requested 0.6.0, host contract
# 0.9.0) fires first, then the missing `entry` (default "plugin.wasm", no Wasm
# shipped) would refuse it too. The matrix scenario
# `plugins.plugin_startup_fail_closed` (case `legacy_api_0_6`) is meant to
# observe that refusal once its driver step exists (not implemented yet);
# `crates/mc-plugin-host/src/discovery.rs` (legacy_fixture_tests) pins it. It
# replaces the real land-claims / online-roster / geological-mines packages,
# which were v1 artefacts (0.6.0 manifest + main.lua, no Wasm) removed by the
# D66 duplicate-plugin audit (2026-11-19, receipts/PluginDupAudit/AUDIT.md).
#
# Not a package: nothing deploys it, and it must stay that way. Never add an
# `entry` or a plugin.wasm here: the fixture's whole point is to be a manifest
# the host must refuse.
id = "legacy-api-0-6"
name = "Legacy API 0.6 Fixture"
version = "0.0.0"
api = "0.6.0"
capabilities = ["storage", "zones"]
player_commands = ["claim"]
