severity = "major"
status = "open"
source = "BreakIssue1x11 break-it pass on ISSUE-1-11, finding F4 (receipts/BreakIssue1x11/report.md, sets F/K, 3 of 7 runs with an extra homeless resident): the unbound librarian stands 2.5-5 blocks from its outdoor bed all night with no minecraft:home; the breaker queried only 2 of 5 Brains. Cause (code read): allocator::acquire let bound residents claim any bed in the settlement radius, while villager/brain.rs shelter_night lets a resident sleep only in a roofed home bed (it shelters indoors otherwise, a tested settlement rule), so a homeless resident that searched first kept the open-air bed empty and barred to the vanilla villager. Residents now claim only roofed beds: allocator::bed_allowed gates both acquire and free_bed (breeding spare bed, newborn home), and home validation releases a resident's bed whose roof is gone or that was claimed before the rule (roof flag cached per bed head chunk revision in ValidatedPoi). Policy in docs/settlements/breeding.md and jobs.md: an open-air-only settlement gets no rations and no births."
