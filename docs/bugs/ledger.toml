[[bug]]
id = "RAIDER-TARGET-SCAN-EVERY-TICK-COLLAPSE"
title = "A thousand melee mobs collapse the server tick: every vindicator rescans every candidate within 64 blocks with a line-of-sight ray each tick"
area = "gameplay"
repro = "source"
severity = "major"
status = "fixed"
source = "BattleBaseline report (core b5a225b6, 500 iron golems + 500 vindicators: 4.65 TPS, 5000: 0.10 TPS, perf self: TargetGrid::nearest<special_mobs::target_in closure> 27%, Chunk::get_block 27%, ChunkWorld::block_at 19%, floor 17%). MobTargetPerf frame-pointer profile of base 6efe8db0 (1k, same harness): 98.4% of tick-thread samples under special_mobs::raiders::run, 71.7% under hostile::sight_clear called from target_in via TargetGrid::nearest; the cause is raiders::run calling target_in(range 64) for every raider every tick with no target memory (420 sight checks/tick for 20 raiders x 21 candidates). Vanilla (javap 26.1.2): NearestAttackableTargetGoal searches 1 tick in 10 (randomInterval 10) within FOLLOW_RANGE (vindicator 12), TargetGoal keeps the target while valid and drops it after 60 unseen ticks. Fix: raiders keep a held target, search on the 1-in-10 roll within follow range, and the raider follow ranges come from the 26.1.2 attributes. Same harness, same lane, host load 44-82 (before 1k/5k under load 44-53, after under 73-82): 1k melee 3.07 TPS (MSPT p50 308 ms) -> 20.00 TPS (p50 3.4 ms, p99 9.4 ms); 5k melee 0.10 TPS (p50 9450 ms) -> 19.27 TPS (p50 24.1 ms, p99 113.6 ms, first 100 ticks mean 55.7 ms); combat continued (entities 1106 -> 745 and 5097 -> 3793 over the 60 s window). Real-client and vanilla-timing acceptance of raider fights is not claimed. Residual: ranged raiders' goal attacks (shooters::run) still scan their candidates every tick at their short goal ranges (8-16); HurtByTargetGoal retaliation and player-before-villager priority are not modelled."
regression = ["cargo:mc-core:raids::tests::raiders_hold_targets_and_do_not_scan_every_candidate_every_tick", "cargo:mc-core:raids::tests::raider_ignores_candidates_beyond_its_follow_range", "cargo:mc-core:raids::tests::raider_drops_a_dead_target_and_a_target_unseen_for_sixty_ticks", "cargo:mc-core:raids::tests::raider_does_not_hit_a_held_target_behind_a_wall_in_reach"]
failing_first = "reported"
