[[bug]]
id = "CLIENT-HELD-DROP-KEY-DOUBLE-DROP"
title = "Holding the drop (Q) key across a tick sent two drop packets (press-edge dispatch + held-key tick edge)"
area = "client"
repro = "source"
severity = "minor"
status = "open"
source = "A Q press was dispatched twice: the press edge (src/session/actions.rs) inserted 'drop'/'pick' into the session key set and src/player/interaction.rs also dispatched the same action from the held-key tick edge, so a key held across a tick boundary sent two drop packets for one press."
