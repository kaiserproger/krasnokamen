source = "Breaker finding F7 (slice DUPLICATE-LOGIN 2): a same-profile client held in configuration through a loopback proxy and released after a second client entered Play joined and kicked the playing session (7/7 runs, both orders). Vanilla 26.3 ServerConfigurationPacketListenerImpl.handleConfigurationFinished refuses the late finisher with DUPLICATE_LOGIN_DISCONNECT_MESSAGE; only a newer login (ServerLoginPacketListenerImpl.verifyLoginAndFinishConnectionSetup -> disconnectAllPlayersWithProfile) kicks a session in Play. Custody held in every run. Arbitration lived only in crates/mc-core/src/tick/input/session.rs join."
