[[bug]]
id = "CLIENT-CREATIVE-PLACEMENT-DROPPED"
title = "A creative inventory placement (the second click of a pickup-then-place pair) is silently dropped on some runs: the player's stack stays on the cursor and nothing reaches the server. HYPOTHESIS, not proven: the placement is release-driven, so when the release's hover lookup does not resolve an enabled slot the intent is never issued - and the harness queues a press with its release in one flush right after it warps the pointer (`native_player_input.py::_input`), so a dropped release is equally plausible; a UI-level press/release trace has to decide between them."
area = "client"
repro = "source"
severity = "major"
status = "open"
source = "Found while proving HC-2 (D123ClientD, 2026-11-24) on native-v2-input-menus. Two runs of the same client binary (sha256 449af52527cf3e70…, source 45ef47e3cc) and the same server pin (b114cf18f4722022…, core b35c8223b) disagree: 20261124T033435-native-v2-input-menus-ju2fz7j0 PASSES creative_move_persists (slot 11 receives emerald x3) and 20261124T033645-native-v2-input-menus-cf2psg9q FAILS it (slot 11 empty, carried empty). An earlier run of a different debug build of the same source failed the same assertion (20261124T031708-native-v2-input-menus-ll9a_wv4), and the pre-fix pair receipt for HC-2 recorded the same failure three times."
regression = ["harness:entities:native-v2-input-menus"]
proving_assertions = { "harness:entities:native-v2-input-menus" = "creative_move_persists" }
failing_first = "not recorded"
repro_check = "The failing run's client-side trace (receipts/D123/D123Client/negctl/creative-drop-trace.log, from an uncommitted KEYDBG build of 45ef47e3cc instrumented at src/inventory/actions.rs Prediction::execute and src/lib.rs) ends at the pickup: `prediction_click_slot slot=10 button=0 mode=Pickup game_mode=1 creative_screen=true`, `creative_click slot=10 … cursor_empty=true`, `prediction_click_slot_done slot=10 result=Ok(()) cursor_empty=false cursor_count=3 commands=1` — and then there is NO `slot=11` entry at all, i.e. the placement click never produced a UiIntent and never reached InventoryStore::execute. The same run's surviving cursor rules out the contents-broadcast wipe that the first hypothesis blamed (a contents packet with an empty carried would have logged `contents …`; none arrived after the creative screen opened, and a build with `held_creative_stack` did not change either outcome, so that change was reverted uncommitted). The passing run's trace shows the same pickup followed by `prediction_click_slot slot=11 … cursor_count=3` and `…_done … commands=1`. Code path: src/lib.rs:1765-1801 synthesizes the Pointer Down/Up edges from `self.last_cursor` (set only by WindowEvent::CursorMoved while the window is focused), and src/ui/state.rs:2447-2471 issues the placement only when the RELEASE's hovered node is an enabled NodeAction::Slot and the drag state set by the Down edge survived (`release_all()` clears it on focus loss); any other outcome is a silent `Ok(())`. What is missing for a fix: a UI-level trace of the press and the release (pointer, resolved node id, drag_origin, focused) on a failing run, because the scene's X input is identical in both outcomes (XWarpPointer + queued press/release, one XSync) and the client's own cursor position at the release is the only quantity known to vary. The scene step that catches this is `creative_move_persists`; do not narrow it."
