source = "receipts/ArchDesign/VOTE-RESIDENCY-R13-astra.md item 3 and DESIGN-RESIDENCY-R14.md (read-only audit). On main 3068dfb1b brushing::run's progress.retain rereads each cell and calls set_dusted on a due reset (crates/mc-core/src/brushing.rs:19-31,52-80,280-297) through block_at, which serves a cold overlay (world.rs:951-965). Fix and scene: has_chunk of the cell before brushable in the reset pass; T16i-17 (non-zero progress, reset due, cold chunk with and without overlay)."
regression = ["cargo:mc-core:brushing::tests::brush_reset_pauses_on_a_cold_cell_instead_of_decrementing_its_overlay"]
failing_first = "not recorded"
ingress_proof = ["crates/mc-core/src/brushing.rs:289 the reset pass keeps a non-resident cell and writes no dusted stage"]
