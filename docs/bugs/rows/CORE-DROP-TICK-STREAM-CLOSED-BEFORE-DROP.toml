[[bug]]
id = "CORE-DROP-TICK-STREAM-CLOSED-BEFORE-DROP"
title = "The drop-join fixture's tick stream closed before the drop, so the block write never published (fail-closed halt or early tick-owner end, cause unidentified)"
area = "harness"
severity = "minor"
status = "open"
source = "Full-workspace gate 20261127T131015-correctness-dzm_6622 (clean ce79b59a57) failed only mc-core core::core_drop_join_tests::plain_drop_holds_the_world_lease_until_the_publication_commits at test.log:5736 in 12.062 s. The child's own panic is core/core_drop_join_tests.rs:84 'tick stream closed while waiting for the block write' (test.log:5764-5766) — the tick owner's broadcast closed BEFORE the drop thread existed, so this is not the lease-after-drop loss that CORE-DROP-RELEASES-LEASE-BEFORE-OWNERS-JOIN covers. Not a 90 s wait and not a duration flake. The same test passed on 96dc0dc439 (20261127T105323 test.log:6017, 7.356 s) with identical product bytes, and passed in 3 sequential runs, 8 concurrent runs, 8 concurrent runs under a 100 % CPU quota for 14.6-15.3 s each, and the whole mc-core lib suite (20261127T141757/mc-core 5551 passed). Cause still unidentified. Leading hypothesis: the 10 s reliable-outbox stall watchdog (config.rs:146 OUTBOX_STALL_LIMIT; tick_loop.rs:362) fired because the fixture never drains the reliable outbox and the join tick queues a PlayerChange::Joined batch (tick/input/session.rs:339 -> tick/state.rs:227); 12.062 s ≈ ~2 s of open/join + the 10 s limit. The wall time of the starved runs does not measure the undrained ticking interval, so it does not exclude this branch. Instrumentation (halt_reason on the closed stream, commit 6d5884ba43) and an edge-style drain (commit c99d277960, same call core_stop_tests.rs:265-271 makes for its own player) are in the tree; neither is a diagnosis, and a green batch does not prove the cause. Full trace receipts/D124/Main/D138-DROP-JOIN.md."
repro = "source"
regression = [
  "cargo:mc-core:core::core_drop_join_tests::plain_drop_holds_the_world_lease_until_the_publication_commits",
]
