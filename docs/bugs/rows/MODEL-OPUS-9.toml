repro_check = "candidate: cod and pufferfish_small/medium are exact against 26.3 with a real revert control (receipts/XHarnessGates/client-r5-revert-red.log fails the pufferfish ref at asset_model_regression_tests.rs:352; receipts/XHarnessGates/models263/audit-pufferfish.json). Decision (Main, round 5): salmon, tropical_fish and pufferfish_big keep the authored rigs because the vanilla samples fall outside the 32x32 texture and the shared checker stays unchanged - the earlier needs the 26.3 dump and a decision clause is settled. area=client, candidate: real-client check required. D123PackPairs3 (2026-11-26) measured a dead end for a geometry witness: the client mesher emits six quads per cube (an authored faces map selects UV rects only), so both sides of the pair submit the same pufferfish geometry - 216 indices / 36 quads for pufferfish_small and 396 / 66 for pufferfish_medium on ba1971d76215 (raw receipt receipts/D123/D123PackPairs3/raw-pufferfish.log), and the pre-image 72f4ff6f rigs have the same cube counts and the same 5x3x6 px bbox (the control raw run receipts/D123/D123PackPairs3/raw-pufferfish-control.log measured the same 216 indices / 36 quads with client 72f4ff6f, artifact 20261126T142611-scene-shot-esucwstj). The fix is quad-atlas exactness, whose only real-client separator would be a texture-texel oracle on a 1x2 px fin face, not a stable frame assertion; PUFF_STATE (the rig selector) is not reachable either, because the server sends no puff-state metadata (received_metadata in the dump has no such index). D123PackPairs3 (2026-11-26) found the honest witness: the client layer report now carries a bounded UV digest (quantized /65535 FNV-1a over the layer vertices), and the pufferfish frames differ only in UV while the indices stay 216 on both sides. Pair: the fix tree is the base (ba1971d7 + the selection field 8eda5627 + the digest commit a5bd1f5e, cdb7d514) with the two pufferfish lookups re-landed in one commit, bb33b3f1 = fix_commit; the control 53