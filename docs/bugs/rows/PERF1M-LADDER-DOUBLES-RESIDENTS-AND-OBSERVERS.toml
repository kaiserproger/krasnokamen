[[bug]]
id = "PERF1M-LADDER-DOUBLES-RESIDENTS-AND-OBSERVERS"
title = "The Perf1M scale ladder changes two factors at once (observer count K = ceil(N/1024) grows with the resident count N), so the published 3.87x wall-cost ratio for 2x residents cannot be attributed to a shared-resource ceiling and roadmap lever 1 rests on a confounded pair."
area = "harness"
repro = "source"
severity = "minor"
status = "open"
source = "receipts/Books/REPORT-R1.md gap G-3 and section F1 (Gregg 12.1.3 failure 10 changing multiple factors, 2.5.11 workload characterization; the report's top finding, it invalidates a published ranking; perf). receipts/Perf1M/SCALE-CURVE.md:27-28 gives K = ceil(N/1024) (pens of 1,024 residents, tools/coreperf/profiles.py), so the pair (8,192, K=8) -> (16,384, K=16) doubles both; receipts/Perf1M/ROADMAP.md:147 ranks superlinear tick growth as lever 1 and concludes the cost is a shared resource, while its own control (16k, no observer 0.85 ms vs 35.66 ms with 16 observers, ROADMAP.md:156) and SCALE-CURVE.md:85-87 point at observers x visible entities. The controls now exist (--scale-residents, --scale-view-distance, 2c043ef82 / 91ceac94c) but the confound is not resolved: ROADMAP.md still lists the K sweep as a next step. Fix is a changed measurement recipe, not code: 16,384 residents at K=8 and 8,192 at K=16 on the same box, pin and lane, one A/B pair each; report cost(N,2K)/cost(N,K) per phase (a phase with ratio about 2 at fixed N is observer-bound) and remove its share from the per-entity column before any 100 ns/entity claim. Gates the next roadmap revision."
regression = []
failing_first = "not recorded"
