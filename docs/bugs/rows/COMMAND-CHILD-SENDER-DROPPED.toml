[[bug]]
id = "COMMAND-CHILD-SENDER-DROPPED"
title = "A command sent by a player standing in the Nether or the End ran on the root world: /kill did nothing, /summon put the entity in the wrong world and gamerule feedback never reached the edge"
area = "gameplay"
repro = "cargo"
severity = "major"
status = "open"
source = "Found while auditing the command path for the XCoreCommands slice (wt/XCoreCommands 349208af8): command_execution_deferred.rs ran the queued job against the job's root context, not job.context.dimension, so every queued command from a child dimension executed on the overworld. XCoreItems' bisect left b2b442ded6 among the candidates for the same symptom (candidate, not proven causal)."
regression = ["cargo:mc-core:dimensions::tests::data_edits_an_entity_for_senders_in_the_nether_and_the_end", "cargo:mc-core:dimensions::tests::send_command_feedback_set_from_the_nether_is_published_for_the_edge", "cargo:mc-core:dimensions::tests::anchor_respawn_can_stand_on_top_when_surrounded", "cargo:mc-core:dimensions::tests::anchor_respawn_uses_carpet_collision_height", "cargo:mc-core:dimensions::tests::kill_from_the_nether_clears_the_live_nether_cow_and_spares_the_root"]
failing_first = "reported"
fix_commit = "patch:244af5f2dc4de7157b501ac76df83efcc89dc732a39413bda81ba8e442115128"
repro_check = "Open. The fix is a sha256 patch without a resolvable commit; an invented root-context stub is not accepted as a control (owner decision requested)."
