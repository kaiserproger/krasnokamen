[[bug]]
id = "FANOUT-ROSTER-SCAN-PER-VISIBLE-PLAYER-PER-VIEWER"
title = "broadcast_to answers 'is this recipient a spectator and may it see this entity' by scanning player_roster linearly, twice, for every visible player entity of every viewer on every publish, so the cost is O(viewers x visible players x roster) with a new cache line per step."
area = "gameplay"
repro = "source"
severity = "minor"
status = "fixed"
source = "receipts/Books/REPORT-R3.md rule table R3-19 (Fabian, Searching / Tables: never re-derive a relation by scanning when it can be an index; perf). crates/mc-edge/src/plan/entity_interest.rs broadcast_to scans snapshot.player_roster (RosterPlayer carries a String name, about 56 B, crates/mc-core/src/dimensions_globals.rs), called from changed() and enter_leave(); the answer is a pure function of per-snapshot data. Verified open on main 5bdc02911 (player_roster iterated in entity_interest.rs). Fix direction: build a per-snapshot game-mode index once per publish. Measure fanout-thread self time (perf record -g) at 100 and 1000 observers with many players. No loss, crash or security consequence; Perf1M scale item, not freeze-relevant."
regression = ["cargo:mc-edge:plan::plan_tests::player_visibility_tests::broadcast_to_answers_from_the_publish_set_not_the_roster"]
failing_first = "reported"
fix_commit = "patch:aecd75e12dd745501c8c297dfe5d6f4784589f0c6fc96ad778c4cfb4a1e4a6e0"
promotion = "docs/bugs/promotions/FANOUT-ROSTER-SCAN-PER-VISIBLE-PLAYER-PER-VIEWER.json"
repro_check = "broadcast_to with a roster that contradicts the publish set answers the roster (red on the control: player 1 does not see the player); the fixed set lookup answers the set One HashSet of spectator entities built per publish in TickPlanIndex, threaded through broadcast_to/changed/enter_leave/delta and entity_candidates::collect; broadcast_to is a set lookup, so a publish visits the roster once instead of twice per (entity, recipient) pair. The control reverses only broadcast_to's body to the pre-fix two-scan body (same 4-parameter signature, the kept set parameter unused); the registered authority test hands it a roster that contradicts the set and reds."
