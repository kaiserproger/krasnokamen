[[bug]]
id = "CHECKPOINT-MANIFEST-HAS-NO-FORMAT-VERSION"
title = "The checkpoint manifest JSON has no format version and its domain_versions gate covers 10 of about 25 fields, so an older binary opens a newer world, defaults the unknown fields and writes them back erased at its next checkpoint (default game mode, scheduled functions, world spawn)."
area = "gameplay"
repro = "source"
severity = "major"
status = "open"
source = "receipts/Books/REPORT-R5.md section 1 G1 (Petrov ch. 3 versioning p. 57-58, ch. 5 p. 90; data loss on a binary downgrade). CheckpointManifest (crates/mc-core/src/journal.rs) derives Serialize and Deserialize with no version field and every newer field is serde(default); the only gate is native_checkpoint::validate_manifest comparing domain_versions() for equality (crates/mc-core/src/native_checkpoint.rs, a ten-name list: climate, gamerules, block_ticks, fluid_ticks, claims, tickets, raids, end_fight, plugins, plugin_startup), mirrored by the redb header VERSIONS (crates/mc-world/src/native/checkpoint.rs). Fields outside the list (world_spawn, scheduled_functions, default_game_mode, difficulty, border, inhabited_time, debt, generated_entity_claims, ...) are protected by nothing; unknown fields are ignored. Scenario: the operator rolls the pin back one build; the older binary passes the gate, supplies GameMode::default() = Survival, and its next checkpoint writes the manifest without the field; the newer binary reopens a world whose default mode flipped to survival, scheduled command blocks stopped and spawn moved, with no log line. Verified open on main 5bdc02911 (no manifest_version, domain_versions() still ten names). Fix direction, decided by the architecture committee (receipts/Books/PERSIST6-SYNTHESIS.md): one exact-equality `manifest` entry in domain_versions(), written to the root and both child images and compared exactly on read; no converter and no accept-both or serde-default fallback, so a world written under another version refuses startup. The report's proposed \"accept both lists, manifest_version default 0\" is rejected. The version constant lives in mc-core native_checkpoint.rs and mirrors in mc-world native/checkpoint.rs. Regression evidence: cargo:mc-core:native_checkpoint::tests::manifest_format_version_is_required_in_root_and_children, cargo:mc-core:native_checkpoint::tests::manifest_format_version_round_trips_through_the_writer, cargo:mc-world:native::checkpoint_tests::native_checkpoint_requires_the_manifest_format_version, cargo:mc-world:native::checkpoint_tests::native_checkpoint_round_trips_the_manifest_format_version; cross-binary refusals recorded in receipts/ManifestVersion/run-a-oldrefusal.log and run-b-newrefusal.log."
regression = ["cargo:mc-core:native_checkpoint::tests::manifest_format_version_is_required_in_root_and_children", "cargo:mc-core:native_checkpoint::tests::manifest_format_version_round_trips_through_the_writer", "cargo:mc-world:native::checkpoint_tests::native_checkpoint_requires_the_manifest_format_version", "cargo:mc-world:native::checkpoint_tests::native_checkpoint_round_trips_the_manifest_format_version"]
failing_first = "not recorded"
