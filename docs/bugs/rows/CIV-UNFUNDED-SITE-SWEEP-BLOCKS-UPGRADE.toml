[[bug]]
id = "CIV-UNFUNDED-SITE-SWEEP-BLOCKS-UPGRADE"
title = "An unfinished site search for a now-unfunded building can delay a paid House upgrade"
area = "gameplay"
severity = "minor"
status = "open"
source = "Matched mc-core plan_pass fixture on base 99b3bf0154da: two residents share a one-bed House L1, the L2 upgrade is paid and eligible, and the unfinished search for a new House L1 has no candidate. Adding only a retained Farm candidate after Farm funding is withdrawn changes the verdict from upgrade to sweep_waiting, leaving no project. This fixture does not identify the cause of the historical A9 population plateau. The fixture named above was reconstructed from the A9IntegC lane: receipts/A9IntegC/layers/09-sweep-hold-materialize.patch (its forward fix patch) and the negative-control receipt receipts/A9IntegC/NC-03-stale-hold.ejbBmsua (control tree bb79786c, nextest exit 100 on the two-test stale/funded sweep filter)."
repro = "cargo"
regression = ["cargo:mc-core:settlements::construction::growth_tests::a_stale_unfunded_sweep_does_not_hold_the_slot_for_a_funded_upgrade", "cargo:mc-core:settlements::construction::growth_tests::a_funded_sweep_that_still_holds_a_candidate_keeps_the_slot", "cargo:mc-core:settlements::construction::growth_tests::an_ordinary_revisit_of_the_priority_house_owns_the_hold", "cargo:mc-core:settlements::construction::growth_tests::a_refused_materialization_keeps_the_earlier_hold"]
failing_first = "reported"
fix_commit = "patch:27e4358a39c30bec784213e18d1e8a0bf14517364eec97e61407d4f510ab04dd"
repro_check = "Patch docs/bugs/promotions/CIV-UNFUNDED-SITE-SWEEP-BLOCKS-UPGRADE.patch (patch:27e4358a, map in .hunks.md; the net non-test diff of 968589107 plus the per-kind-hold refactor) reverses on the candidate. Reversed, site_refusals holds every live sweep again: the stale-scratch run (a retained Farm candidate whose funding was withdrawn) returns no project where the plain run admits the paid House L2, so a_stale_unfunded_sweep_does_not_hold_the_slot_for_a_funded_upgrade fails at its decision assertion; a_funded_sweep_that_still_holds_a_candidate_keeps_the_slot stays green in the same control (the same-kind hold is unchanged). an_ordinary_revisit_of_the_priority_house_owns_the_hold covers SitePass::house_advanced and a_refused_materialization_keeps_the_earlier_hold the materialization keep."
