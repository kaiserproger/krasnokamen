[[bug]]
id = "CLIENT-MOUNTED-SCAN-REFUSES-BESIDE-UNHELD-CHUNK"
title = "A mounted client (boat or vehicle) still aborts its whole prediction when a scan cell falls in a chunk it does not hold: world.block(..).ok_or(\"unloaded_mount_*\"/\"unloaded_boat_*\") returns Err, Player::tick records movement_blocked and pins the mount, so a mounted player beside a quarantined column can hit the same freeze the unheld-cell rule fixed on foot."
area = "client"
repro = "client"
regression = ["client:krasnokamen-client:player::vehicle::tests::boat_status_resolves_an_unheld_column_as_solid_ground", "client:krasnokamen-client:player::vehicle::tests::finish_move_keeps_the_step_over_an_unheld_column", "client:krasnokamen-client:player::vehicle::tests::boat_fluid_box_keeps_exposed_passenger_and_restores_submerged_body"]
severity = "major"
status = "open"
source = "Review REVIEW-15-Opus-delta d-m4 [inference]: client:cdc99ae98 installed the unheld-cell rule in collision::gather, climbable, the inside scan and the fluid contact, but src/player/vehicle.rs still converts an unheld block into an error at 13 sites: line 728 (unloaded_mount_collision), 1020 (unloaded_mount_fluid), 1142 and 1166 (unloaded_boat_water), 1202 (unloaded_boat_ground), 1539 and 1548 (unloaded_mount_inside_block), 1643, 1665 and 1679 (unloaded_mount_collision), 1705 (unloaded_boat_water), 1762 and 1768 (unloaded_mount_fluid). The water and ground scans at 1142, 1166 and 1202 iterate the body's x/z cells expanded by ceil, so a boat one block from a quarantined column samples the unheld cell and returns Err."
repro_check = "Fix on client 56d53fe534 (wt/D123PackClientCore): all 13 listed sites in src/player/vehicle.rs resolve a cell of an unheld chunk as one full solid cube instead of returning Err - the water scans and boat_water_above skip it (no fluid), the boat ground scan counts it as contact with vanilla default friction 0.6, mount friction/speed/jump read 0.6/1/1, finish_move has no slime/bed bounce, water and lava current-cell reads give speed factor 1, append_lava_colliders and the bubble-column surface treat it as no lava/no fluid surface, and the powder-snow read finds no block identity. Two client refs were added: boat_status_resolves_an_unheld_column_as_solid_ground (a boat straddling the chunk border, x = 16 unheld) and finish_move_keeps_the_step_over_an_unheld_column. Negative control on the same tree with only the boat_status and finish_move production hunks reverted: the two tests fail at called Result::unwrap() on an Err value: unloaded_boat_water and unloaded_mount_collision - receipts/D123PackClientCore/logs/negative-control.log. Still missing for promotion: proof (a) a scene leg that boards a boat beside the column native-v2-corrupt-chunk-near-camera quarantines and asserts movement_blocked null, corrections 0 and a predicted step, and proof (c) its real-client red/green receipt pair; neither scene leg exists yet, and the other 7 sites (strider above, bubble-column above, powder-snow position, lava colliders) carry no discriminating test of their own."
fix_commit = "client-test:56d53fe5341262ca3be971ed577ab33e0fe9eeab"
failing_first = "reported"
