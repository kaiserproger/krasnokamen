[[bug]]
id = "CLIENT-MOUNTED-SCAN-REFUSES-BESIDE-UNHELD-CHUNK"
title = "A mounted client (boat or vehicle) still aborts its whole prediction when a scan cell falls in a chunk it does not hold: world.block(..).ok_or(\"unloaded_mount_*\"/\"unloaded_boat_*\") returns Err, Player::tick records movement_blocked and pins the mount, so a mounted player beside a quarantined column can hit the same freeze the unheld-cell rule fixed on foot."
area = "client"
repro = "client"
regression = ["client:krasnokamen-client:player::vehicle::tests::boat_status_resolves_an_unheld_column_as_solid_ground", "client:krasnokamen-client:player::vehicle::tests::finish_move_keeps_the_step_over_an_unheld_column", "client:krasnokamen-client:player::vehicle::tests::boat_fluid_box_keeps_exposed_passenger_and_restores_submerged_body", "harness:entities:native-v2-mount-beside-refused-column"]
proving_refs = ["harness:entities:native-v2-mount-beside-refused-column"]
proving_assertions = { "harness:entities:native-v2-mount-beside-refused-column" = "mount_beside_refused_column_not_blocked" }
fix_commit = "client:631bc9f011227c6019eea5f2af9bf6f701bce3ed"
severity = "major"
status = "open"
source = "Review REVIEW-15-Opus-delta d-m4 [inference]: client:cdc99ae98 installed the unheld-cell rule in collision::gather, climbable, the inside scan and the fluid contact, but src/player/vehicle.rs still converts an unheld block into an error at 13 sites: line 728 (unloaded_mount_collision), 1020 (unloaded_mount_fluid), 1142 and 1166 (unloaded_boat_water), 1202 (unloaded_boat_ground), 1539 and 1548 (unloaded_mount_inside_block), 1643, 1665 and 1679 (unloaded_mount_collision), 1705 (unloaded_boat_water), 1762 and 1768 (unloaded_mount_fluid). The water and ground scans at 1142, 1166 and 1202 iterate the body's x/z cells expanded by ceil, so a boat one block from a quarantined column samples the unheld cell and returns Err."
repro_check = "Fix on client 56d53fe534 (wt/D123PackClientCore): all 13 listed sites in src/player/vehicle.rs resolve a cell of an unheld chunk as one full solid cube instead of returning Err - the water scans and boat_water_above skip it (no fluid), the boat ground scan counts it as contact with vanilla default friction 0.6, mount friction/speed/jump read 0.6/1/1, finish_move has no slime/bed bounce, water and lava current-cell reads give speed factor 1, append_lava_colliders and the bubble-column surface treat it as no lava/no fluid surface, and the powder-snow read finds no block identity. Two client refs were added: boat_status_resolves_an_unheld_column_as_solid_ground (a boat straddling the chunk border, x = 16 unheld) and finish_move_keeps_the_step_over_an_unheld_column. Negative control on the same tree with only the boat_status and finish_move production hunks reverted: the two tests fail at called Result::unwrap() on an Err value: unloaded_boat_water and unloaded_mount_collision - receipts/D123PackClientCore/logs/negative-control.log. Promotion attempted on a new scene leg (harness:entities:native-v2-mount-beside-refused-column): the refused fixture column, the rejoin, the grounded restart and the on-foot walk to the column's face all pass, and the summoned oak_boat is received by the client (4 runs, receipts/D123PackClientCore/logs/probe-fix-mount{,2,3,4}.log). The leg stops at the ride: minecraft_approach_entity and minecraft_interact_entity complete without a local error, yet the player never becomes a passenger - the boat answers an 8-tick drive press with 0.008 blocks of drift, and the client's observer rows carry no boat row at all (boats: []), so no passenger or vehicle evidence exists. The mounted prediction therefore never runs and the scene cannot yet discriminate this row's symptom; the row stays open. Exact blocker: boarding a vehicle through the client automation surface (either entity interaction sends no mount action for a boat, or the observation exposes no vehicle/passenger field to confirm one)."
failing_first = "reported Promotion uses this row own patch, committed at docs/bugs/fix-patches/CLIENT-MOUNTED-SCAN-REFUSES-BESIDE-UNHELD-CHUNK.patch (it reverse-applies on client bda1cd84dd; the four rows share one client commit, so a client:<sha> reversal would carry all of them): run `python3 -m tools.harness ledger promote CLIENT-MOUNTED-SCAN-REFUSES-BESIDE-UNHELD-CHUNK --fix-patch docs/bugs/fix-patches/CLIENT-MOUNTED-SCAN-REFUSES-BESIDE-UNHELD-CHUNK.patch --dry-run`, record the patch:<sha256> the tool prints and cite `bda1cd84dd` in the promotion body."
