[[bug]]
id = "CLIENT-MOUNTED-SCAN-REFUSES-BESIDE-UNHELD-CHUNK"
title = "A mounted client (boat or vehicle) still aborts its whole prediction when a scan cell falls in a chunk it does not hold: world.block(..).ok_or(\"unloaded_mount_*\"/\"unloaded_boat_*\") returns Err, Player::tick records movement_blocked and pins the mount, so a mounted player beside a quarantined column can hit the same freeze the unheld-cell rule fixed on foot."
area = "client"
repro = "client"
regression = ["client:krasnokamen-client:player::vehicle::tests::boat_fluid_box_keeps_exposed_passenger_and_restores_submerged_body"]
severity = "major"
status = "open"
source = "Review REVIEW-15-Opus-delta d-m4 [inference]: client:cdc99ae98 installed the unheld-cell rule in collision::gather, climbable, the inside scan and the fluid contact, but src/player/vehicle.rs still converts an unheld block into an error at 13 sites: line 728 (unloaded_mount_collision), 1020 (unloaded_mount_fluid), 1142 and 1166 (unloaded_boat_water), 1202 (unloaded_boat_ground), 1539 and 1548 (unloaded_mount_inside_block), 1643, 1665 and 1679 (unloaded_mount_collision), 1705 (unloaded_boat_water), 1762 and 1768 (unloaded_mount_fluid). The water and ground scans at 1142, 1166 and 1202 iterate the body's x/z cells expanded by ceil, so a boat one block from a quarantined column samples the unheld cell and returns Err."
repro_check = "Not measured on a real client yet; the evidence is the source path. Every listed site reads `world.block(p).ok_or(\"unloaded_...\")?`, and Player::tick turns any Err out of predict into movement_blocked with the velocity zeroed (src/player.rs tick), which is exactly the state CLIENT-NO-GROUND-BESIDE-QUARANTINED-CHUNK measured on foot before client:cdc99ae98. The server resolves such a cell as BlockMaterial::Solid (full block), so the client has to agree in these scans too or the mount freezes and its steps are corrected. Missing proof, in order: (a) a scene leg that boards a boat (or mounts a vehicle) beside the column native-v2-corrupt-chunk-near-camera quarantines and asserts movement_blocked null, corrections 0 and a predicted step; (b) a fix that resolves an unheld cell as a full solid block in these scans (no fluid, no inside effect, no climb); (c) a real-client red/green receipt pair with its own proving assertion. No fix written in this round (Main's instruction: record it, do not fix now). The registered client ref is the boat fluid-box test: it passes today and is not evidence for this bug - the row has no discriminating check yet, which is exactly what (a) has to add."
