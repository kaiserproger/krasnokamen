repro_check = "CONTROL (real pre-image, no rewrite): `d3e8d4686` (2026-10-24) added `falling::scheduled` plus the `tick_cell` gravity arm in `redstone/mod.rs`; those two non-test hunks reverse cleanly at this head (`git apply -R --check`), so the control is the plain reversal in `wt/D123MechanicsGCtl` (`8a72651f6`, its diff byte-identical to the fix's 35 added / 13 removed lines with the sign swapped, `falling_tests.rs` kept).\n\nFIXTURE: only a save can carry the row's record. `/setblock` turns a gravity cell into a falling entity inside the placing write (`falling::start`), and no engine path schedules a gravity block tick, so a `/tick freeze` fixture would prove the *entity* lane instead - that is why the earlier frozen-world gate design was dropped (it also sat on FREEZE-EXPORT-IMPORT-QUARANTINE, now fixed). The gate plants the record into the world `world export-anvil` wrote: `tools/harness/backends/anvil_scheduled_tick.py` turns the sand's support cell into air (palette index only, no entry added) and appends `block_ticks` `{i: minecraft:sand, x, y, z, t: 600, p: 0}` to the chunk's own list, after verifying that the cell holds sand and the support holds stone. `world import-anvil` then reads it back through the product's restore path (`mc-world-conversion/src/import.rs:726-745`), which is the route the report came from.\n\nGATE `native-v2-ledger-gravity-tick` (assertion `saved_tick_moved_the_sand`): before the export the client reads the sand on its support (`sand_placed_on_its_support`); after the restart nothing writes near the block - the scene only reads the cell in 20-tick steps - and the saved tick alone must move it (`saved_tick_moved_the_sand`) onto the kept support (`sand_landed_on_its_support`, `landing_support_survived`). The read of the sand in its cell after the rejoin is recorded, not asserted, so a slower rejoin cannot fake it.\n\nRECEIPTS: candidate (server pin `c2d54b3342f7`, client pin `fa231b1b34f8`) green three times: `20261125T131941-native-v2-ledger-gravity-tick-pbuust5q` (62.3 s), `20261125T132105-...-a1mpkcgu` (57.9 s), `20261125T132205-...-01kiw6wx` (62.6 s) - each read `minecraft:sand` at the placed cell for 19 20-tick steps and then `minecraft:air`, with landing/support sand/stone. Control (pin from the reversed tree `8a72651f6a15`) red three times, each at `saved_tick_moved_the_sand` with the sand held for every one of the 45 steps: `20261125T132915-...-2rdk88iz`, `20261125T133109-...-cnuqouei`, `20261125T133301-...-wnjrl300`."
