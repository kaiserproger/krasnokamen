[[bug]]
id = "JAVA-CLIENT-MISSES-FOUNDING-STARTER-CHEST-BLOCK"
title = "A vanilla Java 26.3 client sometimes does not show the starter chest placed by `/settlement create`: the server holds the chest and the grant, the client keeps air at that cell (a Horizon 26.3 miss was reported but its artifact was lost)"
area = "gameplay"
severity = "major"
