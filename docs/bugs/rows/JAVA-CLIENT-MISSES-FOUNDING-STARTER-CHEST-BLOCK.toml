source = "D63 stage 1 acceptance (SettlementQuickWinsAccept, 2026-11-20), pin 7393780e37a4 (tree 7209af9fb), `settlement-map-qa --client java --windowed -- --scenario quickwins --language ru_ru`: 1 of 5 Java 26.3 runs, 0 native runs. Failed run receipts/SettlementQuickWinsAccept/java-7209af9fb/flake-C1-26.3 (artifact 20261119T215801-settlement-map-qa-6pvauu2f): after the chat line `Founded qw` the client block scan x124..132 y198..204 z-4..4 ran 15 times over about 15 s and saw the pad (81 dirt, 81 grass, 405 air), never a chest. On a hash-checked copy of that run's stopped world (receipts/SettlementQuickWinsAccept/c1-flake-world-copy): `world census` PASS, settlement 2 anchor [128,201,0]; `world probe` finds exactly one empty chest at (129,201,0) inside the scan window; state.redb holds the grant row settlement_chest/<owner uuid>. The chest is placed in the founding command's own tick (crates/mc-core/src/command_execution/settlement.rs:63-81). Cause open: lost, late or out-of-order delivery are not distinguished by retained evidence. A Horizon 26.3 run on the same pin was reported to miss the chest through 15 scans, a ±16 scan and a 60 s rescan and to show it after teleporting 220 blocks away and back; its run directory and world were deleted by a rerun (run_hz.sh rm -rf), so only the agent's transcription remains (receipts/SettlementQuickWinsAccept/horizon-7209af9fb/c1-miss-diagnostic-TRANSCRIBED.json). It is not independent evidence; a retained reproduction is required before 'missing until chunk resend' or a Horizon repro can be claimed."
repro = "client"
