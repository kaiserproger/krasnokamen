[[bug]]
id = "JAVA-CLIENT-MISSES-FOUNDING-STARTER-CHEST-BLOCK"
title = "A vanilla Java 26.3 client sometimes does not show the starter chest placed by `/settlement create`: the server holds the chest and the grant, the client keeps air at that cell (a Horizon 26.3 miss was reported but its artifact was lost)"
area = "gameplay"
severity = "major"
status = "open"
source = "D63 stage 1 acceptance (SettlementQuickWinsAccept, 2026-11-20), pin and tree 7393780e37a4 (server code 7209af9fb plus harness-only changes), `settlement-map-qa --client java --windowed -- --scenario quickwins --language ru_ru`: one failure in five Java 26.3 runs; no failures in the three retained native runs. Failed run receipts/SettlementQuickWinsAccept/java-7209af9fb/flake-C1-26.3 (artifact 20261119T215801-settlement-map-qa-6pvauu2f): after the chat line `Founded qw` the client block scan x124..132 y198..204 z-4..4 ran 15 times over about 15 s and saw the pad (81 dirt, 81 grass, 405 air), never a chest. On a hash-checked copy of that run's stopped world (receipts/SettlementQuickWinsAccept/c1-flake-world-copy): `world census` PASS, settlement 2 anchor [128,201,0]; `world probe` finds exactly one empty chest at (129,201,0) inside the scan window; state.redb holds the grant row settlement_chest/<owner uuid>. The chest is placed in the founding command's own tick (crates/mc-core/src/command_execution/settlement.rs:63-81). Cause (ChestDeliveryFix, reviewed by ReviewChestFix; receipts/ChestDeliveryFix/CAUSE.md): with the Nether and End resident the command runs as a dimension-coordinator job, and the coordinator republished the Overworld output with the chest's block change beside a chunk image taken before the chest was folded in (crates/mc-core/src/dimensions_travel.rs `refresh`); the fold followed a tick later without a block change. The edge sent the change with that output's own state (air) and took the chunk's next revision as explained by that tick's other block or light changes, so it never resent the chunk: no correct packet is lost, the edge reads stale state from an inconsistent core output. A Horizon 26.3 run on the same pin was reported to miss the chest through 15 scans, a ±16 scan and a 60 s rescan and to show it after teleporting 220 blocks away and back; its run directory and world were deleted by a rerun (run_hz.sh rm -rf), so only the agent's transcription remains (receipts/SettlementQuickWinsAccept/horizon-7209af9fb/c1-miss-diagnostic-TRANSCRIBED.json). Retained reproduction (receipts/ChestDeliveryFix/REVIEW-BRIEF.md): founding with observer clocks changing blocks of the anchor's chunk, 100 ticks after the pad (now `--scenario quickwins-c1-race`), pin 7393780e37a4 missed the chest on Java 26.3 in 7 of 7 runs and on Horizon 26.3 in 2 of 2; where rescanned it was absent after 60 s and present after teleporting 220 blocks away and back, and the stopped worlds hold it. The fixed core showed it in 5 of 5 Java and 2 of 2 Horizon runs."
repro = "client"
regression = ["cargo:mc-core:dimensions::tests::cross_dimension_anchor_respawn_publishes_the_spent_charge_in_its_chunk_image", "cargo:mc-edge:plan::plan_tests::coordinator_block_tests::coordinator_respawn_anchor_charge_reaches_a_viewer_holding_the_chunk", "harness:settlement-map-qa:starter_chest_race"]
fix_commit = "1a3021c5053bc9975dabd569366b74188bd6bf9d"
failing_first = "reported"
