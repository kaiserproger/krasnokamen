[[bug]]
id = "HARNESS-CIV-GATE-IRON-EVIDENCE-WINDOW"
title = "The civilization gate's iron_smelted verdict misses smelting that happened: it needs an ingot in a furnace's output slot at a snapshot, while the town's own furnace records the smelted recipes and the tender collects the output between samples."
area = "harness"
repro = "client"
severity = "major"
status = "open"
source = "Seed-24 civilization-seed-qa 20261124T212153-civilization-seed-qa-ppx5x3ra (pin ae26eec99e74, 1683 s, full 96 000 ticks): verdicts are new_house false, births false, second_building true, iron_smelted false, and the milestones hold only second_building. The town did smelt iron: server.log holds 34 reads of the furnace at [132,78,-222] with '{Items: [], RecipesUsed: {minecraft:iron_ingot_from_smelting_raw_iron: 2}, cooking_time_spent: 0s, cooking_total_time: 200s, id: minecraft:furnace, lit_time_remaining: 0s, lit_total_time: 300s}' (report_reads only), the snapshot's workstation list holds 'minecraft:furnace@132,78,-222' (the store-level terrace column, so 9026719a07 held), and storage at the last snapshot holds minecraft:shears 1 (crafted from two smelted ingots) beside raw_iron 6 and coal 10. The verdict samples each furnace's container at snapshot time (civization_seed_qa.py, the `container_totals.iron_ingot > 0` branch that calls capture_iron_menu) and the resident had already collected both ingots, so no snapshot ever saw one in the output slot."
failing_first = "reported"
fix_commit = "patch:1103da5b6e6d1585af593ddb69f9c997bccf7fdb3b20a9efdcebe0c4ea9a142c"
regression = [
  "python:tools.harness.test_village_autonomy_qa:IronSmeltCounterTests.test_a_furnace_recipe_counter_proves_a_smelt",
  "python:tools.harness.test_village_autonomy_qa:IronSmeltCounterTests.test_an_empty_or_foreign_counter_is_no_evidence",
  "python:tools.harness.test_village_autonomy_qa:IronSmeltCounterTests.test_recipe_read_reports_console_refusal_and_expiry",
  "python:tools.harness.test_civilization_seed_qa:IronEvidenceTests.test_a_town_furnace_counter_proves_a_smelt",
  "python:tools.harness.test_civilization_seed_qa:IronEvidenceTests.test_a_stored_ingot_is_the_stronger_evidence",
  "python:tools.harness.test_civilization_seed_qa:IronEvidenceTests.test_a_baseline_furnace_with_a_prewritten_counter_proves_nothing",
  "python:tools.harness.test_civilization_seed_qa:IronEvidenceTests.test_empty_zero_and_blasting_only_counters_are_no_evidence",
  "python:tools.harness.test_civilization_seed_qa:IronEvidenceTests.test_a_fixture_command_that_writes_block_entity_nbt_fails_closed",
  "harness:civilization-seed-qa:iron_smelted",
]
repro_check = " Promotion uses patch mode: `--fix-patch /run/media/kaiserroman/games/solaris-work/receipts/D123/D123Civ/promotions/HARNESS-CIV-GATE-IRON-EVIDENCE-WINDOW.patch` (git diff cc97c16d67..HEAD of the two gate backends; the commit 336649720f no longer reverses because f45ef51afa moved the same lines).The evidence rule is the blocker, not a missing observation: run 20261124T195404 observed the same furnace after smelting (RecipesUsed iron_ingot_from_smelting_raw_iron: 2) and its snapshot caught the output slot once (iron_smelted true), while run 20261124T212153 smelted two ingots (shears in storage) and every sample missed the slot. A fix would accept the furnace's persistent RecipesUsed counter for minecraft:iron_ingot_from_smelting_raw_iron (read-only, already in the snapshot's own data-get output) as evidence that the town smelted iron, optionally keeping the menu capture for the screenshot. Main accepted CIV-B2 (1) on 2026-11-25: the gate now also reads the furnace's persistent RecipesUsed and, for a town furnace (not a baseline one), accepts minecraft:iron_ingot_from_smelting_raw_iron >= 1 as the iron_smelted proof, naming the furnace and the counter in the milestone, and keeps the output-slot menu capture (screenshot) as the stronger evidence when an ingot is present. The milestone always names its source (`output_slot` or `furnace_recipes`) and the furnace coordinates. The gate fails closed when one of its own fixture commands writes block-entity NBT (`data merge`, `data modify`, `RecipesUsed`/`recipes_used`), so a written counter cannot forge the proof. No 'crafted shears' evidence is used: adopted-village chests can hold vanilla ingots. Remaining proof for promotion: a passed gate receipt carrying `milestones.iron_smelted.source`, plus the graphical negative control - one run on a pin with 9026719a07 reversed (furnace on the well roof, RecipesUsed empty, iron_smelted false by both branches), which also closes CIV-B1 for SETTLEMENT-FURNACE-SITE-ON-ANOTHER-STRUCTURES-ROOF. Patch regenerated 2026-11-28 (D145) at a3c6bd958: docs/bugs/fix-patches/HARNESS-CIV-GATE-IRON-EVIDENCE-WINDOW.patch is the forward-ported non-test diff of 336649720 (furnace RecipesUsed read) plus f45ef51af (iron_evidence, source labels, NBT fail-closed); `git apply` restores the fix on its own pre-image and `git apply -R` removes it on a3c6bd958 (both checked). fix_commit is patch:1103da5b6e6d1585af593ddb69f9c997bccf7fdb3b20a9efdcebe0c4ea9a142c."
