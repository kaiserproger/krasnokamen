[[bug]]
id = "REFRESH-CONTAINER-VIEWERS-COLD-ANCHOR-STALE"
title = "A viewer whose menu is anchored on a half that went cold is never matched by a custody refresh of the resident half, so its menu keeps the old image until the first click closes it"
area = "gameplay"
repro = "source"
severity = "minor"
status = "open"
source = "Filed from the independent review of wave 2 (receipts/D123/D123Persist/review/REVIEW-wave2-1.md N1), after REFRESH-CONTAINER-VIEWERS-COLD-FORK fixed the partial-image case. `tick/containers.rs` `refresh_container_viewers` matches viewers by `container_cells(state, open) == cells`, so a viewer anchored on a now-cold half `H` is not matched when the mutation is on the resident half `R` (`[H] != [R]`): no partial image and no duplicate is sent (the reviewer checked custody), but the menu keeps its previous image until the first click closes it through the residency check in `tick/input/inventory.rs` `container_click`."
regression = []
failing_first = "not recorded"
repro_check = "Open: no control yet, and the naive shape does not work: for a cold half H container_cells(H) is [H] and the mutation on the resident half yields [R], so matching viewers by an intersection of cells closes nothing either (the cold side has no resolvable partner). Two fix shapes: (a) close any viewer whose own anchor cell is non-resident on every custody refresh - a broader rule (a refresh of another chest would close unrelated menus) that needs a decision; (b) record the anchor cell in OpenContainers and close the menu when that chunk is evicted, which keeps the rule local to the viewer. Either way the ref is a chests_tests scene with the viewer opened on a half that is then evicted, asserting MenuClosed and no MenuContents for its window. No test or control built."
