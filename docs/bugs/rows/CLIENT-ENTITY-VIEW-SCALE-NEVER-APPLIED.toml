[[bug]]
id = "CLIENT-ENTITY-VIEW-SCALE-NEVER-APPLIED"
title = "Native client ignores Entity Distance and render distance for entity culling: 2211 received mobs ~75 blocks below an overhead camera draw nothing"
area = "client"
severity = "major"
status = "fixed"
source = "Stage3 Horizon client 1:1 comparison (HzClient1v1 crowd diagnostic, entities_2000 camera_275 observation) on native client 19259ce8: 2211 entities received at overhead pose x4096 y275 z0 pitch 90 with mobs near y200 and entity_distance_scaling=5, but entity_presentation eligible/submitted/crowd = 0 and lighting_pending = 0. Main source check on client 19259ce8: Store::set_view_scale (src/entities.rs:376) has no production caller (only the test at src/entities/view_range.rs:207) and view_range::view_scale (src/entities/view_range.rs:19, vanilla clamp(effective render distance / 8, 1, 2.5) * entityDistanceScaling) is used only in tests, so ViewScale stays at its default 1.0 (src/entities.rs:363-366): the entity draw range is size * 64 blocks instead of up to size * 64 * 12.5"
repro = "client"
regression = ["client:krasnokamen-client:session::actions::render_distance_wire_tests::entity_view_scale_follows_entity_distance_and_effective_render_distance"]
failing_first = "reported"
repro_check = "Fix on client 56d53fe534 (wt/D123PackClientCore): Session::sync_entity_view_scale applies view_range::view_scale(effective_render_distance, entity_distance_scaling) at every input - apply_client_setting (which also gained the missing entity_distance_scaling arm; the Options screen value never reached the session field), apply_persisted_settings, LOGIN and SET_CHUNK_CACHE_RADIUS, the connection radius reset, and both replay distance setters. Negative control run on the same tree: with only those production hunks reverted, cargo test -p krasnokamen-client --lib session::actions::render_distance_wire_tests fails at left: 1.0, right: 5.0 (Store::view_scale stayed at its default 1.0) - receipts/D123PackClientCore/logs/negative-control.log. Promoted on the harness crowd scene (harness:scene-shot:native-crowd-stream: 1300 NoAI cows on a 0.75-block grid at y=100, spectator camera 75 blocks above, RD8, server view distance 10, Entity Distance 500%): the fix client d6102613bed0 reports eligible 1300 / submitted 1244 / dropped_over_budget 56 at 314688 stream vertices with crowd_entities_rendered true, and the control client 418fec0b8e86 (only this row production hunks reversed) reports eligible 0 / submitted 0 and fails the scene at crowd_entities_rendered. Control and restore are one client commit apart, exactly this row non-test patch (delta patch-id 97d986d5937a); promoted as client:51160c3f30, receipt docs/bugs/promotions/CLIENT-ENTITY-VIEW-SCALE-NEVER-APPLIED.json."
promotion = "docs/bugs/promotions/CLIENT-ENTITY-VIEW-SCALE-NEVER-APPLIED.json"
