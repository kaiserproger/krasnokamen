[[bug]]
id = "CLIENT-ENTITY-VIEW-SCALE-NEVER-APPLIED"
title = "Native client ignores Entity Distance and render distance for entity culling: 2211 received mobs ~75 blocks below an overhead camera draw nothing"
area = "client"
severity = "major"
status = "open"
source = "Stage3 Horizon client 1:1 comparison (HzClient1v1 crowd diagnostic, entities_2000 camera_275 observation) on native client 19259ce8: 2211 entities received at overhead pose x4096 y275 z0 pitch 90 with mobs near y200 and entity_distance_scaling=5, but entity_presentation eligible/submitted/crowd = 0 and lighting_pending = 0. Main source check on client 19259ce8: Store::set_view_scale (src/entities.rs:376) has no production caller (only the test at src/entities/view_range.rs:207) and view_range::view_scale (src/entities/view_range.rs:19, vanilla clamp(effective render distance / 8, 1, 2.5) * entityDistanceScaling) is used only in tests, so ViewScale stays at its default 1.0 (src/entities.rs:363-366): the entity draw range is size * 64 blocks instead of up to size * 64 * 12.5"
repro = "client"
regression = ["client:krasnokamen-client:session::actions::render_distance_wire_tests::entity_view_scale_follows_entity_distance_and_effective_render_distance"]
failing_first = "reported"
repro_check = "Fix on client 56d53fe534 (wt/D123PackClientCore): Session::sync_entity_view_scale applies view_range::view_scale(effective_render_distance, entity_distance_scaling) at every input - apply_client_setting (which also gained the missing entity_distance_scaling arm; the Options screen value never reached the session field), apply_persisted_settings, LOGIN and SET_CHUNK_CACHE_RADIUS, the connection radius reset, and both replay distance setters. Negative control run on the same tree: with only those production hunks reverted, cargo test -p krasnokamen-client --lib session::actions::render_distance_wire_tests fails at left: 1.0, right: 5.0 (Store::view_scale stayed at its default 1.0) - receipts/D123PackClientCore/logs/negative-control.log. Still missing for promotion: a scene receipt for the reported crowd fixture (2000 NoAI animals, overhead camera, Entity Distance 500%, RD8) asserting entity_presentation eligible/submitted above 0; no harness scenario carries that fixture yet (the hz-compare crowd diagnostic is outside the harness). Promotion uses this row own patch, committed at docs/bugs/fix-patches/CLIENT-ENTITY-VIEW-SCALE-NEVER-APPLIED.patch (it reverse-applies on client bda1cd84dd; the four rows share one client commit, so a client:<sha> reversal would carry all of them): run `python3 -m tools.harness ledger promote CLIENT-ENTITY-VIEW-SCALE-NEVER-APPLIED --fix-patch docs/bugs/fix-patches/CLIENT-ENTITY-VIEW-SCALE-NEVER-APPLIED.patch --dry-run`, record the patch:<sha256> the tool prints and cite `bda1cd84dd` in the promotion body."
