[[bug]]
id = "CONTAINER-CUSTODY-LOST-ON-UNLOADED-REPLAY"
title = "A replayed container post-image in an unloaded chunk can be skipped by checkpoint, pruning its only WAL copy; materializing after a partial snapshot can erase untouched chest, furnace, hopper and brewing inventories."
area = "gameplay"
repro = "cargo"
severity = "major"
status = "open"
source = "CoreBlockers: historical dirty-only fix 1d6bef3e was rejected and reverted because materializing after the snapshot erases neighbouring inventories. ContainerReplayCustody: real chest-to-player transfer regressions cover healthy/refused unloaded chunks, full chest/furnace/hopper/brewing inventories, WAL retention, repair and two restarts. Contributing factors and defenses: docs/architecture/persistence.md#checkpoints."
