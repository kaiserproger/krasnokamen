repro_check = "Re-promoted after review 6 B1/B4 with the real c7bd44dd06 hunk (`has_chunk` added before the existing air check; the earlier patch's invented a/-side is gone). Cargo ref `interact_parity_dragon_egg_never_teleports_into_a_cold_overlay` (interact_parity_tests.rs:671-675) reds with `has_chunk` removed because the fixture leaves air only in cold chunks (:638-655); the parity path in a resident frame is unchanged. Real-client receipt `20261124T045150-native-v2-ledger-dragon-egg-zohyzqtz` passed on clean tree 5da40b7524 (pin 5da40b7524be); that gate runs at view 4 where the whole frame is resident, so it is NOT evidence for the cold-overlay symptom — it covers the row's registered ref only."
