source = "receipts/ArchDesign/RESIDENCY-CONSUMERS-R11.md and DESIGN-RESIDENCY-R12.md (read-only audit). On main 3068dfb1b the target search reads block_at over +-15 (crates/mc-core/src/vanilla_interact.rs:110,126-134; entries tick/input/interact.rs:87,180) and block_at serves the overlay of a non-resident chunk (world.rs:951-965). Fix and scene: DESIGN-RESIDENCY-R12/R16 wide frame +-15 checked before the target search; T16i wide-frame scenes (T16i-6..8). Reopened 2026-11-24: the registered real-client gate harness:entities:native-v2-ledger-dragon-egg fails egg_teleported_exactly_once (20261123T163402-native-v2-ledger-dragon-egg-3bwctpd9 and, after reverting the guard, 20261123T192331-native-v2-ledger-dragon-egg-oh8hrych), so the gate is red independently of the per-target has_chunk guard and the guard effect is unknown; the cause of the gate failure is not established. Vanilla teleports into a target chunk the server then loads, so a final fix needs chunk admission for the wide frame before the write, not a skipped teleport."
