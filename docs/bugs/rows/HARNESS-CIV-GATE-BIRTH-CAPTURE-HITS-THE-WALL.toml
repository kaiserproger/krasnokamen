[[bug]]
id = "HARNESS-CIV-GATE-BIRTH-CAPTURE-HITS-THE-WALL"
title = "The civilization gate aborts its whole run when the birth capture teleports the observer onto the newborn's own cell inside its house and the raycast hits the floor."
area = "harness"
repro = "client"
severity = "major"
status = "open"
source = "Seed-24 civilization-seed-qa 20261124T205323-civilization-seed-qa-2a8qpw9_ (pin a638d217f80b, 1137 s): the run cleared the farm stage, reached the birth evidence, and died with 'milestone target is occluded or out of reach: baby 89cbd2e9-281a-4d03-9394-f7acec7eb5eb: {block_id: minecraft:cobblestone, type: block, x: 120, y: 71, z: -274, face: south}'. The newborn stays inside its parents' house; minecraft_approach_entity answered in_reach=false, and _aim_at_baby then teleported the creative observer to the baby's exact position (the console tp uses the baby's x/y/z), waited 20 ticks and aimed at the baby - from its own cell the raycast hit the cobblestone underfoot, so no attempt could ever see the entity and every later milestone was lost with the run."
failing_first = "reported"
regression = [
  "python:tools.harness.test_civilization_seed_qa:ApproachRetryTests.test_a_baby_inside_a_house_is_observed_from_beside_it",
  "harness:civilization-seed-qa:births",
]
fix_commit = "patch:1f8eabeda9f289366dee22b48df740cc44fe968fbb3ae4be56b502d8729febe5"
repro_check = " A second abort of the same capture path: run 20261124T232341-civilization-seed-qa-gvym7aii on pin aaf52cb1feac failed after 947 s with 'baby no longer visible for milestone capture' - the baby was listed, then left the view before the capture, and the capture refuses hard. A baby that leaves between the listing and the capture must be re-listed on a later snapshot (bounded by the birth deadline), not abort the run.Fix 2c222924e8: an unreachable newborn is observed from one and a half blocks beside it, one side per attempt over four sides (BABY_TELEPORT_SIDES), so a wall on one side is retried on the next and the aim never starts from the baby's own cell. Negative control: the production hunk reverted alone on this tree (tools/harness/backends/civilization_seed_qa.py at HEAD~, the tests kept) makes test_a_baby_inside_a_house_is_observed_from_beside_it fail at its own assertion 'the observer must stand beside the baby, never on its own cell: [(120.5, 71.0, -274.5)]' (receipts/D123/D123Civ/baby-capture-control.log). Green on the candidate: ApproachRetryTests 2/2. The gate proof is harness:civilization-seed-qa:births on a pinned candidate: a run that observes the birth screenshot and completes the birth checkpoint verification."
