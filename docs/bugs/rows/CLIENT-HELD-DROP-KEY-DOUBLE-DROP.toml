[[bug]]
id = "CLIENT-HELD-DROP-KEY-DOUBLE-DROP"
title = "Holding the drop (Q) key across a tick sent two drop packets (press-edge dispatch + held-key tick edge)"
area = "client"
repro = "source"
severity = "minor"
status = "open"
source = "A Q press was dispatched twice: the press edge (src/session/actions.rs) inserted 'drop'/'pick' into the session key set and src/player/interaction.rs also dispatched the same action from the held-key tick edge, so a key held across a tick boundary sent two drop packets for one press."
regression = ["client:krasnokamen-client:session::actions::item_key_tests::one_drop_press_sends_one_drop_and_a_held_key_does_not_repeat", "client:krasnokamen-client:session::actions::item_key_tests::one_pick_press_sends_one_pick_item", "client:krasnokamen-client:session::actions::item_key_tests::repeated_key_down_events_are_extra_clicks"]
fix_commit = "client:405ff485"
repro_check = "repeat parity resolved: vanilla KeyboardHandler.keyPress clicks on GLFW_REPEAT (javap offsets 971/1168-1176; F11 is press-only at 275), so a held Q drops one item per OS repeat. client:405ff485 stops the double dispatch and the extension client:648ab844 routes src/session/actions.rs repeats (plus one src/lib.rs hunk) only inside the game screen. Control receipts/XClientControl/negctl/negctl-real-F-repeat.log: with it reverted, three key-downs produce one drop. Candidate: real-client check required - physical repeat delivery is not unit-testable"
