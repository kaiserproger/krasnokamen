[[bug]]
id = "CLIENT-HELD-DROP-KEY-DOUBLE-DROP"
title = "Holding the drop (Q) key across a tick sent two drop packets (press-edge dispatch + held-key tick edge)"
area = "client"
repro = "source"
severity = "minor"
status = "open"
source = "A Q press was dispatched twice: the press edge (src/session/actions.rs) inserted 'drop'/'pick' into the session key set and src/player/interaction.rs also dispatched the same action from the held-key tick edge, so a key held across a tick boundary sent two drop packets for one press."
regression = ["client:krasnokamen-client:session::actions::item_key_tests::one_drop_press_sends_one_drop_and_a_held_key_does_not_repeat", "client:krasnokamen-client:session::actions::item_key_tests::one_pick_press_sends_one_pick_item", "client:krasnokamen-client:session::actions::item_key_tests::repeated_key_down_events_are_extra_clicks", "harness:entities:native-v2-input-menus"]
fix_commit = "client:e1080bb6"
repro_check = "Committed pair client:8f0c025e -> client:e1080bb6 splits 405ff485: the reversal re-adds HeldInput's pick/drop/swap_hands fields and the held-key tick-edge dispatch in Player::interaction_tick (its production hunks; the commit's actions.rs hunk is an appended test module and stays in both commits), the re-land removes them again, and git patch-id of the pair equals that production patch (cd571889). Real-client leg in native-v2-input-menus: a physical Q press held across three client ticks drops exactly one diamond from the selected stack (held_drop_once), which the double dispatch fails with two."
proving_assertions = { "harness:entities:native-v2-input-menus" = "held_drop_once" }
