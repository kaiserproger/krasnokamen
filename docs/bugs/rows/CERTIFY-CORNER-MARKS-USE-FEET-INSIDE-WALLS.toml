[[bug]]
id = "CERTIFY-CORNER-MARKS-USE-FEET-INSIDE-WALLS"
title = "The certify corner marks store the player's feet block, so a player who follows the tooltip inside a finished building marks the air layer above its floor and certification is refused as footprint 0"
area = "gameplay"
severity = "major"
status = "open"
source = "Owner field session (laptop report receipts/SettlementUX/REPORT.md, sha 906e7bffa8d1: the owner could not certify a correct house). Code chain: the mark handlers (crates/mc-core/src/settlements/ui.rs:303-318) store player_pos, which is `state.entities.pos(slot).map(|value| value.floor() as i32)` (ui.rs:372-376) — the block the player's FEET occupy, i.e. the air block above a floor the player stands on. certify (ui.rs:1093-1105) takes the two marks as INCLUSIVE bounds (min/max over the two corners, max y plus the form's extra height), and buildings::certify requires a solid floor at bounds.min.y (`floor &= solid` when y == min, crates/mc-core/src/settlements/buildings.rs:297-330), solid edge columns strictly inside the bounds (:320-342), and reports the footprint as dims[0]*dims[2] only when that floor is solid, else 0 (:375-380). A player who follows the tooltip (crates/mc-core/src/settlements/ui_text.rs:383-391, \"Stand in a corner block and press this\") inside a correct building therefore marks (2 201 2)..(4 201 4) for a house whose floor is y=200: the inclusive floor layer is air, so the footprint is 0 and the certification is refused although the building is correct. Any player certifying from inside a building is affected; the workaround is typing the floor's y by hand. RED RUN (this tree, 2026-11-19, `cargo nextest run -p mc-core --lib --run-ignored only -E 'test(=settlements::ui::tests::corner_marks_taken_inside_a_finished_house_certify_it)'`): assertion `left == right` failed: marks taken at 2 201 2 .. 4 201 4 (the feet block) must certify the house; the server says: Cannot certify Farmer workshop. Missing: footprint 0/9. The same fixture certifies with its own inclusive bounds (1 200 1 .. 5 204 5) in the sibling `finished_workshop_house_certifies_with_its_inclusive_bounds`, which passes — so the fixture is a valid building and the marks are the defect."
repro = "source"
regression = ["cargo:mc-core:settlements::ui::tests::standing_inside_a_finished_house_certifies_its_floor_wall_and_roof_bounds"]
failing_first = "reported"
fix_commit = "dc4a7be39b742b9742538304d6242069eafd6610"
