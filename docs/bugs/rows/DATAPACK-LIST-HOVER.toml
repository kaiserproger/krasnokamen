[[bug]]
id = "DATAPACK-LIST-HOVER"
title = "Datapack listing emits joined plain names and discards pack descriptions, so users cannot inspect pack.mcmeta descriptions by hovering the listed packs in chat."
area = "gameplay"
repro = "manual"
severity = "minor"
status = "open"
source = "/run/media/kaiserroman/games/solaris-work/BUGS.md#DATAPACK-LIST-HOVER The withdrawn patch reversed the emission: reversing it made the list print plain pack names instead of hover chat links."
regression = ["cargo:mc-core:datapacks::command_tests::list_entries_are_chat_links_with_title_and_description_hover", "harness:entities:native-v2-ledger-datapack-hover"]
repro_check = "OPEN — no control is constructible under the mechanical-adaptation rule (recorded 2026-11-25 on Main's instruction to find the real pre-fix commit). The real fix is `ba2b3a98a` (`fix(commands): B16 server commands — budget clamp, selectors, datapacks, debug`), which created `datapack_management.rs` with `hover_entry(name, description)` and emitted every listing entry through it. Its pre-image is `ba2b3a98a^:crates/mc-core/src/datapacks.rs:549-551`, one plain English line naming the enabled packs with no components at all (`datapack list` => `feedback(…, format!('Enabled directory datapacks: {}', names.join(', ')))`). `32069cbb9` later rewrote the module into `list`/`present`/`present_group` with `chat_link(id, enabled, description)` and the translated `commands.datapack.list.*` keys, which is what HEAD carries. A control at HEAD would have to replace a translated `success_feedback` emission with the old raw formatted message and drop the available/enabled group split the pre-image never had — a rewrite of the emission, not a mechanical adaptation of the real a-side, so README:234-258 refuses it. The behaviour is real and gate-proven (`20261125T044847-native-v2-ledger-datapack-hover-7_bn3a53` green, description line `The default data for Minecraft`); only a control shape this ledger accepts is missing."
proving_assertions = { "cargo:mc-core:datapacks::command_tests::list_entries_are_chat_links_with_title_and_description_hover" = "crates/mc-core/src/datapack_commands_tests.rs:206", "harness:entities:native-v2-ledger-datapack-hover" = "datapack_list_hover_shows_the_vanilla_description" }
