[[bug]]
id = "HARNESS-CIV-GATE-HOUSE-DOOR-UNLOADED"
title = "civilization-seed-qa's house milestone capture navigates to a received house door that is farther than the client's loaded radius, aborting the gate with 'target chunk is not client-loaded' before new_house can be recorded"
area = "harness"
repro = "client"
severity = "major"
status = "open"
source = "civilization-seed-qa artifact wt/D123FinalPin/.analysis/validation/20261126T092432-civilization-seed-qa-74f53q9d (final pin 600bb4e32522, client pin ba1971d76215, seed 24, 2628.6 s): the settlement completed a House L1 at tick 103080 (server.log 3967739, building=4294967313) 80 blocks south of the bell; the harness scanned its faces from the bell with the two `minecraft_wait_for_loaded_block` retries (transcript steps 9241-9243 returned cobblestone at 93..96/-297), moved the observer back to the bell (step 9247), and then `capture_house` (tools/harness/backends/civilization_seed_qa.py:355) called `minecraft_navigate_to_block` on the door at 96,64,-297 from (132.2,77.0,-215.5) - 89.2 horizontal blocks, above the gate's own `view_distance = 4` (64 blocks) - and the client refused at src/minecraft/navigation.rs:233 with {code: target chunk is not client-loaded, retryable: false, stage: automation}. `capture_house` has no wait-for-loaded step before the door walk and handles only `unreachable` on the walk back, so the whole run aborted on the one capture that would have recorded new_house. Same family as HARNESS-CIV-GATE-REMOTE-SCAN-UNLOADED (fix 354e288e6a moved the observer beside a remote building for the face scans) and HARNESS-CIV-GATE-LOCAL-SCAN-UNLOADED: the remaining hole is the house capture's own walk to the door, and `capture_target`'s walk back to the initial position (civilization_seed_qa.py:623) has the same unhandled code. Fix shape: before the door walk, if the door is farther than the client's render radius (or navigate refuses with this code), call minecraft_wait_for_loaded_block at the door and retry once, and otherwise move the creative observer beside the house the way capture_target does."
failing_first = "reported"
regression = [
  "python:tools.harness.test_civilization_seed_qa:RemoteHouseDoorTests.test_a_remote_door_loads_its_chunk_then_walks_straight_to_the_capture",
  "python:tools.harness.test_civilization_seed_qa:RemoteHouseDoorTests.test_a_refused_straight_walk_takes_a_lateral_hop_then_the_door",
  "python:tools.harness.test_civilization_seed_qa:RemoteHouseDoorTests.test_a_door_no_hop_can_reach_is_observed_from_the_console_teleport",
  "python:tools.harness.test_civilization_seed_qa:RemoteHouseDoorTests.test_a_door_no_hop_can_reach_without_a_teleport_fails_with_a_named_error",
  "harness:civilization-seed-qa:new_house",
]
repro_check = [
  "python3 -m unittest tools.harness.test_civilization_seed_qa.RemoteHouseDoorTests (aa2afc814: the door's chunk is loaded, then a straight walk; a refused straight walk takes a lateral hop; a door no hop reaches is observed from the console teleport; without a teleport a named error replaces the raw client refusal)",
  "Next gate run: a completed house farther than the client's loaded radius is reached by load and hops or observed from the console teleport, and without a teleport the gate reports the named error instead of aborting on the raw refusal.",
]
fix_commit = "aa2afc8142c2064c4261f2621ada4c628f38f2a4"
