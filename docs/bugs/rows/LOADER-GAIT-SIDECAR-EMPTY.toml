repro_check = "Proven cause (LoaderGaitFix): the IO completion callback sampled frame 547 for screenshot 541, so render/extract state was not tied to the captured frame. Loader fix 30a39f838 (loader main) captures gait inputs with their rendered frame (VanillaFrameTransformer). Red: fix-only reversal makes VanillaFrameCaptureTest fail and the real Java 26.3 gait scene produce 192/192 empty sidecars (receipts/LoaderGaitFix/red-fix-only-real/20261115T033610-scene-shot-7mruhd0f, harness e5512b2a5). Green: 3/3 real runs pass with 0 empty sidecars (receipts/LoaderGaitFix/green-frozen-real/20261115T033835-scene-shot-sms00brg, 20261115T034012-scene-shot-vyyyv3hh, 20261115T034125-scene-shot-ke3ccriy), accepted frames visually reviewed. Promotion still needs a registered real-client harness ref and candidate receipt. Promotion is refused by the ledger's own shape, not by missing evidence: the fix is Loader 30a39f838, and tools/harness/ledger.py refuses a loader:<sha> fix on a client-surface row ('a loader:<sha> fix proves only its loader ref; a client-surface row (area client, or repro manual/client) needs a graphical real-client ref and receipt, which this promotion cannot supply'), while patch mode has no core hunk to reverse. The graphical evidence (192/192 empty sidecars on the fix-only reversal, 3/3 real runs clean after) is recorded above, and the registered ref harness:scene-shot:java-gait-sidecar runs the same Java 26.3 gait scene. The row needs a ledger closure shape for a Loader fix proved by a graphical scene (same decision family as LOADER-ZOMBIE-SHIELD-MIXIN / CL-1)."
