repro_check = "Commit 9cc59fb37 corrected three test files; this row's control reverses only crates/mc-core/src/falling_tests.rs (`control_a_files`), the other two belong to TEST-DIMENSION-BIOME. Old versus new assertions of falling_tests.rs, and the independent evidence for it. (1) falling_tests.rs `empty_collision_attachment_is_not_a_floor_and_slab_landing_drops_instead` (line 345, the row symptom): old asserted block_at(pos) == sand (the empty-collision torch was overwritten) and spawned.is_empty(); new asserts the torch survives, spawned.len() == 1 with one minecraft:sand item, removed.len() == 1 and no falling entity left. Evidence: crates/mc-core/src/falling.rs:382-388 replacement-gated drop and the pinned FallingBlockEntity bytecode artifact 64820:1114-1176,1316-1335. Nothing removed or loosened. (2) dimensions_tests.rs `native_dimension_spawn_tables_and_census_are_local` (line 1657): old asserted the Nether biome equals minecraft:nether_wastes exactly; new accepts any Nether biome (nether_wastes, soul_sand_valley, crimson_forest, warped_forest, basalt_deltas) and still asserts End == minecraft:the_end; the biome-local spawn-entry assertion is unchanged. Evidence: the dimension seed places crimson_forest, so the old fixed name was an oracle defect, not a product change. (3) golems_tests.rs `natural_golem_player_damage_scales_with_difficulty` (line 369): old set player health to 100.0 and broke the loop when it fell below 100.0; new sets 20.0 and breaks below 20.0, so the observed golem hit is visible in the first blows; the damage-range assertions are unchanged. Control A: the pre-commit test hunks restored make (1) fail on current code at the block assertion; Control B: docs/bugs/test-only/TEST-FALLING-TORCH-defect.patch sets replaceable = true (every landing surface replaceable) so (1) fails at the torch-survival assertion, the same test (proving ref). Control A reverses only crates/mc-core/src/falling_tests.rs (control_a_files), so the other two correction