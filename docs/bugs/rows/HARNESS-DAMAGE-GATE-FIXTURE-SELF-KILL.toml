source = "Gate receipts under wt/HarnessRows/.analysis/validation: 20261111T120956-native-v2-p4-damage-6mwbxea3 (wait_for_inventory timeout; the player was slain by the zombie), 20261111T132303-native-v2-p4-damage-wdwexu3s (stalactite from y+5 deals 24 damage to a 20 HP player), 20261111T142141-native-v2-p4-damage-n54aaggu (night spawns a zombie that kills the player), 20261111T142757-native-v2-p4-damage-6pky77eh (warden kills the player before the 7 HP state is observed), 20261111T151144-native-v2-p4-damage-xiqtnmrl (thorns row starts out of reach), 20261111T185402-native-v2-p4-damage-1x27s3mu (void row: below the world the client reports in_play false with no player row, so the row is judged from the out_of_world wire event and the death screen), 20261111T190210-native-v2-p4-damage-6qo8d1ux (hurt tilt observed only after the kill command had cost the ten-tick animation), 20261111T191626-native-v2-p4-damage-hy75cx01 and 20261111T192723-native-v2-p4-damage-aw9r90m6 (on_fire row: no burn after the fire block is removed; the wire holds only in_fire), 20261111T192315-native-v2-p4-damage-wespznqp and 20261111T193311-native-v2-p4-damage-3bv6qiv1 (sweet_berry_bush row: no berry damage after a walk through the bush), 20261111T193906-native-v2-p4-damage-dhuzqzip and 20261111T194354-native-v2-p4-damage-o3gp55l2 (fall row: no fall damage). Cause of the on_fire, berry and fall failures: the water fill that douses the player leaves flowing water (amount 5-7, region scan in 20261111T194354-native-v2-p4-damage-o3gp55l2 scenario.json region_cells) that decays for dozens of ticks; in it a fall is cushioned (core test physics_flowing_water_cancels_landing_damage), fire cannot ignite and a berry bush is washed away. The gate now waits until the client sees no fluid around the cell (douse_water_drained). The server is vanilla-consistent here. Cause of the thorns failures (about half of the runs from 20261111T195113-native-v2-p4-damage-ml9kngg7 on): the row sent `gamemode survival @s` and the attack back to back; a creative player takes no reflected damage and the command and the attack packet are not ordered, so the row now waits ten ticks between them (not yet proven by three consecutive greens). A frozen night (advance_time false) was tried and reverted: it brings a hostile mob into the starve row. The causes above are fixed on branch wt/HarnessRows with a python unit test (tools.harness.test_native_v2.NativeV2ProbeTests.test_damage_*); the ledger has no python-test ref kind, so the row stays open."
regression = ["harness:entities:native-v2-p4-damage", "python:tools.harness.test_native_v2:NativeV2ProbeTests.test_damage_scenario_disables_mob_spawning_before_the_night", "python:tools.harness.test_native_v2:NativeV2ProbeTests.test_damage_scenario_pins_clear_weather_before_its_rows", "python:tools.harness.test_native_v2:NativeV2ProbeTests.test_damage_rows_wait_for_the_douse_water_to_drain_before_their_fixture", "python:tools.harness.test_native_v2:NativeV2ProbeTests.test_damage_void_row_observes_outside_play_while_the_player_hangs_below_the_world", "python:tools.harness.test_native_v2:NativeV2ProbeTests.test_damage_thorns_row_lets_the_survival_mode_land_before_the_hit", "python:tools.harness.test_native_v2:NativeV2ProbeTests.test_damage_thorns_row_returns_the_player_to_the_origin_before_the_reach_bound_attack", "python:tools.harness.test_native_v2:NativeV2ProbeTests.test_damage_warden_lethal_prep_accepts_a_player_the_sonic_boom_already_killed", "python:tools.harness.test_native_v2:NativeV2ProbeTests.test_damage_scenario_stops_the_zombie_before_slow_capture", "python:tools.harness.test_native_v2:NativeV2ProbeTests.test_damage_identity_timeout_reports_the_wire_events_it_saw"]
repro_check = "negative control receipts/XHarnessGates/neg-damage-selfkill.log (kill command removed -> fixture-order ref red); candidate: exact revert (git apply -R of b6e946c1, clean) reds the ref, which asserts fixture ordering (no pre-existing mob before the night) - a proxy for the in-game self-kill; repro=client, real-client gate pending (stage 3). Wave 2 (2026-11-24): the candidate half is green twice - 20261124T134831-native-v2-p4-damage-_oflia9r (287.9 s, head 149cb9519) and 20261124T140948-native-v2-p4-damage-km3uj4oj (319.5 s, head 8abdcc42e) - with the full entities scene environment; the control half cannot be produced: the fix only removes a stochastic failure (a pre-existing zombified piglin wandering into the starve row), so the p4-damage scene on the reversed tree (pinned 8abdcc42eb6a-0ac4b668) came back GREEN (promote 20261124T141814-ledger-promote-7nzaij2z), and its python refs are unrunnable under the reversal (the fixture-order assertion raises ValueError on the missing kill command, not an AssertionError). Without a deterministic pre-fix red this row stays fixed-unpromoted."
