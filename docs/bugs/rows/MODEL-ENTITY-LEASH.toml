repro_check = "26.3 LeashFeatureRenderer needs the holder transform in the emit path; the scene counts the rope's pixels. The rope producer was CREATED by e8fe40c2 in src/entities/render_special/world_fx.rs (that path does not exist at e8fe40c2^), so there is no pre-image blob at all; the faithful control is a committed pair that deletes the dispatch call site (world_fx::append_leash in render_special.rs, the accepted kept-helper class) and leaves the module unreferenced. PAIR REBUILT on the current client head 9308bb29: control client:df888507 deletes the dispatch (the leash branch returns Ok(Handled::Unhandled), so the mob draws only its rig), the restore client:03c4675b re-applies exactly that diff and is the fix_commit. Threshold registered BEFORE the rebuilt run, derived from the model and not from any measurement: the rope is `tube_segment(..., 0.018, ...)`, i.e. a 0.036-block-diameter tube along the anchor-to-anchor line (`leash_anchors`: mob height * 0.7 + width * 0.5 forward, holder height * 0.7 + width * 0.5 forward; cow 0.9 x 1.4 and sheep 0.9 x 1.3 at 160) with the `rope_point` sag `4 * clamp(horizontal * 0.1, 0.08, 0.75) * t * (1 - t)`, i.e. at most 0.403 blocks for the scene's 4.03-block gap, so the rope's mid sits at y = 160.54 and z = 1005.2. The camera is at (1000.5, 161.62, 1000.5) with fov 70 on 1280x720, so at the rope's 4.7..4.9-block depth one block is 360 / (depth * tan(35 deg)) = 105..109 px and the tube is 3.8..4.0 px wide; the check's ROI x 560..760 maps to world x -0.76..+0.76 (half width 0.125 * tan(hfov/2) * depth, tan(hfov/2) = tan(35 deg) * 16/9 = 1.2448), i.e. 1.5 blocks, or about 160 px, of rope. The model's lower bound for the drawn rope inside the ROI is therefore ~160 * 3.8 = 600 px, and the registered `rope_n > 300` asks for about half of one visible crossing - it cannot be reached by a rig, a shadow or the sky, and the old pair measured 0 px (control) against 1041 px (fix, receipt 20261125T140748 / 20261125T140830 on the earlier head); the rebuild re-takes three per side on clean pins."
promotion = "docs/bugs/promotions/MODEL-ENTITY-LEASH.json"
