[[bug]]
id = "HARNESS-VOICE-RECONNECT-CAPABILITY-REGISTRATION"
title = "Voice reset gate mistakes fresh client capability registration for stale server state"
area = "harness"
severity = "minor"
status = "open"
source = "screens-voice-qa checks registered=false after reconnect, but the native client advertises its voice capability on every Play connection independently of server support. Run 20261115T031638-screens-voice-qa-j5rvvqct had server_enabled=false, listening=false and no microphone HUD, yet failed that verdict. The corrected gate also checks all voice flags and HUD are cleared immediately after disconnect."
repro = "client"
regression = ["python:tools.harness.test_screens_voice_qa:ScreensVoiceHelperTests.test_voice_reset_allows_fresh_capability_registration_only_after_reconnect"]
fix_commit = "0857a48c5"
failing_first = "reported"
repro_check = "receipts/ScreensVoiceStart/voice-reset-red.log fails False != True with the original reconnect predicate; voice-reset-green.log passes eight tests, including rejection of stale disconnect registration, support, listening and HUD. Promotion is blocked by the contract, measured 2026-11-26: any faithful reversal of 0857a48c5 removes voice_reconnect, which the kept test calls, so the python ref is unrunnable (not red) in the control (receipts/D123PackHarnessRows/control-voice-python.log: six AttributeError/TypeError errors); the graphical verdict harness:screens-voice-qa:native_voice_resets_on_non_voice_server does flip false on a reversed gate, but proving_refs may not exclude an unrunnable ref and a real-client row must keep a graphical proving ref, so the pair cannot be formed. Closing the row needs either an owner-accepted excluded-unrunnable rule for 'the fix's own new API', or the gate restructured so the corrected predicate is a pure function that exists pre-fix. REVERSAL WITHDRAWN (Main, 2026-11-28): the rebuilt patch's minus side does not exist in `git show 0857a48c5^:tools/harness/backends/screens_voice_qa.py` (checked line by line), so it was written for the control rather than taken from the pre-image, which PITFALLS forbids; the patch is deleted and fix_commit is back to the real commit. A promotable reversal needs a pre-image that actually contains the removed lines."
