repro_check = "Control rebuilt 2026-11-25 after REVIEW-wave2-3 rejected the first attempt (an invented ten-line guard). The real pre-image is `32069cbb9^:crates/mc-core/src/datapacks.rs` `tick`, whose completion arm refused every reload whose `packs.resources` differed from the live set: `Ok(_) => feedback(state, connection, \"Recipe/loot changes require restart; reload refused, old packs and selection retained\")`. HEAD merged that decision into `finish`, so the scoped patch (class (b), condition and message verbatim) restores the refusal at the install site: a reload whose resources differ returns before `install_registry`, exactly the pre-fix outcome. Reversing it makes the harness:datapack-reload:native-datapack-reload assertions red (recipes stay old after a hot enable, so pack_recipe_after_hot_enable fails). Candidate gate: run on this tree, see the promotion JSON."
