[[bug]]
id = "COPPER-HONEYCOMB-WAXES-ACROSS-COLD-CHUNK-EDGE"
title = "Using honeycomb (or an axe) on copper whose cell lies in a non-resident chunk's overlay waxes or scrapes it and debits the item, and a double copper chest with its other half in a cold chunk is changed one half only."
area = "gameplay"
repro = "source"
severity = "minor"
status = "open"
source = "receipts/ArchDesign/RESIDENCY-CONSUMERS.md appendices [R10]-[R11] (read-only consumer audit; GATE-V1 closed in VOTE-RESIDENCY-R16-astra.md). On main 3068dfb1b UseItemOn calls copper::use_on directly from input (crates/mc-core/src/tick/input/interact.rs:144-175); it reads World::block_at, which returns the overlay first even when the chunk is not resident (world.rs:951-965), then writes and debits (copper.rs:235-254,322-334); client_build_refused checks reach, spawn protection and zones, not residency (tick/build.rs:462-480); a cold partner half collapses storage_cells to one cell (chests.rs:149-181; copper.rs:289-308). Fix and scenes: DESIGN-RESIDENCY-R13/R16 entry frame (click +-2) before the first world read; T16i-3/T16i-4 (top-face click, cold half with and without overlay)."
regression = []
failing_first = "not recorded"
