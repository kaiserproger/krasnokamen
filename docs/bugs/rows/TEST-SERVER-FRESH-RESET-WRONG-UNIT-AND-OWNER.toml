[[bug]]
id = "TEST-SERVER-FRESH-RESET-WRONG-UNIT-AND-OWNER"
title = "Fresh-world reset checks the wrong service before deleting the world and defaults to the wrong binary owner"
area = "harness"
severity = "major"
status = "open"
source = "Static inspection of tools/dev/test-server/deploy-reset.sh:7-16 and solaris.service:7-8: the helper stops solaris but checks whether krasnokamen is active before deleting world; it verifies the archive listing but not the stopped solaris unit or surviving process, and defaults KRASNOKAMEN_SERVER_USER to solaris while the tracked unit runs as krasnokamen. The owner has prohibited executing this helper in any form, including mock or throwaway environments, until separate permission. The prepared repair remains isolated and has no behavioral proof."
repro = "source"
fix_commit = "patch:1f7d397bcbac9651195df445ec4a7431785425bf853585ece6c041db1925dccb"
regression = ["python:tools.dev.test_deploy_reset:FreshResetGuardTests.test_it_stops_and_checks_the_solaris_unit_not_krasnokamen", "python:tools.dev.test_deploy_reset:FreshResetGuardTests.test_it_reads_the_whole_archive_listing_before_judging_it", "python:tools.dev.test_deploy_reset:FreshResetGuardTests.test_it_refuses_to_overwrite_a_backup", "python:tools.dev.test_deploy_reset:FreshResetGuardTests.test_it_owns_the_binary_as_the_unit_user"]
failing_first = "reported"
repro_check = "Script fixed on wt/D123Harness: it stops the `solaris` unit and checks that unit, refuses when a krasnokamen process survives the stop, verifies world/ is in the archive and defaults KRASNOKAMEN_SERVER_USER to krasnokamen (the unit User=). The guard is tools/dev/test_deploy_reset.py: it reads the script text and never launches it (the owner prohibits executing the helper in any form), and reversing the script against the base turns all four assertions red."
