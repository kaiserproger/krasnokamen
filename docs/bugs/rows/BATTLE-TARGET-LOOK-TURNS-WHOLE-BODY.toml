[[bug]]
id = "BATTLE-TARGET-LOOK-TURNS-WHOLE-BODY"
title = "A battle soldier with a look target turns its whole body every step instead of its head, so standing soldiers spin bodily toward each nearby enemy"
area = "gameplay"
severity = "major"
status = "open"
source = "Owner D36 (2026-11-18, receipts/Stage3/OWNER-DECISIONS-20261117-1000.md, point 1: the head/body split is the missing baseline, not a design variant) and the BattleTurnCap cause runs (GO #4/#6/#7, receipts/BattleTurnCapCause/CADENCE-DESIGN.md: rotation traffic and engaged/near sway grow in the foot classes). entity_motion::look (crates/mc-core/src/entity_motion.rs:312-330), used whenever a row has a look target (callers at lines 399, 559, 566), returns [yaw, pitch, yaw]: body yaw turns toward the target by up to 90 degrees per tick and head yaw is set equal to body yaw. The vanilla-like head lag (follow_head: HEAD_TURN 10 deg/tick, head clamped to a MAX_HEAD_YAW 75 deg cone around the body) exists only in the no-target path (move_look). Expected: with a target the head tracks it and the body turns only when the head would leave its cone. Fix: the D36 facing slice after the 19:50 cut (PLAN post-cut item 9), merged only after the owner's own look in the client."
repro = "source"
