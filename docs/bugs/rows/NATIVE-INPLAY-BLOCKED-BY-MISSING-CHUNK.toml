[[bug]]
id = "NATIVE-INPLAY-BLOCKED-BY-MISSING-CHUNK"
title = "The native client never reaches in_play while a refused or missing chunk lies within about 12 blocks of the camera (play_world_presentation_ready in src/session/observation.rs needs the biome-neighbour chunks); a vanilla client proceeds with a hole in the world."
area = "client"
repro = "client"
severity = "major"
status = "open"
source = "CoreBlockers: native-v2-corrupt-block-entities fixtures had to stay two chunks from the player; with the fixture in the player's own chunk the client stays at 'session startup: play' while the server keeps ticking (scenario native-v2-corrupt-chunk-near-camera, restart_client_entered_play fails); a refused chunk two chunks away does not block it (play_world_presentation_ready, spawn_meshes_presented)."
regression = ["cargo:mc-core:chunk_loader::tests::refused_chunk_never_blocks_other_chunks_and_stays_refused", "client:krasnokamen-client:session::observation::destruction_tests::a_hole_under_the_camera_does_not_hold_the_play_loading_screen"]
repro_check = "Still open after a measured attempt on 2026-11-25, and the blocker moved to the SERVER side. 803f0e00 removed the camera-block and biome-neighbour demands and client:108c8b2a drops the last one-received-chunk condition (NAT-3(a)); the scene native-v2-corrupt-chunk-near-camera now refuses a column the PRE-FIX gate demanded but not the player own chunk (with the player own chunk refused nobody has ground: 20261125T024253). Measured: the client reaches the play phase and reports world_ready with the loading overlay released, but it receives NO world payload at all - player.position null, entity_rows 0, only server_position (192.5, 77, -447.5) beside the quarantined chunk (11, -28) (20261125T034455, and the same on 20261125T030306/031825). A quarantined chunk two columns away does not stall it (the main corrupt-block-entities scene plays), so a refused chunk within one column of the join point stalls the join payload. Exact missing piece: a server-side fix or row for that stall (chunk batch isolation on quarantine), then a control with 803f0e00 reversed red at restart_client_entered_play. The grounded leg is bounded to 60 s so a red is an assertion, and its failing observation is recorded in the report. The grounded leg's failing observation was read out on 2026-11-25 (20261125T045348/050342/052850/061924): the client is in play with the refused column unreceived, pose_known true, local_position == server_position == [192.5, 77.0, -447.5], feet_block_loaded and below_block_loaded both true (the two samples Player::predict gates on), abilities_flying false, movement_blocked null, every tick stage running, and a 5-tick forward press at zero velocity - so the open question is why the predictor reports no ground on a loaded floor block after a reconnect rather than whether the chunks arrived (HANDOFF-16 lists the connect/reset difference to check next). Promoted fix: an unheld chunk cell is a solid cube in the client's collision/climb/inside/fluid scans (client fd2adaed, the rule mc-core already applies at tick.rs:583-590). Evidence: native-v2-corrupt-chunk-near-camera PASSED with client pin 85d215b3c04f (20261125T081605, assertions include restart_player_grounded true and player_identity_stable true) and the same scene FAILED with the reversed client pin cc81fb18a877 (20261125T082023, restart_player_grounded false, every earlier assertion true) - receipts receipts/D123/D123ClientNative/receipt-fix-85d215b3.json and receipt-control-cc81fb18.json."
fix_commit = "client:fd2adaed"
