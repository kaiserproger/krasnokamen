[[bug]]
id = "NATIVE-INPLAY-BLOCKED-BY-MISSING-CHUNK"
title = "The native client never reaches in_play while a refused or missing chunk lies within about 12 blocks of the camera (play_world_presentation_ready in src/session/observation.rs needs the biome-neighbour chunks); a vanilla client proceeds with a hole in the world."
area = "client"
repro = "client"
severity = "major"
status = "open"
source = "CoreBlockers: native-v2-corrupt-block-entities fixtures had to stay two chunks from the player; with the fixture in the player's own chunk the client stays at 'session startup: play' while the server keeps ticking (scenario native-v2-corrupt-chunk-near-camera, restart_client_entered_play fails); a refused chunk two chunks away does not block it (play_world_presentation_ready, spawn_meshes_presented)."
regression = ["cargo:mc-core:chunk_loader::tests::refused_chunk_never_blocks_other_chunks_and_stays_refused", "client:krasnokamen-client:session::observation::destruction_tests::a_hole_under_the_camera_does_not_hold_the_play_loading_screen"]
repro_check = "Still open after a measured attempt on 2026-11-25. 803f0e00 removed the camera-block and biome-neighbour demands; the client also gained client:108c8b2a, which drops the last one-received-chunk condition (NAT-3(a): a refused chunk behaves like an unloaded one). The scene native-v2-corrupt-chunk-near-camera was corrected so the refused column is one the PRE-FIX gate demanded but not the player own chunk (with the player own chunk refused nobody has ground and the scene cannot tell a held loading screen from a fall in the void: 20261125T024253). Measured on server pin d7ca8f4ec3cf-8b3066f2: the fixed client (108c8b2a) and the revert control both reach restart_client_entered_play, then BOTH stay in play with player.grounded false until the deadline (20261125T030306, 20261125T031825) - so this fixture cannot carry the row control yet, and the grounded leg is now bounded to 60 s so a red is an assertion instead of a deadline. Exact missing piece: a restart fixture whose player actually reports on_ground beside the refused column, then a control with 803f0e00 reversed and the row proving assertion restart_client_entered_play red."
fix_commit = "client:803f0e00"
