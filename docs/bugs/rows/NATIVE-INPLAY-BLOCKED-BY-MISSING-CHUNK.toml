[[bug]]
id = "NATIVE-INPLAY-BLOCKED-BY-MISSING-CHUNK"
title = "The native client never reaches in_play while a refused or missing chunk lies within about 12 blocks of the camera (play_world_presentation_ready in src/session/observation.rs needs the biome-neighbour chunks); a vanilla client proceeds with a hole in the world."
area = "client"
repro = "client"
severity = "major"
status = "open"
source = "CoreBlockers: native-v2-corrupt-block-entities fixtures had to stay two chunks from the player; with the fixture in the player's own chunk the client stays at 'session startup: play' while the server keeps ticking (scenario native-v2-corrupt-chunk-near-camera, restart_client_entered_play fails); a refused chunk two chunks away does not block it (play_world_presentation_ready, spawn_meshes_presented)."
regression = ["harness:entities:native-v2-corrupt-chunk-near-camera", "cargo:mc-core:chunk_loader::tests::refused_chunk_never_blocks_other_chunks_and_stays_refused", "client:krasnokamen-client:session::observation::destruction_tests::a_hole_under_the_camera_does_not_hold_the_play_loading_screen"]
proving_assertions = { "harness:entities:native-v2-corrupt-chunk-near-camera" = "restart_client_entered_play" }
repro_check = "Still open after a measured attempt on 2026-11-25, and the blocker moved to the SERVER side. 803f0e00 removed the camera-block and biome-neighbour demands and client:108c8b2a drops the last one-received-chunk condition (NAT-3(a)); the scene native-v2-corrupt-chunk-near-camera now refuses a column the PRE-FIX gate demanded but not the player own chunk (with the player own chunk refused nobody has ground: 20261125T024253). Measured: the client reaches the play phase and reports world_ready with the loading overlay released, but it receives NO world payload at all - player.position null, entity_rows 0, only server_position (192.5, 77, -447.5) beside the quarantined chunk (11, -28) (20261125T034455, and the same on 20261125T030306/031825). A quarantined chunk two columns away does not stall it (the main corrupt-block-entities scene plays), so a refused chunk within one column of the join point stalls the join payload. Exact missing piece for that half: a server-side fix or row for the stall (chunk batch isolation on quarantine). The row is NOT fixed by client:fd2adaed: that commit is CLIENT-NO-GROUND-BESIDE-QUARANTINED-CHUNK's unheld-cell collision rule, and the same scene ran green on in_play and restart_client_entered_play with that fix reversed too (the control cc81fb18 red only at restart_player_grounded; review REVIEW-14-Opus P-M5, receipts/D123/D123ClientNative/receipt-control-cc81fb18.json). This row's own fix is 803f0e00 + 108c8b2a (play_world_presentation_ready). Until this note the row carried no graphical harness ref and no proving_assertions, which _promote_client_fix refuses; both are recorded now, with restart_client_entered_play as the symptom assertion. The control this row needs is a client whose production diff against the restore is exactly non_test_patch(fix_commit) and is red at restart_client_entered_play. Measured 2026-11-25: non_test_patch(803f0e00) no longer reverse-applies at the tip (`git apply -R --check` fails at src/session/observation.rs:465) because 108c8b2a rewrote the same function, and reversing only 108c8b2a (restoring `self.world.chunks().next().is_some()`) would stay green here because this scene receives the player's own chunk. So the faithful control is a committed re-land pair: A = the pre-803f0e00 gate body hand-ported at the tip (the exact lines 803f0e00 deleted, named by blame), red at restart_client_entered_play; B = the re-land, which becomes fix_commit; with promotions/NATIVE-INPLAY-BLOCKED-BY-MISSING-CHUNK.hunks.md naming each real commit, every non-test hunk and its HEAD equivalent. No such pair exists yet, so the row stays open."
fix_commit = "client:803f0e00"
