[[bug]]
id = "NATIVE-INPLAY-BLOCKED-BY-MISSING-CHUNK"
title = "The native client never reaches in_play while a refused or missing chunk lies within about 12 blocks of the camera (play_world_presentation_ready in src/session/observation.rs needs the biome-neighbour chunks); a vanilla client proceeds with a hole in the world."
area = "client"
repro = "client"
severity = "major"
status = "open"
source = "CoreBlockers: native-v2-corrupt-block-entities fixtures had to stay two chunks from the player; with the fixture in the player's own chunk the client stays at 'session startup: play' while the server keeps ticking (scenario native-v2-corrupt-chunk-near-camera, restart_client_entered_play fails); a refused chunk two chunks away does not block it (play_world_presentation_ready, spawn_meshes_presented)."
regression = ["harness:entities:native-v2-corrupt-chunk-near-camera", "cargo:mc-core:chunk_loader::tests::refused_chunk_never_blocks_other_chunks_and_stays_refused", "client:krasnokamen-client:session::observation::destruction_tests::a_hole_under_the_camera_does_not_hold_the_play_loading_screen"]
proving_assertions = { "harness:entities:native-v2-corrupt-chunk-near-camera" = "restart_client_entered_play" }
repro_check = "A client-side loading gate: play_world_presentation_ready demanded the camera block and its light plus the biome-neighbour chunk columns, so a refused or missing column within about 12 blocks of the camera held 'Preparing terrain and light' forever. 803f0e00 removed the camera-block and biome-neighbour demands and client:108c8b2a dropped the last one-received-chunk condition, so the gate is `self.player.pose_known && self.dimension.is_some()`. Measured on 2026-11-25 on core 5f67fd29c934 with native-v2-corrupt-chunk-near-camera: the join is healthy - the edge plan serves 80 of 81 chunks around [192.5, 77.0, -447.5] and the eighty-first is the refused column 11 (20261125T035800) - and both clients in play report in_play and restart_client_entered_play true (fixed c084f8c48327: 20261125T104941/105120/105258; reversed 3671790ee7f9: 20261125T105418/105703/105918). The earlier 'the client receives NO world payload / the join stalls and needs chunk batch isolation on quarantine' reading is RETRACTED: it came from observation keys the published MCP payload does not carry. The row is not fixed by client:fd2adaed (that commit is CLIENT-NO-GROUND-BESIDE-QUARANTINED-CHUNK's unheld-cell collision rule). Its own proof is a committed re-land pair at this tip: A puts the exact pre-803f0e00 body back (hand-ported, the lines named by `git blame -C -C`, byte-checked against `git show 803f0e00^:src/session/observation.rs`), B re-lands the current body and becomes fix_commit; `git diff A B` equals non_test_patch(B) (patch-id ff511a9d83b149fcd2ba255f29f8bf786397ab70). The control is the client pinned at A, which must be red at restart_client_entered_play because the pre-803f0e00 gate demanded the refused column; the restore is the client pinned at B, green on the same assertion. docs/bugs/promotions/NATIVE-INPLAY-BLOCKED-BY-MISSING-CHUNK.hunks.md maps both real commits (803f0e00, 108c8b2a), every non-test hunk and its HEAD equivalent."
fix_commit = "client:fdc19309818760c2086494acabf2ed9108702f3b"
