[[bug]]
id = "FREEZE-EXPORT-IMPORT-QUARANTINE"
title = "A world exported while `/tick freeze` is active imports as quarantined chunks: the restarted server logs `stored chunk unavailable; repair required` for most chunks and the client never enters play."
area = "gameplay"
repro = "client"
severity = "major"
status = "open"
source = "docs/bugs/rows/HS-3.toml (found 2026-11-25 while building HS-3's saved-due-gravity-tick fixture; the same scenario without `/tick freeze` imports cleanly)"
regression = [
  "cargo:mc-core:level_metadata::tests::frozen_clock_held_prefix_survives_anvil_metadata_roundtrip",
  "cargo:mc-core:chunk_loader::tests::stored_debt_anchor_ahead_of_the_served_held_prefix_stays_refused",
  "harness:entities:native-v2-ledger-freeze-export",
]
fix_commit = "b1b42f880183c86c8861d937eab3e0b574f4e82b"
failing_first = "2026-11-25, artifact 20261125T063246-native-v2-ledger-gravity-tick-f4v0b_n_ (wt/D123Mechanics): `/tick freeze`, floating sand, `save-all`, clean stop, `world export-anvil` + `world import-anvil` both PASS, then the restarted server logged `stored chunk unavailable; repair required` for 81 chunks and `checkpoint skipped quarantined chunks count=81`, and `reimport_entered_play` was false at 153 s. The same scenario without the freeze line imports cleanly (20261125T063605-native-v2-ledger-gravity-tick-e71qaxcf)."
repro_check = "CAUSE (2026-11-25, D123FreezeExport): the export wrote each chunk's simulation-debt anchor but not the clock's held prefix. In `world-export-0` of the failing artifact every chunk root carries `KrasnokamenSimLastTick=251`, `KrasnokamenSimDebt=0`, `KrasnokamenSimHeldTicks=11`, and `level.dat` has `Data.Time=308` with `world_clocks.minecraft:overworld.total_ticks=240` and no held-tick witness. `world import-anvil` therefore rebuilt `ClimateImage.game_clock` as `Running { held_ticks: 0 }`, and the restarted server's `debt::validate_anchor` rejected `anchor 11 > held ticks 0` at admission for 81 chunks, quarantined them at every checkpoint and never let the client into play. A native restart of the same store is unaffected (recovery reinstalls the prefix from the checkpoint climate image), so the defect is the export/import metadata boundary — not the frozen checkpoint/baseline/WAL, and not a corrupt chunk. FIX: the export writes `level.dat/Data.KrasnokamenSimHeldTicks` (the held prefix at `Data.Time`) and the import installs it as the running clock's prefix (a freeze is session state; the simulated age it produced is durable), and `import-anvil` validates every chunk's extras against the clock it is about to serve, so a conversion that would publish quarantined chunks refuses instead of reporting PASS. An export without the witness keeps the pre-fix zero-prefix behaviour: anchored chunks stay invalid and are refused, never repaired or regenerated. RED CONTROL: reversing the fix hunks reds `frozen_clock_held_prefix_survives_anvil_metadata_roundtrip` at the imported-clock assertion (receipt FILLME); `chunk_loader::tests::stored_debt_anchor_ahead_of_the_served_held_prefix_stays_refused` keeps the fail-closed admission control (a chunk whose anchor is ahead of the served prefix is still quarantined, never generated or overwritten). GATE: `harness:entities:native-v2-ledger-freeze-export` reruns the original fixture on the promoted tree with the real offline conversion and restart, asserting `reimport_entered_play`, `reimport_no_quarantined_chunks` (zero quarantine lines in the restarted server log) and `reimport_sand_fell_one_block` (receipt FILLME)."
proving_assertions = { "harness:entities:native-v2-ledger-freeze-export" = "reimport_entered_play" }
