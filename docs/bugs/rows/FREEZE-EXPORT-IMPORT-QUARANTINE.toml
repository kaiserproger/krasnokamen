repro_check = "CAUSE (2026-11-25, D123FreezeExport): the export wrote each chunk's simulation-debt anchor but not the clock's held prefix. In `world-export-0` of the failing artifact 20261125T063246-native-v2-ledger-gravity-tick-f4v0b_n_ every chunk root carries `KrasnokamenSimLastTick=251`, `KrasnokamenSimDebt=0`, `KrasnokamenSimHeldTicks=11`, and `level.dat` has `Data.Time=308` with `world_clocks.minecraft:overworld.total_ticks=240` and no held-tick witness. `world import-anvil` therefore rebuilt `ClimateImage.game_clock` as `Running { held_ticks: 0 }`, and the restarted server's `debt::validate_anchor` rejected `anchor 11 > held ticks 0` at admission for 81 chunks, quarantined them at every checkpoint and never let the client into play. A native restart of the same store is unaffected (recovery reinstalls the prefix from the checkpoint climate image), so the defect is the export/import metadata boundary — not the frozen checkpoint/baseline/WAL, and not a corrupt chunk. FIX: the export writes `level.dat/Data.KrasnokamenSimHeldTicks` (the held prefix at `Data.Time`) and the import installs it as the running clock's prefix (a freeze is session state; the simulated age it produced is durable), and `import-anvil` validates every chunk's extras against the clock it is about to serve, so a conversion that would publish quarantined chunks refuses instead of reporting PASS. An export without the witness keeps the pre-fix zero-prefix behaviour: anchored chunks stay invalid and are refused, never repaired or regenerated. RED CONTROL: reversing the fix hunks reds `frozen_clock_held_prefix_survives_anvil_metadata_roundtrip` at the imported-clock assertion (receipt .analysis/validation/20261125T075752-test-u2dpsr5t/result.json); `chunk_loader::tests::stored_debt_anchor_ahead_of_the_served_held_prefix_stays_refused` keeps the fail-closed admission control (a chunk whose anchor is ahead of the served prefix is still quarantined, never generated or overwritten); it cannot flip with the fix — it asserts the refusal that stays in place on both sides — so it is registered but not a proving ref. GATE: `harness:entities:native-v2-ledger-freeze-export` reruns the original fixture on the promoted tree with the real offline conversion and restart, asserting `reimport_entered_play`, `reimport_no_quarantined_chunks` (zero quarantine lines in the restarted server log), `reimport_gametime_continues_from_the_frozen_age` (the server's own `/time query gametime` answers 402 before the export and 617 after the reimport with at least 750 held ticks, so the simulated age continued instead of jumping by the dropped prefix) and `reimport_sand_fell_one_block` (receipt .analysis/validation/20261125T090814-native-v2-ledger-freeze-export-k9emw7ff/result.json)."
proving_assertions = { "harness:entities:native-v2-ledger-freeze-export" = "reimport_no_quarantined_chunks" }
