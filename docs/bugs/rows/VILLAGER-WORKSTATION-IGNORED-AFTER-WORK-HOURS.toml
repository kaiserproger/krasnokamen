source = "Breaker finding F2 (VillageBreak2, ISSUE-1-10 break-it pass, agent-run): at time 10000 (awake, after work hours) an unbound jobless villager 51 blocks outside any settlement gets a lectern two blocks away, and a bound jobless resident's settlement certifies a librarian workshop; both stay jobless for 1200 ticks, and after time set 2500 both are librarians within 200 ticks, so the stations were valid and reachable (native client d5f25569, server pin 4bfacdf6391f-3f0eb5d2 = main 71d1c127; scene-shot artifacts 20261112T013249-scene-shot-qfcl2h4c, 20261112T013426-scene-shot-yc4y5ut8, 20261112T013520-scene-shot-dh5v6muo: unbound 3/3, bound 2/2). Vanilla 26.3 VillagerGoalPackages.getCorePackage holds AcquirePoi for POTENTIAL_JOB_SITE and AssignProfessionFromJobSite, which run whatever the schedule activity is, so an awake villager takes a free workstation at any time of day (the usual lectern reroll). crates/mc-core/src/settlements/allocator.rs acquire_pois searches jobs only while day_time is in 2000..9000, for bound and unbound villagers; docs/settlements/jobs.md documents that window: owner decision whether unbound villagers should follow vanilla."
