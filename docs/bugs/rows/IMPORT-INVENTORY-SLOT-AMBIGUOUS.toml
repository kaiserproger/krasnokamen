repro_check = "Round 1 slot control: missing/repeated/unsupported Inventory and legacy equipment duplicates incorrectly publish PASS. Round 2 controls: wrong WAL array lengths and malformed item ids incorrectly admit custody. Round 3 WAL-opaque duplicate Carried/CraftingGrid control publishes recovered state and offline export PASS; native raw checkpoint duplicates were already refused and are regression-pinned, not claimed as a new loss fix. Combined production patch: docs/bugs/fix-patches/IMPORT-INVENTORY-SLOT-AMBIGUOUS.patch. Per-ingress evidence, historical vanilla writer table and control-tree diffs: owner-host receipts/ImportSlotFix/REPORT.md. Row stays open; Main owns independent custody review and promotion."
