[[bug]]
id = "IMPORT-INVENTORY-SLOT-AMBIGUOUS"
title = "Anvil import keeps a player whose inventory has a missing or repeated Slot, and the next save drops the extra items"
area = "gameplay"
severity = "major"
status = "open"
source = "Stage3 ReviewBattleGap (read-only review of the DFU import commit): crates/mc-data/src/player_nbt.rs:174-193 silently skips a stack without a valid Slot; crates/mc-core/src/journal/player_nbt.rs:316-325 writes stacks into the slot array in order, so two valid stacks with the same Slot keep only the last; crates/mc-world import.rs:723-777 accepts the player after that decode; the next serialization rebuilds Inventory from the array (journal/player_nbt.rs:47-59), losing the skipped or overwritten item"
repro = "source"
regression = ["cargo:mc-world-conversion:player_slot_import_tests::missing_inventory_slot_refuses_import_before_load_save", "cargo:mc-world-conversion:player_slot_import_tests::repeated_inventory_slot_refuses_import_before_load_save", "cargo:mc-world-conversion:player_slot_import_tests::unsupported_player_slots_refuse_without_partial_publication", "cargo:mc-world-conversion:player_slot_import_tests::repeated_legacy_equipment_slot_refuses_before_dfu_fold", "cargo:mc-world-conversion:player_slot_import_tests::ordinary_player_inventory_survives_import_load_save_reopen", "cargo:mc-world-conversion:player_slot_import_tests::missing_item_id_with_payload_refuses_import_before_load_save", "cargo:mc-world-conversion:player_slot_import_tests::wrong_type_item_id_with_payload_refuses_import_before_load_save", "cargo:mc-world-conversion:player_slot_import_tests::duplicate_carried_refuses_import_before_first_match", "cargo:mc-world-conversion:player_slot_import_tests::duplicate_crafting_grid_refuses_import_before_first_match", "cargo:mc-world-conversion:player_slot_import_tests::duplicate_embedded_player_custody_refuses_import_before_publication", "cargo:mc-world-conversion:player_slot_import_tests::duplicate_wal_player_custody_refuses_offline_export_without_publication", "cargo:mc-core:native_checkpoint::tests::player_custody::short_wal_inventory_refuses_recovery_without_partial_load", "cargo:mc-core:native_checkpoint::tests::player_custody::long_wal_inventory_refuses_recovery_without_partial_load", "cargo:mc-core:native_checkpoint::tests::player_custody::ordinary_wal_inventory_recovers_all_players_without_rewriting_checkpoint", "cargo:mc-core:native_checkpoint::tests::player_custody::duplicate_carried_in_wal_opaque_refuses_recovery", "cargo:mc-core:native_checkpoint::tests::player_custody::duplicate_crafting_grid_in_wal_opaque_refuses_recovery", "cargo:mc-core:native_checkpoint::tests::player_custody::missing_item_id_with_payload_refuses_checkpoint_recovery", "cargo:mc-core:nat