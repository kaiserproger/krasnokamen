[[bug]]
id = "KNOCKBACK-EPOCH-MAP-COPY"
title = "The knockback epoch observer assumes the tick output's snapshot Arc is unique: with any retained clone it panics the tick owner on `Arc::get_mut(..).expect(..)`, and because every published WorldSnapshot also holds the epoch map, its `Arc::make_mut` deep-copies the whole ConnectionId->(count, tick) map on every tick that carries an explosion knockback for anyone."
area = "gameplay"
severity = "minor"
status = "open"
source = "crates/mc-core/src/core.rs:52-91 (observe_explosion_knockback): `Arc::make_mut(knockback_ticks)` at :79 and `Arc::get_mut(&mut output.snapshot).expect(\"tick output is not shared before publication\")` at :87; the shared map is WorldSnapshot.player_knockback_ticks (crates/mc-core/src/boundary.rs:666) and the broadcast retains up to broadcast_cap=32 outputs (crates/mc-core/src/config.rs:137) while the tick seeds its handle at crates/mc-core/src/core/tick_loop.rs:66. Found by read-only audit CS341/REPORT-B.md B6, no failure observed."
repro = "source"
regression = []
failing_first = "not recorded"
repro_check = "No red reproducer exists yet; the panic needs a shared snapshot, which no live caller produces today. Test idea for the fix, through the real observer: a mc-core unit test that calls `crate::core::observe_explosion_knockback` (pub(crate)) with an Output whose `snapshot` Arc is also held by the test, plus one explosion knockback entry for a live player; today the call panics at core.rs:87, after a fallback that clones the snapshot instead of expecting uniqueness it must return and publish an epoch map that still reads correctly through the retained clone. Suggested name: `cargo:mc-core:core::knockback_epochs_shared_snapshot_does_not_panic_the_observer`. The second symptom (a full map copy per explosion tick, because make_mut is never unique) is the same code path and is measured, not asserted: `perf stat` allocations or a test-only allocation counter on a two-player explosion fixture at 20 TPS. Keep it in one row; split only if a fix lands for the panic and not the copy."
