[[bug]]
id = "WORLD-PRUNE-PANICS-ON-CRASH-IMAGE"
title = "world prune panics on a SIGKILLed battle world image instead of pruning or refusing"
area = "gameplay"
severity = "major"
status = "fixed"
source = "A11Regression 2026-11-16, receipts/A11Regression/REPORT.md finding 1 and receipts/A11Regression/prune-panic (command.txt, prune-1.log, prune-2.log): `krasnokamen world prune --keep-radius 4194304 --dry-run` on a hash-verified copy of receipts/A11FinalBreaker/real-sigkill-clear-candidate-crash-1-1/crash-copy/world (pin b06399a7e288-10ec419b) exits 101 twice with `core process panic ... crates/mc-core/src/chunk_loader.rs:251:18: Cannot block the current thread from within a runtime`. Reproduced on main 85abb168f (pin 85abb168f590, receipts/A11Promote/prune-recheck, RUST_BACKTRACE in prune-bt.log): operator_cli calls prune_world on the async runtime thread, its Core::open replays the crash tail's block writes and ChunkLoader::recv blocks there (pregenerate and the server use spawn_blocking). The same command prunes a clean world normally (probe-export/clean-prune.log); the source image is unchanged. The panicking dry run did rewrite the copy's native/state.redb (hash changed, journal files unchanged, content not compared), although PruneRequest.dry_run documents that it writes nothing. Reproducible crash: announcement-blocking under DEFINITION_OF_DONE queue admission. Fix e3babeb88 (PruneFix, branch wt/PruneFix): prune_world runs in tokio spawn_blocking like pregenerate. Negative control with only that hunk reverted: the new test fails with the chunk_loader `Cannot block the current thread from within a runtime` panic (receipts/PruneFix/negative-control-test.log); with the fix it passes (receipts/PruneFix/test-operator-cli-fixed.log). Real repro on a hash-verified copy of the crash image (receipts/PruneFix/copy-verify-before.log; source image re-verified after, source-image-verify-after.log): fixed debug build (krasnokamen-debug.sha256) `world prune --keep-radius 4194304 --dry-run` exits 0 with a prune report (prune-fixed.log, prune-fixed.exit). The dry run still recovers the crash tail into native/state.redb like a server start; PruneRequest::dry_run, the --dry-run help and OPERATING.md now say so. Repro reclassified manual -> command by Main in 9822bc306 (the same agent that then promoted it); the original report is the offline CLI command. Post-merge independent review receipts/ReviewPruneFix/REPORT.md (architect-fable): pass, minor findings only (prune does not check that the open/shutdown cycle published a checkpoint covering the tail; regression test asserts only success; doc precision, fixed in the same commit as this note)."
repro = "command"
regression = ["cargo:mc-edge:operator_cli::tests::world_prune_dry_run_recovers_a_crash_journal_tail_off_the_async_worker"]
failing_first = "reported"
