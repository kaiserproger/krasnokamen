repro_check = "Open: no promotion receipt and no faithful control yet. Every hunk of this behaviour still applies in reverse at this HEAD (`git apply -R --check` of c4d8c0d01's own file diff succeeds for debt.rs, journal.rs, weather.rs, core/recovery.rs, world/capture.rs and world/residency.rs), so a faithful control is buildable: a patch whose a/-side is the real pre-image of those hunks, leaving the abstract-simulation freeze gate on both sides so TIME-FROZEN-CATCHUP-DEBT's assertions stay green. Not attempted yet; a later commit's rewrite of journal/replay.rs, native_checkpoint.rs and world/clocks.rs means those files can only be class (c) if they are needed. The two refs were green in TIME-FROZEN-CATCHUP-DEBT's restore (.analysis/validation/20261124T033121-ledger-promote-fu2j91l7, ledger-3-run.log)."
