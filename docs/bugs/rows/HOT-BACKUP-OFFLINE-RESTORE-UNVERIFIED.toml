source = "Split from HOT-BACKUP-STATE-DATABASE-COPY-UNVERIFIED (final review 10, B5): that row now covers only the in-process `Core::backup` path (5cdafd6588). The offline path is crates/mc-edge/src/backup.rs; the fix is 92a28e7186 (verify the copy from the copy's own one open). Narrowed on the wave-2 independent review (receipts/D123/D123Persist/review/REVIEW-wave2-1.md B1): the control proves a FALSE REFUSAL of a good hot copy (the pre-fix path already called `hot_backup::verify_restorable`, only through a second read-only open), not a missing verification; the command's `complete`-before-verification reporting half moved to HOT-BACKUP-OFFLINE-STATUS-BEFORE-VERIFY. 57f90fd920 (backup and restore read the operator's --config) is not part of this verification path."
regression = ["cargo:mc-edge:backup::tests::the_restore_command_accepts_a_hot_backup_verified_with_content"]
