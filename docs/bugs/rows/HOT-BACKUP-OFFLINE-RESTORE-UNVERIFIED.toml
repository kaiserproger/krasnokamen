repro_check = "fix_commit is the forward-ported pre-fix form of the verification path: docs/bugs/fix-patches/HOT-BACKUP-OFFLINE-RESTORE-UNVERIFIED.patch carries 92a28e7186 backup.rs hunks for backup_expected_tick and the verify_backup body (both still reverse at this HEAD; reversed, the file equals blob 3450417f7 except for the two excluded run_backup hunks, so it is not that blob and the patch index line only names the blobs of the whole commit). Control (reversed): the real restore command on a hot backup with content fails the assertion at backup_tests.rs:668 - assertion failed: the restore command verifies and restores a hot backup: native source: world was not shut down cleanly; start and stop the server once to repair it - the second read-only open the pre-fix verify_backup makes. Restore is green on the same tree in the promotion. Excluded: run_backup's signature and final-println hunks with operator_cli.rs's Command::Backup arm (a: another row's behaviour, HOT-BACKUP-OFFLINE-STATUS-BEFORE-VERIFY, which must carry both together so its red lands on its own assertion), hot_backup.rs (c: rewritten by later commits; verify_copy has no pre-image), mc-world/src/native.rs snapshot_reader (a: WINDOWS-BACKUP-SECOND-HANDLE-ERROR-33 coverage) and 57f90fd920 (a: the operator --config plumbing for backup and restore, operator_cli.rs and backup_tests.rs only, not this verification path)."
