[[bug]]
id = "HOT-BACKUP-OFFLINE-RESTORE-UNVERIFIED"
title = "The offline backup command and run_restore report success while checking only files and digests, so an offline copy that cannot restore is reported as a verified backup"
area = "gameplay"
repro = "source"
severity = "major"
status = "open"
source = "Split from HOT-BACKUP-STATE-DATABASE-COPY-UNVERIFIED (final review 10, B5): that row now covers only the in-process `Core::backup` path (5cdafd6588). The offline path is crates/mc-edge/src/backup.rs, and the fix commits are 92a28e7186 (verify the copy from the copy's own one open) and 57f90fd920 (backup and restore read the operator's --config). In that row's control this row's ref was green, so it proves nothing there."
regression = ["cargo:mc-edge:backup::tests::the_restore_command_accepts_a_hot_backup_verified_with_content"]
failing_first = "reported"
repro_check = "fix_commit is the forward-ported pre-fix form of the verification path: docs/bugs/fix-patches/HOT-BACKUP-OFFLINE-RESTORE-UNVERIFIED.patch carries 92a28e7186 backup.rs hunks for backup_expected_tick and the verify_backup body (blob pair 3450417f7 -> d3f02c038, both still reverse at this HEAD). Control (reversed): the real restore command on a hot backup with content fails the assertion at backup_tests.rs:668 - assertion failed: the restore command verifies and restores a hot backup: native source: world was not shut down cleanly; start and stop the server once to repair it - the second read-only open the pre-fix verify_backup makes. Restore is green on the same tree in the promotion. Excluded: the run_backup signature/final-report hunks and operator_cli.rs (b: operator_cli.rs is not carried and keeps calling run_backup for a usize), hot_backup.rs (c: the file no longer reverses; verify_copy has no pre-image) and native.rs snapshot_reader (a: WINDOWS-BACKUP-SECOND-HANDLE-ERROR-33 coverage)."
fix_commit = "patch:7fde9964184cd1b21cfbb23cf918a80d824fb2803923e6a9797375c0751ee571"
