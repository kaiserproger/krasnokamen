[[bug]]
id = "SETTLEMENT-UPGRADE-HAUL-STALLS-WITH-LOGS-IN-STORE"
title = "An upgrade project stood at 2 work units with 140 logs and 2 planks in store, and A's mason:2 for 23k ticks"
area = "gameplay"
repro = "client"
severity = "major"
