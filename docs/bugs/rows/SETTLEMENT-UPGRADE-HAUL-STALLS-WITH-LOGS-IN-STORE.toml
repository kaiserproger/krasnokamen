[[bug]]
id = "SETTLEMENT-UPGRADE-HAUL-STALLS-WITH-LOGS-IN-STORE"
title = "An upgrade project stood at 2 work units with 140 logs and 2 planks in store, and A's mason:2 for 23k ticks"
area = "gameplay"
repro = "client"
severity = "major"
status = "open"
source = "D123 review round 4 (receipts/D123/D123Civ/HANDOFF-53.md §9/§11): the adopted-village closure test bound `lumber_camp:2` at 2 work units from tick 5,420 with `oak_log` 140 and `oak_planks` 2 in store while Storage and House waited; on the A control the mason:2 project stood for 23,000 ticks. The executor DOES craft bill items at haul (`settlement_builds.rs` `reserve_wood` + `ensure_units`), so an upgrade bill containing crafted planks should be satisfiable from logs."
failing_first = "cargo (reproducer, see repro_check)"
cause = "Established with a deterministic reproducer (2026-11-26): the stock-only upgrade rule disabled in `preparation::upgrade_project` (the check turned into `if false && ...`), the adopted-village closure test (`villager::building_autonomy_tests::adopted_village_with_resident_shears_produces_stock_and_builds`) instrumented every 2,000 ticks with `project_status`, the resident professions and the chest totals. The upgrade `lumber_camp:2` is admitted at tick ~6,000 (site 3,200,13), the executor reserves its whole bill AND crafts the planks at haul: the bill line shows `oak_planks 36`, `oak_slab 14`, `oak_stairs 12`, `oak_log 36` reserved, and the bound builder walks around carrying exactly that load (oak_planks 36, oak_slab 14, oak_stairs 12, oak_door 14, ...) with `navigation_target: None` and an empty `navigation_path`, while the ledger stays `Blocks: 2/104 . Running` and `pause_reason: None` from tick 6,000 past tick 40,000 with 123 oak logs and 0 planks in store. So the stall is NOT in reserve_wood/ensure_units (crafting works) and NOT a material shortage: after collecting the load the site places two blocks and then the builder is left idle, out of reach of the next cell, with no navigation target and no pause reason - a placement-side hand-off bug in the structure executor for an UPGRADE site (new buildings complete; only the upgrade path stalls).""
regression = []
repro_check = ["Reproduced: (a) in `crates/mc-core/src/settlements/construction_preparation.rs` turn the per-item stock check into `if false && !missing_base(...)`; (b) add a trace to the 80k loop printing `state.tick`, the chest logs/planks, `construction::project_status(&state, id)` and every Builder resident's position, `navigation_target`, `navigation_path.last()` and inventory; (c) `cargo test -p mc-core --lib -- --nocapture adopted_village_with_resident_shears`. Output: `lumber_camp . level 2 . 1%`, `Blocks: 2/104 . Running`, the reserved bill incl. `oak_planks 36`, and a Builder holding that load with no navigation target for 34,000 ticks. With the stock rule restored the upgrade is never admitted and the same village closes at tick 26,573 (the admission policy is the working workaround). Original note: Proof shape: a settlement with a completed lumber camp, 140 oak logs and 2 planks in one chest, and an admitted lumber_camp level-2 upgrade; assert the executor places a plank cell within N ticks (today the project's placed count stays at 2). Also compare against a new-building bill with the same materials to show the upgrade path is the difference."]
