[[bug]]
id = "EDGE-OUTBOX-STALL-WATCH-HALTS-LIVE-LAGGING-PUMP"
title = "The 10 s reliable outbox stall watch halts the core fail-closed under a live edge pump that only lags: at 3 TPS a lone queued batch waits a whole 32-output broadcast window (about 10.3 s) behind the pump and the core stops with `edge pump not draining`"
area = "gameplay"
severity = "major"
status = "fixed"
source = "Latent; CheckpointJoinStall 2026-11-20, side finding of the EDGE-SLOW-PUMP-HOLDS-JOIN-BEHIND-STALE-OUTPUTS repro (not seen in Perf1M R3k-4, which shut down by SIGTERM). crates/mc-core/src/core/tick_loop.rs halts when the outbox is non-empty and its drain epoch has not moved for `outbox_stall_ms` (StallWatch, core/outbox.rs); the edge pump drains a batch only when it publishes an output at or past the batch's tick and, behind the tick, sat at the oldest retained output. Base dc670b3bd, `/tick rate 3`, default window 32, pump paced at half the tick rate behind a lone `Joined` batch: the core closed its broadcast; raising only `outbox_stall_ms` to 60 s removed the halt (A/B, receipts/CheckpointJoinStall/repro/m2-repro-base-20tps-and-stallhalt.log). A pump that stops for good must still halt the core."
repro = "cargo"
regression = [
  "cargo:mc-edge:server::pump_join_lag_tests::a_live_pump_behind_a_lone_batch_does_not_trip_the_stall_watch",
  "cargo:mc-edge:server::pump_join_lag_tests::a_hung_pump_still_halts_the_core",
  "harness:join-lag-gate:live_pump_does_not_halt",
]
failing_first = "reported"
fix_commit = "patch:a9098920f0a64040d39be8913ab65bcdcf042080bf53ce17b777702144b113dd"
promotion = "docs/bugs/promotions/EDGE-OUTBOX-STALL-WATCH-HALTS-LIVE-LAGGING-PUMP.json"
repro_check = ["Evidence upgrade after review wave2-9 Major-1: the earlier candidate receipt .analysis/validation/20261124T181913-join-lag-gate-rfdoyqwt is WITHDRAWN as the halt-watch evidence — its claimed 17.0 s window divided ticks by the admitted 3 TPS rate while the first 31 ticks ran at ~20 TPS, so the server lived only 7.3 s after admission and the pass could not have seen a halt that arrives ~9.2 s after admission. Re-taken with the wall-clock rule (window start = the later of admission and the first publication already at the applied rate; end = the last pump publication; require >= 12 s, event-driven extension): .analysis/validation/20261124T201826-join-lag-gate-8o68w09t PASS on the candidate pin fc77576f0bb2 — join landed in 3.4 s behind 62 publish-budget skips at 3.23 TPS, joiner in play, no halt, halt window 14.1 s of wall clock (admitted 20:18:44.89, last publication 20:18:58.97). The control reds stand (four 2026-11-24 control runs, live_pump_does_not_halt false with the client in play). This row is not re-promoted from the old receipt; the corrected candidate belongs to the same patch a9098920."]
