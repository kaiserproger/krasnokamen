[[bug]]
id = "SETTLEMENT-HOUSE-BILL-STALLS-BELOW-COBBLESTONE-DEMAND"
title = "A funded House in a dense adopted village finds no legal site (frontages measured, every site refused), so the House project is never created and the settlement idles a full game day"
area = "gameplay"
repro = "client"
severity = "major"
status = "open"
source = "civilization-seed-qa series on the merged pin (de356989816d, artifacts 20261125T205606-zufri62p and 20261125T213859-civilization-seed-qa-1yrnu8ge; village_center [136,70,-216], seed 24). The mine-zone rule and the entrance hold are not the blocker any more: the village box [140,58,-203]..[154,73,-189] is queued at tick ~500, a Mine certifies (planner `no_source: Some(Miner)`), a Miner is assigned and deposits (miner lane `heavy_load` 4 in run 1, 3 in run 2). The stall is site selection: with cobblestone at have: 194, total: 224 (run 2, tail of server.log) the settlement logs `funded kinds found no legal site` 708 times, `frontages=4619 examined=64` and every examined site refused - LotGeometry 29, BuildingBuffer 17, SurfaceUnavailable 8, ProtectedObstruction 3, CutBeyondEnvelope 3, ProtectedFloor 2 - so no House project is ever created and the harness stall oracle fires after one unchanged game day (run 2; run 1 also fails, on a harness storage read: `filesystem event timeout for server.log`). Not a cobblestone shortage: the stock exceeds the bill."
failing_first = "reported"
regression = ["cargo:mc-core:settlements::construction::growth_tests::the_house_reserve_is_netted_per_item_of_the_upgrade_bill", "cargo:mc-core:settlements::construction::growth_tests::a_house_upgrade_is_not_reserved_against_itself", "cargo:mc-core:settlements::construction::growth_tests::the_house_reserve_refuses_an_upgrade_on_its_shared_items", "cargo:mc-core:settlements::construction::growth_tests::a_birch_village_admits_its_upgrade", "cargo:mc-core:settlements::construction::growth_tests::logs_only_do_not_admit_an_upgrade"]
cause = "Measured on the final civ series (receipts/D123/D123CivGates/FINAL-SERIES.md, runs 2-3): the House was never funded (0 of 1539 / 0 of 2795 funding passes, last bill `oak_planks 4/106`) while the settlement upgraded two mason workshops to L3 and completed Storage L1. The upgrade admission is stock-only (`preparation::upgrade_project`), so every plank the village gathered above a mason upgrade's own bill was spent on that upgrade: the House's 106-plank bill never accumulated. Fix: while the village is short of roofed beds, the priority House's level-1 bill (`house_reserve_bill`, the chosen species/bed bill) is netted into the upgrade funding proof, so an upgrade never spends the House lane's stock (`crates/mc-core/src/settlements/construction.rs`, `construction_preparation.rs`). Legacy half of the row (dense adopted village, every House frontage refused) is unchanged: the priority House scan still reports its refusals."
fix_commit = "7925c7bdc"
repro_check = ["Filed from the series of HANDOFF-47 (mine-zone fix on de356989816d): not reproduced under a cargo control yet, read from the two artifacts named in `source`. Proof shape: a dense adopted-village cargo fixture that certifies a Mine, fills the settlement's cobblestone above a House bill's demand, then asserts a House project gets a site - today `site_for`/the ranked sweep returns None with those refusal counts, so a cargo test that drives a funded House to a site (or pins the first legal frontage) reds on the current tree and greens on the fix."]

