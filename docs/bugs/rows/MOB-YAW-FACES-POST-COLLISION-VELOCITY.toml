[[bug]]
id = "MOB-YAW-FACES-POST-COLLISION-VELOCITY"
title = "A mob with nothing to look at turns toward the velocity physics left it with instead of the direction it wants to travel, so a clipped, blocked or knocked-back step swings its body by up to 90 degrees a tick"
area = "gameplay"
severity = "major"
status = "open"
source = "BattleJitterClient/Main 2026-11-17 (receipts/BattleJitterClient/FIX-PROPOSAL.md:5-14: the freeze fix was battle-only; receipts/Stage3/D20-INVENTORY.md row 'Global MoveControl yaw parity'; receipts/MotionYaw/DESIGN.md). Before this change crates/mc-core/src/entity_motion.rs:448-460 called look() with the post-physics body.velocity, and look() at :248-282 turned the body yaw toward whatever direction it was handed at 90 deg/tick; the head was returned as the body yaw. Vanilla MoveControl turns the body toward the wanted position (local javap constants: MAX_TURN 90, MIN_SPEED 5.0E-4 blocks/tick, MIN_SPEED_SQR 2.5000003E-7, MOVE_TO with no turn under the dead zone), never toward the resolved velocity, and a knockback does not move the wanted position. Fix in receipts/MotionYaw: the body turns toward the tick's wanted drive with the vanilla dead zone, and the head follows the body at LookControl's 10 deg/tick inside the 75 deg cone of BodyRotationControl. Battle rows keep battle_holds_facing (BATTLE-HOLD rows above) unchanged. Fix in tree: `789097be5` (mob body yaw follows the wanted drive; head lags on its own axis), probe green on all 11 refs (`20261124T092509-ledger-probe-cadi2cru`). Client-visible: promotion needs the registered scene `native-v2-mob-yaw-blocked-step` (SWEEP-MANIFEST.md) and a curated patch for the commit plumbing hunks."
repro = "client"
regression = ["cargo:mc-core:entity_motion_tests::move_facing_faces_the_wanted_direction_not_the_resolved_step", "cargo:mc-core:entity_motion_tests::move_facing_holds_below_the_vanilla_dead_zone", "cargo:mc-core:entity_motion_tests::move_facing_ignores_a_knockback", "cargo:mc-core:entity_motion_tests::move_facing_steady_walk_keeps_the_old_yaw_and_pitch", "cargo:mc-core:entity_motion_tests::move_facing_head_follows_the_body_at_the_vanilla_rate", "cargo:mc-core:entity_motion_tests::stationary_body_holds_its_facing_while_the_head_settles", "cargo:mc-core:entity_motion_tests::move_facing_follows_the_swim_detour_around_a_wall", "cargo:mc-core:entity_motion_tests::unloaded_column_settles_the_head_on_the_body", "cargo:mc-core:entity_motion_tests::standing_battle_row_keeps_the_legacy_facing_on_an_impulse", "cargo:mc-core:tick::entity_phase::entity_phase_tests::standing_battle_row_keeps_the_legacy_facing_on_an_impulse", "cargo:mc-core:entities::tests::apply_motion_result_keeps_the_head_separate_from_the_body",
  "harness:scene-shot:native-v2-mob-yaw-blocked-step",
]
failing_first = "not recorded"
repro_check = ["The client proof now exists as the registered scene `native-v2-mob-yaw-blocked-step` (scene-shot, windowed native; `tools/harness/mob_yaw_blocked_step_scene.json` + `mob_motion_oracle.chase_facing`): a zombie pushed at an oak-fence line while the local player stands diagonally behind it. The scene first proves the fixture really deflected the step (at least 30 deg between the wanted bearing and the measured displacement over three moving intervals), then asserts the received body yaw stays within 15 deg of the bearing to the player, not of the deflected step, at no more than 90 deg/tick. Evidence and limits in `docs/bugs/promotions/MOB-YAW-FACES-POST-COLLISION-VELOCITY.hunks.md`. Still missing for promotion: a real pre-image control. The non-test hunks of 789097be5 no longer reverse at HEAD (later commits restructured entity_motion.rs, blueprint.rs, raiders.rs, tick/dying.rs and tick/entity_phase.rs, so `git apply -R --check` refuses and commit-mode promote cannot build the cargo red); a reversing patch must be regenerated by the bed-patch procedure, or the pre-image tree 789097be5^ pinned and the scene run on it."]
