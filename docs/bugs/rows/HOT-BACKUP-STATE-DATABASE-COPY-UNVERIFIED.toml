[[bug]]
id = "HOT-BACKUP-STATE-DATABASE-COPY-UNVERIFIED"
title = "In-process Core::backup reports success without proving the copy restores: state.redb is copied as hashed bytes and no one restores the copy, so a damaged store or semantically unreplayable records surface only at disaster time."
area = "gameplay"
repro = "source"
severity = "major"
status = "fixed"
source = "receipts/Books/REPORT-R5.md section 1 G3 (Petrov ch. 3 checksumming p. 59: do not propagate corrupt data; the backup must be restorable); committee receipts/Books/ARCH-PERSIST6-astra.md (G3) and ARCH-PERSIST6-fable.md. Partly closed on main by 4e060c76c: copy_world (crates/mc-core/src/hot_backup.rs) runs journal::verify_batch_file (decode_batch + CRC) on every WAL batch it copies. Not closed: the checkpoint database is copied with copy_reader_hashed (a SHA-256 of the copied bytes only). CRC-clean batches plus a store that opens still do not prove restorability: recovery also checks record semantics (crates/mc-core/src/journal/replay.rs:403-475). Verified on main 5bdc02911. Fix direction: after writing a backup, restore exactly that copy into an empty temporary directory and run the ordinary native recovery and replay with the same pin and config up to the expected tick, without opening the archive itself for writing; a failure is reported as an unverified backup, never as a verified one. Tests: a byte flipped in the copied database, and a semantically invalid but CRC-clean batch, each refuse verification. No format change. Landing (fix 5cdafd6588): `Core::backup` verifies the finished copy as the next serve opens it - read-only, or through a repaired scratch copy when redb would repair a live store's image, so the backup itself is never written - and runs the ordinary recovery reader and WAL replay to the copied tick. This row now covers only the in-process `Core::backup` path; the offline backup/CLI path (92a28e7186, 57f90fd920) is HOT-BACKUP-OFFLINE-RESTORE-UNVERIFIED (open)."
regression = ["cargo:mc-core:hot_backup_tests::backup_refuses_a_copy_that_does_not_restore"]
failing_first = "not recorded"
repro_check = "Narrowed to the in-process path (final review 10, B5). Identity patch:bfab16b1 carries only 5cdafd6588's `Core::backup` verification call (core.rs:1780-1787) - the pure-addition hunk whose a/-side is the real pre-image of the call site. verify_copy and verify_restorable keep their signatures on both sides (class (b): the registered ref reads them), and no counter or assertion text is invented. Control red by assertion at hot_backup_tests.rs:352 `an unrestorable copy is not a backup` for both test_hooks modes (DATABASE and UNREPLAYABLE_BATCH): the copy was reported successful. Restore green. The offline/CLI commits 92a28e7186 (verify from the copy's own one open) and 57f90fd920 (backup/restore read the operator's --config) are not carried - they are the separate open row HOT-BACKUP-OFFLINE-RESTORE-UNVERIFIED, whose ref was green in this control."
fix_commit = "patch:bfab16b165d49e12c75742231c886f96b9241fafbc7457ebccd22f556a40ff17"
promotion = "docs/bugs/promotions/HOT-BACKUP-STATE-DATABASE-COPY-UNVERIFIED.json"
