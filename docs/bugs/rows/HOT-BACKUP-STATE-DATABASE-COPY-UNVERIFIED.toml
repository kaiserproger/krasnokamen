[[bug]]
id = "HOT-BACKUP-STATE-DATABASE-COPY-UNVERIFIED"
title = "A backup is reported successful without proving it restores: the journal batches are CRC-checked and state.redb is only hashed, but no one restores the copy into an empty directory and runs ordinary recovery and replay, so a damaged store or semantically unreplayable records surface only at disaster time."
area = "gameplay"
repro = "source"
severity = "major"
status = "fixed"
source = "receipts/Books/REPORT-R5.md section 1 G3 (Petrov ch. 3 checksumming p. 59: do not propagate corrupt data; the backup must be restorable); committee receipts/Books/ARCH-PERSIST6-astra.md (G3) and ARCH-PERSIST6-fable.md. Partly closed on main by 4e060c76c: copy_world (crates/mc-core/src/hot_backup.rs) runs journal::verify_batch_file (decode_batch + CRC) on every WAL batch it copies. Not closed: the checkpoint database is copied with copy_reader_hashed (a SHA-256 of the copied bytes only); offline backup and run_restore (crates/mc-edge/src/backup.rs) check files and digests only. CRC-clean batches plus a store that opens still do not prove restorability: recovery also checks record semantics (crates/mc-core/src/journal/replay.rs:403-475). Verified on main 5bdc02911. Fix direction: after writing a backup, restore exactly that copy into an empty temporary directory and run the ordinary native recovery and replay with the same pin and config up to the expected tick, without opening the archive itself for writing; a failure is reported as an unverified backup, never as a verified one. Tests: a byte flipped in the copied database, and a semantically invalid but CRC-clean batch, each refuse verification. No format change. Landing (fix 5cdafd6588): `Core::backup` verifies the finished copy as the next serve opens it - read-only, or through a repaired scratch copy when redb would repair a live store's image, so the backup itself is never written - and runs the ordinary recovery reader and WAL replay to the copied tick, so the last two sentences above are now checked, not just specified; a copy that does not restore is withdrawn and the offline `backup` command verifies the same way. Control: revert the non-test hunks of 5cdafd6588 (the `CoreInner.config` field and the `verify_restorable` call)."
regression = ["cargo:mc-core:hot_backup_tests::backup_refuses_a_copy_that_does_not_restore", "cargo:mc-edge:backup::tests::the_restore_command_accepts_a_hot_backup_verified_with_content"]
fix_commit = "patch:bfab16b165d49e12c75742231c886f96b9241fafbc7457ebccd22f556a40ff17"
failing_first = "not recorded"
repro_check = "Bespoke reversible form (Main-approved): the shipped a00ae565 removed verify_copy, which the registered refs call (hot_backup_tests.rs:420/:442), so it was E0425 and never a control. Identity patch:bfab16b1 instead carries the behaviour the row names: Core::backup reports success only after hot_backup::verify_restorable restores the copy (core.rs:1780-1787). verify_copy and verify_restorable keep their signatures on both sides (class (b): the registered refs read them), and no counter or assertion text is invented. Control red by assertion in the re-break worktree: hot_backup_tests.rs:352 `an unrestorable copy is not a backup` for both test_hooks modes (DATABASE and UNREPLAYABLE_BATCH) - the copy was reported successful; log /tmp/hot_break_tests.log. mc-edge backup::tests::the_restore_command_accepts_a_hot_backup_verified_with_content is green in that control and is a green regression, not control evidence."
promotion = "docs/bugs/promotions/HOT-BACKUP-STATE-DATABASE-COPY-UNVERIFIED.json"
