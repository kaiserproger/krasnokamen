[[bug]]
id = "SETTLEMENT-PROJECT-BLUEPRINT-WITHOUT-NAME"
title = "The Construction dialog prints 'Unknown blueprint' for the autonomous furnace project"
area = "client"
repro = "client"
severity = "major"
status = "open"
source = "D123Civ civilization gate, run 20261124T002707: the planner's one-cell furnace project (blueprint id `furnace`, construction_furnace.rs NAME, handled by `site_target`'s furnace branch, absent from the asset catalog and the layout table) had no display name, so the dialog listed 'Unknown blueprint' and the gate could not read the project. Fix a895cc853b names it in ui_text::blueprint (Furnace/Печь) and the gate's label map; filed on 2026-11-24 (review D123Civ6 note d), same class as SETTLEMENT-LAYOUT-PROJECT-SHOWS-UNKNOWN-BLUEPRINT."
regression = ["harness:settlement-map-qa:program_unknown", "cargo:mc-core:settlements::ui_text::tests::every_project_kind_has_a_display_name"]
fix_commit = "a895cc853b"
proving_assertions = { "cargo:mc-core:settlements::ui_text::tests::every_project_kind_has_a_display_name" = "crates/mc-core/src/settlements/ui_text.rs:1003" }
failing_first = "reported"
repro_check = "The wider gate ref (`harness:civilization-seed-qa:all`) was replaced on 2026-11-26 by the symptom's own dialog read, `harness:settlement-map-qa:program_unknown` (`--scenario program-unknown`): the gate's `all` verdict also requires `new_house` and `births`, unrelated product milestones that failed in all three final-pin series runs (receipts/D123/D123CivGates/FINAL-SERIES.md, new_house 0/3), so that ref could never record this row's symptom. The scenario raises the planner's own one-cell furnace project out of real storage and reads the Construction status page's card text (a display name, never the raw `furnace` id) - the read the civilization gate could not make in run 20261124T002707."
