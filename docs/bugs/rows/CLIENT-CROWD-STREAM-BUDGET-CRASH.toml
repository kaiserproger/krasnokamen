[[bug]]
id = "CLIENT-CROWD-STREAM-BUDGET-CRASH"
title = "Native client exits with dynamic_or_ui_stream_budget_exceeded when an overhead camera sees a 2000-mob crowd 19 blocks below"
area = "client"
severity = "major"
status = "fixed"
source = "Stage3 Horizon client 1:1 comparison (HzClient1v1 crowd diagnostic, laptop): sealed world with 2000 stationary NoAI mobs at feet y200 on a 0.75-block grid around x4096 z0 (receipts/HzClient1v1/crowd-failures/REPRO_NATIVE_CROWD.md, exact summon commands in logs/entities_2000-summons.json); after `tp HzCamera 4096 219 0 0 90` the native client exits 1 with `client failed: dynamic_or_ui_stream_budget_exceeded` and the server logs the connection closure. Confirmed on the retained UNMODIFIED release binary SHA256 5e30c40a1ebeb730d1e0562072175203ba47624f414109b6ae13d538c3effd51 (crowd-failures/original-confirmation/compatibility/crowd-diagnostic-ours-1794729983844856371/client.log), so the read-only observer patch is not the cause. The Horizon client @0a4dc7ca draws the same pose (1845/2000 bodies in frustum). Fix waits for the owner's client decision."
repro = "client"
regression = ["client:krasnokamen-client:entities::presentation::tests::entity_pass_bounds_a_crowd_to_the_dynamic_stream_share", "harness:scene-shot:native-crowd-stream"]
proving_refs = ["harness:scene-shot:native-crowd-stream"]
proving_assertions = { "harness:scene-shot:native-crowd-stream" = "crowd_stream_bounded" }
fix_commit = "client:bee3b7cc2a070abe10d2e5d426dbb9872bb1806b"
failing_first = "reported"
repro_check = "Budget consumer attributed on the pinned repro (receipts/HzClient1v1/crowd-failures): the entity pass alone. 2000 animal bodies at ~300 body vertices and 80 bytes per Vertex are about 46 MB of dynamic-stream vertices against the 32 MB cap in render::mesh (Stream::validate_size), so the first frame that teleported the camera 19 blocks above the mobs failed with dynamic_or_ui_stream_budget_exceeded and the client exited 1. Fix on client 56d53fe534 (wt/D123PackClientCore): mesh.rs names the caps and derives ENTITY_VERTEX_BUDGET / ENTITY_INDEX_BUDGET (three quarters of each cap, leaving room for clouds, weather, block entities and shadows); presentation::append stops submitting bodies at that share, counts them in PresentationStats::dropped_over_budget and keeps them for a later frame, and a frame over 256 candidates submits nearest first. GPU crowd-instanced bodies are exempt (they take no dynamic-stream space). Negative control on the same tree with only the bound removed: entities::presentation::tests::entity_pass_bounds_a_crowd_to_the_dynamic_stream_share fails at left: 0, right: 2 (nothing dropped, the stream overflows) - receipts/D123PackClientCore/logs/negative-control.log. Promoted on the harness crowd scene: the fix client d6102613bed0 submits 1244 of 1300 eligible bodies and reports dropped_over_budget 56 at 314688 stream vertices (crowd_stream_bounded true, client exit 0, gpu_completion true), and the control client 0ea6d25adb (only this row production hunks reversed) submits all 1300 at 328316 vertices with no dropped body and fails the scene at crowd_stream_bounded. Control and restore are one client commit apart, exactly this row non-test patch (delta patch-id 72026a55aed4); promoted as client:bee3b7cc2a, receipt docs/bugs/promotions/CLIENT-CROWD-STREAM-BUDGET-CRASH.json."
promotion = "docs/bugs/promotions/CLIENT-CROWD-STREAM-BUDGET-CRASH.json"
