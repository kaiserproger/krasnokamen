repro_check = "The check that would prove it: the registered unit ref run in a control tree that reverses b40b8d63's mirror-flag hunks (a client-test reversal or a pinned control client whose receipt carries that ref red), or a scene assertion on the UV winding itself (a per-layer digest that changes with the mirror flag, like the pufferfish pufferfish_layer_uv_digest), because an index or quad count cannot flip on a mirror flag."
