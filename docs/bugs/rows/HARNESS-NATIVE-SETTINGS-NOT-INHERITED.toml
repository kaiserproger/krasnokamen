[[bug]]
id = "HARNESS-NATIVE-SETTINGS-NOT-INHERITED"
title = "A native harness run took the operator's environment as a prepared managed-settings file and no receipt named the file or its content, so a gate could silently read a shared, mutable client-settings.json."
area = "harness"
repro = "source"
severity = "major"
status = "open"
source = "receipts/D123/D123Client/review/REVIEW-ReviewD123Client5-Opus-delta.md#b2 (review ReviewD123Client5, blocker B2)"
regression = ["python:tools.harness.test_harness:NativeLaunchEnvironmentTests.test_the_operator_environment_never_names_a_run_settings_file", "python:tools.harness.test_harness:NativeLaunchEnvironmentTests.test_a_prepared_settings_file_is_passed_explicitly", "python:tools.harness.test_harness:NativeLaunchEnvironmentTests.test_a_launch_never_inherits_the_data_roots_managed_settings"]
fix_commit = "patch:f7ec71337f2222ceeb8b72de1b066fff4b482e6b66795b4819a99381fc87c0cd"
repro_check = "The finding was a missing guard, not a missing fix: 49cc72655f gave every native run its own settings file and 0a96276952 (git blame -C -C, tools/harness/backends/native_client.py:207-208) made the prepared path an explicit launch input, dropped the operator's KRASNOKAMEN_CLIENT_SETTINGS and recorded the file's path and sha256 in the receipt. The guarding hunks at HEAD are promotions/../fix-patches/HARNESS-NATIVE-SETTINGS-NOT-INHERITED.patch (this row's fix_commit): exactly the two lines that stop reading the variable from the environment and use the explicit `settings` argument. Reversing them on the candidate keeps the signature and every call site intact and turns the two launch-environment refs red at their own assertions (the reversed body takes a named /home/owner/client-settings.json for the run and ignores the prepared path), while the pre-existing no-inheritance ref stays green; the restore on the candidate is green. Promote with `--fix-patch docs/bugs/fix-patches/HARNESS-NATIVE-SETTINGS-NOT-INHERITED.patch`."
