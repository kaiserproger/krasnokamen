[[bug]]
id = "HARNESS-CIV-GATE-OBSERVER-WAIT-HANGS"
title = "The civilization gate's building-scan observer waits unbounded for a console teleport whose landing the server clamps, so one miss spends the whole scenario deadline while the world completes the milestones."
area = "harness"
repro = "client"
severity = "major"
status = "open"
source = "Seed-24 civilization-seed-qa 20261124T170423-civilization-seed-qa-ra304fqf (pin 797d3892c9a5, windowed native client, 7253.8 s, deadline expired). The gate reached iron_smelted at sprint 1800 (furnace [132,78,-222], FurnaceMenu with an iron ingot in the output slot) and recorded 25 snapshots up to sprint 45 000; the last snapshot ends at elapsed 693 s. After it, civilization_seed_qa.building_blocks teleported the observer to the remote farm at [78,68,-320]..[84,72,-311] (requested point (81,75,-315.5)) and waited for the player to be within one block on x, y and z; the server left the observer on the field at (82.5, 69, -317), so the predicate could never hold. The transcript ends with 32 695 minecraft_wait_for_state_change calls in that one probe.wait, and the server log's last tick sprint finished is 17:18:06 while the run ended 19:05:17 (the server kept ticking at 20 tps to server tick 186 692). The world completed the milestones while the harness was stuck: settlement_birth tick 26 316 (17:11:53) and settlement_building_completed blueprint=house level=1 tick 99 816 (17:52:25), level=2 tick 123 272, level=3 tick 127 020, plus the lumber camp L1-L3 at ticks 55 064/56 976/75 144. None was observed: verdicts all false, milestones only iron_smelted."
failing_first = "reported"
regression = [
  "python:tools.harness.test_civilization_seed_qa:ObserverMoveTests.test_an_observer_that_never_lands_cannot_consume_the_scenario",
  "harness:civilization-seed-qa:all",
]
fix_commit = "patch:905567b164675a6b15a8885b0029ee1841c5eac30872715a32d3a1394a8d72a3"
repro_check = " A later abort on the same observation path (run 20261125T011226, 1790 s): the walk back from a capture failed with 'target is unreachable from the current loaded client position: 131, 76, -216' and aborted the gate. capture_target and capture_house now tolerate an unreachable walk back (console tp when a teleport exists, otherwise the next capture navigates from where the observer stands), because the observer's position only loads what the next capture reads.Fix 0236b9e2e0: move_observer compares the horizontal landing only (a teleport above a site lands on the ground the server picks, so an exact y is not a property of a successful move), closes any open menu before the move, and bounds each move at OBSERVER_MOVE_TIMEOUT = 30 s; building_blocks then scans regardless and records observer_teleported/observer_moved, so a failed move cannot hide a milestone. Negative control: the production hunks reverted alone on this tree (tools/harness/backends/civilization_seed_qa.py at HEAD, the new tests kept) makes test_an_observer_that_never_lands_cannot_consume_the_scenario fail at its own assertion 'None != False : a landing the server clamps is a recorded miss, not a hang' (the other two tests error on the absent move_observer; log receipts/D123/D123Civ/observer-fix-control.log). Green on the candidate: the three ObserverMoveTests pass. The gate proof is harness:civilization-seed-qa:all on a pinned candidate: the same run must observe new_house, births, second_building and iron_smelted instead of expiring in the observer wait."
