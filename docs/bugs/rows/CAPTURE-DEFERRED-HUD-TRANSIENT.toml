[[bug]]
id = "CAPTURE-DEFERRED-HUD-TRANSIENT"
title = "Screenshots and automation captures are deferred for the whole lifetime of any HUD animation, so a 10 s toast is never in the frame."
area = "client"
repro = "manual"
severity = "minor"
status = "fixed"
source = "Found while gating NATIVE-TOASTS-MISSING (2026-11-24): the retained overlay always carried the toast (448 vertices, layer-2 draw range covering them) yet native-toast failed toast_panel_appeared. The capture request was held by `UiState::animating()` = `anim.was_active`, which a live toast keeps true for its 10 s, so both shots (2 s and 18 s after Play) were taken after it expired. Any HUD transient - toast, hotbar selection slide - was equally uncapturable."
regression = [
  "harness:scene-shot:native-toast",
  "client:krasnokamen-client:ui::toasts::tests::capture_deferring_ignores_a_live_toast_in_play",
]
proving_assertions = { "harness:scene-shot:native-toast" = "toast_panel_appeared" }
failing_first = "not recorded (the red was read from the capture path, not from a failed assertion in a pre-fix build)"
fix_commit = "client:8a9ecaa678"
repro_check = "CONTROL 2026-11-24 on core 12dc478ed3: with the pre-fix client 10a9c5dee5 pinned, native-toast FAILS at toast_panel_appeared (20261123T215415-native-toast-ki79xsv8) - the two frames carry no toast panel (late panel 170 px of terrain silhouette only); with the fix client 8a9ecaa678 the frame shows the panel and the yellow title (20261123T215339-native-toast-nmjj7q5f, early panel 89615, late 0 inside the panel rect). The later client 37bdec7f3e narrows the same predicate to screen transitions only (exit fade, screen open window, hover/press/value easing); the hotbar slide and toasts no longer defer a capture."
promotion = "docs/bugs/promotions/CAPTURE-DEFERRED-HUD-TRANSIENT.json"
