# Narrow form only (Opus design verdict review/REVIEW-ReviewD123BattleDesign-Opus-perf.md section 3):
# a binary_search_by insert in UnitCounters::record and in TargetGrid::rebuild, both probing through the
# one shared faction_cmp, so the registered test counts real comparisons; the per-faction loop of
# nearest_enemy/any_enemy is untouched because its visit order is observable.
# Fix landed in 5f3415769, contained in this tree; the patch is its non-test hunks at HEAD, map
# docs/bugs/promotions/BATTLE-FACTION-LOOKUP-QUADRATIC.hunks.md
fix_commit = "patch:b9c433bd7895940c376ebad7977b3295450639e04cb9dfafe2d42910ebec51be"
repro_check = "Inspect battle/mod.rs population counting: linear faction lookup per body and PopulationCache::sample over the whole faction population yield N(N-1)/2 comparisons per sample for N distinct factions; targeting.rs nearest_enemy also visits every faction. Faction is u16, not limited to two sides. TPS impact has not been measured. The registered test pins the faction comparisons per sample and per rebuild at F=64 to ceil(log2(len+1))+1 (at most 9 per unit) through the shared faction_cmp; the residual per-faction loop of a retarget stays O(F)."
