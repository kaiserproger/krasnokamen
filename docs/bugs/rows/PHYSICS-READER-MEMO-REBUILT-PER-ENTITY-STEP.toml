source = "receipts/Books/REPORT-R2.md finding R2-5 (Bakhvalov 8.1, Drepper; perf). crates/mc-core/src/world.rs PhysicsReader caches the last chunk and the last 16-high section and documents that it is never retained across entity steps; tick/entity_phase.rs step_entity starts with let reader = ctx.world.physics_reader(); the probe is inlined into PhysicsReader::block_at (2.21 % self in the measured leg). Verified open on main 5bdc02911. Fix: rows.par_iter().map_init(|| ctx.world.physics_reader(), |reader, row| ...) (or for_each_init), one reader per rayon worker; the type is Cell-based and single-owner and the world is immutable during the phase (world.rs states the invariant); keep the warm-versus-fresh reader test (world_tests.rs:1476-1490). Measure by wall-clock A/B of the entity phase and l1_data_cache_fills_from_memory."
