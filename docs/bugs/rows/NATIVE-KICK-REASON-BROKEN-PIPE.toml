[[bug]]
id = "NATIVE-KICK-REASON-BROKEN-PIPE"
title = "A duplicate-login kick of an incumbent in the Nether can show 'Broken pipe (os error 32)' on the native client instead of the kick reason the server sent."
area = "client"
repro = "client"
severity = "minor"
status = "open"
source = "BreakJoinRows 2026-11-12 (receipts/BreakJoinRows/FINDINGS.md F5, 1/2, BREAK_DL_ATTACK=nether); the server log shows 'You logged in from another location' was sent."
regression = ["client:krasnokamen-client:protocol::network::tests::kick_reason_survives_a_failed_client_write", "client:krasnokamen-client:protocol::network::tests::kick_published_before_the_writer_ends_is_not_replaced_by_a_queue_error", "harness:entities:native-v2-duplicate-login"]
failing_first = "reported"
fix_commit = "client:900da0990290bcde145e00696f26a2126304187c"
repro_check = "REOPENED 2026-11-25 (review M1) and re-attempted the same day. The SIGSTOP kick fault was measured and rejected: stopping the incumbent around the duplicate login makes the server close a connection that still holds unread client packets, Linux answers with RST, and the RST discards the kick packet itself, so the FIXED client also loses the reason (20261125T004925 red at kick_reason_preserved with Connection reset by peer, 20261125T005003 green). A variant that keeps the packet has no queued write to fail, and the scene cannot queue a session send while the client is in its error phase (the second half of the fix), so no external fault reproduces the row ordering. Evidence: notes/kick-sigstop-experiment.md. Exact missing proof stays: a deterministic fault in which the client outbound write fails after the kick packet is decodable, e.g. a socket-level write-half shutdown the harness cannot perform. fix_commit stays client:900da09902. Remaining proof, measured 2026-11-26: no external fault reproduces the row's ordering (the SIGSTOP experiment 20261125T004925 loses the kick packet itself; a shutdown FIN lets the server close before the kick). The deterministic route is an application-level outbound-write fault: while armed, every packet write fails with the OS EPIPE text and the socket plus its inbound stream stay alive, so the pre-fix client ends with 'Broken pipe (os error 32)' while the fixed client latches the failure, keeps reading and preserves the server's kick reason. That seam is implemented in the client tree (wt/D123PackHarnessRowsClient, uncommitted: catalog minecraft_inject_network_fault, lib.rs intercept, protocol::network::fail_outbound_writes + unit test) but not yet durable: it needs (a) the core scene to arm it before the duplicate login (tools/harness/backends/native_duplicate_login.py, the nether kick block), (b) a committed reversal pair over the existing 7c9e8472/900da099 hunks with the seam present in both sides (C0 = tip + seam, R = C0 + reverse of the fix, F = R + re-land), (c) client pins for R and F, (d) the red/green receipt pair and ledger promote with proving_assertions kick_reason_preserved. None of (a)-(d) was run; the row stays open with fix_commit client:900da099 as the historical fix."
proving_assertions = { "harness:entities:native-v2-duplicate-login" = "kick_reason_preserved" }
