repro_check = "Fix: client:5ef71d56 (2026-10-29, pre-rename, so its parent cannot be pinned; its hunks no longer reverse-apply - receipts/XClientControl/negctl/hc23-reverse-apply-failures.log). Pair: client:0941d0948f (reversal - the native_item_key dispatch call site removed from App::dispatch_binding) -> client:45ef47e3cc (re-land, the row fix_commit); native_item_key stays because the kept controls/inventory tests call it, every other hunk is another surface, reason (c) or a test hunk, all mapped in promotions/HC-2.hunks.md, and the swap-while-carrying guard the same commit added is split into HC-2-SWAP-WHILE-CARRYING. Receipts: control 20261124T040917-native-v2-input-menus-gt72wr88 red at survival_number_1_moves_hovered, restore 20261124T040942-native-v2-input-menus-6u9gpufl passed, promote 20261124T042035-ledger-promote-tn9modnw; promotions/HC-2.json. Cause of the digit-2 step this pair first hit (2026-11-24, review ReviewD123Client5 B1): not an inherited operator habit - the client's own unit test controls_native_dispatch_uses_rebound_mouse_button (src/controls_tests.rs) captured Mouse(Middle) for hotbar_2, and save_client_settings wrote that into the machine's real client-settings.json on every cargo test of the client. Bindings::action maps one input to one action, so a physical Digit2 press then resolved to no action and every later game on that host lost the 2 key. Row CLIENT-SETTINGS-TEST-POLLUTION isolates the test; the harness gives each run its own settings file, no longer takes an operator KRASNOKAMEN_CLIENT_SETTINGS as a prepared one, and records the file's sha256 (row HARNESS-NATIVE-SETTINGS-NOT-INHERITED). The scene's creative half carries the separate open row CLIENT-CREATIVE-PLACEMENT-DROPPED; it cannot move this row's red, because the scene stops at the first failure and the survival numbers run first."
