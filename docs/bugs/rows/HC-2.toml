[[bug]]
id = "HC-2"
title = "Physical container 1-9/F/Q presses never reach the hovered-slot actions: the inventory key dispatch was missing, so a number press left the hovered stack in place. The swap-while-carrying half is HC-2-SWAP-WHILE-CARRYING; the creative QA5 residual is separate."
area = "client"
repro = "source"
severity = "major"
status = "open"
source = "/run/media/kaiserroman/games/solaris-work/BUGS.md#HC-2"
regression = ["harness:entities:native-v2-input-menus", "client:krasnokamen-client:ui::inventory_input_tests::inventory_native_number_keys_and_offhand_swap_hovered_stack", "client:krasnokamen-client:ui::inventory_input_tests::inventory_native_q_and_control_q_throw_hovered_items", "client:krasnokamen-client:ui::inventory_input_tests::inventory_native_shortcuts_preserve_gameplay_and_ignore_releases", "client:krasnokamen-client:ui::inventory_input_tests::hovered_hotbar_swap_reconciles_server_rejection", "client:krasnokamen-client:ui::inventory_input_tests::inventory_swapping_while_carrying_does_not_change_slots", "python:tools.harness.test_harness:NativeLaunchEnvironmentTests.test_a_launch_never_inherits_the_data_roots_managed_settings"]
proving_assertions = { "harness:entities:native-v2-input-menus" = "survival_number_1_moves_hovered" }
fix_commit = "client:45ef47e3cc"
repro_check = "The fix came with client:5ef71d56 (2026-10-29, pre-rename, so its parent cannot be pinned) and its hunks no longer reverse-apply (receipts/XClientControl/negctl/hc23-reverse-apply-failures.log). The pair is client:0941d0948f (reversal: the `native_item_key` dispatch call site removed from `App::dispatch_binding`) -> client:45ef47e3cc (re-land, the row fix_commit); `native_item_key` itself stays because the kept controls/inventory tests call it, and every other hunk of the commit is another surface, reason (c) or a test hunk, all mapped in promotions/HC-2.hunks.md. The swap-while-carrying guard the same commit added is split into HC-2-SWAP-WHILE-CARRYING (reason (a) in the map). Control and restore receipts on the candidate core tree are recorded in promotions/HC-2.json. BLOCKER 2026-11-24: the pair is committed (0941d0948f -> 45ef47e3cc) and the control reds exactly survival_number_1_moves_hovered (20261124T024831-native-v2-input-menus-9mf2wzy9, 21 s), but the registered scene cannot carry the restore: on the re-land AND on the untouched tip c9814263c3 native-v2-input-menus fails survival_number_2_moves_hovered (20261124T024857-native-v2-input-menus-5t3oc_z7 and 20261124T025051-native-v2-input-menus-2dtu1jbf; snapshot: slot 9 still holds 12 diamonds, carried empty - the second press is never applied). The same scene passed on client e32052ade6 in 20261124T023354-era runs, so the number_2 step (or its hover state after the number_1 return) is unreliable on this tree; the row stays open until that step is fixed or an assertion that does not depend on it exists. DIAGNOSIS 2026-11-24: not a client regression between e32052ade6 and the tip - the identical pin pair (client e32052ade6 + server 1cc8a6288897/dbeaf821) passes at 20261123T233548 and fails at 20261124T025415, and all later clients fail the same step. Forcing the hover before each press and pressing 2 FIRST both still fail (temporary scene edits, reverted), so the 2 press never produces a swap even before any 1 interaction; 1 works every time. Next: instrument UiState key handling for digit 2 or the owned Xvfb keymap for digit 2. DECISIVE 2026-11-24: with the loop reordered to press 3 then 1 then 2 (temporary edit, reverted), number_3 and number_1 pass and only number_2 fails (20261124T025830-native-v2-input-menus-8j6ua0pe). Digits 1 and 3 therefore deliver and swap correctly; the digit-2 key specifically never yields a swap, in every client pin tried. RESOLVED 2026-11-24 (D123ClientD): the digit-2 step was never a client defect. The runs inherited a managed client-settings.json whose hotbar_2 was rebound to the middle mouse button (receipts/D123/D123Client/negctl/contaminated-client-settings.json, sha256 5e7c746ce709897d…; the same rebind has sat in ~/.local/share/krasnokamen-client/client-settings.json since 2026-11-15 06:27, sha256 3482e9567270c1ea…, which is the data root a run gets when XDG_DATA_HOME is not pinned). Bindings::action is a reverse map from one input to one action, so with hotbar_2 on the middle button a physical Digit2 press resolved to no action at all: an instrumented build (uncommitted KEYDBG lines in src/lib.rs and src/ui/state.rs) logs `window code=Digit2 pressed=true repeat=false focused=true screen=inventory` with NO `action=` line, while Digit1 logs `action=hotbar_1`, then `ui key=1 node=slot/9 pointer=[141.3,129.0]` and `execute key=1 result=Ok(()) new_commands=1` (run 20261124T031557-native-v2-input-menus-40qdrf3h). With a fresh settings file the same instrumented client passes every number step in both modes (20261124T032332-native-v2-input-menus-n3e0zst6, 20261124T033435-native-v2-input-menus-ju2fz7j0). The harness now gives every native run its own settings file so a saved rebind cannot change a gate again (tools/harness/backends/native_client.py launch_environment; unit ref python:tools.harness.test_harness:NativeLaunchEnvironmentTests.test_a_launch_never_inherits_the_data_roots_managed_settings, whose red control deletes the two guard lines and sees an assertion failure). The scene's creative half carries a SEPARATE open defect, CLIENT-CREATIVE-PLACEMENT-DROPPED: its placement click is release-driven and is silently dropped on some runs, so a restore receipt is a passed run of the whole scene and may need a re-run; the control's red is survival_number_1_moves_hovered, which the creative half cannot influence (the scene stops at the first failure, and the survival numbers run first)."
