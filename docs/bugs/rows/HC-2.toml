repro_check = "The fix came with client:5ef71d56 (2026-10-29, pre-rename, so its parent cannot be pinned) and its hunks no longer reverse-apply (receipts/XClientControl/negctl/hc23-reverse-apply-failures.log). The pair is client:0941d0948f (reversal: the `native_item_key` dispatch call site removed from `App::dispatch_binding`) -> client:45ef47e3cc (re-land, the row fix_commit); `native_item_key` itself stays because the kept controls/inventory tests call it, and every other hunk of the commit is another surface, reason (c) or a test hunk, all mapped in promotions/HC-2.hunks.md. The swap-while-carrying guard the same commit added is split into HC-2-SWAP-WHILE-CARRYING (reason (a) in the map). Control and restore receipts on the candidate core tree are recorded in promotions/HC-2.json. BLOCKER 2026-11-24: the pair is committed (0941d0948f -> 45ef47e3cc) and the control reds exactly survival_number_1_moves_hovered (20261124T024831-native-v2-input-menus-9mf2wzy9, 21 s), but the registered scene cannot carry the restore: on the re-land AND on the untouched tip c9814263c3 native-v2-input-menus fails survival_number_2_moves_hovered (20261124T024857-native-v2-input-menus-5t3oc_z7 and 20261124T025051-native-v2-input-menus-2dtu1jbf; snapshot: slot 9 still holds 12 diamonds, carried empty - the second press is never applied). The same scene passed on client e32052ade6 in 20261124T023354-era runs, so the number_2 step (or its hover state after the number_1 return) is unreliable on this tree; the row stays open until that step is fixed or an assertion that does not depend on it exists. DIAGNOSIS 2026-11-24: not a client regression between e32052ade6 and the tip - the identical pin pair (client e32052ade6 + server 1cc8a6288897/dbeaf821) passes at 20261123T233548 and fails at 20261124T025415, and all later clients fail the same step. Forcing the hover before each press and pressing 2 FIRST both still fail (temporary scene edits, reverted), so the 2 press never produces a swap even before any 1 interaction; 1 works every time. Next: instrument UiState key handling for digit 2 or the owned Xvfb keymap for digit 2."
