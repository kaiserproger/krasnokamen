repro_check = "WITHDRAWN 2026-11-25 after the Opus code review (receipts/D123/D123ClientModel/REVIEW-CODE-1-Opus.md): the promoted assertion guardian_minus_bee >= 350 does not test the row's symptom - the +180 guardian indices come from the head (1 -> 5 cubes) and tail2, while the twelve spikes were present in the pre-image with pivots inside the body; and the bee term was inverted (78 -> 54 quads, so a tree with the baby bee's legs REMOVED passed more easily). The row also shared native-rig-parity with MODEL-OPUS-11, whose allay span check runs first and masked it, and the fixture checks came after the row checks. Narrowed 2026-11-25 to what this lane can witness: the guardian rig (head plates, spikes, tail fin) and the baby bee. Hoglin, strider, rabbit/fox/panda/vex and the horse family moved to their own rows (MODEL-OPUS-10-HOGLIN, MODEL-OPUS-10-STRIDER, MODEL-OPUS-11-RABBIT-FOX-PANDA-VEX, MODEL-OPUS-11-HORSES). Corrected proving ref: `native-rig-guardian` (its own scene, its own check, fixture checks first, one species per shot), assertion `guardian_spikes_and_bee_legs_submitted` = guardian EntityCutout 792 indices (22 cubes, from the vanilla dump minecraft:guardian#main), baby bee 324 (9, minecraft:bee_baby#main) AND the guardian's own cutout bbox height in 1.44..1.53 blocks. The height term is derived from the dump, not fitted: with the client's bone convention (pivot relative to parent, rotation Z then Y then X) the dump's spikes put the guardian's vertices between y = 4.03 px and 27.89 px (1.4912 blocks, both bounds are spike tips; a spike-less rig reads 1.0). A lateral bbox term was computed and rejected: the pre-image's spikes reach x = 1.5017 against the fix's 1.4841, so the width cannot witness the pivot claim. Pair to run: client control e3678206 (the rig fix 92dcb25d reversed at the tip) vs fix 3bfbd7b6, on a server pinned at the harness commit that carries this check. NOTE the pair must be re-taken on CM-4 client binaries: the layer summary is now the