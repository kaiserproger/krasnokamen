[[bug]]
id = "SETTLEMENT-ROAD-STALL-HOLDS-SLOT-TRIAL4"
title = "A settlement road project stays Running with no progress for 78,000 ticks and holds the only construction slot, leaving the owner upgrade queued"
area = "gameplay"
repro = "source"
severity = "major"
status = "fixed"
source = "UpgradeProof D18 harness on the retained trial-4 world (receipts/UpgradeProof/HANDOFF.md, logs/after-final.log), trees d7fd00e64 and 94968fcc6a alike: road level 1 at state=Running stage=0 work=34 consumed=0 pause=None from tick 304153 to 382153, so a funded owner upgrade order remains Queued{busy} for the observation. Same symptom family as CIV-SEED24-ROAD-CLEAR-STALL, but that row's fix 2b8219d1 (fence-post stand) is an ancestor of 94968fcc6a, so it does not cover this stall. Cause (SlotStall, receipts/SlotStall/README.md, native retained-world probe on copies at ab2d945c9): the construction stall watch only rotated Builders and reached retry_preparation only for a protected tree in a clear stage, so a rotation that kept picking residents who could not reach the worksite held the only slot forever. Shape A, trial-4: road Running work=34/42 consumed=0 for 24,000 ticks, settlement_construction_stalled cause=worksite_unreached recovery=builder_released at tick 308521, then recovery_failed at 311521 and nothing more; 7 of 8 residents float in the one-cell water basin beside the bell (SETTLEMENT-RESIDENTS-TRAPPED-IN-PLAZA-BASIN), so every rotation picks a trapped Builder. Shape B, growth-03ef2e297a72-laptop-2: perimeter Prepared work=0/24 the same way; its Builders carry the cobblestone but get no worksite target (SETTLEMENT-WALL-STRETCH-WITHOUT-STAND). The other Prepared scan hits never stall when ticked: fast-ab/pin, fast-ab/frames12 and LedgerSplit base-tail start at the morning shift, PreparedLaunchFix real-gait has a frozen clock (day_time 18000). Fix: at the repeated-stall window unpaid work (nothing consumed) is cancelled through retry_preparation (owner order requeued when no newer order is pending); on the fixed tree both copies log recovery=preparation_cancelled and the slot frees, so a queued owner order is admitted at the next planning pass. Paid work keeps rotating Builders."
regression = [
  "cargo:mc-core:settlements::construction::stall_tests::an_unpaid_road_that_stops_running_gives_back_the_slot_after_a_failed_rotation",
  "cargo:mc-core:settlements::construction::stall_tests::an_unpaid_project_that_never_starts_gives_back_the_slot_to_the_queued_order",
]
failing_first = "reported"
fix_commit = "85e10283e4b29cfa9854a79d39fc5eeef4993161"
promotion = "docs/bugs/promotions/SETTLEMENT-ROAD-STALL-HOLDS-SLOT-TRIAL4.json"
