repro_check = "Measured and re-classified as NOT a defect by the Opus review of 2f9d54521 (2026-11-25) and re-read on the Integ1 tree: the certificate box is the enclosed hull by construction, not the level's full extent. `house.json` level 3 is 11x9x8 with cert [11,5,7] (identical to level 2), and its 8th z row is an open porch, not a wall row: y=0 one `oak_stairs` step, y=1 two `oak_stairs`, y=2 six open `oak_trapdoors` (shutters), y=3 three inverted `oak_stairs` with two `wall_torch` lights, y=4 the eave beam - there are no posts and no planks in it, so nothing there closes an enclosure (the south wall stands on z=6, `LccDccLcccL` at y=1). The height is likewise shorter (cert 5 against 9 layers), which the same premise would call a second gap. The gate certified level 3 as built (`house.L3_upgrade` and `house.L3_blockmatch` PASS, 20261125T175716). The pinned test `the_house_certificate_boxes_match_the_footprints_they_inspect` documents the difference and stays as a blueprint-data guard. The row needs an owner decision to close; no data changes."
