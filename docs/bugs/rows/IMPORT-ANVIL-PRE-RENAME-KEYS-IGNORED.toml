[[bug]]
id = "IMPORT-ANVIL-PRE-RENAME-KEYS-IGNORED"
title = "Anvil import keeps pre-rename solaris:* entity keys as unread data and reports no gap"
area = "gameplay"
severity = "major"
status = "fixed"
source = "RC5WorldConversion 2026-11-14 (receipts/RC5WorldConversion-rc5/REPORT.md, export-rc5.json, import-main2.json, export-main2.json): an RC5-line world exported with `world export-anvil` carries solaris:* keys on every entity (solaris:WireId, entity_loot, solaris:PortalTime, ...) and on player data; main 57324da4 `krasnokamen world import-anvil` keeps them as unread extra fields and re-exports them verbatim, reads only krasnokamen:* keys, and reports known_gaps=[] with no warning. The rider case was shown only with an injected solaris:Rider naming a mob, which RC5 itself refuses (RC5 mounts/persistence.rs:270-282), so a lost rider from a valid RC5 world is not demonstrated."
repro = "source"
repro_check = "Control (patch mode, kept API): docs/bugs/promotions/IMPORT-ANVIL-PRE-RENAME-KEYS-IGNORED.patch (patch:004791584d3f) carries 7df454ee1's six import-wiring hunks at their HEAD paths (the stats.pre_rename.rename calls in import.rs, now Owner-typed) plus the open_refusal message; reversing them leaves pre_rename.rs, lib.rs's mod/field and the receipt blocks compiled (kept API, class (b) in docs/bugs/promotions/IMPORT-ANVIL-PRE-RENAME-KEYS-IGNORED.hunks.md) but imports no pre-rename field, so the kept ref reds at its own receipt assertion (pre_rename_tests.rs:418, pre_rename_keys absent) and the later rider/export assertions. The fix tree itself (7df454ee1) still does not build under the current dependency set; the control does, because it runs on the candidate tree. The earlier patch:8e2d0965 stub a/-side was synthetic and stays withdrawn."
regression = ["cargo:mc-world-conversion:pre_rename::tests::rc5_export_with_a_player_rider_keeps_its_fields_and_the_rider"]
fix_commit = "patch:004791584d3fe3ad556dce4cb22b04fc26c386985eeae8bab677be1dac4bec8c"
