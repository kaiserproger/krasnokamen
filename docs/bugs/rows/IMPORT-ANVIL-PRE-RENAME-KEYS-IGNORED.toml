repro_check = "fix in tree unpromoted; the control was rejected by review. 7df454ee1 is real (pre_rename.rs added as a new module plus its import/lib wiring), but its tree does not build under the current dependency set (predicates Evaluator::conditions, E0599; .analysis/validation/20261123T184749-ledger-promote-qna1vwpj) and reversing the module on HEAD removes the API the kept test drives through import_anvil, so no red-by-assertion control exists that keeps the real code. The earlier patch:8e2d0965 stub a/-side was synthetic and is withdrawn together with its receipt; its red landed on a counter the stub zeroed by construction. The ref is green on the candidate (grouped import/mount proof .analysis/validation/20261123T162541-test-iqg03tu_, 3/3)."
