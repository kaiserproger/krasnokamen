id = "IMPORT-ANVIL-PRE-RENAME-KEYS-IGNORED"
title = "Anvil import keeps pre-rename solaris:* entity keys as unread data and reports no gap"
area = "gameplay"
severity = "major"
status = "fixed"
source = "RC5WorldConversion 2026-11-14 (receipts/RC5WorldConversion-rc5/REPORT.md, export-rc5.json, import-main2.json, export-main2.json): an RC5-line world exported with `world export-anvil` carries solaris:* keys on every entity (solaris:WireId, entity_loot, solaris:PortalTime, ...) and on player data; main 57324da4 `krasnokamen world import-anvil` keeps them as unread extra fields and re-exports them verbatim, reads only krasnokamen:* keys, and reports known_gaps=[] with no warning. The rider case was shown only with an injected solaris:Rider naming a mob, which RC5 itself refuses (RC5 mounts/persistence.rs:270-282), so a lost rider from a valid RC5 world is not demonstrated."
repro = "source"
repro_check = "Control (patch mode, kept API): docs/bugs/promotions/IMPORT-ANVIL-PRE-RENAME-KEYS-IGNORED.patch (patch:166abc985f12) carries 7df454ee1's import-facing hunks at their HEAD paths - the six stats.pre_rename.rename calls in import.rs (now Owner-typed), the ConversionStats.pre_rename field and the receipt blocks in lib.rs (callers of the module outside the carried hunks), and the open_refusal message. Reversing it leaves pre_rename.rs compiled and imported (mod pre_rename survives, class (b): the kept ref runs pre_rename::tests) but nothing renames or reports, so the kept ref reds at pre_rename_tests.rs:418 with left None, right Some(4) - the receipt value the row names ('reports no gap'); the test stops there, later rider/export assertions are not reached and are not claimed. Measured on the reversed tree before the promote (.analysis/codex-logs/import-control2/run.log) and again by the promote. The fix tree itself (7df454ee1) still does not build under the current dependency set; the control runs on the candidate tree. The earlier patch:8e2d0965 stub and the superseded first control (patch:00479158, promotion 20261125T220349) are withdrawn where they conflict; that receipt stays as evidence."
regression = ["cargo:mc-world-conversion:pre_rename::tests::rc5_export_with_a_player_rider_keeps_its_fields_and_the_rider"]
