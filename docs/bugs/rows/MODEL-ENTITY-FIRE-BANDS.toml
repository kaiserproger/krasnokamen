rite = textures[band % 2] mirrored in u when (band / 2) % 2 == 0, and EntityRenderDispatcher.submit rotates with Mth.rotationAroundAxis(Y_AXIS, camera.orientation) - the CAMERA's yaw. The sprite parity and the camera rotation stay unit-covered and are NOT witnessed by this pair (both halves submit one EntityFire layer and the plane looks the same), which is why this row's proving assertion is the span alone. Hunk map: docs/bugs/promotions/MODEL-ENTITY-FIRE-BANDS.hunks.md."
