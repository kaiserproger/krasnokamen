3, sprite = textures[band % 2] mirrored in u when (band / 2) % 2 == 0, and EntityRenderDispatcher.submit rotates with Mth.rotationAroundAxis(Y_AXIS, camera.orientation) - the CAMERA's yaw. The 2026-11-25 client fix (presentation.rs append_entity_fire) corrected the rotation source and the sprite parity; those two are unit-covered and NOT witnessed by this pair (one layer, the plane looks the same), which is why this row's assertion is the span alone. The pair above was taken on an older server pin; re-run both halves on the pinned tree that carries this row."
