  "harness:battle-dismount:battle-live-dismounted-rider-walk","cargo:mc-core:battle::cavalry::tests::a_dismounted_rider_keeps_his_foot_drive_under_a_chase", "cargo:mc-core:battle::cavalry::tests::a_dismounted_rider_keeps_his_foot_drive_under_a_flank", "cargo:mc-core:battle::cavalry::tests::a_rider_whose_horse_dies_walks_from_the_next_battle_tick"]
failing_first = "reported"
fix_commit = "9176f32745de0bb4933212569efa643f0ec68874"
repro_check = ["Fix 9176f3274 is in tree and its three cargo refs are green. Missing proof: the registered graphical scene `battle-live-dismounted-rider-walk` (SWEEP-MANIFEST.md: a cavalry husk whose horse dies mid-charge, 100 ticks, ground speed <= walk speed) and its passed receipt on the promotion tree; the client must be in play, which no cargo test produces.",
  "Blocker 2026-11-25 (D123BattleL): no scene `battle-live-dismounted-rider-walk` is registered (only the two battle-live scenes exist), but the machinery is there - the console accepts `kill <uuid>` and battle_recovery.battle_rearm_recovery already kills a horse at a real windup, and per-tick positions come from the WAL publication - so this row is a scene build plus a control reversing 9176f3274, not an external blocker.",

  " Scene built 2026-11-25 (D123BattleL) and registered as harness:battle-dismount:battle-live-dismounted-rider-walk (proving_assertions=dismounted_rider_keeps_walk_speed): it kills the horse of a rider whose horse is moving at charge speed and measures his own blocks/second over the next 100 published ticks. Candidate green (091149, 14.36 blocks/s horse -> 0.0 after). CONTROL DOES NOT FLIP: the reversed guard (head minus the seated check, 11 lines) passed 3/3 (091754 0.39 blocks/s, 091917 0.0, 092044 pass), because the sampled rider is not driven by a live sweep plan. Exact need: select a rider whose regiment has an active plan (expose the sweep plan in the published image, or read it from the console) so the pre-image raw-heading drive is exercised.",
]
