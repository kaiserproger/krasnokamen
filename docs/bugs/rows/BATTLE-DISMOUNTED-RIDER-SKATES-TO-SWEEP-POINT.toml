[[bug]]
id = "BATTLE-DISMOUNTED-RIDER-SKATES-TO-SWEEP-POINT"
title = "A cavalry husk whose horse died skates across the battlefield at 45-107 blocks per second toward its regiment's sweep point"
area = "gameplay"
severity = "major"
status = "open"
source = "BattleJitterClient diagnosis 2026-11-17 (receipts/BattleYawHold/RIDER-FLING.md): wire recordings of six field-1k battle takes, two before and four after the yaw fix, a per-tick server probe and the source. Every wire position step above 2 blocks per 3-tick packet but one horse knockback belongs to a dismounted cavalry husk (3-51 per take, up to 10.9 blocks per packet, 2 entity_position_sync packets in one take); the vanilla client draws them as a 3-tick glide, so the body visibly skates. Cause: battle/cavalry.rs sweep_drives wrote the raw sweep heading, a displacement in blocks, as the drive of every untargeted steady member of a sweeping mounted regiment; only the mounted pass turns it into a horse speed, so a rider whose horse died kept it as his own drive in blocks per second and covered 1/20 of the distance to the plan point every tick (server probe: consecutive-tick step ratio 0.950, up to 5.34 blocks/tick). Fix: only members seated on their own native row take the plan heading; the others keep the steering foot drive (independent design review receipts/BattleYawHold/REVIEW-DESIGN-sweepseat-astra.md). Take acceptance (FinalCampaign RUNBOOK 6b, client wire-recorder receipt, never a probe-patched binary): dismounted steps above 2 blocks per packet = 0 on at least three takes of the unmodified final pin whose wire shows at least N_min really dismounted bodies moving untargeted, with N_min from the fling rate of such bodies on a skip-reverted control pin, which must reproduce the fling on one of them."
repro = "client"
regression = ["cargo:mc-core:battle::cavalry::tests::a_dismounted_rider_keeps_his_foot_drive_under_a_chase", "cargo:mc-core:battle::cavalry::tests::a_dismounted_rider_keeps_his_foot_drive_under_a_flank", "cargo:mc-core:battle::cavalry::tests::a_rider_whose_horse_dies_walks_from_the_next_battle_tick"]
failing_first = "reported"
fix_commit = "9176f32745de0bb4933212569efa643f0ec68874"
repro_check = ["Fix 9176f3274 is in tree and its three cargo refs are green. Missing proof: the registered graphical scene `battle-live-dismounted-rider-walk` (SWEEP-MANIFEST.md: a cavalry husk whose horse dies mid-charge, 100 ticks, ground speed <= walk speed) and its passed receipt on the promotion tree; the client must be in play, which no cargo test produces."]
