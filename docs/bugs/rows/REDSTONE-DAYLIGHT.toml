repro_check = "control: da5421f7b's single hunk still reverses on HEAD (`git show da5421f7b -- crates/mc-core/src/redstone/mod.rs | git apply -R --check`); with it reversed the detector keeps power 15 after an explicit wake, so the ref reds at its own `power == \"10\"` (`crates/mc-core/src/redstone/gap_tests.rs:203`). Thunder expectation derived from vanilla 26.3 itself (server-26.3.jar javap): `DaylightDetectorBlock.updateSignalStrength` takes `Level.getEffectiveSkyBrightness` = max(skyLight - skyDarken, 0); `Level.updateSkyBrightness` sets skyDarken = (int)(15 - SKY_LIGHT_LEVEL); `WeatherAttributes` alpha-blends SKY_LIGHT_LEVEL toward 4.0 with alpha 0.3125 (rain) and 0.52734375 (thunder, the rain alpha compounded with itself). Full rain and thunder at noon: 15 + (4-15)*0.52734375 = 9.19921875 -> skyDarken 5 -> effective 10 -> round(10*cos 0) = 10. So 10 is vanilla's value and the bare 15 was the defect. No client gate can discriminate: weather levels ramp 0.01/tick (~100 ticks), and the pre-image's own 20-tick periodic recheck resamples before the levels settle (the ref `redstone::tests::daylight_detector_periodically_resamples` is green on both trees), so the honest proof is the ref through the real tick path."
