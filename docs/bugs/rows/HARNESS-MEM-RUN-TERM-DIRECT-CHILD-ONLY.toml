  "python:tools.dev.test_mem_run_term:CancelledScopeTests.test_a_term_honouring_child_ends_the_scope_before_the_escalation",
  "python:tools.dev.test_mem_run_term:CancelledScopeTests.test_a_cargo_scope_takes_no_token_and_ends_on_cancellation",
  "python:tools.dev.test_reserve_cpus:MemRunReservationTests.test_a_non_numeric_cancel_grace_is_named_before_the_scope_starts",
]
