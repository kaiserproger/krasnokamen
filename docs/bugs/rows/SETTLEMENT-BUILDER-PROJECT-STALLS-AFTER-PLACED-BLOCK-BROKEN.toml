repro_check = "HEAD-adapted control at docs/bugs/promotions/SETTLEMENT-BUILDER-PROJECT-STALLS-AFTER-PLACED-BLOCK-BROKEN.patch (patch:470330e2, six hunks, a real pre-image: `if !paused {` at the recover entry plus pure deletions). It is HEAD-adapted twice: `recover`'s head carries the upgrade-cell scan, and this lane's second pack rewrote the `finish_project` text the sixth hunk anchored on (the shared `certificate_bounds` helper replaced the refusal warnings), so the same six removals are re-anchored on the current text - the delta against patch:b15befd9 is context only. Re-promoted on 1f695d4b25: the reversed control tree's three cargo refs red at `construction did not finish` (`construction_fencing_tests.rs:385`, the line named in `proving_assertions`) and its house gate reds `house.broken_cell_replaced` - the L1 stage's injected break is never re-placed, the flow records `_verdict(sub, \"broken_cell_replaced\", \"FAIL\", ...)` before `probe.check` raises (a verdict with no level prefix cannot be classified from an assertion name alone), and the L1 certificate never appears. The candidate gate 20261125T175716-buildings-qa-s1_5wshf has all four refs PASS, and the promotion (20261125T231226, artifact .analysis/validation/20261125T231226-ledger-promote-rujrikx1) records the four reds against the candidate's four greens."
