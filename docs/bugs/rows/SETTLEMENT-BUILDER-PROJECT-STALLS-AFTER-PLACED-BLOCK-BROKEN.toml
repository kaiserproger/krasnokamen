[[bug]]
id = "SETTLEMENT-BUILDER-PROJECT-STALLS-AFTER-PLACED-BLOCK-BROKEN"
title = "A player breaking an already-placed cell of an active Builder project leaves a hole that is never re-placed: House L1 stays active at 250/250 and holds the settlement's project slot"
area = "gameplay"
repro = "client"
severity = "major"
status = "fixed"
source = "Issue1Breaker (qa-breaker) on main fa637b84, receipts/Issue1Breaker/REPORT.md 'Actual player site interference' (1/1): on a copy of an active House L1 world at [122,69,-5], a survival-mode real native client broke the already-placed corner [122,70,-5] (oak_log[axis=y]) at 88/250; the block read air, work continued to 160/250 with the corner still air, and after a copied-world restart the project stayed active at 250/250 with the cell air across eight 200-tick observations (wt/Issue1Breaker/.analysis/validation/20261113T075452-scene-shot-o4m1dbb1, 20261113T075614-scene-shot-ca1o3e5m; retained under receipts/Issue1Breaker retained/player-site-break and retained/player-break-followup). docs/settlements/construction.md#builders-and-supplies says already placed cells are not re-planned after a foreign edit, so the project can never pass its geometric certificate and blocks further construction. A foreign SOLID block in a placed cell (operator diamond at the same corner) still certifies, which that rule documents and is not this defect. Expected: Builders re-place an authored cell that a foreign edit emptied, and the project finishes."
regression = ["cargo:mc-core:settlements::construction::fencing_tests::a_placed_cell_broken_to_air_is_replaced_before_the_house_certifies", "cargo:mc-core:settlements::construction::fencing_tests::a_cell_broken_after_the_last_placement_is_replaced_instead_of_stalling_the_project", "cargo:mc-core:settlements::construction::fencing_tests::a_second_break_during_the_repair_requeues_the_repair_stage", "harness:buildings-qa:house.broken_cell_replaced"]
failing_first = "reported"
# Every one of the row's cargo controls reds at `complete_authored`'s own assertion that the
# project must close — the `construction did not finish` panic naming the stalled project — which is
# the row's symptom. Name the panic site so the classifier counts it as an assertion.
proving_assertions = { "cargo:mc-core:settlements::construction::fencing_tests::a_placed_cell_broken_to_air_is_replaced_before_the_house_certifies" = "crates/mc-core/src/settlements/construction_fencing_tests.rs:387", "cargo:mc-core:settlements::construction::fencing_tests::a_cell_broken_after_the_last_placement_is_replaced_instead_of_stalling_the_project" = "crates/mc-core/src/settlements/construction_fencing_tests.rs:387", "cargo:mc-core:settlements::construction::fencing_tests::a_second_break_during_the_repair_requeues_the_repair_stage" = "crates/mc-core/src/settlements/construction_fencing_tests.rs:387" }
fix_commit = "patch:0cb7484f364896a0287ae662d4a48dd74690723edf152445e6e36b51010c4502"
# 95dc2a9bd is the fix under test (repair scan + reopen_emptied guard). The handoff
# `recover` head this patch deletes around also carries 6b3e5a5b31 (the upgrade-cell
# fix), which the control tree keeps, so the patch is HEAD-adapted, not the original
# 7df36624 pre-image.
repro_check = "HEAD-adapted control at docs/bugs/promotions/SETTLEMENT-BUILDER-PROJECT-STALLS-AFTER-PLACED-BLOCK-BROKEN.patch (patch:0cb7484f, five hunks: `if !paused {` at the recover entry, the repair scan and its tail consumer, and the two `finish_project` guards). HEAD-adapted twice: `recover`'s head carries the upgrade lane's committed-cell scan and `finish_project`'s tail was rewritten (the shared `certificate_bounds` helper, then the stale terminal-index comment), so the same removals are re-anchored on the current text. Opus review R2 (2026-11-26) found the previous patch carried the `|| harvestable_crop(target, cell)` skip of `reopen_emptied`'s record-cell loop - that line is SETTLEMENT-HARVEST-REOPENS-FARM-REPAIR's fix (dde9a9e72), so this patch keeps it (class (a): another row's hunk is never reverted here); the `reopen_emptied` body and `REPAIR` stay as a helper (b), and the origin patch's `recover` doc and `record.image`/bookkeeping rewrites stay as comment/bookkeeping changes without behaviour (c). Both classes are itemized in the row's hunks.md. The reversed tree's three cargo refs red at `construction did not finish` (`construction_fencing_tests.rs:387`, the line named in `proving_assertions`) and its house gate reds `house.broken_cell_replaced`: the L1 stage's injected break is never re-placed, the flow records `_verdict(sub, \"broken_cell_replaced\", \"FAIL\", ...)` before `probe.check` raises, and the L1 certificate never appears. The candidate gate 20261125T175716-buildings-qa-s1_5wshf has all four refs PASS."
promotion = "docs/bugs/promotions/SETTLEMENT-BUILDER-PROJECT-STALLS-AFTER-PLACED-BLOCK-BROKEN.json"
