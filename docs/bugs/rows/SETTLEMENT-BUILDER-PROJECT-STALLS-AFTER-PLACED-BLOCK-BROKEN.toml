# 7df36624 pre-image.
repro_check = "HEAD-adapted control at docs/bugs/promotions/SETTLEMENT-BUILDER-PROJECT-STALLS-AFTER-PLACED-BLOCK-BROKEN.patch (patch:470330e2, six hunks, HEAD-adapted, a real pre-image: `if !paused {` at the recover entry plus pure deletions): it reverses on the promoted head (`git apply -R --check`). On the reversed tree the row's three cargo refs red at `construction did not finish` - the broken cell stays air and the project never closes - and the house gate's `house.broken_cell_replaced` verdict reds in the control (the L1 house never certifies after the injected break), while the candidate gate `20261125T141741-buildings-qa-bdfzq_2x` has it PASS."
