repro_check = "round-final, regenerated for the per-record structure ledger (LedgerSplit): receipt patch docs/bugs/fix-patches/SETTLEMENT-BUILDER-PROJECT-STALLS-AFTER-PLACED-BLOCK-BROKEN.patch (patch:7212599ea066f7c6), the fix's hunks with the split API on both sides (ledger.insert_structure, save(state, ledger)), so reversing keeps that API and the tree compiles; reverse-ok on 8848fa850, replaces patch:813e2a17 and patch:f6806e45. Control: the candidate's tree with this patch reversed (wt/LedgerSplitCtl: 8848fa850 + the reversed patch + the split's construction_ledger_tests.rs, which drives reopen through recover), .analysis/validation/20261117T151224-test-6gq7a5jy — 3 passed, 4 failed of 7 fencing tests: the three row refs a_placed_cell_broken_to_air_is_replaced_before_the_house_certifies, a_cell_broken_after_the_last_placement_is_replaced_instead_of_stalling_the_project and a_second_break_during_the_repair_requeues_the_repair_stage are red ('construction did not finish', the house left Committed at 249/249 with the broken cell foreign), and broken_placed_house_cell_is_rebuilt_before_completion_even_after_restart is red on assertion left: None == right: Some(\"repair\") (construction_fencing_tests.rs:47). Restore on the candidate: the same filter green, .analysis/validation/20261117T151447-test-dcxz0bbd, 7/7. The harness ref buildings-qa:house.broken_cell_replaced is the graphical control ledger promote runs; not rerun here."
