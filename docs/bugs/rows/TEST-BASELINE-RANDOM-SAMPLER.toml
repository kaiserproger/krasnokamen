repro_check = "Old oracle (pre-f945cba85) ran exactly 20 ticks and asserted the nether wart reached age 3 on that tick. Vanilla nether wart advances one age per received random tick gated nextInt(10) == 0 (pinned 26.1.2 NetherWartBlock bytecode), so a single fixed tick is an RNG artefact, not the behaviour; the corrected oracle runs one tick at a time up to 200 at random_tick_speed=FAST and asserts maturity, then digs the soul sand and asserts the wart is removed. Evidence: the pinned bytecode gate and plants.rs random_growth -> plant_rules_26_1_2 crop_growth_gate_passes (nether_wart one-in-ten). Control A: the old exact-tick oracle restored fails on current code. Control B: the defect patch makes the nether-wart gate return false so `assert!(grown, \"accelerated wart matures\")` fails; the chorus test in the same file stays green and is not proving."
