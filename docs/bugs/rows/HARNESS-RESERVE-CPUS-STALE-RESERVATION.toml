[[bug]]
id = "HARNESS-RESERVE-CPUS-STALE-RESERVATION"
title = "A stale CPU reservation left by a killed `reserve-cpus` silently pins every later `mem-run` scope away from those CPUs, or drops the restriction entirely when the stale list covers a whole lane pool"
area = "harness"
severity = "minor"
status = "fixed"
source = "CS341 audit A 2026-11-17, receipts/CS341/REPORT-A.md G4, read from code and not reproduced: tools/dev/reserve-cpus:20-30 creates /tmp/solaris-mem-slots/reserved-cpus with only the CPU list (`printf '%s\n' \"$cpus\" > \"$file\"`, noclobber) and releases it from `trap release EXIT`; a SIGKILL (agent cancel, OOM) or a wrapper kill leaves the file behind, and tools/dev/mem-run.sh:365-373 then excludes those CPUs from every new scope, including the perf lane's own pool (`pool=$perf_cpus`), so -p A/B numbers shrink with no line in the log saying why; when the stale list covers a whole pool, `allowed` is empty and mem-run.sh:371-372 skips `cpu_pin`, so the scope runs on the reserved CPUs and the reservation is ignored instead. tools/dev/README.md:17 states the file is removed when the command ends. Nothing records a pid or checks freshness; /tmp is tmpfs, so only a reboot clears it. Repro: `tools/dev/reserve-cpus 6,7 -- sleep 60` and SIGKILL the script's pid, then run `tools/dev/mem-run.sh -m 1G sh -c 'grep Cpus_allowed_list /proc/self/status'` and see the reserved CPUs excluded with no reservation owner alive."
repro = "source"
regression = ["python:tools.dev.test_reserve_cpus:ReserveCpusTests.test_a_dead_owner_is_cleared_instead_of_blocking_the_next_reservation", "python:tools.dev.test_reserve_cpus:ReserveCpusTests.test_a_reservation_records_its_live_owner", "python:tools.dev.test_reserve_cpus:ReserveCpusTests.test_a_one_line_file_from_an_older_writer_is_honoured", "python:tools.dev.test_reserve_cpus:MemRunReservationTests.test_a_stale_reservation_is_named_cleared_and_does_not_pin_the_scope", "python:tools.dev.test_reserve_cpus:MemRunReservationTests.test_a_live_reservation_logs_the_cpus_it_excludes", "python:tools.dev.test_reserve_cpus:MemRunReservationTests.test_a_reservation_covering_the_whole_pool_is_named_not_silently_dropped", "python:tools.dev.test_reserve_cpus:ReservedCpusProtocolTests.test_a_corpse_is_stale_and_a_live_owner_is_kept", "python:tools.dev.test_reserve_cpus:ReservedCpusProtocolTests.test_a_reservation_rewritten_after_the_verdict_is_not_unlinked", "python:tools.dev.test_reserve_cpus:ReservedCpusProtocolTests.test_clear_removes_a_corpse_and_keeps_a_live_reservation"]
failing_first = "not recorded"
fix_commit = "patch:f0dab557b9b203492e275eee61d7e9ecdca4268cabf3d35f8c1dfa4a9a6b6d79"
