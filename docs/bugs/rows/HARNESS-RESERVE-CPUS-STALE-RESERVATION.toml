[[bug]]
id = "HARNESS-RESERVE-CPUS-STALE-RESERVATION"
title = "A stale CPU reservation left by a killed `reserve-cpus` silently pins every later `mem-run` scope away from those CPUs instead of being named and cleared (the whole-pool fallback is asserted by the suite, not by this row's control)"
area = "harness"
severity = "minor"
status = "open"
source = "CS341 audit A 2026-11-17, receipts/CS341/REPORT-A.md G4, read from code and not reproduced: tools/dev/reserve-cpus:20-30 creates /tmp/solaris-mem-slots/reserved-cpus with only the CPU list (`printf '%s\n' \"$cpus\" > \"$file\"`, noclobber) and releases it from `trap release EXIT`; a SIGKILL (agent cancel, OOM) or a wrapper kill leaves the file behind, and tools/dev/mem-run.sh:365-373 then excludes those CPUs from every new scope, including the perf lane's own pool (`pool=$perf_cpus`), so -p A/B numbers shrink with no line in the log saying why; when the stale list covers a whole pool, `allowed` is empty and mem-run.sh:371-372 skips `cpu_pin`, so the scope runs on the reserved CPUs and the reservation is ignored instead. tools/dev/README.md:17 states the file is removed when the command ends. Nothing records a pid or checks freshness; /tmp is tmpfs, so only a reboot clears it. Repro: `tools/dev/reserve-cpus 6,7 -- sleep 60` and SIGKILL the script's pid, then run `tools/dev/mem-run.sh -m 1G sh -c 'grep Cpus_allowed_list /proc/self/status'` and see the reserved CPUs excluded with no reservation owner alive."
repro = "source"
regression = [
  "python:tools.dev.test_reserve_cpus:ReservedCpusProtocolTests.test_a_present_unparseable_owner_is_stale_not_immortal",
  "python:tools.dev.test_reserve_cpus:MemRunReservationTests.test_a_failing_verdict_helper_is_named_and_the_first_line_honoured",
  "python:tools.dev.test_reserve_cpus:MemRunReservationTests.test_a_garbage_first_line_with_a_failing_helper_refuses_the_scope",
  "python:tools.dev.test_reserve_cpus:MemRunReservationTests.test_a_stale_reservation_is_named_cleared_and_does_not_pin_the_scope",
  "python:tools.dev.test_reserve_cpus:MemRunReservationTests.test_a_live_reservation_logs_the_cpus_it_excludes",
  "python:tools.dev.test_reserve_cpus:MemRunReservationTests.test_a_reservation_covering_the_whole_pool_is_named_not_silently_dropped",
  "python:tools.dev.test_reserve_cpus:ReserveCpusTests.test_the_locked_create_refuses_a_second_reservation_and_release_removes_only_its_own",
]
failing_first = "not recorded"
fix_commit = "patch:1c996e0e836d4739d763801c12875917927aee37a561aa178bc0bcde6e055371"
