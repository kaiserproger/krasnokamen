repro_check = "A scene step whose summon did not create its subject still captured, so a shot of nothing passed; 259649f7c added the require_entities step (list entities, fail closed on an incomplete snapshot, assert each declared type). scene_shot.py was split by 1cadb5c0a, and the execute branch lives in scene_shot_execute.py (fix-patches/HARNESS-SCENE-SHOT-MISSING-SUBJECT.hunks.md maps the port; the mcp_calls and validate branches are shared with another row assert_entities so they are omitted (a)). Red observed 2026-11-24 with the patch reversed: SceneShotTests.test_require_entities_fails_before_shot_when_summon_did_not_create_subject fails (the step is a no-op and the capture runs); green at HEAD. 2026-11-25 D123HarnessH: the graphical ref scene-shot:issue1-01-villager-leg was added because the scene carries a require_entities step for minecraft:villager (tools/harness/issue1_01_villager_leg_scene.json:101). Candidate scene PASSED on the pinned tree (20261125T105727-issue1-01-villager-leg-xoeyevvx, assertion villager-present_minecraft:villager true, server pin 8e502111d280). Promotion attempt (.analysis/validation/20261125T110008-ledger-promote-k1dj_83o) refused: with the patch reversed the scene cannot run at all -- the pre-image rejects the step kind (ValueError 'invalid scene step', unrunnable, never red), so a graphical ref can neither prove nor be excluded, and _check_proving_choice refuses a proving named scenario without a proving assertion. The python ref now reds at an AssertionError on the reversed tree (d6e998d6b6 turns the pre-image's ValueError into the row's failed assertion). The remaining gap is the rule, not the evidence: owner decision H-10."
