[[bug]]
id = "LEDGER-CONTROL-COVERS-ONE-REF"
title = "A promotion control passes when any one of the row's refs is red, so a scene control can be unrunnable"
area = "harness"
severity = "major"
status = "open"
source = "Found while re-auditing ISSUE-1-19 for REVIEW-wave2-12 (M1/M4). The stored promotion `docs/bugs/promotions/ISSUE-1-19.json` at `e25d40529` was accepted with `negative_control[harness:scene-shot:issue1-19-hostile-motion] = red` whose detail was `client receipt is 'failed', not passed` — a run that never produced a verdict — and the amended audit showed the same shape as `unrunnable` when `KRASNOKAMEN_SERVER_BINARY` named the candidate pin: the row still passed because the cargo ref was red."
repro = "tooling"
regression = []
failing_first = "reported"
repro_check = "`ledger.row_verdict` reduces a row's control states with `red > all-green > needs-real-client > unrunnable`, so one red ref satisfies the control for the whole row. Two consequences seen on 2026-11-25: (a) a scene whose control run crashed (`failed`, no assertion verdict) counted as the row's red and the first ISSUE-1-19 promotion was accepted with a scene control that proved nothing — it only surfaced when the scene gained an explicit assertion name; (b) with `KRASNOKAMEN_SERVER_BINARY` set to the candidate pin the scene control is `unrunnable` and the row still passes on the cargo red. Missing proof: a promote that requires every ref in `row['regression']` that the promotion *cites* to reach the side's required state (red on the control, green on the restore), refusing `unrunnable`/`failed-without-verdict` on either side, with a test that a row of two refs fails when one of them is unrunnable on the control."
