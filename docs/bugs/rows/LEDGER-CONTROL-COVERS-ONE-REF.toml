[[bug]]
id = "LEDGER-CONTROL-COVERS-ONE-REF"
title = "A promotion control passes when any one of the row's refs is red, so a scene control can be unrunnable"
area = "harness"
severity = "major"
status = "fixed"
source = "Found while re-auditing ISSUE-1-19 for REVIEW-wave2-12 (M1/M4). The stored promotion `docs/bugs/promotions/ISSUE-1-19.json` at `e25d40529` was accepted with `negative_control[harness:scene-shot:issue1-19-hostile-motion] = red` whose detail was `client receipt is 'failed', not passed` — a run that never produced a verdict — and the amended audit showed the same shape as `unrunnable` when `KRASNOKAMEN_SERVER_BINARY` named the candidate pin: the row still passed because the cargo ref was red."
repro = "tooling"
regression = ["python:tools.harness.test_regressions:ControlCoversEveryProvingRefTests"]
failing_first = "reported"
repro_check = "`ledger.row_verdict` reduces a row's control states with `red > all-green > needs-real-client > unrunnable`, so one red ref satisfied the control for the whole row. The real case: `docs/bugs/promotions/ISSUE-1-19.json` at `e25d40529` was accepted with the scene ref red and the cargo ref `unproven-panic`, so the row held although only one of its two refs proved anything — visible once the scene gained an explicit assertion name. Fixed in `a260a34fa`/`71f7b487f`: every proving ref must be RED (`proving_refs` defaults to all refs), an excluded ref must be GREEN on the control, and a crashed/aborted/unrunnable run never counts as red; `ControlCoversEveryProvingRefTests` is the red control (it fails on the pre-fix tree)."
fix_commit = "patch:609f07ef3570808b8413c8e9ea1b4be35142b5bdc212ab9821d152b841050d8d"
proving_assertions = { "python:tools.harness.test_regressions:ControlCoversEveryProvingRefTests" = "test_an_unrunnable_run_never_counts_as_red" }
promotion = "docs/bugs/promotions/LEDGER-CONTROL-COVERS-ONE-REF.json"
