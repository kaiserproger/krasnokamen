repro_check = "Old oracle ran 5 harness ticks and then asserted the water had descended into the single adjacent lower hole. The out-of-band test placement stamps its deadline on the already-processed tick, so the first tick that can flow is the 6th run: the corrected oracle runs 6 and asserts the same behaviour (the cell below the source stays air, the east neighbour holds water_levels[1]). Nothing is loosened: same fixture, same two assertions. Evidence (independent, local vanilla 26.2; no Mojang bytes in git, only path+sha256+javap lines): outer jar data/vanilla/.content-import-phyD1h/.work/server.jar sha256 cdacdfb25898de5e4b4b0e5ddcc2722f77067e46605709c2d886c000ebb63ec5; inner META-INF/versions/26.2/server-26.2.jar sha256 183c0499c5f855570ee487dd38e141a53f0121f83a0b07a3bac2d8b6698823e8. javap -p -c net/minecraft/world/level/material/WaterFluid.class sha256 ab6d93e4d0df11cb2e54cc0e0de82734b4652a14258fb0eebcd1b9e99c9bc202: public int getTickDelay(LevelReader) is iconst_5; ireturn (Fluid.getTickDelay is abstract, so water alone is 5). net/minecraft/server/level/ServerLevel.class sha256 8e503c6d761c27595fb1b6a0d9af12336c0aac393fd8abac3c34d3b2906114df: tick() calls tickTime() at offset 215, and tickTime() computes getGameTime()+1 and setGameTime (offsets 12/25) before LevelTicks.tick(gameTime,...) at offset 269 and runBlockEvents at 360 run in the same tick with the new time; a 5-tick delay scheduled against the old gameTime therefore flows on the 5th subsequent tick, i.e. the oracle's 6th run. Control A: the 5-tick oracle restored fails on current code because the flow has not fired yet. Control B: the defect patch treats a neighbour with an open floor as impassable, so no water leaves the source and `at(pos, 1) == water_levels[1]` fails."
