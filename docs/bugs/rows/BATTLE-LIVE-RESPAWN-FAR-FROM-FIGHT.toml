[[bug]]
id = "BATTLE-LIVE-RESPAWN-FAR-FROM-FIGHT"
title = "A respawned front-rank player is placed at his side's centre file far from any fighting instead of where his line is in contact"
area = "gameplay"
repro = "client"
severity = "major"
status = "fixed"
source = "G2R calibration trial-7: after dying near (-197,8,23) PovRed respawned 'regiment=4 file=29 at=30.73,94.00,37.83' (placed at -152,108 before start), about 230 blocks from where he fell, and saw 0 enemies for four minutes. crates/mc-core/src/battle/live_players.rs reenter took the free front-rank file nearest the line centre of any eligible line (choose_slot) regardless of the fight. Now respawn_slot keeps an explicit order, each nearest where he fell: a file of his own regiment in contact (a soldier with an enemy within weapon reach, the in_weapon_reach census of combat::count_fighting), broken or not; else, while it is not broken, any living file of it; else, when it is broken and out of contact or has no living file left, a file of his side's standing foot lines in contact; else the old centre rule. A regiment change is logged with regiment_changed=<from>-><to> and reason=regiment_broken|regiment_gone (and rule=centre for the old rule)."
regression = ["cargo:mc-core:battle::live_players::tests::a_respawn_goes_to_the_file_of_his_line_in_contact_nearest_where_he_fell", "cargo:mc-core:battle::live_players::tests::a_respawn_goes_to_his_broken_regiments_file_in_contact", "cargo:mc-core:battle::live_players::tests::a_respawn_with_no_contact_in_his_regiment_takes_its_file_nearest_where_he_fell", "cargo:mc-core:battle::live_players::tests::a_respawn_after_his_regiment_is_gone_takes_the_sides_contact_nearest_where_he_fell", "cargo:mc-core:battle::live_players::tests::a_respawn_after_his_infantry_broke_takes_a_standing_line_with_the_same_kit",
  "harness:battle-live:battle-live-respawn-line-contact",
]

failing_first = "reported"
fix_commit = "patch:0cf17053a18f903a5e067a51671ebf4322e659e6a0b639c558d268ec5e6a48a8"
repro_check = ["The client proof is the `battle-live` profile: one small staged battle (field-1k, 200 a side) with a real Horizon PovRed holder and CamSpec spectator; the holder is killed through the console fifo once the telemetry reports fighting, and the gate asserts the server's own respawn line (contact=true, not the centre fallback), his client back in play with a new entity id, and — when the client exposes its own coordinates — a respawn within 40 blocks of where he fell. Run `20261124T220339-battle-live-respawn-line-contact-_193o7hb` (pin `1aee24a97872`, 60.3 s): respawned at -36.32,93.00,-19.46 with contact=true, no rule=centre, 33.7 blocks from where he fell (-6,95,-34), client playing and the spectator camera 1.62 blocks from his eye. Control state (REVIEW-wave2-14 Major-2): the earlier behaviour-only patch was a hand re-break (its a-side never existed in history) and is withdrawn; the control is the fix's real parent tree `f90997cc1^`, pinned non-incremental, with the witness scene red on it and green on the candidate. Measured witness so far: candidate pin `f75930bf7ffc` (`20261125T012343-…-b75mwfj8`) gives `holder_at = [-1.0, 93.0, -1.0]` (his client; server `at=-0.20,93.00,-0.27`), 200 enemy fighters in the image and `min_enemy_distance = 11.17`; the row's symptom is ~230 blocks, so a bound in the tens of blocks separates them with margin, but the bound is not fixed until the parent pin is measured. Parent pin BLOCKED: tree `ce793d6e5` predates the krasnokamen rename and has only the `solaris-v2` bin target, while `pin-release` builds `krasnokamen` (the tool lists: available bin targets are solaris-v2) — a tooling gap outside this lane. The four cargo refs cannot be built from the ledger's reversal (`E0425: nearest_file` when the commit's hunks are reversed), so they are excluded as non-proving only if they are green on that parent pin (docs/bugs/README.md, proving_refs). The graphical control still cannot be behavioural: the row's symptom (an enemy in sight after the respawn) has no client witness in this gate - the holder's horizon-ctl exposes no entity census (entities blocks; minecraft_list_entities belongs to the hotbar MCP client) and the client state carries no entities; contact=/rule=centre are strings the fix writes. Measuring it needs the server-side battle image (WAL) or a client entity feed. Originally missing: a real pre-image control; the fix hunks of f90997cc1 no longer reverse at HEAD (live_players.rs was restructured by the later kit-custody commit), and `ledger promote` cannot consume a red real-client receipt from a pre-image pin for a non-client fix_commit."]
promotion = "docs/bugs/promotions/BATTLE-LIVE-RESPAWN-FAR-FROM-FIGHT.json"
