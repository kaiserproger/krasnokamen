[[bug]]
id = "SP-PLAYER-ROTATION-LOST-ON-REOPEN"
title = "Singleplayer: after a clean quit and reopen the player's position is kept but yaw/pitch come back as 0/0; vanilla persists Rotation."
area = "gameplay"
repro = "client"
severity = "minor"
status = "open"
source = "BreakJoinRows 2026-11-12 (receipts/BreakJoinRows/FINDINGS.md F4, 8/8 including the uninterrupted control run); not caused by the WORLD-FIRST-START-INTERRUPTED fix. Root cause found 2026-11-24: the core already journals and restores the player's Rotation (Joined carries yaw/pitch from the saved record, tick/input/session.rs:341), but the edge stashed the spawn as a 4-tuple without it and crates/mc-edge/src/play.rs sent the join SynchronizePlayerPosition with a hardcoded 0/0."
regression = ["cargo:mc-edge:play::tests::join_burst_syncs_the_restored_player_rotation", "harness:singleplayer-regressions:native-sp-rotation-reopen"]
