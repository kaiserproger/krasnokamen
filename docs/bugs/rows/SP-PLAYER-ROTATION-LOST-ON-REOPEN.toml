proving_assertions = { "harness:singleplayer-regressions:native-sp-rotation-reopen" = "reopen_keeps_rotation" }
repro_check = "Identity patch:4f267ef8 is the two-line join-sync half of the fix in its tip form (docs/bugs/promotions/SP-PLAYER-ROTATION-LOST-ON-REOPEN.{patch,hunks.md}): the a/-side `yaw: 0.0, pitch: 0.0` is the real pre-image at play.rs before the fix. JoinedSpawn's rotation field and the pump/registry plumbing stay on both sides (the kept cargo ref builds JoinBurst with `rotation`), so the control compiles. Control red by assertion: the new singleplayer scenario native-sp-rotation-reopen looks 90/20, saves and quits to title, reopens the world and finds the camera back at 0/0 (reopen_keeps_rotation false); the cargo ref join_burst_syncs_the_restored_player_rotation is red in the same control at play_tests.rs (`(sync.yaw, sync.pitch)` = (0.0, 0.0))."
fix_commit = "patch:4f267ef894e374b77995f0b77882a7195e801aaacef8fbf354bad26a602c21b0"
