[[bug]]
id = "CORE-DROP-LEAVES-WORLD-DIR-WRITER"
title = "A file appears in the world directory after Core is dropped, so deleting the directory right after drop fails with DirectoryNotEmpty"
area = "gameplay"
repro = "cargo"
severity = "minor"
status = "open"
source = "CI run 43340344269 (main 3caeae5c, regressions stage): mc-edge advancements::tests::reloaded_recipes_are_announced_once_and_feed_the_next_book panicked at crates/mc-edge/src/advancements_tests.rs:233 on std::fs::remove_dir_all(dir).unwrap() directly after drop(core): Os code 39 DirectoryNotEmpty (artifact test-failure-receipts-1, receipts/FleetControl/ci-flakes-20261113/a). Reproduced on main ad93ee71 (after the forest-worker join fix fb4c1a52, so that fix does not cover it) by looping the exact test binary: 0 of 100 serial, 1 of 100 with four copies in parallel (receipts/CiFlakes/repro.sh, repro.out, A-par4-56.log). Classification: a timing race in the core, not in the test and not caused by the input/entity commits: remove_dir_all empties the directory and the final rmdir fails, so some core thread or deferred writer still creates a file after Core::drop returned (Core::drop does not wait for every writer of the world directory). Which thread and file is not yet identified."
regression = ["cargo:mc-core:core::core_drop_join_tests::plain_drop_joins_a_journal_writer_holding_the_world_directory"]
failing_first = "reported"
repro_check = "Not reproduced on this head; stays open with that evidence. Fresh parallel loop 2026-11-26 (receipts/D123/D123GameplayP/row3-repro/, tree 3ee7ab8c60): the exact CI test binary (mc-edge advancements::tests::reloaded_recipes_are_announced_once_and_feed_the_next_book) ran 100 times serially and 100 times with four concurrent copies, with a /tmp/mc-edge-recipe-reload-* leftover scan armed on every failure: 0 failed in both loops. Write-path audit at this head: every durable writer of world_dir is owned by the two owners stop_owners joins - the tick thread (input log, merge writes; joined first after its final checkpoint flush request) and the mc-core-journal thread (JournalWriter appends/fsyncs, run_native_work checkpoint commits and WAL prune; joined second). The native store is held only by the journal thread (journal_store is its only clone that outlives open), the lease is opened on the caller's thread before any owner exists (Linux open_for_lease opens the world directory only; the Windows lease file is created there too, before owners), the store and marker are written during recovery before owners start, and the world-lease wait thread (only for a contended lease) neither creates nor writes files. A plain drop therefore waits for every writer that existed at the row's filing: the reported 1-in-100 four-way failure predates CORE-DROP-RELEASES-LEASE-BEFORE-OWNERS-JOIN (the drop now releases the lease only after the joins) and no longer reproduces. Earlier evidence kept: the JOURNAL_EXIT_HOLD test holds the journal owner on its exit path and the drop does not return until it is released (regression ref below), and the leftover_paths diagnostic never fired. Next step if it returns: the CI artifact left behind by the failing run (the loop now captures the surviving /tmp/mc-edge-recipe-reload-* tree) naming the leftover entry, not another blind loop."
