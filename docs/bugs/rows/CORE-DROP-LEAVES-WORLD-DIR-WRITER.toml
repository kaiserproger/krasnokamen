[[bug]]
id = "CORE-DROP-LEAVES-WORLD-DIR-WRITER"
title = "A file appears in the world directory after Core is dropped, so deleting the directory right after drop fails with DirectoryNotEmpty"
area = "gameplay"
repro = "cargo"
severity = "minor"
status = "open"
source = "CI run 43340344269 (main 3caeae5c, regressions stage): mc-edge advancements::tests::reloaded_recipes_are_announced_once_and_feed_the_next_book panicked at crates/mc-edge/src/advancements_tests.rs:233 on std::fs::remove_dir_all(dir).unwrap() directly after drop(core): Os code 39 DirectoryNotEmpty (artifact test-failure-receipts-1, receipts/FleetControl/ci-flakes-20261113/a). Reproduced on main ad93ee71 (after the forest-worker join fix fb4c1a52, so that fix does not cover it) by looping the exact test binary: 0 of 100 serial, 1 of 100 with four copies in parallel (receipts/CiFlakes/repro.sh, repro.out, A-par4-56.log). Classification: a timing race in the core, not in the test and not caused by the input/entity commits: remove_dir_all empties the directory and the final rmdir fails, so some core thread or deferred writer still creates a file after Core::drop returned (Core::drop does not wait for every writer of the world directory). Which thread and file is not yet identified."
regression = ["cargo:mc-core:core::core_drop_join_tests::plain_drop_joins_a_journal_writer_holding_the_world_directory"]
fix_commit = "patch:ac21dca494074f48dbc8ef64828f6745734d9989b4cbafbfd253601bd6758bb6"
failing_first = "reported"
repro_check = "Closed by the earlier guard: the reported flake predates `impl Drop for CoreInner` (added by 84116c517 'fix(core): join owners before releasing world lease', 2026-11-22; the CI failure is run 43340344269 on main 3caeae5c, 2026-11-13), and its cause is exactly a plain `drop(core)` detaching the tick and journal owners and closing the world lease while they could still write. The same defect was filed and fixed as CORE-DROP-RELEASES-LEASE-BEFORE-OWNERS-JOIN (its source says 'Possibly the cause of CORE-DROP-LEAVES-WORLD-DIR-WRITER; not yet reproduced'), whose patch:ac21dca\u2026 is carried here unchanged as docs/bugs/fix-patches/CORE-DROP-LEAVES-WORLD-DIR-WRITER.patch; this row is the duplicate it closes and its repro class stays `cargo`. Proof: core::core_drop_join_tests::plain_drop_joins_a_journal_writer_holding_the_world_directory parks the real journal owner on its exit path (JOURNAL_EXIT_HOLD) and drops the Core on another thread. The test reports the row's loss first: a joined drop cannot return before the hold is released, so a bounded 2 s window firing is the defect, and the test fails with 'the plain drop returned while the journal owner was still alive: a writer was left in the world directory'; on the fixed path it then requires the exit event, that the drop has not returned, and that remove_dir_all of the world directory succeeds. With the patch reversed (no Drop) the drop detaches the owners and the test reds at that assertion. Reproduction attempt 2026-11-26 (receipts/D123GameplayP/row3-repro/, tree 3ee7ab8c60): 0 failures in 100 four-way runs of the exact CI test - at the original ~1% rate that is p=0.99^100, about 0.37, so it is not evidence of absence; the serial 100 are not comparable because the original never failed serially. Writer audit at this head: every durable world_dir writer is owned by the two owners stop_owners joins (tick: input log and merge writes; mc-core-journal: WAL appends/fsyncs and checkpoint commit/prune, holding the only long-lived native store clone), the lease opens on the caller's thread before owners exist (Linux open_for_lease opens the directory only), the store and marker are written during recovery before owners start, and the contended-lease wait thread creates and writes nothing."
