[[bug]]
id = "ENTITY-CROWD-PUSH-INTO-WALL"
title = "Mobs in crowded pens are observed suffocating with their bodies partly or wholly inside stone walls; the cause is a clip/overlap tolerance band in the movement kernel."
area = "gameplay"
repro = "source"
severity = "major"
status = "open"
source = "Perf1M prep11-125000 on main de660fabd fixture (seal-then-clear pens, no Invulnerable), 2026-11-17 ~23:00: at 98/128 pens, 95,798 cohort summons, 204 suffocation events on 98 distinct cohort mobs (the earlier 190/93 was a snapshot of the same run), every one inside a pen wall, repeating every 10 ticks at the same position. Examples: zombie pos=11.54,65.00,511.95 (0.4-wide body spans z 511.75-512.15, 0.25 into the stone wall at z=511); skeleton pos=7966.70,65.00,511.30 (body z 511.10-511.50, wholly inside the wall block). Pens span z=512..575, wall at z=511; no fixture sweep reaches the wall. Receipt: targets/Perf1M/legs/prep11-125000/prepare/server.log; read-only world probes confirm (11,64,511)=stone with (11,64,512) and (11,64,510) air. Cause: the entity step's horizontal resolver is the time-of-impact sweep, whose first_sweep_hit drops any obstacle whose entry time is in the past (crates/mc-physics/src/lib.rs TIME_EPSILON 1e-12), while every clip and support predicate treats a side within COLLISION_EPSILON (1e-7 blocks) of a face as not overlapping; a body between ~1e-14 and 1e-7 blocks inside a block is therefore invisible on both sides and the step advances into the wall every tick. The band is supplied by the clip's own rounding while these mobs carry hand-written f64 literals: crates/mc-core/src/blueprint.rs builds minecraft:zombie with half width 0.3 (blueprint.rs:903 at de660fabd; 512.3 + (512.0 - (512.3 - 0.3)) - 0.3 = -5.68e-14), not the f32-widened contract width that R6 checked. Once inside, try_start_jump's raised-box sweep ignores the same obstacle, so a jumping kind lands on the wall's lowest block (y=65) and stays; only jumping kinds show y=65 (spiders have jump_speed 0). Fix: vanilla VoxelShape.collideX symmetric tolerance in clip_x/clip_z plus a contact pre-clip inside the tolerance in resolve_horizontal_sweep, and body sizes sourced from the vanilla f32 contract."
regression = ["cargo:mc-physics:tests::wall_face_snap_never_lets_a_body_cross_the_face", "cargo:mc-physics:tests::a_contact_never_grows_deeper_than_the_tolerance_behind_a_face", "cargo:mc-core:tick::crowd_pen_tests::crowded_pen_bodies_never_enter_the_wall", "cargo:mc-core:blueprint_tests::body_sizes_come_from_the_vanilla_entity_contract", "cargo:mc-core:blueprint_tests::a_summoned_villager_keeps_the_contract_body_through_the_appearance_refresh", "cargo:mc-core:sleep::tests::a_woken_player_carries_the_player_contract_body", "cargo:mc-core:tick_tests::elytra_tests::an_unsolvable_reported_move_is_refused_instead_of_teleporting_the_player"]
failing_first = "reported"
