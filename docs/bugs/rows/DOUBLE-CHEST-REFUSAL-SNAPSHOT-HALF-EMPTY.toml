[[bug]]
id = "DOUBLE-CHEST-REFUSAL-SNAPSHOT-HALF-EMPTY"
title = "With a 54-slot double chest open and the partner half's chunk non-resident, a refused inventory operation (reserved SwapHands, book edit) resends the menu as 27 real slots plus 27 empty ones, or includes records of the cold half from the overlay."
area = "gameplay"
repro = "source"
severity = "minor"
status = "open"
source = "WinFixReview-adjacent residency audit (receipts/ArchDesign/VOTE-RESIDENCY-R15-astra.md and DESIGN-RESIDENCY-R16.md). Pre-fix, crates/mc-core/src/tick/containers.rs inventory_transition_refused rebuilt the menu from whatever cells were readable, so a 54-slot double chest with one half's chunk non-resident was resent as 27 real slots plus 27 empty ones (or with overlay records of the cold half), and an unloaded half also leaves the overlay records behind (tick/hydration.rs). A first attempt in this lane checked only the expected partner position (chests::partner_position) and closed the menu only for a cold partner; the final review rejected it because a cold open half or both cold halves fell through to the same half-empty image. The accepted fix applies the click/recipe custody check instead: the retained menu shape must match the reconstructed storage and every named cell must be resident. debug_menu_snapshot has the same fork and is not part of this row."
regression = ["cargo:mc-core:chests::tests::integrity_reserved_refusal_with_a_cold_partner_closes_the_menu", "cargo:mc-core:chests::tests::integrity_reserved_refusal_with_a_cold_open_half_closes_the_menu", "cargo:mc-core:chests::tests::integrity_reserved_refusal_with_both_halves_cold_closes_the_menu"]
failing_first = "reported"
repro_check = "Fixed by closing the menu instead of resending it when the open block menu's custody spans a cold chunk: inventory_transition_refused applies the same check as the click and recipe paths (the retained menu shape must match the reconstructed storage and every named block must be resident in ChunkWorld), so a cold open half, a cold partner or both close the menu through close_player_menu. The close returns the cursor stack and the menu grid to the player's inventory (overflow through merge_life_drops), and the refusal then returns a window-0 resync so predicted stack, cursor and book edits roll back. Patch-mode identity patch:0377bd2a is the whole function with the pre-image verbatim on the a/-side (no adaptation: &mut callers coerce to &); in the control the pre-fix body resends the half-empty menu, keeps the menu open and the three cold-half regressions redden at their own assertions (no MenuContents for the closed window, MenuClosed in the outbox, cursor emerald back in the inventory). chests::partner_position was deleted, so no second convention remains. The earlier patch:6af67cbd/patch:4b2427db receipts (cold partner only) are superseded and deleted."
fix_commit = "patch:0377bd2ac02a94a8b3d767f050439bb3a8e8d11d37851ae5ddcbcfb64b42a3a3"
