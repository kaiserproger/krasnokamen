[[bug]]
id = "DOUBLE-CHEST-REFUSAL-SNAPSHOT-HALF-EMPTY"
title = "With a 54-slot double chest open and the partner half's chunk non-resident, a refused inventory operation (reserved SwapHands, book edit) resends the menu as 27 real slots plus 27 empty ones, or includes records of the cold half from the overlay."
area = "gameplay"
repro = "source"
severity = "minor"
status = "fixed"
source = "receipts/ArchDesign/VOTE-RESIDENCY-R15-astra.md and DESIGN-RESIDENCY-R16.md (read-only audit). On main 3068dfb1b inventory_transition_refused rebuilds container_cells (crates/mc-core/src/tick/containers.rs:274-284); storage_partner misses a cold partner and storage_cells returns one cell (chests.rs:149-179); missing slots are sent EMPTY (player_reservations.rs:165-174; inventory.rs:532-541); unload keeps overlay records (tick/hydration.rs:73-76); debug_menu_snapshot has the same fork (tick/containers.rs:209-230). Fix and scene: expected-partner chunk check before reading it, refusal via close_player_menu; T16i-26 (a)-(zh) plus the resident control."
regression = ["cargo:mc-core:chests::tests::integrity_reserved_refusal_with_a_cold_partner_closes_the_menu", "cargo:mc-core:chests::tests::integrity_reserved_refusal_with_a_cold_open_half_closes_the_menu", "cargo:mc-core:chests::tests::integrity_reserved_refusal_with_both_halves_cold_closes_the_menu"]
failing_first = "reported"
repro_check = "Fixed by closing the menu instead of resending it when the open block menu's custody spans a cold chunk: inventory_transition_refused applies the same check as the click and recipe paths (the retained menu shape must match the reconstructed storage and every named block must be resident in ChunkWorld), so a cold open half, a cold partner or both close the menu through close_player_menu. The close returns the cursor stack and the menu grid to the player's inventory (overflow through merge_life_drops), and the refusal then returns a window-0 resync so predicted stack, cursor and book edits roll back. Patch-mode identity patch:83e6126e is the whole function with the pre-image verbatim on the a/-side (no adaptation: &mut callers coerce to &); in the control the pre-fix body resends the half-empty menu, keeps the menu open and the three cold-half regressions redden at their own assertions (no MenuContents for the closed window, MenuClosed in the outbox, cursor emerald back in the inventory). chests::partner_position was deleted, so no second convention remains. The earlier patch:6af67cbd/patch:4b2427db receipts (cold partner only) are superseded and deleted."
fix_commit = "patch:83e6126e934477f5f90d63c76e0d2884cae009765d944df319fa4b436846f843"
promotion = "docs/bugs/promotions/DOUBLE-CHEST-REFUSAL-SNAPSHOT-HALF-EMPTY.json"
