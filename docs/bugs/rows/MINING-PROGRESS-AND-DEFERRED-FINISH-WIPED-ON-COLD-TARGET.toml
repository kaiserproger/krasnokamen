[[bug]]
id = "MINING-PROGRESS-AND-DEFERRED-FINISH-WIPED-ON-COLD-TARGET"
title = "When the mined block's chunk stops being resident, mining progress and a queued (native or authorized) finish are wiped, or accrue from a cold overlay, instead of pausing until the chunk is admitted again."
area = "gameplay"
repro = "source"
severity = "minor"
status = "fixed"
source = "receipts/ArchDesign/VOTE-RESIDENCY-R13-astra.md item 2, VOTE-RESIDENCY-R14-astra.md item 2 and DESIGN-RESIDENCY-R15.md (read-only audit). On main 3068dfb1b mining::advance runs before apply_inputs, reads the target and accrues progress for normal and deferred mining, and without an overlay drops both (crates/mc-core/src/tick/mining.rs:26-85,76-84,96-121; tick.rs:1495-1500); the speed computation reads the eye cell (effects.rs:1114-1128). Fix and scenes: freeze in advanced while the target or eye chunk is cold; peek, check the delivery frame (target +-2 plus player chunk), then take; T16i-21, T16i-22, T16i-25."
regression = ["cargo:mc-core:tick::mining_tests::mining_progress_and_a_queued_finish_pause_while_the_target_chunk_is_cold", "cargo:mc-core:tick::mining_tests::a_queued_finish_waits_while_a_neighbour_inside_the_delivery_frame_is_cold"]
failing_first = "not recorded"
ingress_proof = ["crates/mc-core/src/tick/mining.rs cold_target_or_eye freezes progress after the reach/life check and before valid_target reads block_at", "crates/mc-core/src/tick/mining.rs cold_delivery_frame holds a queued finish in take_finished until the target and its +-2 frame are resident"]
