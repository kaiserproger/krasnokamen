[[bug]]
id = "ENTITY-BODY-72-BYTE-STRIDE-STRADDLES-CACHE-LINES"
title = "Body is 72 B in a plain Vec<Body> with 16-byte malloc alignment, so its 'contact set in the first cache line' ratchet holds for only 3 of every 8 rows and a random body lookup by slot costs two line fills where the ratchet promises one."
area = "gameplay"
repro = "source"
severity = "minor"
status = "open"
source = "receipts/Books/REPORT-R2.md finding R2-2 (Drepper 6.2.1 p. 52: an unaligned object makes field reordering worthless; perf, H5). crates/mc-core/src/entity_body_tests.rs body_layout_contact_set_in_first_cache_line asserts size 72, align 8 and contact_end <= 64, while the column is a plain Vec<Body> (crates/mc-core/src/entities.rs) so row i starts at 72i + b with b in {0,16,32,48} and the contact set [0,41) crosses a line boundary whenever (72i + b) mod 64 > 23, 5 of 8 rows; Body is read at random by slot after id_index (battle::faction::live_unit, hostile::zombie_arms_update). Verified open on main 5bdc02911 (ratchet still asserts 72). Fix shape: (a) shrink Body to 64 B (11 free bytes in the contact set; move one u32 such as air_supply, pickup_delay, attack_cooldown or hurt_at out) and assert stride == 64, or (b) 64-byte align the column. Measure fills on an id-resolution-dominated leg versus a dense-iteration leg."
regression = []
failing_first = "not recorded"
repro_check = ["Blocked on Main-s `-x` window (PERF-QUEUE.md item 1): shrink `Body` to 64 B (or 128-align) with a `size_of::<Body>() == 64` ratchet, measured by L1 line fills per random lookup on the 1M-row fixture. No window has run and no code is on the tree."]
