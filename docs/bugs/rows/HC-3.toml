repro_check = "candidate: the gameplay early return and the pick binding were introduced by d5303246/83994480 and the dispatch by client:5ef71d56 (pre-rename, so its parent cannot be pinned); no non-test hunk of 5ef71d56 reverse-applies (receipts/XClientControl/negctl/hc23-reverse-apply-failures.log), so the control is the committed reversal pair client:0941d0948f (the `native_item_key` dispatch call site removed from `App::dispatch_binding`) -> client:45ef47e3cc (re-land, the row's fix_commit), the same pair HC-2 uses; the map is promotions/HC-3.hunks.md and the pair delta is the single `src/lib.rs` block (patch-id 317bd348e8…, equal to 45ef47e3cc's own). Without the call site a physical middle-click resolves to the `pick` action, which the gameplay fallthrough match has no arm for, so the click is dropped and the creative palette entry never reaches the hotbar. The mapping names `survival_picked_block_hotbar` because the scene runs the survival leg first and stops at the first failing check: the control therefore records the survival pick false and never reaches `creative_picked_block_hotbar`. Both legs are the same physical middle-click gesture, and the restore proves both (`survival_*` and `creative_*` green). The server pick handler is tracked separately as PICK-SERVER. Re-proved 2026-11-24 on core 3eac5f18c4's successor with the registered server pin: control and restore receipts are recorded in promotions/HC-3.json."
