source = "Seed-24 original adult49 at (122.5,72.5,-279.5) has a received adult bounding box overlapping the upper half of the oak stair at (122,72,-280). The canonical collision descriptor fingerprint is verified. Removing only the stair releases two blocks of local movement. The seating owner validates a standing position above the stair, then places the physical body at the unchecked stair center y+0.5; the edge already renders a separate visual seat anchor. This is a source-proven penetration ingress, not proof of this resident's historical ingress. Leaf removal permits free-bed reachability probes but does not prove a movement route was requested or committed. Preserve that distinction while verifying seating, dismount and navigation."
regression = ["cargo:mc-core:villager::brain::tests::resting_villager_moves_onto_nearby_indoor_stair", "cargo:mc-core:villager::brain::tests::embedded_resident_recovers_to_nearest_free_standing_position", "harness:scene-shot:native-village-stair-penetration"]
