repro_check = "HEAD re-break control: docs/bugs/promotions/VILLAGER-STAIR-PENETRATION-STALL.patch (patch:255a2ab9) reverses on the promotion head (`git apply -R --check`). Its a/-side keeps the `standing(...)` guard and the `let body` binding, both of which predate the fix (2e5fa2944), and reverts only the returned position to the unchecked stair centre, so the row's own assertion crates/mc-core/src/villager/brain_tests.rs (the physical seated body must not overlap its stair) goes red. hunks.md maps the one HEAD hunk, the named tuple-constructor adaptation, the (b) seat/edge API omissions and the (c) guide line. The 001844/002042 graphical runs are one shared reverse of three patches with a tree-identity mismatch (the pin names the dirty tree 5d1b9a9e while the receipt records the clean commit) and are not per-row proofs; this row's own graphical control is its reverted-tree run in the promotion JSON."
