[[bug]]
id = "PHYSICS-CLIP-MISSING-VANILLA-EPSILON-EARLY-RETURN"
title = "Vanilla's `|d| < 1.0E-7 -> 0.0` early return in VoxelShape.collideX was missing on every axis, so a negligible motion still ran the full shape sweep (the old kernel returned the sub-epsilon step unchanged, e.g. 1e-8, where vanilla returns 0.0)"
area = "gameplay"
repro = "source"
severity = "minor"
status = "fixed"
source = "javap of VoxelShape from the 26.1.2 server jar (sha256 4723380bd2a0a0206719b50f2e390383afdaf82b0a76a0d573baf788e6aa3e86), recorded in receipts/D123/D123Battle/javap/voxelshape-collidex.txt: collideX returns the motion unchanged for an empty shape, then returns 0.0 whenever `Math.abs(d) < 1.0E-7` (offsets 9..21), before the axis cycle and the sweep; collideY/collideZ reach the same body through AxisCycle. clip_x/y/z had no such early return, so a body with a sub-epsilon motion entered the sweep on all three axes and came back with that motion (1e-8) instead of vanilla's 0.0. Documented limits: (1) the guard tests the box list `collision_boxes_for_motion` produces, which widens the Y scan by step_height + max_local_y, so it can fire on a larger list than vanilla's per-shape check; (2) it is an entry-only check, where vanilla re-checks |d| < 1.0E-7 before every shape in the list; (3) the mob horizontal path in `step_entity` resolves through `resolve_horizontal_sweep`, so the early return covers `resolve_horizontal_axes` (clip_x/clip_z) and `clip_y`, not the sweep's own per-face clamp; (4) -0.0 now returns +0.0, and nothing depends on the sign bit."
regression = ["cargo:mc-physics:tests::a_sub_epsilon_axis_step_is_zero_on_every_axis"]
failing_first = "reported"
fix_commit = "f3cdf12a48b6b2a98b81b73a6609dcca9901c6d6"
promotion = "docs/bugs/promotions/PHYSICS-CLIP-MISSING-VANILLA-EPSILON-EARLY-RETURN.json"
repro_check = "promote control of f3cdf12a48 (20261123T190956-ledger-promote-0h55qapw): reversing only the three guards left the test green up to the `0.0` assertions for +-1e-8 on x/y/z, red there; restored green on the same head"
