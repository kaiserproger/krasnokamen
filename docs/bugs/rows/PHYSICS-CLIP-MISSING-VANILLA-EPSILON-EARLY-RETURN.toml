[[bug]]
id = "PHYSICS-CLIP-MISSING-VANILLA-EPSILON-EARLY-RETURN"
title = "Vanilla's `|d| < 1.0E-7 -> 0.0` early return in VoxelShape.collideX is not implemented on any axis, so a negligible motion still runs the full shape sweep"
area = "gameplay"
severity = "minor"
status = "open"
source = "javap of VoxelShape from the 26.1.2 server jar (sha256 4723380bd2a0a0206719b50f2e390383afdaf82b0a76a0d573baf788e6aa3e86), recorded in receipts/D123/D123Battle/javap/voxelshape-collidex.txt: collideX returns the motion unchanged for an empty shape, then returns 0.0 whenever `Math.abs(d) < 1.0E-7` (offsets 9..21), before the axis cycle and the sweep. clip_x/y/z have no such early return, so a body with a sub-epsilon motion still enters the sweep on all three axes. No failure is recorded yet: the sweep with a negligible motion should return the same value, and the only visible cost is the work."
repro = "source"
regression = ["cargo:mc-physics:tests::a_sub_epsilon_axis_step_is_zero_on_every_axis"]
failing_first = "not recorded"
fix_commit = "f3cdf12a48b6b2a98b81b73a6609dcca9901c6d6"
