repro_check = ["The G2L real-client stab hit-test exists as the registered scene `native-v2-spear-jab-decode` (scene-shot, windowed native; `tools/harness/spear_jab_scene.json`): the client holds the iron spear, looks at a NoAI cow two blocks ahead and dispatches one ordinary attack (wire-8 STAB); the step asserts the target's own received state (health drop or removal) and fails on a dropped jab. The promotion's control is `patch:e9197d12` (the decode hunk only, which reverses on the promotion tree 1aee24a9 and still reverses on the final integration tree e1c374dc - `git apply -R --check`, 2026-11-27): it reds exactly two refs at their own assertions, `cargo:mc-edge:decode::decode_tests::player_action_maps_dig_drop_release_swap` (`crates/mc-edge/src/decode_tests.rs:579`, `left: []`) and `cargo:mc-edge:translation::adjacent::play::tests::old_client_stab_reaches_core_input_through_adjacent_translation` (`crates/mc-edge/src/translation/adjacent/play_tests.rs:724`, `left: []`, protocol 775). The other five cargo refs stay green on the control because they construct `PlayerInput` and the item facts directly; they are guards, not proving refs. The scene is green in the candidate client receipt (`tree_head` 1aee24a9, as the receipt's covered ref) and `unrunnable` on the control ('release server: no registered pin-release server'), so it is not a proving ref and a graphical red on a reversed pin is still owed; the promotion has no `control_tree_sha256`, so `ledger graphical-control` cannot backfill it and a re-promotion is needed. The kernel half (`crates/mc-core/src/tick/input/combat.rs` `stab`) is not covered by any control. Evidence and limits in `docs/bugs/promotions/PLAYER-SPEAR-JAB-DROPPED-AT-DECODE.hunks.md`."]
