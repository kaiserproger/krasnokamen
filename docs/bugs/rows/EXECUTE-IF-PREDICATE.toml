regression = ["cargo:mc-core:command_execution::tests::selector_predicate_tests::execute_if_predicate_binds_the_datapack_predicate_to_the_command_origin"]
repro_check = "`condition()` in `crates/mc-core/src/command_context.rs` implements `if|unless predicate <id>`: the id is parsed and resolved against the installed datapack predicates while parsing (a missing id fails the command with `argument.resource_or_id.no_such_element`, a malformed one with `argument.resource_or_id.invalid`), and the predicate evaluates against a command loot context whose ORIGIN is the execution position (`advancements::location_at` + `command_execution::predicate_event_at`), so `positioned`/`in` move the origin and `unless` inverts. Regression: `execute_if_predicate_binds_the_datapack_predicate_to_the_command_origin` (match, positioned origin, unless, unknown-id refusal and its translated feedback). repro=source, so the row needs no client gate."
failing_first = "not recorded"
fix_commit = "8e1ea70158edc754b116bf1318ee6a607aa6b969"
