[[bug]]
id = "BATTLE-SEPARATION-CELL-CAP-DROPS-NEIGHBOURS-UNREPORTED"
title = "The battle crowd separation grid packs at most CELL_CAP = 8 bodies per one-block sub-cell and silently drops the rest, and the overflow counter never reaches FormationWork, so no gate receipt can say whether the 3 % and 15 % heap limits were measured with candidates missing."
area = "gameplay"
repro = "source"
severity = "minor"
status = "fixed"
source = "receipts/Books/REPORT-R6.md section 1 G6 (Ericson 7.1.1 p. 287: the per-cell bound follows from non-interpenetration, which a heap breaks; 7.7.2 time stamping; measurement gap, not a proved defect). crates/mc-core/src/battle/steering.rs SeparationGrid::rebuild drops bodies past CELL_CAP and increments self.overflow (asserted in steering_tests.rs but never added to FormationWork, crates/mc-core/src/battle/formation.rs), and nearest_where searches only packed indices, so in a dense heap the bodies it most needs to separate from are the ones it cannot see. BATTLE-OBLIQUE-GAP-REOPEN and BATTLE-BOUNDARY-REOPENS-GAP are fixed with heap 4.51 % -> 1.12 % (foot) and 6.01 % -> 6.04 % (horse); the cap may bias exactly that metric. Verified open on main 5bdc02911 (overflow absent from formation.rs). Fix direction: expose overflow in the work counters (about one line in steering.rs) and re-run the 1000-a-side fixture; if overflow is 0 in the residual heaps the cap is exonerated by data, otherwise pack every body and de-duplicate the query (time stamping) instead of dropping data."
regression = ["cargo:mc-core:battle::ranks_tests::the_production_tick_reports_the_separation_grids_dropped_candidates"]
fix_commit = "patch:313e9566e45198db840df08ef6c13650e2ad5adf097aafdd72865b3c5d91a55b"
failing_first = "not recorded"
repro_check = ["Fixed in tree (c393b9240) and window-ready: the grid-s dropped-candidate count reaches `FormationWork::separation_overflow` and the RANKS gate prints `separation_overflow_max` (PERF-QUEUE.md item 5). The row-s red now exists without a client: `the_production_tick_reports_the_separation_grids_dropped_candidates` (ranks_tests) runs only `run_tick` on a staged 60-a-side battle with every soldier's entity moved into one sub-cell, so it reds when the mirror call is reversed while the two helper-level tests (steering_tests, ranks_test H4) stay green. The fix is `patch:` of that one production call (docs/bugs/promotions/BATTLE-SEPARATION-CELL-CAP-DROPS-NEIGHBOURS-UNREPORTED.hunks.md maps the kept field/helper). Separate measurement, not this symptom: the 1000-a-side RANKS foot and horse cells under Main-s `-x` window now *can* report whether a heap was measured with bodies past the cap; reading that number is Main-s window work."]
promotion = "docs/bugs/promotions/BATTLE-SEPARATION-CELL-CAP-DROPS-NEIGHBOURS-UNREPORTED.json"
