repro_check = "WITHDRAWN 2026-11-25 after the Opus code review: the 0.85 span threshold was chosen AFTER seeing 1.10/1.122 and 0.69/0.70 and its stated justification is wrong - the body is 2 px = 0.125 blocks; 0.694 is 11.1 px, the distance from the head's front face at -2.5 px to the wing tip at 0.6 + 8 px in the LAYER rest pose. The check is one-sided too: wings of size 0 still submit 42 quads with span 0.31, and a rig scaled 0.6 passes. Rabbit/fox/panda/vex moved to MODEL-OPUS-11-RABBIT-FOX-PANDA-VEX and the horse family to MODEL-OPUS-11-HORSES. Still OPEN after `javap -p -c net/minecraft/client/model/animal/allay/AllayModel` on the local 26.3 client jar (solaris/.analysis/decompile/client.jar, Mojang names, never committed): setupAnim sets right_wing.xRot = 0.4363 * (1 - min(walkSpeed / 0.3, 1)) and right_wing.yRot = -0.7854 + f, left mirrored (+0.7854 - f) - so at idle the VANILLA allay holds its wings at 25 degrees about x and -+45 about y, not the flat rest pose the layer dump records. The client never applies that (presentation.rs only rolls the allay +-0.3 rad, `folds_wings` in state.rs excludes it), so the 0.69-block span the check measured is the client's rest pose, and a rest-pose window (|span - 0.694| <= 0.03) would freeze that non-vanilla pose. Redesign: implement AllayModel.setupAnim's wing rotation in the client, then assert the ANIMATED span, which the layer dump plus those angles put at 0.7696 blocks horizontally (x -0.385..0.385; the rest pose is 0.6937 with x +-0.156) - a two-sided |span - 0.770| <= 0.03. Nothing here can be promoted before that client change and a fresh pair."
