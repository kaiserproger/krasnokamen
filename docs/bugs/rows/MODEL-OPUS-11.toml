repro_check = "WITHDRAWN 2026-11-25 after the Opus code review: the 0.85 span threshold was chosen AFTER seeing 1.10/1.122 and 0.69/0.70 and its stated justification is wrong - the body is 2 px = 0.125 blocks; 0.694 is 11.1 px, the distance from the head's front face at -2.5 px to the wing tip at 0.6 + 8 px in the LAYER rest pose. The check is one-sided too: wings of size 0 still submit 42 quads with span 0.31, and a rig scaled 0.6 passes. Rabbit/fox/panda/vex moved to MODEL-OPUS-11-RABBIT-FOX-PANDA-VEX and the horse family to MODEL-OPUS-11-HORSES. Still OPEN after `javap -p -c net/minecraft/client/model/animal/allay/AllayModel` on the local 26.3 client jar (solaris/.analysis/decompile/client.jar, Mojang names, never committed): setupAnim sets right_wing.xRot = 0.4363 * (1 - min(walkSpeed / 0.3, 1)) and right_wing.yRot = -0.7854 + f, left mirrored (+0.7854 - f) - so at idle the VANILLA allay holds its wings at 25 degrees about x and -+45 about y, not the flat rest pose the layer dump records. The client never applies that (presentation.rs only rolls the allay +-0.3 rad, `folds_wings` in state.rs excludes it), so the 0.69-block span the check measured is the client's rest pose, and a rest-pose window (|span - 0.694| <= 0.03) would freeze that non-vanilla pose. Redesign: implement AllayModel.setupAnim's wing rotation in the client, then assert the ANIMATED span, which the layer dump plus those angles put at 0.7696 blocks horizontally (x -0.385..0.385; the rest pose is 0.6937 with x +-0.156) - a two-sided |span - 0.770| <= 0.03. Nothing here can be promoted before that client change and a fresh pair. Follow-up 2026-11-25 (Main's task list, and the derivation demanded before any pair run): the client now APPLIES `AllayModel.setupAnim`'s wings in `presentation::procedural_part` (25 deg about x times 1 - k, right wing -45 deg + flap about y, left mirrored, flap = cos(ageInTicks * 20 deg + walkAnimationPos) * PI * 0.15 + walk speed, k = min(speed / 0.3, 1)), unit-covered by `entities::presentation::tests::allay_wings_take_the_vanilla_setup_anim_pose`. The proposed two-sided |span - 0.770| <= 0.03 is NOT satisfiable and was not used: 0.770 is only the value at flap 0. Evaluated with the client's bone convention on the dumped allay rig, the flap sweeps the y angle over -72..-18 deg and the horizontal span over 0.7014 (at -39.6 deg) .. 1.0135 (at -72 deg), against 0.6937 for the rest pose and 1.122 for the pre-image's baked-spread wings - so the span cannot witness the pose at all (its minimum is 1.1% above the rest pose) and only an envelope is honest: `allay_wing_span_within_wings` now asserts 0.68..1.03, which covers every flap phase and still separates the pre-image. The row does NOT stay open on that ground (Main's decision, 2026-11-25): its claim is the invented rig -> vanilla rig re-land PLUS the pose, and the envelope separates the invented-rig control (1.122, red) from the vanilla-rig+pose client (green inside the window) - that is the row's claim; a pose-less control is not the row's pre-image and is out of the scene's reach. The pose half is pinned by `entities::presentation::tests::allay_wings_take_the_vanilla_setup_anim_pose`, which runs green on the candidate and CANNOT run on the control (the control tree has no `walk_pos` argument to `procedural_part`, so the test does not compile there - it is a candidate-only ref, not a negative control). Envelope margins, derived before the pair: low 0.7014 - 0.02 slack = 0.68, high 1.0135 + 0.016 = 1.03. Per-bone witness or recorded visual review would be a future strengthening, not a requirement."
