[[bug]]
id = "PLUGIN-MENU-CLICK-FLOOD-HALTS-WORLD"
title = "Repeated clicks on a plugin inventory menu, one durable event each, fill the plugin event queue past 1024 and halt the whole world without a final checkpoint, even with a healthy plugin host"
area = "gameplay"
repro = "source"
severity = "major"
status = "fixed"
source = "Rule-5 review of PluginBacklogHalt (receipts/PluginBacklogHalt/REVIEW.md, finding medium; static read at bd2c27a1): crates/mc-core/src/tick/players.rs:182-183 passed every InventoryMenuClicked from plugin_player::menu_input to enqueue_result with no backlog check. refresh_menu does not raise the native state_id, so a client repeating the same click on an open menu gets one event per click; with the optional basic-economy package (the only deployed one that calls open_inventory_menu) two or three hostile clients with a burst of 1000 ContainerClick per tick push pending_events to 1024, which sets delivery_failed and halts the world at seal_events. A stalled plugin host reaches the same state with fewer clicks. Not reachable in the standard pack, which opens no menu."
failing_first = "reported"
regression = ["cargo:mc-core:plugin_player::tests::a_stalled_plugin_drops_menu_clicks_instead_of_halting_the_world"]
fix_commit = "patch:8aa0536fa9665224a4f38e0d364390e0b59f8f6e1ba0e84cb4a2d5c8dd4cf0d8"
promotion = "docs/bugs/promotions/PLUGIN-MENU-CLICK-FLOOD-HALTS-WORLD.json"
