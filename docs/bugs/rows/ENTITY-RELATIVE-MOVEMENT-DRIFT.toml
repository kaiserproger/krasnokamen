[[bug]]
id = "ENTITY-RELATIVE-MOVEMENT-DRIFT"
title = "Relative entity movement can accumulate negative viewer drift on closed trajectories"
area = "client"
severity = "major"
status = "open"
source = "SOURCE-INFERRED from mc-edge plan::entity_movement: flooring raw displacement sends +40 then -41 for y=69 -> 69.01 -> 69, while retaining raw endpoints. Throwaway arithmetic accumulates -0.25 blocks after 1024 cycles. Local official 26.1.2/26.2/26.3 VecDeltaCodec metadata instead rounds endpoints (ties +infinity) before subtraction. Neither a production-byte reproduction nor Spain's native underground/population cause is established."
repro = "source"
regression = ["cargo:mc-edge:plan_tests::shared_moves_tests::relative_movement_cycles_return_the_decoded_consumer_to_origin", "cargo:mc-edge:plan_tests::shared_moves_tests::relative_movement_rounds_endpoints_at_signed_half_step_boundaries", "cargo:mc-edge:plan_tests::shared_moves_tests::relative_movement_preserves_unsent_components_and_accumulates_small_steps", "cargo:mc-edge:plan_tests::shared_moves_tests::relative_movement_range_uses_quantized_endpoints_and_sync_resets_the_consumer"]
fix_commit = "patch:536ca16ddbccab572a1a380c315921494d42fcd641060747f7bfd60a4a8b8477"
failing_first = "not recorded"
repro_check = "Fixed in tree by 4256150e2 (crates/mc-edge: relative_move_delta rounds 1/4096 endpoints with ties toward +infinity and keeps the raw baseline for thresholds). The four registered relative_movement_* tests ran green on core dcc1dd2486 (cargo test -p mc-edge --lib relative_movement: 4 passed, 0 failed; log receipts/D123/D123ClientRest/negctl-entity-relative-refs.log). The recorded patch docs/bugs/fix-patches/ENTITY-RELATIVE-MOVEMENT-DRIFT.patch (sha256 536ca16d…) was written against the pre-split plan.rs and no longer reverse-applies after 9d71feb62 split plan.rs into owner modules, so promotion needs the patch forward-ported to plan/entity_motion.rs first. It also needs a real graphical ref for a closed 1024-cycle relative trajectory: no scene drives one, and the per-cycle loss is at most 1/4096 block, so the drift is invisible in a frame. Owner decision CR-5 asks whether the cargo refs may close it (POL-2 shape)."
