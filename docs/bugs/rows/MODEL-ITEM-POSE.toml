repro_check = "Fix identified 2026-11-24 (this lane): ad0fd066 selects the copper-golem statue item pose layer (standing/running/sitting/star) and stands the held statue upright at its feet (presentation.rs special_item, two hunks), and implements swap_animation_scale for the 7 spear items in player/visual.rs, with the client-side held-items scene and Java oracle (tools/held_items_scene.json). The earlier credit of this row to 4380b088 was wrong, and the earlier credit of ad0fd066 to MODEL-USE-POSE was wrong. No promotion yet: needs a frame that shows the statue item in two poses (a dropped or held statue item whose model node carries `pose`), then the pair 83994480-style. Note the HEAD text is softer than the fix: `special[\"pose\"].as_str().unwrap_or(\"standing\")` at presentation.rs:3287, so the hunk must be hand-ported against that line. D123PackPairs3 (2026-11-26): measured dead end for a promotion. `git apply -R --check` of ad0fd066's whole non-test patch at ba1971d76215 fails on src/player/visual.rs:458, src/entities/presentation.rs:2362 and docs/AGENT_TESTING.md:75 (the file was rewritten since 2026-11-11), and a client row has no patch-mode path: the client-receipt rule requires the control and restore pins to differ by exactly the fix's non-test patch, so a hand-ported subset (the two presentation.rs hunks alone) is refused. The pre-rename pins 72ce659a/ad0fd066 are from 2026-11-11 and predate the client rename f0a6abf6, so no pre-image client builds either. The fixture itself is known (tools/held_items_scene.json holds `minecraft:copper_golem_statue[block_state={copper_golem_pose:sitting}]`), and a dropped item entity is the layer-geometry form; what is missing is a buildable control, not the witness."
