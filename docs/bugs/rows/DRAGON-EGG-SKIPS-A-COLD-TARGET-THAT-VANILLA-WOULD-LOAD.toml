[[bug]]
id = "DRAGON-EGG-SKIPS-A-COLD-TARGET-THAT-VANILLA-WOULD-LOAD"
title = "Dragon egg teleport parity: vanilla loads the sampled target chunk and lands the egg, HEAD refuses a cold target"
area = "gameplay"
repro = "cargo"
severity = "minor"
status = "open"
source = "Split from DRAGON-EGG-TELEPORTS-INTO-COLD-CHUNK-OVERLAY (review 7 B2; docs/bugs/README.md 'one row describes one symptom'): the fixed row closes the write into the cold overlay. This row keeps the remaining parity gap at the edge of the resident zone - vanilla's Level.getChunk loads the sampled target and the egg lands there, while HEAD now skips a target whose column is not resident."
regression = [
  "cargo:mc-core:interact_parity_tests::interact_parity_dragon_egg_requests_a_cold_target_through_the_demand_path"
]
repro_check = "Implemented as OD-1 option 1. `vanilla_interact::dragon_egg` records the first in-border, unprotected sample whose chunk is not resident (origin, target, egg state, clicking actor, 40-tick budget); `TickState::desired_chunks` adds that chunk at priority 0 while the record lives, and the tick's chunk phase (`complete_pending_egg_teleports`, after `ensure`) performs the vanilla move through `set_block` + `merge_block_writes`; the record is dropped when the egg moved or changed state, the cell is no longer air, the border/protection/plugin checks now fail for the loaded cell, the clicking actor left, or the budget expired. A cold sample is recorded without any air/protection/plugin test because a non-resident cell reads as None (REVIEW-wave2-13 M1); divergence from vanilla, recorded here: vanilla samples on past a loaded non-air cell, while this keeps the cold-overlay row's guarantee and the egg stays. Proof: `interact_parity_dragon_egg_requests_a_cold_target_through_the_demand_path` uses only the public surface (run_tick, desired_chunks, world blocks, entity rows) - the click tick yields exactly one new priority-0 demand that no player had before (red on any pre-image), the egg waits at the origin, and after a blocking admission the next tick empties the origin and the egg's custody (block or the falling entity the same tick schedules) is exactly one inside the sampled box. Not tested: the expiry path (a run where the requested chunk never arrives) — with the real loader the request completes in a few ticks, so a public-surface expiry test would measure the loader, not the budget; and a checkpoint between request and completion (tick-note (d)) - the record is derived state that TickState::new initialises empty and no persistence path serialises it, so the guard is construction rather than a test. The control is the reversal of the non-test hunks that `ledger promote` applies, which the public-surface test reds at the missing priority-0 demand."
fix_commit = "patch:92ca0cba74a2e60785588c48234dcf793fa40c3fe59f117e57c276ffe18fe8da"
failing_first = "not recorded"
