[[bug]]
id = "BED-OCCUPIED-STATE-SURVIVES-A-CRASH"
title = "A checkpoint taken while a player sleeps leaves occupied=true on his bed after a crash, with no derived set to clear it"
area = "gameplay"
severity = "minor"
status = "fixed"
source = "Review REVIEW-wave2-9 minor-6, from BED-OCCUPIED-PROPERTY-NOT-MIRRORED: `TickState::occupied_beds` is derived runtime state (`crates/mc-core/src/tick.rs:446`, rebuilt by `sleep::mirror_occupied_beds`), while the bed block's `occupied` property is durable. A checkpoint written while a player sleeps persists `occupied=true`; a crash or stop before any tick restores the world with an empty derived set, so the next wake cannot clear the property (a resident restores because its `sleeping` is persisted). Gameplay is unaffected — `use_bed` derives occupancy from `state.sleepers`, never from the property — but the block state stays wrong until someone sleeps in that bed again."
repro = "cargo"
regression = ["cargo:mc-core:core::checkpoint_custody_tests::checkpoint_mid_sleep_leaves_no_stale_occupied_bed_after_reopen", "cargo:mc-core:sleep::tests::a_sleepers_bed_is_not_rewritten_on_the_next_tick"]
failing_first = "not recorded"
fix_commit = "patch:b299f880de3250e234f5d527be8c19bacab85af3cbe32f2ec158f74ac4ff6e34"
proving_refs = ["cargo:mc-core:core::checkpoint_custody_tests::checkpoint_mid_sleep_leaves_no_stale_occupied_bed_after_reopen"]
repro_check = ["Reproduced by cargo:mc-core:core::checkpoint_custody_tests::checkpoint_mid_sleep_leaves_no_stale_occupied_bed_after_reopen. A joined player sleeps in a placed bed on a stone platform at night (the mirror writes `occupied=true` on both halves), the world takes a durably committed checkpoint, the process stops without another tick, and a fresh `World::open` loads that bed chunk from the store and asserts the stale `occupied=true` really is there. The first tick must clear both halves and leave `occupied_beds` empty. Fix: `sync_chunk_block_entities` calls `sleep::seed_occupied_beds` on every hydration pass, i.e. on every storage-revision bump of a resident chunk (not only when a chunk becomes resident), and the existing mirror pass then clears the beds no sleeper or sleeping resident wants. The seed names only the bed's head cell - the key the mirror keeps (`Sleeper::bed`, a resident's `home`), normalising either half by `facing` - because seeding both halves put the foot in `previous` against a `wanted` naming only the head, and the mirror then cleared and set a sleeping player's bed after every revision of its chunk (four block changes to clients and the WAL); cargo:mc-core:sleep::tests::a_sleepers_bed_is_not_rewritten_on_the_next_tick is the guard for that, red with the both-halves seed. The second guard uses a palette scan per revised chunk, which is small next to the chunk's own hydration decode. No persistence-format change: the durable property stays the bed block state, and the derived set is rebuilt from it per hydration. The first promotion (fix 59f68649f1) is superseded by this two-commit fix (59f68649f1 + 27feed72df)."]
promotion = "docs/bugs/promotions/BED-OCCUPIED-STATE-SURVIVES-A-CRASH.json"
