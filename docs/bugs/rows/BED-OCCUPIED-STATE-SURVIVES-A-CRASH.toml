[[bug]]
id = "BED-OCCUPIED-STATE-SURVIVES-A-CRASH"
title = "A checkpoint taken while a player sleeps leaves occupied=true on his bed after a crash, with no derived set to clear it"
area = "gameplay"
severity = "minor"
status = "fixed"
source = "Review REVIEW-wave2-9 minor-6, from BED-OCCUPIED-PROPERTY-NOT-MIRRORED: `TickState::occupied_beds` is derived runtime state (`crates/mc-core/src/tick.rs:446`, rebuilt by `sleep::mirror_occupied_beds`), while the bed block's `occupied` property is durable. A checkpoint written while a player sleeps persists `occupied=true`; a crash or stop before any tick restores the world with an empty derived set, so the next wake cannot clear the property (a resident restores because its `sleeping` is persisted). Gameplay is unaffected — `use_bed` derives occupancy from `state.sleepers`, never from the property — but the block state stays wrong until someone sleeps in that bed again."
repro = "cargo"
regression = ["cargo:mc-core:core::checkpoint_custody_tests::checkpoint_mid_sleep_leaves_no_stale_occupied_bed_after_reopen"]
failing_first = "not recorded"
fix_commit = "59f68649f10dcbdbcf8d28680a3b268c3f6f1cd0"
repro_check = ["Reproduced by cargo:mc-core:core::checkpoint_custody_tests::checkpoint_mid_sleep_leaves_no_stale_occupied_bed_after_reopen. A joined player sleeps in a placed bed on a stone platform at night (the mirror writes `occupied=true` on both halves), the world takes a durably committed checkpoint, the process stops without another tick, and a fresh `World::open` loads that bed chunk from the store and asserts the stale `occupied=true` really is there. The first tick must clear both halves and leave `occupied_beds` empty. Fix: `sync_chunk_block_entities` (the chunk-admission hook) calls `sleep::seed_occupied_beds` for every newly resident chunk, which puts that chunk's `occupied=true` bed cells into `TickState::occupied_beds`; the existing mirror pass then clears the ones no sleeper or sleeping resident wants. No persistence-format change: the durable property stays the bed block state, and the derived set is rebuilt from it per resident chunk."]
promotion = "docs/bugs/promotions/BED-OCCUPIED-STATE-SURVIVES-A-CRASH.json"
