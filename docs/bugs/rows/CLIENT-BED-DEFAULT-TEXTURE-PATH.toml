repro_check = "supersedes the earlier 'obsolete' note: round 2 (client:109ec84a) deleted the bed entity rigs - 26.3 has no bed block entity - and the refs now assert the rigs are not shipped and the bed item uses the resource-model halves. Negative control receipts/XClientBlocks/19-bed-negative-control.log. area=client, candidate: real-client check required REGRESSIONS-CLIENT 2026-11-24: the shared ref entities::krasnokamen_models::tests::every_shipped_model_is_well_formed failed on the tip because it demanded pixel equality between each battle_* rig's UV grid and its packed PNG; all nine rigs follow the pack convention of a whole x4 texel density (crested_helm 64x64 vs 256x256, holy 128x128 vs 512x512, iron_plate 128x72 vs 512x288) and the UVs fit their declared grids exactly, so the rigs were right. Fixed test-side in client:c9814263c3 (whole, equal factor on both axes still rejects a missing or mis-scaled texture); red 20261124T010152-regressions-client-8vrovfce/ledger-170-client-every_shipped_model_is_w.log, green focused run 1 passed. This row still needs its own graphical bed frame."
