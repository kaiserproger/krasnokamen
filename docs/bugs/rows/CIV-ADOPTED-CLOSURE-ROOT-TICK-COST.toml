[[bug]]
id = "CIV-ADOPTED-CLOSURE-ROOT-TICK-COST"
title = "Adopted-village root-tick closure takes hours in villager decisions before proving stock and construction"
area = "gameplay"
repro = "source"
severity = "major"
status = "open"
source = "Initial CivSimLanding base 6b594d8f plus imported CivSim5: the native-root adopted-village closure ran for more than 6,000 seconds without completing. A bounded reproduction advanced about 800 ticks in two minutes, almost all of it in villager brain decisions; residents and mining progress advanced, so this was pathological per-tick decision cost, not an infinite loop or an unreachable goal. Counters and perf identified construction-funding recipe catalog and result scans, repeated slot counting, repeated identical funding proofs and structure-ledger decoding and copying. The landing adds an immutable recipe index, exact slot totals with an undo journal, a negative-only dependency admission, a 16-entry derived funding memo and a decoded structure-ledger cache. The closure is deterministic at tick 72901; the test bounds it at 80000 ticks and checks a deterministic work budget (full funding proofs and recipe candidates) on every tick, which disabling the recipe index, the dependency admission or the memo separately exceeds. Fixture proof only; promotion and real-client acceptance remain separate. Main's row CIV-ADOPTED-CLOSURE-SLOW-ON-MAIN (VillageBreakFixes slice 3, receipts/VillageBreakFixes/results.md: on main 5b4006df the debug test ran past a 600 s deadline, and at 263c7c9c it was killed at 40 minutes; both trees reached tick 4020 after about 945 s in the same state, no loop) is folded into this row at the CivSimLanding landing merge: it is the same per-tick cost, and this row's fix cures it."
regression = ["cargo:mc-core:villager::building_autonomy_tests::adopted_village_with_resident_shears_produces_stock_and_builds", "cargo:mc-core:settlements::construction_crafting::tests::funding_reuses_loaded_index_without_resolving_recipe_results", "cargo:mc-core:settlements::construction_crafting::tests::unavailable_recipe_dependencies_reject_without_changing_the_canonical_answer", "cargo:mc-core:settlements::construction_crafting::tests::slot_totals_preserve_saturation_unknown_ids_and_nested_rollback", "cargo:mc-core:settlements::construction_crafting::tests::funding_memo_matches_every_input_class_by_value_and_retains_index_identity", "cargo:mc-core:plugin_structures::tests::decoded_structure_ledger_is_derived_from_checkpoint_and_wal_bytes"]
failing_first = "reported"
repro_check = "Patch mode attempted and refused as impossible: the fix is the CivSim-5 landing 4e6874ded (116 files, 74,723 lines) and its perf claim lives in plugin_structures.rs (+174, the decoded structure ledger) and settlements/construction_crafting.rs (+688: the immutable recipe index, SlotTotals with its undo journal, negative-only dependency admission and the 16-entry FundingMemo). Those are APIs carried into other production code: registry.rs:261 refresh_recipe_indexes is called from datapacks.rs:1192 and :2188 and plugin_startup.rs:186; settlements/registry.rs:121 stores the FundingMemo; settlements/construction.rs and settlements/production.rs pass it. A forward port of only the performance hunks therefore reverses to a tree where those call sites no longer compile, so every API hunk needs a (b) exclusion and the patch cannot both carry the row's claim and produce a red assertion. What remains is a decision for the owner: split a narrow perf commit behind stable signatures (then patch mode applies), or accept the landing's own control."
