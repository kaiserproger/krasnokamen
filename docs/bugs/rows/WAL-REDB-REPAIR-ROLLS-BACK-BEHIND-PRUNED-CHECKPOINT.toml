[[bug]]
id = "WAL-REDB-REPAIR-ROLLS-BACK-BEHIND-PRUNED-CHECKPOINT"
title = "redb's unattended repair can roll the store back to the previous commit behind an acknowledged checkpoint whose WAL was already pruned, and nothing durable records that the newer checkpoint ever existed, so the server serves the older world."
area = "gameplay"
repro = "source"
severity = "major"
status = "fixed"
source = "receipts/Books/REPORT-R4.md section 1 R4-P1 (OSTEP 45.6 lost writes, 42.3 forcing writes; data loss). Mechanism read from redb 3.1.0 [INFERENCE]: crates/mc-world/src/native.rs opens the store with the default builder, and when the newest commit slot fails its checksum redb swaps to the older slot; the WAL is pruned right after the commit (crates/mc-core/src/core/journal.rs prune_batches_through iff committed), so no WAL covers the lost interval (up to checkpoint_every_ticks = 1200 ticks, about 60 s of play: players, entities, plugin domains and block edits vanish with no refusal). Partly addressed on main: 4e060c76c / 970060909 install a repair callback that counts repairs and the serving path logs ERROR 'redb repaired ...' (native.rs redb_repairs), so the rollback is now visible. NOT closed: no durable marker of the last acknowledged checkpoint tick exists, so startup cannot tell a rollback of a durable checkpoint from a clean open and does not refuse. Fix direction in the report: write <world>/native/checkpoint-tick (File::create + write + sync_all + rename + sync_parent_dir via atomic_file.rs) after a successful commit and before prune, and refuse startup when the store's committed tick is below it (a crash between commit and marker is harmless: marker <= store tick by construction). Regression sketch: native/checkpoint_drill_tests.rs corrupts the newest commit slot after a committed and pruned checkpoint, reopens, and requires a refusal. Recovery-contract change; the report keeps it out of the pre-announcement freeze."
regression = ["cargo:mc-core:core::store_marker_tests::a_store_rolled_back_behind_the_marker_is_refused_before_replay", "cargo:mc-core:core::store_marker_tests::an_interrupted_first_start_publishes_the_marker_once_and_then_refuses", "cargo:mc-core:core::store_marker_tests::a_marker_write_failure_prunes_nothing_and_halts_the_world", "cargo:mc-core:hot_backup_tests::copy_refuses_a_marker_ahead_of_the_committed_checkpoint", "cargo:mc-core:hot_backup_tests::copy_refuses_a_marker_from_another_store", "cargo:mc-world:store_marker_tests::store_behind_the_marker_is_refused_and_names_both_ticks", "cargo:mc-world-tools:world_maintenance::tests::compact_refuses_a_store_that_disagrees_with_its_checkpoint_marker", "cargo:mc-world-tools:worldgen_upgrade::tests::a_stale_marker_with_a_refused_upgrade_leaves_the_world_unchanged", "cargo:mc-world-conversion:census_tests::census_keeps_a_store_ahead_of_its_marker_byte_identical_and_refuses_a_bad_pair", "cargo:mc-world-conversion:probe_tests::probe_keeps_a_store_ahead_of_its_marker_byte_identical_and_refuses_a_foreign_pair", "cargo:mc-edge:backup::tests::offline_backup_and_restore_keep_the_store_and_its_marker_paired", "cargo:mc-edge:backup::tests::restore_refuses_a_marker_from_another_store"]
failing_first = "not recorded"
fix_commit = "patch:e749161b0a6f48036bd7da2f35c04d4a06168b519bbec2dd9edc513d19ca359a"
