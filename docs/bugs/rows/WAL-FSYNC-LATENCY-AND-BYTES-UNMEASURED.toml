[[bug]]
id = "WAL-FSYNC-LATENCY-AND-BYTES-UNMEASURED"
title = "No receipt records WAL fsync service time, fsync count or WAL bytes per tick; only the tick-side journal_queue_us exists, so the 15 ms journal budget row and the 1M durability story have no measurement behind them."
area = "harness"
repro = "source"
severity = "minor"
status = "fixed"
source = "receipts/Books/REPORT-R1.md gap G-5 and section F5 (Gregg 8.5.2 file system latency analysis, 9.5.2 disk USE; perf/durability). crates/mc-core/src/journal.rs appends one file per tick (File::create, write_all, sync_all, rename, directory fsync every fsync_every batches); the dashboard exposes journal_build_us and journal_queue_us (crates/mc-edge/src/dashboard.rs), which are queue and backpressure, not service time; the WAL creates 20 files/s (1.7 M files/day in one directory) and at 1M the batch size grows with the entity count; the 128-batch queue absorbs a slow fsync until it fills and then the tick blocks with a cause invisible in every current receipt. Verified open on main 5bdc02911 (no fsync latency or batch-byte counter in dashboard.rs). Measurement (no rebuild needed): bpftrace on vfs_fsync per thread name for p50/p99/p999, biolatency-bpfcc and iostat -x 5 for the device, WAL bytes/tick from new batch files or a counter beside journal_build_us, correlated with journal_queue_us p99. Related R1 idea I-9 (WAL micro-benchmark) is in receipts/Perf1M/BOOKS-IDEAS.md."
failing_first = "not recorded"
regression = [
"cargo:mc-core:journal_tests::append_counts_published_bytes_and_fsync_service_time",
"cargo:mc-edge:dashboard::tests::stats_carry_wal_write_cost_and_close_causes",
"python:tools.coreperf.test_profiles:WindowReceiptFieldsTests.test_receipt_records_wal_fsync_service_time_and_bytes"
]
proving_refs = ["python:tools.coreperf.test_profiles:WindowReceiptFieldsTests.test_receipt_records_wal_fsync_service_time_and_bytes"]
fix_commit = "154914e44e83c78340ebcd7adb18a44ce449b862"
repro_check = "The path was closed by two commits, both named and each reversed on its own (docs/bugs/README.md, Fix in several commits); the promotion's identity is the second one only. 2941bc91f88f537c0bf113c43cbac46717ac2b79 added the counters - crates/mc-core/src/journal.rs (published bytes, file and directory fsync counts, fsync nanos), the dashboard fields (crates/mc-edge/src/dashboard.rs, dashboard/prometheus.rs, dashboard/state.rs) and the receipt rollup - with its own control red at test_receipt_records_wal_fsync_service_time_and_bytes (tools/coreperf/test_profiles.py:1253 then), artifact 20261124T174658-ledger-promote-x9ky_i1n, both cargo refs unrunnable under that reversal. 154914e44e83c78340ebcd7adb18a44ce449b862 fixed the divisor and the max's scope and is the row's fix_commit; its control reverses tools/coreperf/profiles.py and tools/bench/remote.py only, so the two cargo refs stay green there (they build a journal/dashboard state directly) and are compatibility checks, not proving refs, which is why proving_refs names the python ref. Its red is the same test at test_profiles.py:1306 then (:1391 today) on fsync_ms_mean 0.3 before / 0.25 after, artifact 20261124T190524-ledger-promote-ccpm7zpt. summary.journal reports the window delta of append_bytes_total, file_fsyncs_total and dir_fsyncs_total, append_bytes_per_tick over the source ticks between the two samples, batch_bytes_last, fsync_ms_mean = window fsync nanos / (file + directory fsyncs) because fsync_nanos_total times both kinds (the old file-only divisor inflated the mean by every journal flush), and fsync_ms_max_since_start, the process-lifetime fetch_max named for its scope instead of being presented as a window maximum. A server without the counters, or fewer than two samples, yields a named unavailable. Binding both production changes under one identity still needs a re-promotion with a combined patch of both commits' non-test hunks: the counters are not reversed by this receipt. Journal device utilisation is not measured and the row title no longer claims it: a window receipt that wants that number needs an iostat/queue-depth capture, a separate finding. A real window receipt is prepared as W1 in receipts/D123/D123Harness/PERF-QUEUE.md, not required for this row's proof."
promotion = "docs/bugs/promotions/WAL-FSYNC-LATENCY-AND-BYTES-UNMEASURED.json"
