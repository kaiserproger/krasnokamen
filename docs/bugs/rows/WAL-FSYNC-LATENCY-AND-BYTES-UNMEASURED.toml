[[bug]]
id = "WAL-FSYNC-LATENCY-AND-BYTES-UNMEASURED"
title = "No receipt records WAL fsync service time, fsync count, WAL bytes per tick or journal device utilisation; only the tick-side journal_queue_us exists, so the 15 ms journal budget row and the 1M durability story have no measurement behind them."
area = "harness"
repro = "source"
severity = "minor"
status = "open"
source = "receipts/Books/REPORT-R1.md gap G-5 and section F5 (Gregg 8.5.2 file system latency analysis, 9.5.2 disk USE; perf/durability). crates/mc-core/src/journal.rs appends one file per tick (File::create, write_all, sync_all, rename, directory fsync every fsync_every batches); the dashboard exposes journal_build_us and journal_queue_us (crates/mc-edge/src/dashboard.rs), which are queue and backpressure, not service time; the WAL creates 20 files/s (1.7 M files/day in one directory) and at 1M the batch size grows with the entity count; the 128-batch queue absorbs a slow fsync until it fills and then the tick blocks with a cause invisible in every current receipt. Verified open on main 5bdc02911 (no fsync latency or batch-byte counter in dashboard.rs). Measurement (no rebuild needed): bpftrace on vfs_fsync per thread name for p50/p99/p999, biolatency-bpfcc and iostat -x 5 for the device, WAL bytes/tick from new batch files or a counter beside journal_build_us, correlated with journal_queue_us p99. Related R1 idea I-9 (WAL micro-benchmark) is in receipts/Perf1M/BOOKS-IDEAS.md."
failing_first = "not recorded"
regression = [
"cargo:mc-core:journal_tests::append_counts_published_bytes_and_fsync_service_time",
"cargo:mc-edge:dashboard::tests::stats_carry_wal_write_cost_and_close_causes",
"python:tools.coreperf.test_profiles:WindowReceiptFieldsTests.test_receipt_records_wal_fsync_service_time_and_bytes"
]
fix_commit = "2941bc91f88f537c0bf113c43cbac46717ac2b79"
repro_check = "Implemented in 2941bc91f: crates/mc-core/src/journal.rs counts every published batch frame's bytes (append_bytes_total, batch_bytes_last) and times each File::sync_all and directory fsync (file_fsyncs_total, dir_fsyncs_total, fsync_nanos_total, fsync_nanos_max) in process-wide atomics read by journal_write_stats(); crates/mc-edge/src/dashboard exposes them in /stats.journal and /metrics (krasnokamen_journal_append_bytes_total, _fsyncs_total, _fsync_nanoseconds_max); tools/coreperf/profiles.py summarize adds summary.journal with the window delta, mean and worst fsync milliseconds, bytes per source tick and the last batch size, or a named unavailable when a server does not report the counters. The cargo refs run the writer and the dashboard on a tempdir WAL (green at HEAD, unrunnable under the reversal because the reversed hunks remove the fields their test files read); the red is test_receipt_records_wal_fsync_service_time_and_bytes at summarize's journal key. This is the measurement half of the row; a real rung receipt is not its proof (the receipt field's fixture test owns it), and a window would quote real service times - the row's capacity claims stay with the PERF1M rows."
