repro_check = "The fix (client:9102bbd4) keeps the window hidden and presents one frame in `resumed` before set_visible, but window-mapping timing has no unit seam and the client publishes no first-frame/mapping timestamp: a native run's observation carries no startup timing (`details` has launch_status/initialized only), so the 25-60 s grey period cannot be measured from a receipt. Measuring it needs a client instrumentation commit (log the window map time and the first presented frame time), a pinned pair with that instrumentation (fix / pre-fix), and a windowed run measuring the gap; the row is not closable without it."
