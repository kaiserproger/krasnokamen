[[bug]]
id = "ENTITY-READ-ROW-248-BYTES-COPIED-PER-ENTITY-TICK"
title = "A 248-byte ReadRow is built into out.rows and then copied by value into step_entity for every entity every tick (about 500 MB of snapshot traffic per tick at 1M), on top of an admission and snapshot pass measured at about 11.6 ms per tick at 1M rows."
area = "gameplay"
repro = "source"
severity = "minor"
status = "open"
source = "receipts/Books/REPORT-R2.md finding R2-3 (Bakhvalov 8.1, Drepper; perf, H5). ReadRow = 248 B (PREP_MICRO size_of_read_row=248, receipts/CritiqueTriage/prep-100k.log:4, prep-1m.log:4); prepare_rows (crates/mc-core/src/tick/entity_phase.rs) fills out.rows and tick/system_graph.rs runs step_entity(*row, ctx) by value per entity; the repo micro parallel_row_prep_algorithm_micro measured 46.267 ms (parallel) / 88.081 ms (serial) over 4 iterations at 1M rows (prep-1m.log:7-8). Verified open on main 5bdc02911 (system_graph.rs: |row: &ReadRow| row.alive.then(|| step_entity(*row, ctx)); worker_snapshot_keeps_rare_state_in_entity_store asserts only <= 256 B). Fix shape: (a) take &ReadRow in the closure and step_entity (only three passive_follow::idle call sites keep a *row copy), (b) move the two Option<[f64;3]> target fields (32 B each) into a rare side vector (64 B off the row); tighten the 256 B assertion into a real ratchet. Part (b) is filed separately as ENTITY-READ-ROW-RARE-TARGET-FIELDS-ON-THE-HOT-ROW; this row covers only the by-value copy and the 256 B worker-snapshot bound."
regression = ["cargo:mc-core:tick::system_graph::tests::step_entity_borrows_its_row", "cargo:mc-core:tick::entity_phase::entity_phase_tests::worker_snapshot_keeps_rare_state_in_entity_store"]
failing_first = "not recorded"
fix_commit = "c393b924068f4211e75f8198a295b5d1058c47d3"
# Promotion refused 2026-11-23 (D123Battle): the commit's blanket reversal removes API the kept
# tests call, so the control does not compile, and this row's discriminating check
# (`step_entity_borrows_its_row`'s function-pointer type) is compile-level, which the ledger
# refuses as a negative control. Splitting the fix needs a history rewrite, forbidden here.
# The size ratchet in `worker_snapshot_keeps_rare_state_in_entity_store` stays green either way.
repro_check = ["Fixed in tree (c393b9240: the reader hands out `&ReadRow`, no 248-byte copy per admitted entity tick) but unpromoted: the only control is compile-level (the by-value signature is gone), so no assertion can go red and `ledger promote` refuses a control that cannot show one. Missing proof: none obtainable for a borrow-vs-copy change without a copy counter; needs Main-/owner-level disposition (close as unprovable or design a counter row). PatchRefresh 2026-11-28: no patch can be produced under the compiling-tree rule - the only discriminating ref (`step_entity_borrows_its_row`) names the `fn(&ReadRow, …)` type, so reversing the borrow makes that test fail to compile, not go red."]
