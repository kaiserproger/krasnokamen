[[bug]]
id = "WRITE-INTO-QUARANTINED-CHUNK-STILL-JOURNALED"
title = "A block write into a chunk whose admission already failed returns before the overlay insert but still enters the tick's change list and the WAL, so after the storage is repaired replay can apply a block without its block entity or owner."
area = "gameplay"
repro = "source"
severity = "major"
status = "fixed"
source = "receipts/ArchDesign/DESIGN-RESIDENCY-R11.md section 2 and VOTE-RESIDENCY-R10-astra.md / VOTE-RESIDENCY-R11-astra.md (read-only). On main 3068dfb1b the setter returns before the overlay insert for a failed chunk while write_block still records the change (crates/mc-core/src/world.rs:1168-1180,1210-1216; crates/mc-core/src/tick.rs:697-700); WAL Block entries change only the block map and the old NBT is removed by a separate RemoveBlockEntity (journal/replay.rs:732-734,843-868), and recovery reinstalls the prior opaque block-entity image after folding blocks (core/recovery.rs:78-103,116-128). Fix (accepted design, not implemented): a producer that can refuse or wait does so before mutating; one that already mutated while its write chunk is refused halts the tick before the journal send and broadcast (core/tick_loop.rs:281-303, halt_authority), detected from the write list, never from overlay presence or the new block type."
regression = ["cargo:mc-core:journal_touched::tests::a_block_write_into_a_refused_chunk_refuses_the_journal_batch"]
failing_first = "not recorded"
fix_commit = "b5a18d05c6fe6429509101d1ffc633216d374793"
repro_check = "Implemented the accepted design: journal_entries_for_tick fails before mutating state when the tick write list names a chunk whose storage admission already failed (ChunkWorld::write_refused), and the tick owner turns that error into halt_authority before the send and broadcast (core/tick_loop.rs journal-capture error path). Detection is from the write list only, never overlay presence or the new block type. Regression: journal_touched::tests::a_block_write_into_a_refused_chunk_refuses_the_journal_batch; reversing the fix returns Ok and the test panics at its own expect_err."
promotion = "docs/bugs/promotions/WRITE-INTO-QUARANTINED-CHUNK-STILL-JOURNALED.json"
