[[bug]]
id = "PERF-WINDOW-HAS-NO-CALL-GRAPH-AND-NO-MAINTAINED-SCRIPT"
title = "The box profiling recipe runs perf record without -g and lives only in receipts/Perf1M/perf-window.sh, with no maintained script under tools/, so captures give self time only and cannot say which caller causes the cache fills."
area = "harness"
repro = "source"
severity = "minor"
status = "open"
source = "receipts/Books/REPORT-R1.md gap G-9 and section F7 (Gregg 6.5.4 profiling, 6.7.3 flame graphs, 12.3.3 profile the benchmark target and its software; tooling). receipts/Perf1M/perf-window.sh records perf record -p <pid> -F 999 without -g and reports --sort dso,symbol; docs/development/performance-windows-and-profiling.md requires the frame-pointer pin plus -g for inclusive attribution; nothing under tools/ reproduces the counter set, so a different counter set makes the next number incomparable. Verified open on main 5bdc02911 (no perf-window script in tools/dev). Fix: add -g / --call-graph fp against a pin-release built with RUSTFLAGS=-C force-frame-pointers=yes, add --per-thread, and promote the script to tools/dev/perf-window.sh with the counter set and a self-test; kernel frames stay unknown until kernel.kptr_restrict=0 (owner action, see receipts/Perf1M/BOOKS-IDEAS.md I-3)."
regression = []
failing_first = "not recorded"
