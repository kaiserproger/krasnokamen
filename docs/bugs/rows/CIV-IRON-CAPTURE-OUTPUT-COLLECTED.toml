[[bug]]
id = "CIV-IRON-CAPTURE-OUTPUT-COLLECTED"
title = "civilization-seed-qa aborts when a resident collects the furnace ingot between the console read and the player's furnace menu"
area = "harness"
repro = "client"
severity = "major"
status = "open"
source = "Seed-24 civilization-seed-qa .analysis/validation/20261111T230450-civilization-seed-qa-o31rlnkb on server pin 107ddb91 (stand fix): after sprint 300 the read-only console read of furnace [134,78,-217] showed one iron ingot in its output slot (server.log line 33); the observer's furnace menu then opened (container 6, 111 transcript observations) with all three furnace slots empty for the whole 15 s wait, so the ingot had left the furnace in between (furnace output is collected by residents, docs/settlements/construction.md); the gate failed after 174 s on 'timed out waiting for furnace_iron_output_visible'. Iron was smelted; the failure is the harness observation race. tools/harness/backends/civilization_seed_qa.py capture_iron_menu now holds the simulation with tick freeze, re-reads the output, captures the menu, then unfreezes; output collected before the hold leaves the milestone to a later snapshot. Negative control: python3 -m unittest tools.harness.test_civilization_seed_qa: with only the backend hunks reverted (receipts/CivSimSeed24/iron-hold-fix-hunks.patch, sha256 db052414) test_furnace_output_collected_before_the_menu_does_not_abort_the_run fails with the gate's TimeoutError on furnace_iron_output_visible (receipts/CivSimSeed24/iron-hold-negative-control.log); fixed tree 79/79 with test_village_autonomy_qa (receipts/CivSimSeed24/iron-hold-tests.log)."
repro_check = "Promotion rule (CIV-B2 (1) review): this row is about the menu capture itself, so it closes only on a milestone with `milestones.iron_smelted.source == 'output_slot'` (a screenshot of the furnace menu with the ingot visible); a `source == 'furnace_recipes'` milestone proves smelting happened but does not prove the capture, and must not close this row. negative control receipts/XHarnessGates/neg-civ-iron.log (backend hunks reversed -> furnace_iron_output_visible TimeoutError); candidate: exact revert (git apply -R of d7f98cd4, clean) reds the ref with the gate's own symptom string `TimeoutError ... furnace_iron_output_visible`; repro=client, real-client gate pending REVERSAL WITHDRAWN (Main, 2026-11-28): the rebuilt patch's minus side does not exist in `git show d7f98cd4^:tools/harness/backends/civilization_seed_qa.py` (checked line by line), so it was written for the control rather than taken from the pre-image, which PITFALLS forbids; the patch is deleted and fix_commit is back to the real commit. A promotable reversal needs a pre-image that actually contains the removed lines."
failing_first = "reported"
regression = ["harness:civilization-seed-qa:iron_smelted", "python:tools.harness.test_civilization_seed_qa:CivilizationEvidenceTests.test_furnace_output_collected_before_the_menu_does_not_abort_the_run", "python:tools.harness.test_civilization_seed_qa:CivilizationEvidenceTests.test_iron_capture_opens_furnace_and_requires_visible_output", "python:tools.harness.test_civilization_seed_qa:CivilizationEvidenceTests.test_iron_collected_by_a_resident_before_the_hold_is_retried_not_fatal"]
fix_commit = "d7f98cd4"
