fix_commit = "ee71ee684"
proving_assertions = { "harness:entities:native-v2-ledger-summon-horse-cargo" = "summoned_items_land_in_the_first_cargo_slot", "cargo:mc-core:command_summon::tests::chested_horse_summon_carries_vanilla_items_cargo" = "crates/mc-core/src/command_summon_tests.rs:26" }
