[[bug]]
id = "SUMMON-ITEMS-HORSE-CARGO"
title = "`summon` refuses `Items` cargo on a chested horse, donkey, mule or llama although vanilla stores horse cargo in `Items`."
area = "gameplay"
repro = "manual"
severity = "minor"
status = "open"
source = "docs/bugs/rows/HS-2.toml (REVIEW-wave2-3, non-blocking note on the Items ingress: vanilla keeps a chested horse's cargo in `Items` alongside `ChestedHorse`, and Krasnokamen's summon field set answers `Entity does not support summon NBT field Items` for those species)"
regression = ["harness:entities:native-v2-ledger-summon-horse-cargo", "cargo:mc-core:command_summon::tests::chested_horse_summon_carries_vanilla_items_cargo", "cargo:mc-core:command_summon::tests::summon_mule_accepts_items_without_a_chest_and_keeps_no_cargo"]
repro_check = "Fixed by ee71ee684 and promoted from the client gate; ee71ee684 is an ancestor of the final integration tree e1c374dc. The field set admits `Items` (vehicles or mounts), `ChestedHorse` and (llamas) `Strength` through mounts::persistence::owns_cargo_field (:384-389); the parse itself needs no extra code because decode() builds the image through EntityStateImage::from_record, which already runs mounts::persistence::from_fields and cargo_from_record (journal/replay.rs:427-441) and refuses a bad slot/strength before the entity exists. Client gate native-v2-ledger-summon-horse-cargo summons a chested donkey carrying three diamonds (storage slot 0) and one apple (slot 14), opens the 53-slot cargo menu with the client (sneak+use) and asserts both stacks in their slots plus an empty saddle slot. Core ref also round-trips the saved record through checkpoint_data_for + from_record, so import/replay and summon share one parser; it covers a chested donkey, a llama with Strength 3, and the horse refusal (crates/mc-core/src/command_summon_tests.rs:1609-1689), while the scene opens the donkey's menu only. The chest-free mule has its own test (crates/mc-core/src/command_summon_tests.rs:1698-1707), so a tree that refuses `Items` fails there naming the field instead of stopping earlier at `ChestedHorse` in the chested cases. Control: the row's `fix_commit` is the committed forward-port patch (`docs/bugs/fix-patches/SUMMON-ITEMS-HORSE-CARGO.patch`, sha256 089fd103…, which reverses cleanly on this head), because ee71ee684 no longer reverses after 9edc3c3ac; reversing it refuses `ChestedHorse`, and the scene's own wait then fails as `summoned_cargo_mount_appears` with the server's `Unknown or unsupported summon NBT field ChestedHorse`, so the fixture never gets placed and the menu assertions are unreachable by construction. The 2026-11-27 re-promotion measured both refs red/green on tree 84fc5c955 with control pin 84fc5c955ca0-5fc5d61a; that pin belongs to that tree and is not reusable — this head needs its own reversed-tree pin at re-promotion (map: docs/bugs/promotions/SUMMON-ITEMS-HORSE-CARGO.hunks.md)."
fix_commit = "patch:089fd1039796720221490f84e3ca93cca354d4aaf742567dab9c02c945136e86"
proving_assertions = { "harness:entities:native-v2-ledger-summon-horse-cargo" = "summoned_cargo_mount_appears", "cargo:mc-core:command_summon::tests::chested_horse_summon_carries_vanilla_items_cargo" = "crates/mc-core/src/command_summon_tests.rs:26", "cargo:mc-core:command_summon::tests::summon_mule_accepts_items_without_a_chest_and_keeps_no_cargo" = "crates/mc-core/src/command_summon_tests.rs:27" }
