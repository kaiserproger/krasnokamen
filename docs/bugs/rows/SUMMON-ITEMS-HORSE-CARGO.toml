[[bug]]
id = "SUMMON-ITEMS-HORSE-CARGO"
title = "`summon` refuses `Items` cargo on a chested horse, donkey, mule or llama although vanilla stores horse cargo in `Items`."
area = "gameplay"
repro = "manual"
severity = "minor"
status = "open"
source = "docs/bugs/rows/HS-2.toml (REVIEW-wave2-3, non-blocking note on the Items ingress: vanilla keeps a chested horse's cargo in `Items` alongside `ChestedHorse`, and Krasnokamen's summon field set answers `Entity does not support summon NBT field Items` for those species)"
regression = []
repro_check = "NOT YET FIXED — filed 2026-11-25 from REVIEW-wave2-3. The `Items` cargo the HS-2 ingress accepts for container vehicles (commit 89f9b15d5, `command_summon::supports` + `authored_fields`, gated by `vehicles::container_size`) is decided per entity id, and `vehicles::container_size` answers 0 for every horse. Vanilla's horse storage is separate: `AbstractHorse` keeps `Items` and `ChestedHorse` together, and `crates/mc-core/src/mounts/persistence.rs` already reads and writes that cargo (`owns_cargo_field(name, \"Items\")`, `cargo_from_record`, `to_fields`), so the summon path is the only refusal. Repro: `/summon minecraft:donkey ~ ~ ~ {ChestedHorse:1b,Items:[{Slot:0b,id:\"minecraft:diamond\",count:1}]}` answers `Entity does not support summon NBT field Items`; the same cargo loads through WAL recovery and an offline export/reimport. Fix shape: route the field through `mounts::persistence`'s existing cargo parser when `mounts` owns `Items` for the entity (item-frame/vehicle sums stay as they are) and add a cargo ref beside `mounts_tests.rs` cargo assertions; the control is a real pre-image because the refusal is the pre-fix behaviour. Related: HS-2 (the vehicle ingress that exposed the gap), CONTAINERS-001 (mount cargo menus)."
