[[bug]]
id = "SUMMON-ITEMS-HORSE-CARGO"
title = "`summon` refuses `Items` cargo on a chested horse, donkey, mule or llama although vanilla stores horse cargo in `Items`."
area = "gameplay"
repro = "manual"
severity = "minor"
status = "fixed"
source = "docs/bugs/rows/HS-2.toml (REVIEW-wave2-3, non-blocking note on the Items ingress: vanilla keeps a chested horse's cargo in `Items` alongside `ChestedHorse`, and Krasnokamen's summon field set answers `Entity does not support summon NBT field Items` for those species)"
regression = ["harness:entities:native-v2-ledger-summon-horse-cargo", "cargo:mc-core:command_summon::tests::chested_horse_summon_carries_vanilla_items_cargo"]
repro_check = "Fixed by ee71ee684 and promoted from the client gate; ee71ee684 is an ancestor of the final integration tree e1c374dc. The field set admits `Items` (vehicles or mounts), `ChestedHorse` and (llamas) `Strength` through mounts::persistence::owns_cargo_field (:384-389); the parse itself needs no extra code because decode() builds the image through EntityStateImage::from_record, which already runs mounts::persistence::from_fields and cargo_from_record (journal/replay.rs:427-441) and refuses a bad slot/strength before the entity exists. Client gate native-v2-ledger-summon-horse-cargo summons a chested donkey carrying three diamonds (storage slot 0) and one apple (slot 14), opens the 53-slot cargo menu with the client (sneak+use) and asserts both stacks in their slots plus an empty saddle slot. Core ref also round-trips the saved record through checkpoint_data_for + from_record, so import/replay and summon share one parser; it covers a chested donkey, a llama with Strength 3, a mule whose Items stay inert without a chest, and the horse refusal (crates/mc-core/src/command_summon_tests.rs:1602-1706), while the scene opens the donkey's menu only. Control: ee71ee684 reversed -> the summon refuses ChestedHorse and the gate cannot even place the fixture. Control status: the promotion's control tree is fix_commit (the summon hunks no longer reverse on HEAD) and its scene receipt is unrunnable (release server: no registered pin-release server for this tree ... wt/ledger-control-fix); the scene is green only in the candidate client receipt (tree_head b9d3b4a4), so the cargo ref is the proving ref and the scene is candidate evidence. The promotion has no control_tree_sha256, so ledger graphical-control cannot backfill it; a re-promotion with a reversed-tree pin is needed to make the window a proof."
fix_commit = "ee71ee684"
proving_assertions = { "harness:entities:native-v2-ledger-summon-horse-cargo" = "summoned_items_land_in_the_first_cargo_slot", "cargo:mc-core:command_summon::tests::chested_horse_summon_carries_vanilla_items_cargo" = "crates/mc-core/src/command_summon_tests.rs:26" }
promotion = "docs/bugs/promotions/SUMMON-ITEMS-HORSE-CARGO.json"
