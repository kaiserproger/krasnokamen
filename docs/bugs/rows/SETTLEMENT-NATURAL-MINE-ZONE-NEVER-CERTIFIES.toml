[[bug]]
id = "SETTLEMENT-NATURAL-MINE-ZONE-NEVER-CERTIFIES"
title = "An adopted village with a staffed lumber camp gets no natural Mine zone, so the stone chain (cobblestone, torch coal) has no source and every bill that needs it waits forever"
area = "gameplay"
repro = "client"
severity = "major"
status = "open"
source = "civilization-seed-qa 20261125T114412-civilization-seed-qa-m0ns24g5 (pin 5060bc323f19-42bc4e0a): nothing planned from sprint 15000 to 39000; retained-world probe (receipts/D123/D123Civ/HANDOFF-39.md) shows 13 buildings including a natural lumber_camp but no Mine, residents Lumberjack (job site at the camp), Nitwit, Farmer, Nitwit, Weaponsmith, Librarian, stock 66 logs / 24 cobblestone / 2 coal, and the House 19 cobblestone + 1 torch short. Cause measured on seed 24 (HANDOFF-42 section 3, probe8): the site has 117 pieces and the X/Z-only overlap rule in queue_natural refused every mine probe box (cursors 0-7 queued 0, each with 1-12 overlaps), so no candidate ever reached prove_natural; the zone itself is not the problem - a probe column certifies with 32+ stone. The proof/staffing rule was NOT the cause: all six residents are untraded (HANDOFF-41 section 3). The quarry digs QUARRY_DEPTH=48 under its certificate (mining::operational_bounds) while nothing above entrance+1 is dug, so the rule is X/Z overlap with any non-street piece that is not wholly above the quarry top - streets and roads excepted, they never certify - and depth does not protect a house, safe()/natural() do (HANDOFF-43/45 reviews, docs/settlements/construction.md#natural-zones-and-radius). A candidate whose entrance chunk is resident but not simulated waits up to 3200 ticks of its own age, then is dropped."
failing_first = "reported"
regression = ["cargo:mc-core:settlements::autonomy::tests::natural_mine_queue_tests::a_plains_village_queues_proves_and_certifies_its_mine", "harness:civilization-seed-qa:new_house"]
fix_commit = "patch:3006c98d6f760c6d2184875e2fe2f5296d19aa1fc886ece8bc678ecf4c435e35"
repro_check = "Clean-tree control against THIS patch: docs/bugs/promotions/SETTLEMENT-NATURAL-MINE-ZONE-NEVER-CERTIFIES.patch (patch:3006c98d6f760c6d2184875e2fe2f5296d19aa1fc886ece8bc678ecf4c435e35, 7 hunks, one production file). The patch leaves out daacf2338's const NATURAL_ZONE_ENTRANCE_HOLD_TICKS hunk (class b): autonomy_tests::loaded_but_unsimulated_natural_worksite_is_not_certified reads the const (autonomy_tests.rs:1246,1251) and promotion keeps test files unmodified, so the const stays in the control tree, unused by the reversed production path. git apply -R --check passes at HEAD bbf5b71e5. RED: .analysis/validation/20261128T091846-test-a6mgtipl FAIL, exit 100: the row's cargo ref panics at its own assertion natural_mine_queue_tests.rs:251 'no mine candidate queued: every probe box holds a built piece in the quarry'. GREEN: .analysis/validation/20261128T092429-test-07wzg06v PASS (MEASURE prints the first cursor whose box holds no non-street piece; the mine certifies and the certificate count is adopted+1). The real-client receipt remains the civilization-seed-qa gate, variable, >=3 runs on the merged pin."
