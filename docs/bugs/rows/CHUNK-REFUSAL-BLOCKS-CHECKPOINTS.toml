[[bug]]
id = "CHUNK-REFUSAL-BLOCKS-CHECKPOINTS"
title = "After one chunk was refused (undecodable stored record), every later checkpoint, including the shutdown one, was silently declined: the journal grew and nothing newer than the refusal was saved. A refused chunk without unsaved state is now skipped; one holding unsaved state still declines, loudly and counted, to avoid duplicating custody."
area = "gameplay"
repro = "manual"
severity = "major"
status = "open"
source = "CoreBlockers: capture.load_error from the failed-chunk map (world/capture.rs, core/journal.rs); server.log of native-v2-corrupt-block-entities showed no 'checkpoint committed' after the refusal."
regression = ["cargo:mc-core:chunk_loader::tests::refused_chunk_never_blocks_other_chunks_and_stays_refused", "cargo:mc-core:chunk_loader::tests::refusing_a_resident_chunk_keeps_custody_of_its_unsaved_edits", "harness:entities:native-v2-corrupt-block-entities"]
failing_first = "reported"
fix_commit = "patch:121feead8c57090f2d0ccab1375b6c8a0590128583aa7ab1856ce43e8e5007f8"
repro_check = "Identity regenerated on the tip (patch:121feead, docs/bugs/promotions/CHUNK-REFUSAL-BLOCKS-CHECKPOINTS.{patch,hunks.md}); 16 of 23 original non-test hunks carried, 3 kept-API hunks and 4 size-only Box<ChunkCapture> hunks dropped as the surrounding SaveGenerated work item was removed later, capture start adapted to the test-only container_work field. The cargo refs are red-by-assertion in the pre-fix form (chunk_loader_tests.rs:885). Promotion awaits the integrated-sweep real-client receipt: python3 -m tools.harness ledger promote CHUNK-REFUSAL-BLOCKS-CHECKPOINTS --fix-patch docs/bugs/promotions/CHUNK-REFUSAL-BLOCKS-CHECKPOINTS.patch --client-receipt <native-v2-corrupt-block-entities result.json on the integrated release pin>."
