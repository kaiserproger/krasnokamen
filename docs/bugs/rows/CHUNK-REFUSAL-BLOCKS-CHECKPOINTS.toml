[[bug]]
id = "CHUNK-REFUSAL-BLOCKS-CHECKPOINTS"
title = "After one chunk was refused (undecodable stored record), every later checkpoint, including the shutdown one, was silently declined: the journal grew and nothing newer than the refusal was saved. A refused chunk without unsaved state is now skipped; one holding unsaved state still declines, loudly and counted, to avoid duplicating custody."
area = "gameplay"
repro = "manual"
severity = "major"
status = "fixed"
source = "CoreBlockers: capture.load_error from the failed-chunk map (world/capture.rs, core/journal.rs); server.log of native-v2-corrupt-block-entities showed no 'checkpoint committed' after the refusal."
regression = ["cargo:mc-core:chunk_loader::tests::refused_chunk_never_blocks_other_chunks_and_stays_refused", "cargo:mc-core:chunk_loader::tests::refusing_a_resident_chunk_keeps_custody_of_its_unsaved_edits", "harness:entities:native-v2-corrupt-block-entities"]
failing_first = "reported"
fix_commit = "patch:7b7f5f553372e75f6678f98bed38ecdceabe2a738f92d54d617fb7cede83b721"
repro_check = "Identity regenerated on the tip (patch:7b7f5f55). 13 of the commit's 23 non-test hunks are carried; 10 are excluded with reason (b): four Box<ChunkCapture> sites (the kept core_journal_backpressure_tests.rs:413 and :839 construct Box::new, reversed the control fails E0308) and the world.rs block_entity_dirty field, initializer and insert (world_capture_tests.rs:354 reads the field, reversed E0609). The capture start keeps the test-only container_work field untouched. The cargo refs are red-by-assertion in the pre-fix form (chunk_loader_tests.rs:885). Promotion awaits the per-lane sweep real-client receipt: python3 -m tools.harness ledger promote CHUNK-REFUSAL-BLOCKS-CHECKPOINTS --fix-patch docs/bugs/promotions/CHUNK-REFUSAL-BLOCKS-CHECKPOINTS.patch --client-receipt <native-v2-corrupt-block-entities result.json on the pin-release binary of this head>."
promotion = "docs/bugs/promotions/CHUNK-REFUSAL-BLOCKS-CHECKPOINTS.json"
