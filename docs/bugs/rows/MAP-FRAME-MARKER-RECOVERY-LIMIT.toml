promotion = "docs/bugs/promotions/MAP-FRAME-MARKER-RECOVERY-LIMIT.json"
repro_check = "real-hunk control: reversing 78fe5e3a's SavedMap::validate hunk re-adds `frame_markers.len() > 256` and the ref fails at recovery with Storage('invalid saved map') on a 300-marker save, i.e. the row's symptom (vanilla-valid save refused); receipts/XCoreItems/frame-markers-negative-control.txt. Repro is source and the ref is a cargo check through the real recovery path, so the row's evidence is complete; the ref was updated by 4c0b0b98c"
