[[bug]]
id = "CLIENT-TEST-SIGSEGV"
title = "Native solaris-client lib test binary SIGSEGVs (signal 11) about every 2nd–3rd full-parallel run on clean winfix eeac43a (stash-verified; clean tree still repros): lifecycle_waits_for_listening / crashed_server_ends_session / crash_while_playing flake run-to-run; single-threaded 651/651 and --test-threads=4 651/651 green; reruns of flaky scopes pass in isolation. Suspect server-process lifecycle race under load (port/tmpdir/signal timing), not client logic — no protocol/content in failing tests."
