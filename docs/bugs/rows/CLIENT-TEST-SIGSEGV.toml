repro_check = "Measured on the client tree of this pack (base ba1971d76215, HEAD 56d53fe534): 20 consecutive default-thread runs of cargo test -p krasnokamen-client --lib, one at a time under mem-run -m 12G with KRASNOKAMEN_CLIENT_RESOURCE_ROOT set - 19 runs exit 0, and no run produced signal 11 or any crash. The single non-zero run (15) failed two assertions unrelated to this row under full parallelism: computer::audio::tests::wav_source_parses_downmixes_loops_and_rejects_other_formats (panicked 10 ms of audio, got 516) and session::packets::tests::resource_pack_push_accepted_downloaded_applied_in_both_phases (the verified pack is extracted under the cache: [/tmp/krasnokamen-pack-push-<pid>-<n>/...]), both green in the other 19 runs and in the single full run on the same tree. So the row rate (about one SIGSEGV in 2-3 runs on winfix eeac43a) does not reproduce at this tree in 20 runs and there is still no failing thread to read: core files are impossible on this host (/proc/sys/kernel/core_pattern pipes to apport and ulimit -c is 0), and the gdb replay procedure for the next occurrence is receipts/D123PackClientCore/SIGSEGV-BACKTRACE.md. Receipts: receipts/D123PackClientCore/logs/sigsegv/{summary.txt,run-N.log,fail-15.log}. Not re-validated here: the row single-threaded 651/651 claim and the named lifecycle_waits_for_listening / crash_while_playing scopes in isolation."
