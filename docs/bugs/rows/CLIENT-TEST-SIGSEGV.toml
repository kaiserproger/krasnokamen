[[bug]]
id = "CLIENT-TEST-SIGSEGV"
title = "Native solaris-client lib test binary SIGSEGVs (signal 11) about every 2nd–3rd full-parallel run on clean winfix eeac43a (stash-verified; clean tree still repros): lifecycle_waits_for_listening / crashed_server_ends_session / crash_while_playing flake run-to-run; single-threaded 651/651 and --test-threads=4 651/651 green; reruns of flaky scopes pass in isolation. Suspect server-process lifecycle race under load (port/tmpdir/signal timing), not client logic — no protocol/content in failing tests."
area = "client"
repro = "source"
severity = "major"
status = "open"
source = "/run/media/kaiserroman/games/solaris-work/BUGS.md#CLIENT-TEST-SIGSEGV"
regression = []
repro_check = "Measured on the client tree of this pack (base ba1971d76215, HEAD 56d53fe534): 20 consecutive default-thread runs of cargo test -p krasnokamen-client --lib, one at a time under mem-run -m 12G with KRASNOKAMEN_CLIENT_RESOURCE_ROOT set - 19 runs exit 0, and no run produced signal 11 or any crash. The single non-zero run (15) failed two assertions unrelated to this row under full parallelism: computer::audio::tests::wav_source_parses_downmixes_loops_and_rejects_other_formats (panicked 10 ms of audio, got 516) and session::packets::tests::resource_pack_push_accepted_downloaded_applied_in_both_phases (the verified pack is extracted under the cache: [/tmp/krasnokamen-pack-push-<pid>-<n>/...]), both green in the other 19 runs and in the single full run on the same tree. So the row rate (about one SIGSEGV in 2-3 runs on winfix eeac43a) does not reproduce at this tree in 20 runs and there is still no failing thread to read: core files are impossible on this host (/proc/sys/kernel/core_pattern pipes to apport and ulimit -c is 0), so the measured rate is 0 in 20 (below one in twenty; under 14% at 95% confidence) against the row claimed about one in 2-3 on winfix eeac43a. Reproduce with receipts/D123PackClientCore/sigsegv-loop.sh (RUNS=20, default thread count, ulimit -c 0, one summary line per run in logs/sigsegv/summary.txt). When a run shows signal: 11, replay the SAME test binary under gdb, which is the only route to a backtrace on this host (core_pattern pipes to apport, ulimit -c is 0, and neither is changed): take BIN from the failing run log line `Running unittests src/lib.rs (<path>)`, then from wt/D123PackClientCore run `KRASNOKAMEN_CLIENT_RESOURCE_ROOT=/run/media/kaiserroman/games/solaris-work/qa-armada/template-data/resources timeout -k 30 1800 gdb -batch -ex 'set pagination off' -ex 'handle SIGSEGV stop print' -ex run -ex 'thread apply all bt 25' --args $BIN > receipts/D123PackClientCore/logs/sigsegv/gdb-run.log 2>&1`. The suspect scopes are the server-process lifecycle tests (src/singleplayer.rs::tests::lifecycle_waits_for_listening_then_sigterm_lets_server_checkpoint, crash_while_playing_is_reported_once); because gdb slows the parallel suite, a narrowed `-- <filter>` pass may be the only way to hit the window, and the full procedure is receipts/D123PackClientCore/SIGSEGV-BACKTRACE.md. Receipts: receipts/D123PackClientCore/logs/sigsegv/{summary.txt,run-N.log,fail-15.log}. Not re-validated here: the row single-threaded 651/651 claim and the named lifecycle_waits_for_listening / crash_while_playing scopes in isolation."
