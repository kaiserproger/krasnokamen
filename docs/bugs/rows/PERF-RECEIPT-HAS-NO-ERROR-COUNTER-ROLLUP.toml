[[bug]]
id = "PERF-RECEIPT-HAS-NO-ERROR-COUNTER-ROLLUP"
title = "No per-resource error-counter rollup reaches the receipt: retried or soft errors, socket drops and short writes are not counted anywhere a receipt can cite, and the 'edge items:' line has no error field."
area = "harness"
repro = "source"
severity = "minor"
status = "fixed"
source = "receipts/Books/REPORT-R1.md gap G-12 (Gregg 2.5.9 USE: errors; hygiene). crates/mc-edge/src/fanout.rs (around :268) prints the edge items line without an error field; fsync and rename failures are fatal by design, but soft errors, drops and short writes are not counted. Verified open on main 5bdc02911. Fix: add a per-window error rollup (socket drops and short writes, retried I/O, input drops already on the dashboard) to the rung receipt; pair with the per-socket snapshot idea I-4 in receipts/Perf1M/BOOKS-IDEAS.md."
failing_first = "not recorded"
regression = [
"cargo:mc-edge:server::session_security_tests::a_play_write_failure_is_counted_by_cause",
"cargo:mc-edge:server::lifecycle_tests::an_ordinary_lifecycle_drop_records_no_close_cause",
"cargo:mc-edge:server::tests::a_session_end_counts_once_and_an_unregistered_id_counts_nothing",
"cargo:mc-edge:server::pump::delivery_tests::a_closed_reliable_receiver_in_the_routing_view_counts_no_cause",
"cargo:mc-edge:server::pump::delivery_tests::a_full_reliable_receiver_in_the_routing_view_counts_its_cause",
"cargo:mc-edge:dashboard::tests::an_abnormal_close_is_counted_by_cause",
"cargo:mc-edge:dashboard::tests::stats_carry_wal_write_cost_and_close_causes",
"python:tools.coreperf.test_profiles:WindowReceiptFieldsTests.test_receipt_records_the_error_rollup"
]
fix_commit = "1932e8e5857c907fccb1781640d1e527c11a5852"
repro_check = "Implemented in 1932e8e5857c907fccb1781640d1e527c11a5852, re-promoted after review REVIEW-wave2-10 M1 (the rollup itself started in bc2c459422ea338244ede66173badc2cf837bd28). The counter is a session-end error rollup, not a tally of close() calls: ConnectionRegistry::close records a cause only when it is abnormal (NORMAL_CLOSE_CAUSES excludes the lifecycle's own removal, a client EOF read-frame, the pump-closed writer stop and a core-ordered kick) and only when this call takes the session's live closer (closers.remove(&id).is_some()), so a second close of the same id, a close of an id no session owned, a status ping or an ordinary exit adds nothing. Every reliable try_send site counts only TrySendError::Full: Closed means the writer already released its receivers, i.e. the session is ending on its own, so the pump drops the connection from its local routing view without a close or a drop count (play-loop command tree, route_changes, route_planned_packets, broadcast_latencies, EdgeServer::send/kick, the screen relay). play_writer records its own terminal stage once before returning (reliable-/world-/keepalive-/dh-write-failed, keepalive-timeout/invalid-reply, pump-closed), the play loop records only a stage the writer did not count (ConnectionRegistry::close_cause_counts), and all three writer awaits (illegal chat, admin input overflow, the abort after the loop) keep an Ok result instead of discarding it, so a write failure is not counted a second time. A delivered rate-limit kick ends as the normal core-disconnect and counts nothing; the loop's rate-limit-kick stage is counted only when the kick itself cannot be delivered (server.kick reports a full queue). The dashboard reads the map on request like input_drops, with &'static str keys, so the pump builds nothing per tick (network.close_causes, krasnokamen_network_close_causes_total{cause=...}, documented in docs/OPERATING.md). Control: reversing this commit's non-test hunks reds a_session_end_counts_once_and_an_unregistered_id_counts_nothing (the old close counts the second close and the unregistered id) and a_closed_reliable_receiver_in_the_routing_view_counts_no_cause (the old pump closes on a queue whose writer already left); a_full_reliable_receiver_in_the_routing_view_counts_its_cause, the EPIPE fence, the lifecycle-drop fence and the dashboard rollup stay green in the control; restore is green. Verified red on real socket writes and a real routing view, not a hand-written close() call."
promotion = "docs/bugs/promotions/PERF-RECEIPT-HAS-NO-ERROR-COUNTER-ROLLUP.json"
