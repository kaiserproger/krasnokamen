[[bug]]
id = "PERF-RECEIPT-HAS-NO-ERROR-COUNTER-ROLLUP"
title = "No per-resource error-counter rollup reaches the receipt: retried or soft errors, socket drops and short writes are not counted anywhere a receipt can cite, and the 'edge items:' line has no error field."
area = "harness"
repro = "source"
severity = "minor"
status = "fixed"
source = "receipts/Books/REPORT-R1.md gap G-12 (Gregg 2.5.9 USE: errors; hygiene). crates/mc-edge/src/fanout.rs (around :268) prints the edge items line without an error field; fsync and rename failures are fatal by design, but soft errors, drops and short writes are not counted. Verified open on main 5bdc02911. Fix: add a per-window error rollup (socket drops and short writes, retried I/O, input drops already on the dashboard) to the rung receipt; pair with the per-socket snapshot idea I-4 in receipts/Perf1M/BOOKS-IDEAS.md."
failing_first = "not recorded"
regression = [
"cargo:mc-edge:server::session_security_tests::a_play_write_failure_is_counted_by_cause",
"cargo:mc-edge:server::lifecycle_tests::an_ordinary_lifecycle_drop_records_no_close_cause",
"cargo:mc-edge:dashboard::tests::an_abnormal_close_is_counted_by_cause",
"cargo:mc-edge:dashboard::tests::stats_carry_wal_write_cost_and_close_causes",
"python:tools.coreperf.test_profiles:WindowReceiptFieldsTests.test_receipt_records_the_error_rollup"
]
fix_commit = "bc2c459422ea338244ede66173badc2cf837bd28"
repro_check = "Implemented in bc2c459422ea338244ede66173badc2cf837bd28, re-promoted after review REVIEW-wave2-9 B1. The counter is a session-end error rollup, not a tally of close() calls: ConnectionRegistry::close records a cause only when it is abnormal (NORMAL_CLOSE_CAUSES excludes the lifecycle's own removal, a client EOF read-frame, the pump-closed writer stop and a core-ordered kick), so a status ping or an ordinary exit adds nothing. play_writer records its own terminal stage once before it returns (reliable-/world-/keepalive-/dh-write-failed, keepalive-timeout/invalid-reply, pump-closed) and the play loop records only a stage it produced itself (writer-panicked, read-frame, rate-limit-kick, decode/admin/submit stages), so one session counts its end exactly once; a delivery-policy close (reliable-overflow, route-changes-/command-/disconnect-/roster-/screen-control-reliable-full, reliable-queue-full, command-tree-send-failed, skipped-explosion-knockback) counts once in close(). broadcast_latencies now names roster-reliable-full instead of remove(). The dashboard reads the map on request like input_drops, with &'static str keys, so the pump builds nothing per tick. Control: reversing the fix's non-test hunks reds a_play_write_failure_is_counted_by_cause (a real EPIPE through play_writer records nothing), an_ordinary_lifecycle_drop_records_no_close_cause (finish counts removed) and stats_carry_wal_write_cost_and_close_causes (the payload never learns the map); restore is green. Verified red on real socket writes, not a hand-written close() call."
promotion = "docs/bugs/promotions/PERF-RECEIPT-HAS-NO-ERROR-COUNTER-ROLLUP.json"
