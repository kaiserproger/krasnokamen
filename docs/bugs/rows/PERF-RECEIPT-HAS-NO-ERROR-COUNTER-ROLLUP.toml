repro_check = "The path was closed by three commits, each reversed on its own, and the reds below are the ones their own controls produced (docs/bugs/README.md, Fix in several commits). 2941bc91f88f537c0bf113c43cbac46717ac2b79 started the rollup (artifact 20261124T180021-ledger-promote-se_15bsl: red test_receipt_records_the_error_rollup at test_profiles.py:1271, dashboard::tests::an_abnormal_close_is_counted_by_cause unrunnable under that reversal). bc2c459422ea338244ede66173badc2cf837bd28 turned the counter into a session-end rollup instead of a tally of close() calls (artifact 20261124T191215-ledger-promote-ghdordwy: red a_play_write_failure_is_counted_by_cause at server_session_security_tests.rs:554 driven by a real EPIPE through play_writer, stats_carry_wal_write_cost_and_close_causes at dashboard/tests.rs:857 and an_abnormal_close_is_counted_by_cause at :915; the lifecycle fence was recorded unproven-panic there and the python ref was green). 1932e8e5857c907fccb1781640d1e527c11a5852 made the count once per live session and Closed-only-evict (artifact 20261124T202332-ledger-promote-fnu4w51u: red a_session_end_counts_once_and_an_unregistered_id_counts_nothing at server/tests.rs:612, which closes ids by hand on purpose, and a_closed_reliable_receiver_in_the_routing_view_counts_no_cause at pump_delivery_tests.rs:165 on a real routing view; the EPIPE fence, the lifecycle fence, the full-queue fence, both dashboard refs and the python ref were green in that control, and all eight were green on restore). a4fcc632172e28562f42360157d2751f56478d8e is the follow-up that makes a cancelled session's dropped keepalive sender a normal end and adds the three fences below; it is not the promoted commit and carries no promotion control of its own. Semantics: ConnectionRegistry::close records a cause only when it is abnormal (NORMAL_CLOSE_CAUSES: removed, read-frame, pump-closed, core-disconnect, keepalive-closed) and only when this call takes the session's live closer (closers.remove(&id).is_some()), so a second close of one id, or a close of an id no session owned, adds nothing. play_writer records its own terminal stage once; the play loop records only a stage the writer did not count (ConnectionRegistry::close_cause_counts) and keeps the Ok result of all three writer awaits. The dashboard reads the map on request with static string keys (network.close_causes, krasnokamen_network_close_causes_total{cause=...}, documented in docs/OPERATING.md). Closed is a behaviour change, not only a counting one (REVIEW-wave2-11 minor-2): a reliable try_send that finds the writer's receiver already released no longer calls close() at all, so no closer is taken, the handles are not removed and the roster is not marked dirty at that moment; the session ends through the play loop's writer arm, the registry generation advances when ConnectionLifecycle::finish runs, and reliable_drops no longer counts such a send. The count-once invariant therefore means that no routing failure adds a cause; it is not literal that every abnormal path goes through close(). Rate limiting: when a kick's own send finds a full queue the counted cause is disconnect-reliable-full; the loop's rate-limit-kick stage is recorded only when the kick cannot be delivered at all, so a delivered rate-limit kick ends as the normal core-disconnect. Fences after the promoted commit (REVIEW-wave2-11 minor-8): a_dropped_keepalive_sender_ends_the_writer_normally (the None reply is keepalive-closed, not an invalid reply), send_and_kick_report_a_released_queue_without_a_cause, and a_closed_latency_receiver_leaves_the_view_without_a_cause. Deliberately not fenced, because each needs a live play connection or a relay scenario and would have to sleep: the Ok branch of the three writer awaits, the Closed branch of route_changes, the Closed branch of the screen relay, and the ; true listing. The classifier fix 738aadb959 makes a custom-message assert a proving red, so the lifecycle fence no longer needs proving_assertions. Known open, narrow race (REVIEW-wave2-11 minor-1, not closed here): the play loop's own stage and play_writer's stage are recorded without taking the session's closer, so a Full close racing an abnormal stage, or reliable-overflow/skipped-explosion-knockback after an abnormal stage but before finish, can still add a second cause. Closing it structurally means taking the closer in record_close_cause, which is a wider change than this minor and needs its own control."
promotion = "docs/bugs/promotions/PERF-RECEIPT-HAS-NO-ERROR-COUNTER-ROLLUP.json"
