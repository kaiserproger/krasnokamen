repro_check = "Root cause and fix (D123CivGatesH pack 1 + D123CivGatesJ pack 2, 2026-11-25; Opus review R1 applied): the level-2 certificate inspects the whole level box (`buildings.rs::assess` enclosure over `level.bounds(origin)`), while the level-2 project plans only the diff against level 1, so a cell the level-1 build placed and level 2 keeps unchanged belongs to no level-2 plan cell. At rotation 1 the house gate 20261124T231255 emptied exactly such a level-1 enclosure cell mid-upgrade and `finish_project` refused it every tick (`cause=certificate_incomplete`, `missing=enclosure: 0/1`) - the project never closed and never certified. Fix: `reopen_emptied` also queues the cells the executed build chain of the same site wrote, folded last-write-per-position (`committed_chain`, the same evidence the upgrade fence reads) and dropping air, for every position no plan cell owns. The chain carries the state and the material actually paid, so an emptied birch or spruce wall is repaired and billed in its own species and bed colour; the raw blueprint image (pack 1) is oak and white, which repairs an oak-less town with an unfundable bill and holds the only construction slot, so pack 2 replaced the image with the chain and deleted `Blueprint::image`/`Blueprint::inherited`. `buildings.rs::assess` is untouched. Regressions: `an_upgrade_repairs_an_inherited_perimeter_cell_emptied_mid_build` (position from the chain outside the plan, broke one work unit before the last placement, the repair re-pays one log: ledger charge = the plan's own log bill + 1, `plugin_structures::validate` clean) and `an_upgrade_repairs_an_inherited_cell_in_the_species_the_house_was_built_with` (birch house, the emptied inherited birch log comes back birch). Red on the pack-1 pre-image `597352d5a7` (`20261125T115102`, `construction did not finish`); red on the pack-2 pre-image (image-based inheritance, `20261125T170443`): the species case stops at `construction_fencing_tests.rs:385`, while the oak case stays green there because that pre-image already repairs an oak inherited cell from the blueprint image - the species case and the cost assertion are what it cannot do. The planner-origin hypothesis from HANDOFF-16 is disproved: the logged origin [131,69,7] is the rotation-1 blueprint origin (cert [11,5,7] over blueprint extent z=8), so plan and certificate agree on the site. Opus review R2 (2026-11-26) found two production defects in the fold and both are fixed here: the chain copied every cell it wrote at the site into the level-2 repair stage, including the level-1 fill below the level-2 floor (a slope foundation fills minecraft:dirt, which is not free soil work) and its detour or retired cells, and plugin_structures::validate requires every cell inside bounds_of_structure(record) - a player who dug out that protruding fill and then let the upgrade certify produced a ledger the next world load refused (Recovery(\"invalid native plugin structure ledger\")); the fold now keeps only cells inside the record's own box. The chain was also keyed on snapshot.origin (the raw site minimum) where same_site compares the blueprint origin [min.x, max.y - height + 1, min.z], so on a slope the chain came back empty and the repair silently did nothing; it now derives that origin. The fold borrows the ledger's cells and clones only the cells it queues (the completion pass runs on every stall tick), and the false 'never per tick' doc is corrected. Regression evidence: preparation_tests::an_emptied_level_fill_below_the_upgrade_box_never_reaches_the_repair_stage certifies the upgrade with validate clean and the fill left air, and fails with Recovery(\"invalid native plugin structure ledger\") when only the box filter is removed; preparation_tests::the_inherited_chain_reads_the_blueprint_origin_not_the_site_minimum fails when the fold is keyed on snapshot.origin. Re-promoted on 1f695d4b25: candidate gate 20261125T175716-buildings-qa-s1_5wshf has house.L2_upgrade and house.broken_cell_replaced PASS plus L1-L3, and the promotion 20261125T215419 records both cargo refs and house.L2_upgrade red on the reversed control tree (the control gate stops at buildings_house_L2_built) against the candidate's greens. Seed 100 made the gate deterministic after the per-tick warnings were dropped: the village planner then out-built the harness twice (its own second House L1 took the deposit, leaving the L2 order unfunded), which the harness now answers by re-stocking a queued order that names missing materials (tools/harness/backends/buildings_qa_project.py, OrderEchoRetryTest)."
promotion = "docs/bugs/promotions/SETTLEMENT-CONSTRUCTION-UPGRADE-PENDING-CELL-UNAVAILABLE.json"
