[[bug]]
id = "SETTLEMENT-CONSTRUCTION-UPGRADE-PENDING-CELL-UNAVAILABLE"
title = "An admitted House L2 upgrade stalls with no next cell (`pending_cell_unavailable`) after an L1 placed-cell repair and never certifies"
area = "gameplay"
repro = "client"
severity = "major"
status = "open"
source = "D123CivGatesH house select, native windowed buildings-qa on release pin 1e0dda6ba2f1 (`.analysis/validation/20261124T204805-buildings-qa-klwqfvj5`, copy `receipts/D123/D123CivGates/house-select-20261124T204805.json`): House L1 built and certified, a survival client broke the placed corner `[138, 70, 7]` mid-project (`became_air: true`, pickup confirmed) and `broken_cell_replaced` PASSed with `at_certificate: minecraft:oak_log`; the funded L2 order was then admitted (`('House', 2)`, `L2_funded` PASS) and the server logged `settlement_construction_stalled settlement=2 blueprint=house origin=[131, 69, 7] stage=2 work=0 next=None cause=\"pending_cell_unavailable\" recovery=\"builder_released\"` at 20:59:04; no L2 certificate appeared before the run ended (2752 s, `buildings_house_L2_built` red)."
regression = ["cargo:mc-core:plugin_structures::settlement_builds::preparation_tests::a_terminal_index_running_structure_is_committed_by_recovery", "harness:buildings-qa:house.L2_upgrade"]
failing_first = "reported"
fix_commit = "patch:f351cbd79845264e908fcd905c65df25d57f43db3dc586811f29c353160fd6f3"
repro_check = "Read-only diagnosis (D123CivGatesH, 2026-11-25). `watch_project` (`crates/mc-core/src/settlements/construction.rs:2350-2380`) reports `pending_cell_unavailable` exactly when a builder is bound but `executor::next_cell` returns `Ok(None)`. `next_cell` (`plugin_structures/settlement_builds.rs:627`) indexes `cells[current_stage_index][completed_work_units]`, so the logged `stage=2 work=0 next=None` means `current_stage_index` equals `stages.len()` (the terminal index) and `cells` has no entry there. `ScriptStructureSnapshot::validate` (`mc-script/src/world_structure_operations.rs:531-543`) accepts `current_stage_index == stages.len()` with zero work and only requires Committed structures to sit at that index, so a terminal-index structure that never committed is a valid persisted state. [INFERENCE from the evidence, not yet reproduced] `recover` (`settlement_builds.rs:325`) acts only on `Committed` or `footprint_changed`-paused structures, `reopen_emptied` also requires `Committed`, and the L2 finish path only commits on the terminal `advance` receipt, so a terminal-index non-committed structure has no path back: the project keeps its slot, every shift reports the stall, and the builder is released. Next step is a unit reproduction: L1 commit + committed repair portion, L2 prepare, advance to the terminal index with the commit refused (or the repair re-opened between the terminal advance and `finish_project`), then assert `next_cell` is `Some` again (commit or re-derive) instead of `None`; expected change is bounded to `settlement_builds::{recover, reopen_emptied}` plus the upgrade finish path, with the existing `construction::fencing_tests` and `settlement_builds` suites as neighbours."
