[[bug]]
id = "SETTLEMENT-CONSTRUCTION-UPGRADE-PENDING-CELL-UNAVAILABLE"
title = "An admitted House L2 upgrade stalls with no next cell (`pending_cell_unavailable`) after an L1 placed-cell repair and never certifies"
area = "gameplay"
repro = "client"
severity = "major"
status = "open"
source = "D123CivGatesH house select, native windowed buildings-qa on release pin 1e0dda6ba2f1 (`.analysis/validation/20261124T204805-buildings-qa-klwqfvj5`, copy `receipts/D123/D123CivGates/house-select-20261124T204805.json`): House L1 built and certified, a survival client broke the placed corner `[138, 70, 7]` mid-project (`became_air: true`, pickup confirmed) and `broken_cell_replaced` PASSed with `at_certificate: minecraft:oak_log`; the funded L2 order was then admitted (`('House', 2)`, `L2_funded` PASS) and the server logged `settlement_construction_stalled settlement=2 blueprint=house origin=[131, 69, 7] stage=2 work=0 next=None cause=\"pending_cell_unavailable\" recovery=\"builder_released\"` at 20:59:04; no L2 certificate appeared before the run ended (2752 s, `buildings_house_L2_built` red)."
regression = ["cargo:mc-core:settlements::construction::fencing_tests::an_upgrade_repairs_an_inherited_perimeter_cell_emptied_mid_build", "cargo:mc-core:settlements::construction::fencing_tests::an_upgrade_repairs_an_inherited_cell_in_the_species_the_house_was_built_with", "harness:buildings-qa:house.L2_upgrade"]
failing_first = "reported"
fix_commit = "patch:27b05b91a78ca5d7a4695428102bb3a043ee07cef35e788172ed5c739410d3ea"
# The control's red is `complete_authored`'s own assertion that the project must close (the
# `construction did not finish` panic names the stalled project). Name the panic site so the
# classifier counts it as this row's assertion, not an unnamed panic.
proving_assertions = { "cargo:mc-core:settlements::construction::fencing_tests::an_upgrade_repairs_an_inherited_perimeter_cell_emptied_mid_build" = "crates/mc-core/src/settlements/construction_fencing_tests.rs:385", "cargo:mc-core:settlements::construction::fencing_tests::an_upgrade_repairs_an_inherited_cell_in_the_species_the_house_was_built_with" = "crates/mc-core/src/settlements/construction_fencing_tests.rs:385" }
repro_check = "Root cause and fix (D123CivGatesH pack 1 + D123CivGatesJ pack 2, 2026-11-25; Opus review R1 applied): the level-2 certificate inspects the whole level box (`buildings.rs::assess` enclosure over `level.bounds(origin)`), while the level-2 project plans only the diff against level 1, so a cell the level-1 build placed and level 2 keeps unchanged belongs to no level-2 plan cell. At rotation 1 the house gate 20261124T231255 emptied exactly such a level-1 enclosure cell mid-upgrade and `finish_project` refused it every tick (`cause=certificate_incomplete`, `missing=enclosure: 0/1`) - the project never closed and never certified. Fix: `reopen_emptied` also queues the cells the executed build chain of the same site wrote, folded last-write-per-position (`committed_chain`, the same evidence the upgrade fence reads) and dropping air, for every position no plan cell owns. The chain carries the state and the material actually paid, so an emptied birch or spruce wall is repaired and billed in its own species and bed colour; the raw blueprint image (pack 1) is oak and white, which repairs an oak-less town with an unfundable bill and holds the only construction slot, so pack 2 replaced the image with the chain and deleted `Blueprint::image`/`Blueprint::inherited`. `buildings.rs::assess` is untouched. Regressions: `an_upgrade_repairs_an_inherited_perimeter_cell_emptied_mid_build` (position from the chain outside the plan, broke one work unit before the last placement, the repair re-pays one log: ledger charge = the plan's own log bill + 1, `plugin_structures::validate` clean) and `an_upgrade_repairs_an_inherited_cell_in_the_species_the_house_was_built_with` (birch house, the emptied inherited birch log comes back birch). Red on the pack-1 pre-image `597352d5a7` (`20261125T115102`, `construction did not finish`); red on the pack-2 pre-image (image-based inheritance, `20261125T170443`): the species case stops at `construction_fencing_tests.rs:385`, while the oak case stays green there because that pre-image already repairs an oak inherited cell from the blueprint image - the species case and the cost assertion are what it cannot do. The planner-origin hypothesis from HANDOFF-16 is disproved: the logged origin [131,69,7] is the rotation-1 blueprint origin (cert [11,5,7] over blueprint extent z=8), so plan and certificate agree on the site."
