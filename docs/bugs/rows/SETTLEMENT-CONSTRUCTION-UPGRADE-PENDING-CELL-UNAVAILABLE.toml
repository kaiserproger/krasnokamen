proving_assertions = { "cargo:mc-core:settlements::construction::fencing_tests::an_upgrade_repairs_an_inherited_perimeter_cell_emptied_mid_build" = "crates/mc-core/src/settlements/construction_fencing_tests.rs:385" }
repro_check = "Root cause and fix (D123CivGatesJ, 2026-11-25): the level-2 certificate inspects the level's whole box (`buildings.rs::assess` enclosure over `level.bounds(origin)`), and at rotation 1 that box is `origin + cert_min` = [132,69,7]..[138,73,17] while the level-1 house is [132,69,7]..[138,73,13]; the level-2 plan is only the diff, so the level-1 wall cells the new box also inspects are not in the plan. Gate 20261124T231255 (`house.L2_upgrade` FAIL; L1 PASS incl. `broken_cell_replaced`) broke [132,71,8] during the L2 build - the unchanged level-1 oak fence at unrotated offset (1,2,6), not a level-2 diff cell - and `finish_project` then refused cause=certify_failed missing=enclosure: 0/1 on every tick (gate 20261125T090331), so the project never closed and the stall reported `next=None` (`pending_cell_unavailable`). `reopen_emptied` now also queues an emptied authored cell of the level image that the level below placed unchanged (`Blueprint::inherited`, `settlement_builds::inherited`), so the repair re-places the hole and the level-2 certificate passes; red on base and green with it at `construction::fencing_tests::an_upgrade_repairs_an_inherited_perimeter_cell_emptied_mid_build` (20261125T115102 red, 20261125T120047 green). The earlier origin hypothesis is disproved by measurement: the logged project origin [131,69,7] is the rotation-1 blueprint origin (cert [11,5,7] against Blueprint extent z=8 gives cert_min.x=1, so the level-1 box is [132..138]), not a shifted structure origin, and the level-2 plan and certificate agree on that origin. Read-only diagnosis (D123CivGatesH, 2026-11-25, kept for the original reproduction). `watch_project` (`crates/mc-core/src/settlements/construction.rs:2350-2380`) reports `pending_cell_unavailable` exactly when a builder is bound but `executor::next_cell` returns `Ok(None)`. `next_cell` (`plugin_structures/settlement_builds.rs:627`) indexes `cells[current_stage_index][completed_work_units]`, so the logged `stage=2 work=0 next=None` means `current_stage_index` equals `stages.len()` (the terminal index) and `cells` has no entry there. `ScriptStructureSnapshot::validate` (`mc-script/src/world_structure_operations.rs:531-543`) accepts `current_stage_index == stages.len()` with zero work and only requires Committed structures to sit at that index, so a terminal-index structure that never committed is a valid persisted state. [INFERENCE from the evidence, not yet reproduced] `recover` (`settlement_builds.rs:325`) acts only on `Committed` or `footprint_changed`-paused structures, `reopen_emptied` also requires `Committed`, and the L2 finish path only commits on the terminal `advance` receipt, so a terminal-index non-committed structure has no path back: the project keeps its slot, every shift reports the stall, and the builder is released. Next step is a unit reproduction: L1 commit + committed repair portion, L2 prepare, advance to the terminal index with the commit refused (or the repair re-opened between the terminal advance and `finish_project`), then assert `next_cell` is `Some` again (commit or re-derive) instead of `None`; expected change is bounded to `settlement_builds::{recover, reopen_emptied}` plus the upgrade finish path, with the existing `construction::fencing_tests` and `settlement_builds` suites as neighbours."
promotion = "docs/bugs/promotions/SETTLEMENT-CONSTRUCTION-UPGRADE-PENDING-CELL-UNAVAILABLE.json"
