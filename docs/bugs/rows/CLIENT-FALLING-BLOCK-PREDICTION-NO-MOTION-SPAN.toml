[[bug]]
id = "CLIENT-FALLING-BLOCK-PREDICTION-NO-MOTION-SPAN"
title = "A falling block's predicted horizontal motion registers no motion span, so the client's own fence on the query-padding span fails (motion_spans.len() == 1 sees none) and the horizontal prediction is unproven"
area = "client"
severity = "minor"
status = "fixed"
source = "client repo src/entities/falling_tests.rs:176-187 (falling_block_prediction_tracks_horizontal_query_padding_without_accumulating_spans), a fence that only compiled once the wave-2 test-module restore added `#[cfg(test)] mod falling_tests;` to src/entities.rs; recorded red in receipts/D123/D123Harness/HANDOFF-15.md ('motion_spans.len()==0') and reported by review REVIEW-wave2-9 minor 6 (a known red with no ledger row). The client registers a motion span only on the packet-motion path (src/entities.rs:822 from `physical.lerp_span`), never for the block's own predicted fall, so `Store::query_padding` (src/entities/physical.rs:262) never widens for a horizontally moving falling block."
repro = "cargo"
regression = ["client:krasnokamen-client:entities::falling_tests::falling_block_prediction_tracks_horizontal_query_padding_without_accumulating_spans"]
repro_check = "Known-red on the client branch, reproduced in this lane on client 89f2223e (cargo test -p krasnokamen-client --lib entities::falling_tests -> 3 passed, 1 failed on this test). Exact red after the style commit 50876432c0: panicked at src/entities/falling_tests.rs:186:9, `assertion `left == right` failed: left: 0, right: 1` for `store.motion_spans.len()` after the first presented tick, i.e. the predicted horizontal fall registered no span at all (the later asserts on motion_spans.get(&1) and position[0] == 8.5 never run); the sibling falling_block_no_gravity_keeps_air_drag_without_gravity and falling_block_freeze_and_no_gravity_preserve_pose_until_a_step fences pass. The fence is an ordinary `#[test]` in the module the wave-2 restore re-registered, so it runs in every `cargo test -p krasnokamen-client --lib` invocation and reds that suite: no gate excludes it, and there is no fix — the symptom is the missing span registration for a predicted fall (src/entities.rs never registers one for the block's own predicted motion), not a presentation regression. Promoted as client-test:a73223df8b, a split commit that carries the production hunk and the fence together (169224a2f5 changes only physical.rs, so a reversal there would name an assert outside the fix changed files, and 56d53fe5 own physical.rs hunk does not remove the production code): the reversal of its non-test hunk on its own tree reds this fence (left: 0, right: 1) and the fence is green on the commit, patch 3ea70871962a14a9, receipt docs/bugs/promotions/CLIENT-FALLING-BLOCK-PREDICTION-NO-MOTION-SPAN.json. The review-round leak fence falling_block_tick_releases_the_packet_spans_registration is green beside it (client f9983a91a4 + b8bbf78109, where the counted bound len() <= 1 was replaced by motion_spans.is_empty())."
failing_first = "reported"
client_test_reason = "The row's only observable is the client's own motion-span bookkeeping (`Store::motion_spans` and `query_padding`): a predicted vertical fall registers no frame-visible state a scene could read, and no harness scenario can drive a falling block into a horizontal predicted step, so the internal query-padding span has no scene assertion that can flip (the fence is a plain #[test] in src/entities/falling_tests.rs)."
fix_commit = "client-test:a73223df8b02afdfc3462b204c206103dc4b8d04"
promotion = "docs/bugs/promotions/CLIENT-FALLING-BLOCK-PREDICTION-NO-MOTION-SPAN.json"
