[[bug]]
id = "CLIENT-FALLING-BLOCK-PREDICTION-NO-MOTION-SPAN"
title = "A falling block's predicted horizontal motion registers no motion span, so the client's own fence on the query-padding span fails (motion_spans.len() == 1 sees none) and the horizontal prediction is unproven"
area = "client"
severity = "minor"
status = "open"
source = "client repo src/entities/falling_tests.rs:176-187 (falling_block_prediction_tracks_horizontal_query_padding_without_accumulating_spans), a fence that only compiled once the wave-2 test-module restore added `#[cfg(test)] mod falling_tests;` to src/entities.rs; recorded red in receipts/D123/D123Harness/HANDOFF-15.md ('motion_spans.len()==0') and reported by review REVIEW-wave2-9 minor 6 (a known red with no ledger row). The client registers a motion span only on the packet-motion path (src/entities.rs:822 from `physical.lerp_span`), never for the block's own predicted fall, so `Store::query_padding` (src/entities/physical.rs:262) never widens for a horizontally moving falling block."
repro = "cargo"
regression = ["client:krasnokamen-client:entities::falling_tests::falling_block_prediction_tracks_horizontal_query_padding_without_accumulating_spans"]
repro_check = "Known-red on the client branch, reproduced in this lane on client 89f2223e (cargo test -p krasnokamen-client --lib entities::falling_tests -> 3 passed, 1 failed on this test). Exact red after the style commit 50876432c0: panicked at src/entities/falling_tests.rs:186:9, `assertion `left == right` failed: left: 0, right: 1` for `store.motion_spans.len()` after the first presented tick, i.e. the predicted horizontal fall registered no span at all (the later asserts on motion_spans.get(&1) and position[0] == 8.5 never run); the sibling falling_block_no_gravity_keeps_air_drag_without_gravity and falling_block_freeze_and_no_gravity_preserve_pose_until_a_step fences pass. The fence is an ordinary `#[test]` in the module the wave-2 restore re-registered, so it runs in every `cargo test -p krasnokamen-client --lib` invocation and reds that suite: no gate excludes it, and there is no fix — the symptom is the missing span registration for a predicted fall (src/entities.rs never registers one for the block's own predicted motion), not a presentation regression."
failing_first = "reported"
fix_commit = "client-test:169224a2f57865af924e58ce8b977e62b9caf461"
