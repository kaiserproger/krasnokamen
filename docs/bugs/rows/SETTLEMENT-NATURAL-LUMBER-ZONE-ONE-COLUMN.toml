[[bug]]
id = "SETTLEMENT-NATURAL-LUMBER-ZONE-ONE-COLUMN"
title = "A natural lumber camp zone is certified from one felled column, so the village can never grow the grove its certificate allows"
area = "gameplay"
repro = "client"
severity = "major"
status = "open"
source = "D123Civ civilization gate, runs 20261124T013537/050222: the only natural camp was certified from a 1x8x1 column (one tree), lumberjacks harvested one stump per game day and the settlement produced no wood for a full day (0 projects, 0 employed). Design (docs/settlements/OWNER_DECISIONS.md 'Lumber replanting near access') is a lumberjack planting and harvesting within its zone, and certify_zone requires >= 4 logs (a grove). Fix so far: 8cd4effc8c sows a carried sapling on vacant soil inside the camp's zone after a full sweep found no tree (bounded by Progress::plant_cursor). A grove-sized natural zone was tried and reverted: queueing a second candidate per tree doubled natural-zone work and broke villager::building_autonomy_tests::adopted_village_with_resident_shears_produces_stock_and_builds (funding budget at tick 23021); the next attempt must expand at certification time (prove_natural), not add candidates. Filed on 2026-11-24 (review D123Civ6 note d); no receipt yet, the gate is still red."
regression = ["harness:civilization-seed-qa:all", "cargo:mc-core:settlements::autonomy::tests::natural_lumber_camp_certifies_the_grove_not_one_tree_column", "cargo:mc-core:villager::lumber_tests::lumberjack_sows_its_own_zone_when_the_sweep_finds_no_tree", "cargo:mc-core:villager::lumber_tests::a_tree_in_the_sweep_is_cut_instead_of_sowing_the_zone"]
failing_first = "reported"
repro_check = "Patch mode over the fix's non-test hunks at candidate 8f29602ac4 (docs/bugs/promotions/SETTLEMENT-NATURAL-LUMBER-ZONE-ONE-COLUMN.patch, patch:27471e1c38040c213d243215c39e6360feec9cf74252ffe3c6d56e8caa940554, 5 hunks, one production file; git apply -R --check passes at 8f29602ac4 and the reversed tree compiles and reaches the row's assertion). The patch carries the non-test hunks of 8a93c14578 (GROVE_RADIUS, the grown-then-fallback certification in prove_natural, grove_bounds) and of 544c763a44 (growth only into simulated chunks via bounds_active, and the doc); 8f29602ac4 is tests only. a/-side = git show 8a93c14578^:autonomy.rs plus one class-(b) adaptation (the _site parameter and its Some(&pending.site) argument, kept because the kept tests call prove_natural with five arguments; unused on the reversed tree, no behaviour change). Red on the reversed tree of 8f29602ac4: settlements::autonomy::tests::natural_lumber_camp_certifies_the_grove_not_one_tree_column fails at its own assertion autonomy_tests.rs:685 'a natural camp's zone is the grove, not one tree column: 2x1 at [-15, 201, 4]..[-14, 206, 4]' (registry 20261124T160707-test-jywi4zet, exit 100). Green on the candidate: the natural_ filter passes (20261124T161120-test-iq4zef1q). The zone grows only while the rectangle's corners stay inside the settlement sphere, every column of it is simulated and nothing certified or generated stands there; certify_zone still owns overlap, >= 4 zone logs and the entrance, and the plain column is the fallback. Still missing: harness:civilization-seed-qa:all - no passed gate receipt on this tree, so the row stays open."
fix_commit = "patch:27471e1c38040c213d243215c39e6360feec9cf74252ffe3c6d56e8caa940554"
