[[bug]]
id = "SETTLEMENT-NATURAL-LUMBER-ZONE-ONE-COLUMN"
title = "A natural lumber camp zone is certified from one felled column, so the village can never grow the grove its certificate allows"
area = "gameplay"
repro = "client"
severity = "major"
status = "open"
source = "D123Civ civilization gate, runs 20261124T013537/050222: the only natural camp was certified from a 1x8x1 column (one tree), lumberjacks harvested one stump per game day and the settlement produced no wood for a full day (0 projects, 0 employed). Design (docs/settlements/OWNER_DECISIONS.md 'Lumber replanting near access') is a lumberjack planting and harvesting within its zone, and certify_zone requires >= 4 logs (a grove). Fix so far: 8cd4effc8c sows a carried sapling on vacant soil inside the camp's zone after a full sweep found no tree (bounded by Progress::plant_cursor). A grove-sized natural zone was tried and reverted: queueing a second candidate per tree doubled natural-zone work and broke villager::building_autonomy_tests::adopted_village_with_resident_shears_produces_stock_and_builds (funding budget at tick 23021); the next attempt must expand at certification time (prove_natural), not add candidates. Filed on 2026-11-24 (review D123Civ6 note d); no receipt yet, the gate is still red."
regression = ["harness:civilization-seed-qa:all", "cargo:mc-core:settlements::autonomy::tests::natural_lumber_camp_certifies_the_grove_not_one_tree_column", "cargo:mc-core:villager::lumber_tests::lumberjack_sows_its_own_zone_when_the_sweep_finds_no_tree", "cargo:mc-core:villager::lumber_tests::a_tree_in_the_sweep_is_cut_instead_of_sowing_the_zone"]
failing_first = "reported"
repro_check = "Patch mode over the fix's non-test hunks at HEAD bbf5b71e5 (docs/bugs/promotions/SETTLEMENT-NATURAL-LUMBER-ZONE-ONE-COLUMN.patch, patch:113f3d8cdcd459341498bbacb7401c098a5ed5418ad72e8cf2163ea416e4aa43, 5 hunks, one production file; git apply -R --check passes at HEAD and the reversed tree compiles and reaches the row's assertion). The 2026-11-24 revision (patch:27471e1c...) no longer reversed: 836f66b0b replaced hunk 3's certify result with the refused/logging match. The HEAD equivalent keeps that later logging (class a/c, another review wave's behaviour) and reverses only the grove growth - certify candidate.bounds instead of grown; hunks 1,2,4,5 are unchanged from 8a93c14578+544c763a44. a/-side keeps the class-(b) _site parameter because the kept tests call prove_natural with five arguments. Red on the reversed tree: .analysis/validation/20261128T085525-test-h0jp3cnb FAIL, exit 100, settlements::autonomy::tests::natural_lumber_camp_certifies_the_grove_not_one_tree_column at its own assertion autonomy_tests.rs:993 'a natural camp's zone is the grove, not one tree column: 2x1 at [-15, 201, 4]..[-14, 206, 4]'. Green on the candidate: .analysis/validation/20261128T092429-test-07wzg06v PASS. The zone grows only while the rectangle's corners stay inside the settlement sphere, every column of it is simulated and nothing certified or generated stands there; certify_zone still owns overlap, >= 4 zone logs and the entrance, and the plain column is the fallback. Still missing: harness:civilization-seed-qa:all - no passed gate receipt on this tree."
fix_commit = "patch:113f3d8cdcd459341498bbacb7401c098a5ed5418ad72e8cf2163ea416e4aa43"
