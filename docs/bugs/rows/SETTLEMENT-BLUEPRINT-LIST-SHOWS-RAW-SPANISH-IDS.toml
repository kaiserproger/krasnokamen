repro_check = "Patch mode: the committed fix 0c20eb8b2 (2026-11-20) replaced ui.rs's hand-written `blueprint_label` match with `ui_text::blueprint`; later commits rewrote the file, so the non-test hunk is forward-ported as docs/bugs/fix-patches/SETTLEMENT-BLUEPRINT-LIST-SHOWS-RAW-SPANISH-IDS.patch (sha256 06a9a6d5..., one file, the exact pre-image `0c20eb8b2^` match as the a/-side and HEAD's delegation as the b/-side; it reverse-applies on the candidate). Reversing it also hides a895cc853b's furnace name, which is SETTLEMENT-PROJECT-BLUEPRINT-WITHOUT-NAME's own open row: the table stays in the control tree but is unreachable. Map docs/bugs/promotions/SETTLEMENT-BLUEPRINT-LIST-SHOWS-RAW-SPANISH-IDS.hunks.md. Graphical ref: `settlement-map-qa --scenario blueprints` (native, quickwins setup, reads every Construction list page) publishes `blueprints`: no raw ids (snake_case or `minecraft:`), no Unknown, every name in the client language, at least 26 distinct. Earlier NC (Main, 2026-11-20): restoring the old label function removed the table and failed both cargo regressions; restore passed 3/3 plus the L0 UI/building scope."
