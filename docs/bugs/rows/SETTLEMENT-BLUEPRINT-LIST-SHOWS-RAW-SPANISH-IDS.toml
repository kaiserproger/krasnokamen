source = "BreakQuickWins reproduced 2/2 on M daafff7b3, native ru_ru: construction slots 21-25 show spanish_house L1, spanish_church L1, spanish_plaza L1, spanish_fortress L1 and spanish_wall L1. BreakQW2 settlement-map-qa receipts 20261119T235152-settlement-map-qa-_niw6wxq and 20261119T235425-settlement-map-qa-6gy6apr0, peer/probe/transcript.json at lines 37594-37638 and 36371-36415 respectively. Root cause: projects_screen formats blueprint_label plus L1; the registry includes five Spanish variants but the old ru/en label match omits them and returns the raw id by default. One ui_text blueprint-name table now covers the registry and supplies a localized generic unknown name. Real-client acceptance remains pending."
