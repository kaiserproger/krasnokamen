[[bug]]
id = "HARNESS-BATTLE-CRASH-HANDOFF-LOST-ON-EARLY-SIGKILL"
title = "Battle runner crash handoff exits on telemetry closure without preserving the SIGKILLed world"
area = "harness"
severity = "major"
status = "open"
source = "A11SigkillBreaker 2026-11-16: run-battle.py --crash-handoff exited 1 with 'telemetry exporter failed: Remote end closed connection without response' and no crash-handoff.json/crash-copy in 2/5 pre-stage/staged SIGKILL cuts. The crash watcher thread blocks in Popen.wait() holding the waitpid lock, so the except branch's poll() returned None and re-raised. Work-root receipts/A11SigkillBreaker/REPORT.md; fixed-runner real-client verification receipts/BattleResume/runner-sigkill-race/RECEIPT.txt (0/6 failures)."
repro = "client"
proving_assertions = { "harness:battle-crash-recovery:battle-crash-handoff" = "crash_handoff_preserved_prestage" }
regression = ["python:tools.battle.test_run_battle:BattleRunnerTests.test_crash_handoff_sees_sigkill_while_crash_watcher_holds_waitpid", "harness:battle-crash-recovery:battle-crash-handoff"]
fix_commit = "patch:2855347b0693a86d7d07d0c99798469007a57f0f1933585c43686dc85b502f8b"
failing_first = "reported"
repro_check = "Real-client gate run 2026-11-25: `run scenario battle-crash-handoff --client native` from wt/D123BattleJ (harness head 5f5cded95, allowlist enabling battle-crash-recovery for the native client) against the harness pin 3cca74ebfeb7 (wt/D123Harness @ 3cca74ebf) PASSED in 160.2 s (receipt .analysis/validation/20261125T041227-battle-crash-handoff-0iyq85h0): 1500 a side, PovRed and CamSpec, SIGKILL before staging and again staged-before-start, and the crash handoff recovered both times with the clients rejoining. Promotion still needs a real control per docs/bugs/README.md: the row's fix_commit 610f31cb0 reversed on the candidate tree (or the runner test red) plus the same scene red on that reversal; this lane does not own the fix hunks. Measured control 2026-11-25 (D123BattleL, docs/bugs/promotions/HARNESS-BATTLE-CRASH-HANDOFF-LOST-ON-EARLY-SIGKILL.hunks.md): the scene run from the tree with 610f31cb0's hunk reversed red 2 of 3 (062846 green; 063126 and 063307 red at crash_handoff_preserved_staged with handoff null), and the ledger's own control run of the same reversed tree stayed green, so the harness ref is a witness, not a deterministic control. The python ref flips deterministically but the row is repro=client, so proving_refs may not drop the graphical ref. A deterministic scene needs a runner change whose exception path observes the exit regardless of the watcher's waitpid lock: with the lock held, Popen.poll() returns None (the old failure) but the current fix's wait(timeout=10) also times out, so holding the lock cannot separate the pair."
