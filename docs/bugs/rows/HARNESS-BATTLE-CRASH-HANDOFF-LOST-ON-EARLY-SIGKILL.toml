[[bug]]
id = "HARNESS-BATTLE-CRASH-HANDOFF-LOST-ON-EARLY-SIGKILL"
title = "Battle runner crash handoff exits on telemetry closure without preserving the SIGKILLed world"
area = "harness"
severity = "major"
status = "open"
source = "A11SigkillBreaker 2026-11-16: run-battle.py --crash-handoff exited 1 with 'telemetry exporter failed: Remote end closed connection without response' and no crash-handoff.json/crash-copy in 2/5 pre-stage/staged SIGKILL cuts. The crash watcher thread blocks in Popen.wait() holding the waitpid lock, so the except branch's poll() returned None and re-raised. Work-root receipts/A11SigkillBreaker/REPORT.md; fixed-runner real-client verification receipts/BattleResume/runner-sigkill-race/RECEIPT.txt (0/6 failures)."
repro = "client"
proving_assertions = { "harness:battle-crash-recovery:battle-crash-handoff" = "crash_handoff_preserved_stalled" }
regression = ["python:tools.battle.test_run_battle:BattleRunnerTests.test_crash_handoff_sees_sigkill_while_crash_watcher_holds_waitpid", "harness:battle-crash-recovery:battle-crash-handoff"]
fix_commit = "patch:2855347b0693a86d7d07d0c99798469007a57f0f1933585c43686dc85b502f8b"
failing_first = "reported"
repro_check = "Real-client gate run 2026-11-25: `run scenario battle-crash-handoff --client native` from wt/D123BattleJ (harness head 5f5cded95, allowlist enabling battle-crash-recovery for the native client) against the harness pin 3cca74ebfeb7 (wt/D123Harness @ 3cca74ebf) PASSED in 160.2 s (receipt .analysis/validation/20261125T041227-battle-crash-handoff-0iyq85h0): 1500 a side, PovRed and CamSpec, SIGKILL before staging and again staged-before-start, and the crash handoff recovered both times with the clients rejoining. Promotion still needs a real control per docs/bugs/README.md: the row's fix_commit 610f31cb0 reversed on the candidate tree (or the runner test red) plus the same scene red on that reversal; this lane does not own the fix hunks. Measured control 2026-11-25 (D123BattleL, docs/bugs/promotions/HARNESS-BATTLE-CRASH-HANDOFF-LOST-ON-EARLY-SIGKILL.hunks.md): the scene run from the tree with 610f31cb0's hunk reversed red 2 of 3 (062846 green; 063126 and 063307 red at crash_handoff_preserved_staged with handoff null), and the ledger's own control run of the same reversed tree stayed green, so the harness ref is a witness, not a deterministic control. The python ref flips deterministically but the row is repro=client, so proving_refs may not drop the graphical ref. Fixture 2026-11-27 (D124PackBattle): the scene's third cut `stalled` makes the graphical ref deterministic without touching the fix. It SIGSTOPs the server after `take.ready`, blocks on its own read of the same dashboard endpoint the exporter is blocked on (a 20 s deadline, past the exporter's 15 s one), asserts `stalled_telemetry_read_timed_out`, then SIGKILLs. While the child is stopped the crash watcher's `waitpid` cannot return and holds `_waitpid_lock`, so the reversed tree's `poll()` samples None and drops the handoff on every run, while the fix's `wait(timeout=10)` observes the kill 5 s inside its window. The proving assertion is `crash_handoff_preserved_stalled`; the cut then recovers the crash copy, reads `battle status` (`recovered_stalled_world_opens`) and stops cleanly. No server code changes: the runner is the tested tree's own tools/battle/run-battle.py. Re-checked 2026-11-28 on 2f4d802c0 (D145): no docs/bugs/fix-patches/HARNESS-BATTLE-CRASH-HANDOFF-LOST-ON-EARLY-SIGKILL.patch exists in the tree for this patch:<sha256> fix, so the promote must either be given --fix-patch from outside the tree or first commit the 610f31cb0 reversal hunks under that name."
