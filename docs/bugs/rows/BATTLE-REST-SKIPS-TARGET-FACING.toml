[[bug]]
id = "BATTLE-REST-SKIPS-TARGET-FACING"
title = "A battle soldier standing still with a look target does not turn to face it while it rests"
area = "gameplay"
severity = "minor"
status = "fixed"
source = "Found while implementing the battle facing rule, 2026-11-17 (receipts/BattleYawHold/RESULTS.md). early_entity_rest (crates/mc-core/src/tick/entity_phase.rs:491) keeps a battle row out of the rest only for a non-zero battle drive. A row with zero drive, zero velocity, on the ground, not hurt in the last 100 ticks and with a battle look target (columns.look_by_slot) therefore rests, and the step is skipped. Its full step would turn it toward the target: a scratch test on a resting husk at yaw 30 with a target at +x gave rest = true while the full step returned yaw -60. Battle rows rest without a physics proof, so the rest is not bit-identical to the step in this case. Fix 75d04c02c4..77a3de360e (design receipts/BattleRest/DESIGN.md): the rest guard refuses the rest while battle::rest_turns_toward_target says the skipped step would still turn the row by at least half a wire quantum (0.703125 deg), and the row rests again once it faces its target. Three base-pin and three fix-pin takes of the A1 battle scene (receipts/BattleRest/BOUNDS-REST-TAKES.md): strict foot S1/S2/S3, strict horse C1, V1, M3 reversal, W1 and horse target-facing (R2) do not regress. The pre-registered foot with-target loose bound (R1) FAILS in mid (350/345/389 vs 292.4) and on two of three takes in late; M3 gap_engaged misses below its window. Committee code review: Opus approve and Sol approve (receipts/BattleRest/REVIEW-CODE-{opus,sol}.md); both name R1 the inherent cost of a resting soldier tracking a moving target, and no narrower guard removes it. Main 2026-11-18 accepted R1 as an explicit trade-off: the FAIL stays recorded as a FAIL; the owner may override. Recorded packet payload cost (receipts/BattleRest/BYTES-ATTRIBUTION.md; .solrec stores the uncompressed packet id and payload without transport framing, so this is NOT measured network bandwidth): rotate_head frames +63%, move_entity_rot frames 21,488 to 422,532, about +3.9 MB of rotation payload per take and about +5.9% total recorded play payload; the differences in other packet types are not isolated. Entity phase p50 3.1-3.4 ms against 3.0-3.1 ms on base (informative, shared host). Integration (Main): the clause moved after the hostile-target and hurt vetoes; the quantization docs now say floor packing gives a bounded angular error, not an invisible one; a boundary regression was added. The fix patch was regenerated from the production hunks against ab2d945c9 at docs/bugs/fix-patches/BATTLE-REST-SKIPS-TARGET-FACING.patch. D36 (row BATTLE-TARGET-LOOK-TURNS-WHOLE-BODY, wt/BattleTurnCapD36, unmerged until the owner's look) replaces battle::rest_turns_toward_target: the guard reads the facing the projection publishes (battle::facing, Facing::rests). A standing split row rests only when its projected rotation is bit-identical to the stored one; a row that keeps the previous whole-body look (rider, head-on-body mob, fighter whose charge bonus lasts) keeps this row's half-quantum guard as Facing::Look. Both regressions still go through early_entity_rest (can_early_rest); the tolerance one now on a charged foot husk. fix_commit and the fix patch stay the historical record of this fix."
repro = "source"
regression = ["cargo:mc-core:tick::entity_phase::entity_phase_tests::resting_battle_row_with_a_look_target_faces_it_and_then_rests", "cargo:mc-core:tick::entity_phase::entity_phase_tests::battle_rest_tolerance_is_half_a_quantum_on_the_wrapped_yaw_error"]
failing_first = "reported"
fix_commit = "patch:3908dbf5ba2e061d4158ce2d05c1b55226bc342b0b87cac4a0971edf6061a770"
promotion = "docs/bugs/promotions/BATTLE-REST-SKIPS-TARGET-FACING.json"
