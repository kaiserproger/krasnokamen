regression = []
repro_check = "NOT a Fabric-launch blocker (2026-11-25 audit). The host has Java 25.0.4, `solaris-loader/gradlew` and `<work>/loader-gradle-home`, and the ledger supports a loader fix (`fix_commit = loader:<sha>`, `loader:gradle:<module>:<class>` refs and `control_files`, README:505-530), so a loader-side unit test can close this row without any real Fabric launch. What blocks it is the control: the fix `432d29d` is the HEAD of the unmerged `monitor-fabric` branch (`git merge-base --is-ancestor 432d29d main` is false), its production hunks are `ScreenAudioSound.java` (M), `solaris-loader.mixins.json` (M) and `ScreenSoundEngineMixin.java` (D - a deleted path the loader rule refuses as a control file), and the test the same commit adds (`ScreenAudioSoundTest`) calls the API the fix introduced (`FabricSoundInstance.getAudioStream`), so reversing `ScreenAudioSound.java` stops the kept test from compiling (unrunnable, not red). The test that would catch the config hunk (`MixinConfigTest`, commit `dfad752`, asserts that no shipped mixin redirects the sound stream) exists only on loader main, which contains neither the fix nor its hunks ('a checkout that does not contain the fix ... refuses', README:519-521).\n\nLOADER-OWNER WORK (no sibling commits were made from this lane): either back-port `MixinConfigTest` onto `monitor-fabric`, then `fix_commit = loader:432d29d` with `control_files = [loader-fabric/src/main/resources/solaris-loader.mixins.json]` and the red = its listed-class / sound-redirect assertion; or merge `monitor-fabric` into loader `main`, which puts the fix commit in the checkout so the main-side test reds on the reversal."
