source = "A11Breaker2 2026-11-16, receipts/A11Breaker2/REPORT.md P0 (2/2): repeated `battle live PovRed red` rearm, SIGKILL, recovery, reconnect, hot backup; the derived backup opened, stopped cleanly with a checkpoint at tick 8828, and its next `world export-anvil` and a normal start on a hash-verified copy (receipts/A11Breaker2/restart-copy-1) exit with `storage: battle recovery: unknown windup target 3257` (second run 1521). Diagnosis receipts/BattleWindupTarget/diag (refused checkpoint row battle_0.json, entities.txt): 3257 is a minecraft:horse execution-column extra, not a roster member; fighter 1188 held Windup{target 3257, start 4952} at battle tick 4960 (impact 4962). Death is the durable removal (entities.rs begin_dying: a dying row gets no checkpoint record), the next battle pass drops the dead extra from the columns (columns.rs prepare), and combat changed a Windup only at impact and never cleared a shield block, so a capture inside the windup window kept an identity the image no longer carries and battle/persistence.rs validate_replay failed closed. Retaliation grudges naming a dead horse extra had the same shape. Write-up: receipts/BattleWindupTarget/WRITEUP.md; the regression failed on the unfixed tree (receipts/BattleWindupTarget/red-base.log)."
