repro_check = ["Fix ab04093d7 is in tree; the harness ref `harness:battle-crash-recovery:battle-rearm-recovery` passed on the promotion pin (candidate receipt, 20/20 assertions incl. horse_departed_during_windup) and the cargo ref is the control. The control-s reopen refusal surfaces at the drill helper-s own `expect` (native_battle_persistence_drill_tests.rs:1157, message a clean checkpoint reopens after a windup target horse dies: Storage(\"battle recovery: unknown windup target 17\")), named in proving_assertions because the panic is an unwrap/expect call site rather than an assert macro; the fixture-panic heuristic otherwise classes any Result::unwrap as setup."]
