[[bug]]
id = "JOURNAL-PRUNE-ERRORS-SILENT"
title = "WAL pruning swallows every failure (`read_dir` error, per-entry error, `remove_file` result), so a read-only or EIO journal directory grows the WAL without bound and without one log line until an append fails with ENOSPC and halt."
area = "gameplay"
repro = "source"
severity = "minor"
status = "fixed"
source = "Auditor C, D19 CS341 audit, /var/tmp/w/receipts/CS341/REPORT-C.md finding G-6 (book rules ch. 12.2.4 p. 270, ch. 12.6 p. 286 'handle failures', ch. 18.7 p. 374). Evidence: crates/mc-core/src/journal.rs:982-997 - `let Ok(entries) = std::fs::read_dir(journal_dir) else { return }`, `let Ok(entry) = entry else { continue }`, `let _ = std::fs::remove_file(...)`; the only caller is the checkpoint completion path crates/mc-core/src/core/journal.rs:1008-1009, which logs nothing about pruning, so a filesystem refusal (remount-ro after a disk error, an overlay/NFS volume turning read-only, a changed directory mode) makes every checkpoint commit while nothing is deleted. Correctness is unaffected (batches at or below the committed checkpoint are ignored by replay), so the observable symptom is pure growth until ENOSPC. Not reproduced as a failure; read from source. Repro/test idea: a cargo test in mc-core that runs a real checkpoint through journal_loop on a temp world, makes the journal directory non-writable (chmod 0555 / a read-only overlay in a drill), then asserts the checkpoint still commits and that a warning is emitted naming the directory, the failing entry count and the errno; the same test must keep the existing green prune test unchanged. Suggested fix: count failures and emit one rate-limited warn per checkpoint with errno and unpruned count/bytes."
regression = ["cargo:mc-core:journal_tests::prune_reports_and_counts_a_refused_removal"]
fix_commit = "patch:a91be6b8f6fe65a21f2e54f42f97b092d8a3f2d8f0d0887a435cbd9b2f211c9d"
failing_first = "not recorded"
promotion = "docs/bugs/promotions/JOURNAL-PRUNE-ERRORS-SILENT.json"
