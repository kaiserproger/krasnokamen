[[bug]]
id = "WINDOWS-BACKUP-CONVERSION"
title = "The console /backup path copies the live redb by path instead of the owned database snapshot, and world import-anvil/export-anvil/census walk and key paths with the platform separator (so a world lease file is treated as a source and validate_relative_path fails on the '\\' keys). The Windows second-handle LockFileEx error 33 is tracked separately in WINDOWS-BACKUP-SECOND-HANDLE-ERROR-33."
area = "gameplay"
repro = "source"
severity = "major"
status = "open"
source = "WinFixReview (history://WinFixReview) on RC5 hotfix a76e1e80: mc-edge backup.rs ExclusiveLease, mc-core hot_backup.rs:123-127, world_conversion.rs:673-679, import.rs session.lock skip"
regression = ["cargo:mc-core:hot_backup_tests::copy_reads_the_owned_database_snapshot_not_a_second_path_handle", "cargo:mc-core:hot_backup_tests::backup_of_a_running_core_restores_the_state_at_its_tick", "cargo:mc-core:core::stop_tests::shutdown_releases_database_while_backup_admission_is_paused", "cargo:mc-edge:backup::tests::offline_backup_restore_copies_database_under_real_file_leases", "cargo:mc-edge:backup::tests::hot_backup_of_a_running_core_is_a_verified_restorable_backup", "cargo:mc-world-conversion:path_tests::walked_paths_are_portable_metadata_keys_and_exclude_world_lease", "cargo:mc-world-conversion:path_tests::syncing_staged_nested_files_preserves_every_byte", "cargo:mc-world-conversion:roundtrip_tests::nested_paths_import_export_and_census_under_world_leases", "cargo:mc-world:native::backup_tests::snapshot_reads_lease_holding_handle_without_releasing_database_custody"]
fix_commit = "patch:cc59e7252b58d25585849f9e4fbc7860fe3ae48c27e40b483a6f6ad0bf0238eb"
repro_check = "Narrowed to the Linux-proven parts (final review B1): identity patch:cc59e725 carries the HEAD equivalent of the c1f387bbcb hunks that a Linux control can redden — hot_backup copy through the owned reader (hot_backup_tests.rs:107), the lease file skipped and slash-normalized keys (path_tests.rs:22, roundtrip_tests.rs:528) and the mc-edge lease-holding reads (coverage only: offline_backup_restore_copies_database_under_real_file_leases is green in the control on Linux). The core.rs BackupJob.store/CoreInner.backup_store hunks are class (c) (a later commit removed the plumbing; core.rs:340-343 has no store field); the native.rs snapshot_reader hunk is class (b) (the kept native/backup_tests needs an independent cursor and checkpoint_drill_tests.rs:226 builds NativeStore { file, .. } as a struct literal), so its HEAD body stays on both sides and the native/backup_tests.rs:17 red under a try_clone adaptation is not evidence. The Windows error-33 symptom needs the Windows VM control and is the new open row WINDOWS-BACKUP-SECOND-HANDLE-ERROR-33."
