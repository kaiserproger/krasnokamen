[[bug]]
id = "WINDOWS-BACKUP-CONVERSION"
title = "The console /backup path copies the live redb by path instead of the owned database snapshot, and world import-anvil/export-anvil/census walk the world lease file as a source. The Windows-only symptoms (second-handle LockFileEx error 33 and the platform-separator keys) are tracked in WINDOWS-BACKUP-SECOND-HANDLE-ERROR-33."
area = "gameplay"
repro = "source"
severity = "major"
status = "fixed"
source = "WinFixReview (history://WinFixReview) on RC5 hotfix a76e1e80: mc-edge backup.rs ExclusiveLease, mc-core hot_backup.rs:123-127, world_conversion.rs:673-679, import.rs session.lock skip"
regression = ["cargo:mc-core:hot_backup_tests::copy_reads_the_owned_database_snapshot_not_a_second_path_handle", "cargo:mc-core:hot_backup_tests::backup_of_a_running_core_restores_the_state_at_its_tick", "cargo:mc-core:core::stop_tests::shutdown_releases_database_while_backup_admission_is_paused", "cargo:mc-edge:backup::tests::offline_backup_restore_copies_database_under_real_file_leases", "cargo:mc-edge:backup::tests::hot_backup_of_a_running_core_is_a_verified_restorable_backup", "cargo:mc-world-conversion:path_tests::walked_paths_are_portable_metadata_keys_and_exclude_world_lease", "cargo:mc-world-conversion:path_tests::syncing_staged_nested_files_preserves_every_byte", "cargo:mc-world-conversion:roundtrip_tests::nested_paths_import_export_and_census_under_world_leases", "cargo:mc-world:native::backup_tests::snapshot_reads_lease_holding_handle_without_releasing_database_custody"]
fix_commit = "patch:cc59e7252b58d25585849f9e4fbc7860fe3ae48c27e40b483a6f6ad0bf0238eb"
repro_check = "Narrowed to the two parts a Linux control proves (final review 9): identity patch:cc59e725 carries the hot_backup owned-reader copy (red at hot_backup_tests.rs:107) and the WORLD_LEASE_FILE_NAME skip (red at path_tests.rs:22, 2 != 1: the lease file is walked as a source). The separator hunks (lib.rs portable keys, import.rs saved-data keys) are carried but give no Linux red — on Linux the a/- form yields the same '/' keys and path_tests.rs:26 passes — so they belong to the Windows-only row WINDOWS-BACKUP-SECOND-HANDLE-ERROR-33, together with the LockFileEx error 33. core.rs BackupJob.store/CoreInner.backup_store hunks are class (c) (later removal; core.rs:340-343 has no store field); the native.rs backend/field/create_with_backend hunks and the snapshot_reader hunk are class (b), HEAD body on both sides (kept checkpoint_drill_tests.rs:226 struct literal and native/backup_tests cursor), so native/backup_tests.rs:17 is not evidence. Constructor adaptations on the a/-side: let _ = database; and &mut std::io::empty() at the journal call site."
promotion = "docs/bugs/promotions/WINDOWS-BACKUP-CONVERSION.json"
