[[bug]]
id = "SETTLEMENT-FURNACE-SITE-ON-ANOTHER-STRUCTURES-ROOF"
title = "The planner certifies the town furnace on another structure's roof (a generated village well), five blocks above the plaza, where no smelting tender can walk; the town owns a furnace it can never load."
area = "gameplay"
repro = "client"
severity = "major"
status = "open"
source = "Seed-24 civilization-seed-qa 20261124T131853-civilization-seed-qa-7a6bn2nl (pin 8a93c14578a1, windowed native client, 7239 s, ~39 000 ticks) on an adopted generated village (settlement 1 village_00000001, anchor [131,78,-217], household origin=adoption). world probe of the pinned native checkpoint (tick 177926): the 'floating 4x4 cobblestone platform' at x131..134, z-218..-221 is the village well - a cobblestone rim at y76 around 2x2 water at 132..133/-219..-220, four oak fence posts up to y80, a cobblestone roof at y81 and torches on it at y82. The storage building is [130,76,-218]..[132,79,-216], its work point (the source chest) [132,78,-217]. construction_furnace::plan searched surface_y(chest y=78, x, z) with SITE_BAND 8, so the well's roof top y81 won for the column (132,-219) at distance 2 on -z and the project origin became the furnace cell [132,82,-219]. The saved state keeps KrasnokamenSmelting {furnace:[132,82,-219], phase:Load, carried:[raw iron x2, coal x2]} for the whole run: the tender is never within reach, the furnace stays empty and unlit, no iron smelts, so shears (2 ingots) are never crafted, no wool is sheared, and the House bed waits. A Builder bound to the same cell stood at [132.7,79.0,-218.5] (the storage roof) with navigation target [132,82,-219], navigation_failed=false, and every stall window reported worksite_unreached until the 3000-shift-tick recovery released it and cancelled the unpaid meadow preparation (settlement_construction_stalled / settlement_construction_recovery_failed, server.log 2026-11-24T13:24:19 and 13:26:46)."
failing_first = "reported"
regression = [
  "cargo:mc-core:settlements::construction::planner_tests::a_furnace_site_stays_at_the_store_level_not_on_a_platform_above_it",
  "harness:civilization-seed-qa:iron_smelted",
]
fix_commit = "9026719a07d3c717cf8d6dfa3f53fee24867ef15"
repro_check = "Fix 9026719a07: furnace::plan skips a site column whose surface is more than two blocks from the storage chest's level, so the well roof (y81 against the chest's y78) is no longer a site and the search reaches the store's own terrace column. Red control: the guard hunk reversed alone on a worktree of 9026719a07 (wt/D123Civ-ctl-furnace, real pre-image, 12 deleted lines) makes a_furnace_site_stays_at_the_store_level_not_on_a_platform_above_it red at its own assert_ne!(project.origin, [3, 206, 1]) - the furnace lands back on the platform. Green on the candidate: the furnace filter, 60/60 tests, .analysis/validation/20261124T163043-test-_6lzkq5o. Graphical proof is the iron_smelted verdict of a passed civilization-seed-qa run on this tree; the verdict is the closest registered one (a passed run keeps the furnace at the store's terrace and smelts the stocked ore), while the row's exact symptom - the certified site's level - has no separate verdict, so a passed iron_smelted run is required and its promotion JSON records the reversed-pin graphical control as unrunnable unless a cheap reversed gate run serves several rows (Main's CIV-B1 ruling)."
