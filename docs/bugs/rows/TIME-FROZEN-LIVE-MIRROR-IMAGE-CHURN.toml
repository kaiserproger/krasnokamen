[[bug]]
id = "TIME-FROZEN-LIVE-MIRROR-IMAGE-CHURN"
title = "The live journal baseline mirror still projects native elapsed over held frames, causing redundant entity images"
area = "gameplay"
repro = "source"
severity = "minor"
status = "open"
source = "Separate residual from TIME-REPLAY-FROZEN-ENTITY-AGE, outside the approved recovery/debt fix. journal_touched.rs:565-569 advances the comparison state by simulation_interval's native to-from, and :774-776 does the same for villager countdowns. During a held active interval the owner stays unchanged but its comparison image advances; the absolute image emitted on mismatch preserves custody but causes avoidable WAL/image churn. The test-only full-scan fence uses the same native projection at :807-808 and :826-829."
regression = []
failing_first = "not recorded"
repro_check = "Design ready (receipts/D123/D123Persist/DESIGN-TIME-FROZEN-LIVE-MIRROR-IMAGE-CHURN.md): journal_touched.rs:565-569 and :774-776 advance the comparison mirror by the activity interval (world/clocks.rs:291-309 knows activity and the current hold but subtracts no held ticks and keeps no frame history), while replay advances by ReplayChunkClock::between against ReplayGameClock::between (replay_game_clock.rs:228). Fix needs a live MirrorGameClock/MirrorChunkClock fed from the GameClockImage and SimDebtImage frames the world already produces, replacing both mirror advances; regression asserts no entity image inside a held span and live/recovered age equality."
