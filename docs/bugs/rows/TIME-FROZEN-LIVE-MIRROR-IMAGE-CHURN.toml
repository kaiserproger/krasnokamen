status = "fixed"
source = "Separate residual from TIME-REPLAY-FROZEN-ENTITY-AGE, outside the approved recovery/debt fix. journal_touched.rs:565-569 advances the comparison state by simulation_interval's native to-from, and :774-776 does the same for villager countdowns. During a held active interval the owner stays unchanged but its comparison image advances; the absolute image emitted on mismatch preserves custody but causes avoidable WAL/image churn. The test-only full-scan fence uses the same native projection at :807-808 and :826-829."
regression = ["cargo:mc-core:journal_touched::tests::held_game_clock_does_not_churn_a_touched_mob", "cargo:mc-core:journal_touched::tests::held_game_clock_holds_a_working_villager_baseline", "cargo:mc-core:journal_touched::tests::recovered_mob_clock_does_not_burst_on_the_first_batch", "cargo:mc-core:journal_touched::tests::the_mirror_agrees_with_the_replay_game_clock_over_holds"]
failing_first = "not recorded"
repro_check = "Reworked after review: the live mirror records game-clock held spans (clock_since = tick - 1 so a recovery baseline at R projects exactly), keeps per-span cumulative held counts for O(log n) lookups, and advances mobs by simulated game ticks and villagers per running span; the differential fence uses the same helpers. Patch-mode identity patch:04e20068 (docs/bugs/fix-patches/TIME-FROZEN-LIVE-MIRROR-IMAGE-CHURN.{patch,hunks.md}) reverses the three projection helpers to the pre-fix raw activity interval; the kept tests call them, so the a/-side keeps their names (preserved-API constructor) and only their semantics revert. Discriminating refs: the touched-mob and working-villager tests fail at their own image assertions in the control, and the differential test disagrees with ReplayGameClock during holds; the recovery test is a guard for the tick-1 history and is green in the control."
fix_commit = "patch:04e20068872aec5d77762675d0435921f39580e4526415bdf596252277a3be67"
