[[bug]]
id = "TIME-FROZEN-LIVE-MIRROR-IMAGE-CHURN"
title = "The live journal baseline mirror still projects native elapsed over held frames, causing redundant entity images"
area = "gameplay"
repro = "source"
severity = "minor"
status = "fixed"
source = "Separate residual from TIME-REPLAY-FROZEN-ENTITY-AGE, outside the approved recovery/debt fix. journal_touched.rs:565-569 advances the comparison state by simulation_interval's native to-from, and :774-776 does the same for villager countdowns. During a held active interval the owner stays unchanged but its comparison image advances; the absolute image emitted on mismatch preserves custody but causes avoidable WAL/image churn. The test-only full-scan fence uses the same native projection at :807-808 and :826-829."
regression = ["cargo:mc-core:journal_touched::tests::held_game_clock_emits_no_mirror_images_inside_the_hold", "cargo:mc-core:journal_touched::tests::held_game_clock_keeps_idle_villager_baselines_equal_to_live"]
failing_first = "not recorded"
repro_check = "Implemented the live mirror: ChunkWorld records the game-clock held spans from the (held at tick, held at tick-1) pair it already receives and projects game ticks exactly as ReplayGameClock does (world/clocks.rs record_clock_tick/game_ticks_at/simulated_game_ticks/for_each_running_interval/last_running_at); journal_touched advances mobs by simulated game ticks and villagers per running span, and the differential fence uses the same projection. Regression: held_game_clock_emits_no_mirror_images_inside_the_hold (no image for 8 held ticks, countdown resumes on release) and held_game_clock_keeps_idle_villager_baselines_equal_to_live (villager path, no image inside the hold)."
fix_commit = "0d718b991b71a90040b833638760cfc4f26b93b0"
