repro_check = "Reworked after two review rounds: the live mirror records game-clock held spans (clock_since = tick - 1 so a recovery baseline at R projects exactly), keeps per-span cumulative held counts for O(log n) lookups, and advances mobs by simulated game ticks and villagers per running span; the differential fence uses the same helpers. Patch-mode identity patch:21994e48 carries every non-test hunk of 0d718b991b (world.rs clock fields, the clocks.rs projection and recorder, the journal_touched.rs call sites/helpers) plus the follow-up c8568f0a9 arithmetic; reversed, the a/-side is the pre-fix inline projection (journal_touched.rs takes the pre-image verbatim) and the only adaptation is the kept tests' three helper names, which the pre-image lacks ((b): reversing them stops the control building) and which the a/-side implements with the old interval arithmetic. Discriminating refs: the touched-mob, working-villager and differential tests fail at their own assertions in the control; the recovery guard is green in the control (the old interval matched the live row) and reddens when the fix itself is mutated to clock_since = Some(tick) (observed at journal_touched_tests.rs is_empty)."
