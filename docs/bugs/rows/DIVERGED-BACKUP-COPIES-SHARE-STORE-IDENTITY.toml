[[bug]]
id = "DIVERGED-BACKUP-COPIES-SHARE-STORE-IDENTITY"
title = "Two copies restored from one backup keep the same store_uuid, so after they run independently their WAL tails are indistinguishable to the store-binding check: a tail from the other branch, in a matching tick range and under the same palette, replays."
area = "gameplay"
repro = "source"
severity = "major"
status = "fixed"
source = "Found by the PersistRows review (receipts/PersistRows/REVIEW-sol.md, finding 5) while proving WAL-BATCH-HAS-NO-STORE-IDENTITY. `run_restore` copies `native/state.redb`, the checkpoint marker and `journal/` verbatim and never rewrites the header id; that is deliberate — a restored backup is the same world, and the marker repeats the id (crates/mc-world/src/native.rs validate_header, store_marker). The consequence: restore one backup twice, start both copies on different hosts, and each keeps a valid `store_uuid` that is equal to the other's. Every batch of either branch then carries a matching 16-byte store id and, with the same content pin, a matching palette digest, so `decode_batch`'s binding accepts branch B's tail on branch A with only the tick range as a limit. The current regression (journal_tests::recovery_refuses_a_journal_copied_from_another_world) creates two independently created stores and therefore does not cover this case; no test claims it does. Not a stated-intent failure: the frame says which world wrote it, and both copies are that world as far as the header knows. Fix direction open (not decided, needs the owner's call because it touches what a restored world is): either a per-instance epoch/lineage written on first start after a restore (a new persisted header field and a WAL frame field), or accept it and document that a diverged copy must not be merged with its sibling."
regression = ["cargo:mc-edge:backup::tests::a_restored_copy_refuses_the_journal_of_another_copy_of_its_backup", "cargo:mc-edge:backup::tests::backup_roundtrip_preserves_real_core_store_wal_and_metadata", "cargo:mc-core:journal_tests::recovery_refuses_a_tail_of_another_branch_of_the_same_store", "cargo:mc-core:journal_tests::rebind_tail_moves_only_the_copied_branch_above_the_checkpoint", "cargo:mc-world:store_marker_tests::the_crash_window_rewrite_keeps_the_branch"]
fix_commit = "01ac685ba7a9f20bf565d831daa7a0263b342c6e"
failing_first = "not recorded"
repro_check = "Decision: Main's option (a) (receipts/D123/OWNER-DECISIONS-NEEDED.md, owner may veto). Fix: every `world restore` mints a random branch for its copy (`run_restore` -> `start_branch`), moves the copied tail above the checkpoint onto it (`journal::rebind_tail`) and writes it into the checkpoint marker; WAL frames are format 3 with the branch beside the store id, and replay requires store AND branch AND palette to match (design: receipts/D123PersistDiv/DIVERGED-BACKUP-DESIGN.md). Proving ref: backup::tests::a_restored_copy_refuses_the_journal_of_another_copy_of_its_backup restores one backup twice, lets the right copy publish a tail bound exactly as its serve binds it, copies that journal over the left copy's and asserts Core::open refuses naming the branch; with the fix commit's restore hunk reversed both copies stay on the backup's branch and the sibling tail replays (red at the refusal assertion). backup_roundtrip_* asserts the restored marker's branch differs from the source and the copy replays its own rebound tail; the mc-core and mc-world refs are green regressions of the frame binding, the rebind and the marker rewrite."
promotion = "docs/bugs/promotions/DIVERGED-BACKUP-COPIES-SHARE-STORE-IDENTITY.json"
