[[bug]]
id = "DIVERGED-BACKUP-COPIES-SHARE-STORE-IDENTITY"
title = "Two copies restored from one backup keep the same store_uuid, so after they run independently their WAL tails are indistinguishable to the store-binding check: a tail from the other branch, in a matching tick range and under the same palette, replays."
area = "gameplay"
repro = "source"
severity = "major"
status = "open"
source = "Found by the PersistRows review (receipts/PersistRows/REVIEW-sol.md, finding 5) while proving WAL-BATCH-HAS-NO-STORE-IDENTITY. `run_restore` copies `native/state.redb`, the checkpoint marker and `journal/` verbatim and never rewrites the header id; that is deliberate — a restored backup is the same world, and the marker repeats the id (crates/mc-world/src/native.rs validate_header, store_marker). The consequence: restore one backup twice, start both copies on different hosts, and each keeps a valid `store_uuid` that is equal to the other's. Every batch of either branch then carries a matching 16-byte store id and, with the same content pin, a matching palette digest, so `decode_batch`'s binding accepts branch B's tail on branch A with only the tick range as a limit. The current regression (journal_tests::recovery_refuses_a_journal_copied_from_another_world) creates two independently created stores and therefore does not cover this case; no test claims it does. Not a stated-intent failure: the frame says which world wrote it, and both copies are that world as far as the header knows. Fix direction open (not decided, needs the owner's call because it touches what a restored world is): either a per-instance epoch/lineage written on first start after a restore (a new persisted header field and a WAL frame field), or accept it and document that a diverged copy must not be merged with its sibling."
regression = ["cargo:mc-edge:backup::tests::a_restored_copy_refuses_the_journal_of_another_copy_of_its_backup", "cargo:mc-edge:backup::tests::a_restore_interrupted_before_its_first_rebind_leaves_nothing_that_opens", "cargo:mc-edge:backup::tests::a_restore_interrupted_inside_its_tail_rebind_leaves_nothing_that_opens", "cargo:mc-edge:backup::tests::a_restore_interrupted_before_publication_leaves_the_target_untouched", "cargo:mc-edge:backup::tests::a_restore_interrupted_after_publication_leaves_the_complete_world", "cargo:mc-edge:backup::tests::a_backup_of_a_restored_copy_with_an_empty_journal_verifies", "cargo:mc-edge:backup::tests::backup_roundtrip_preserves_real_core_store_wal_and_metadata", "cargo:mc-core:journal_tests::a_missing_journal_is_an_empty_tail_only_on_the_root_branch", "cargo:mc-core:journal_tests::recovery_refuses_a_tail_of_another_branch_of_the_same_store", "cargo:mc-core:journal_tests::rebind_tail_moves_only_the_copied_branch_above_the_checkpoint", "cargo:mc-world:store_marker_tests::the_crash_window_rewrite_keeps_the_branch", "cargo:mc-world:store_marker_tests::a_minted_branch_uses_all_64_bits"]
fix_commit = "patch:0ec63ae44ee635104a5c5cbc5897a7c69ab0566e42f3ee2e06bdb450af38b7ff"
failing_first = "not recorded"
repro_check = "Proving refs (red with the fix patch docs/bugs/fix-patches/DIVERGED-BACKUP-COPIES-SHARE-STORE-IDENTITY.patch reversed, which restores the verbatim in-place restore of the base): backup::tests::a_restored_copy_refuses_the_journal_of_another_copy_of_its_backup restores one backup twice, lets the right copy publish a tail bound exactly as its serve binds it, copies that journal over the left copy's and asserts Core::open refuses naming the branch (red: the sibling tail replays); backup::tests::a_restore_interrupted_before_its_first_rebind_leaves_nothing_that_opens kills a restore after its last copy and asserts the target holds no world (red: the target holds the backup's store, marker and tail on the backup's own branch). journal_tests::a_missing_journal_is_an_empty_tail_only_on_the_root_branch is red with the patch's journal hunk reversed (a restored copy without journal/ reads as an empty tail). Fix commits 01ac685ba7 (mint and rebind) and cee142f323 (staging publication, journal/ rule); map in docs/bugs/fix-patches/DIVERGED-BACKUP-COPIES-SHARE-STORE-IDENTITY.hunks.md."
