# Both regressions red through the multi-line `assert!(bed_occupied(..), "…")` macro, whose panic
# location is the macro's own first line, so the control's red is named here (README class (c)).
proving_assertions = { "cargo:mc-core:sleep::tests::a_sleeping_player_marks_the_bed_occupied_and_a_wake_clears_it" = "crates/mc-core/src/sleep_tests.rs:1300", "cargo:mc-core:sleep::tests::a_sleeping_resident_marks_the_bed_occupied_and_any_wake_clears_it" = "crates/mc-core/src/sleep_tests.rs:1321" }
promotion = "docs/bugs/promotions/BED-OCCUPIED-PROPERTY-NOT-MIRRORED.json"
