[[bug]]
id = "BED-OCCUPIED-PROPERTY-NOT-MIRRORED"
title = "A sleeping resident never sets its bed block's occupied=true"
area = "gameplay"
repro = "client"
severity = "minor"
status = "fixed"
source = "receipts/BreakVillageParity/FINDINGS.md (Noticed, not filed): every bed reads FREE while its owner sleeps, in all scenes and in the baseline; vanilla LivingEntity.startSleeping sets the bed's OCCUPIED block state. Solaris derived bed occupancy from its sleepers and never mirrored the property. Also stated in docs/bugs/rows/VILLAGER-BED-USE-SLEEPS-PLAYER-OVER-VILLAGER.toml source. Fix: one mirror pass per tick after the merge in tick/dimension.rs (occupied_beds derived from state.sleepers and sleeping residents; both halves written; a bed an accepted write already targets is skipped, so a same-tick break wins), fix patch docs/bugs/promotions/BED-OCCUPIED-PROPERTY-NOT-MIRRORED.patch, hunk map beside it. Client-visible: promotion needs a scene that reads the bed head's occupied state during sleep and after the wake - see receipts/D123/D123Battle/OWNER-DECISIONS-NEEDED.md item 2. Filed as its own row on 2026-11-24 (review N5). REOPENED 2026-11-27 (D123 review): the recorded patch no longer reverses on the final tree - git apply -R --check fails at crates/mc-core/src/sleep.rs:295, because later commits extended the fix (seed_occupied_beds, the load-time reseed) - so the 2026-11-24 promotion (docs/bugs/promotions/BED-OCCUPIED-PROPERTY-NOT-MIRRORED.json, kept as history) no longer reproduces and its identity is not the candidate's. Its receipt also records the player scene only: harness:scene-shot:native-village-occupied-bed is registered in regression but appears in no control or restore entry, and the manual graphical red in the hunk map is on another tree at 660717828dd4. The fix code is present at HEAD (sleep.rs:311 mirror_occupied_beds, :441 set_bed_occupied; tick/dimension.rs:287), so the two cargo refs stay green; re-promotion needs a forward-ported patch that reverses on the candidate plus both window pairs (player and resident) bound to it."
regression = ["cargo:mc-core:sleep::tests::a_sleeping_player_marks_the_bed_occupied_and_a_wake_clears_it", "cargo:mc-core:sleep::tests::a_sleeping_resident_marks_the_bed_occupied_and_any_wake_clears_it", "harness:scene-shot:native-bed-occupied-state",
  "harness:scene-shot:native-village-occupied-bed"]
failing_first = "not recorded"
fix_commit = "patch:c8992851bda50fd2f9dfd2356123a90a6f7a43e9017cd6b9352d4dc550e53a4e"
# Both regressions red through the multi-line `assert!(bed_occupied(..), "…")` macro, whose panic
# location is the macro's own first line, so the control's red is named here (README class (c)).
proving_assertions = { "cargo:mc-core:sleep::tests::a_sleeping_player_marks_the_bed_occupied_and_a_wake_clears_it" = "crates/mc-core/src/sleep_tests.rs:1300", "cargo:mc-core:sleep::tests::a_sleeping_resident_marks_the_bed_occupied_and_any_wake_clears_it" = "crates/mc-core/src/sleep_tests.rs:1321", "harness:scene-shot:native-bed-occupied-state" = "bed_head_occupied_contains_0", "harness:scene-shot:native-village-occupied-bed" = "resident_bed_head_occupied_contains_0" }
repro_check = "Re-promotion (2026-11-28) is a one-line patch refresh, not a rebuild: the tracked patch named the pre-cut path crate::placement::other_half, which the mc-placement crate split moved to mc_placement::other_half (patch line 86). With that single substitution the patch reverses on clean 206fe0626 (git apply -R --check OK) and its non-test-hunks sha256 is c8992851bda50fd2f9dfd2356123a90a6f7a43e9017cd6b9352d4dc550e53a4e; the occupied_beds field, the hydration seeding and the custody tests stay exactly as HEAD has them (README classes (a)/(b)), and 59f68649f stays untouched. Control: reversing on the candidate yields a two-file pre-image (crates/mc-core/src/sleep.rs, crates/mc-core/src/tick/dimension.rs) where the two cargo refs must red at sleep_tests.rs:1300 and :1321, and both scenes red on their own proving assertions; the candidate receipts of harness:scene-shot:native-bed-occupied-state and harness:scene-shot:native-village-occupied-bed are green. For the client-visible half, take a passing receipt of harness:scene-shot:native-bed-occupied-state and one of harness:scene-shot:native-village-occupied-bed on the candidate, and a red of each on the same reversed tree (each needs its own pin-release registration). The two scenes cover the player and the resident separately: the player scene asserts bed_head/bed_foot occupied while the sleeper lies and free after the wake, the resident scene the same on a villager's claimed bed. No graphical control exists on the final tree yet."
promotion = "docs/bugs/promotions/BED-OCCUPIED-PROPERTY-NOT-MIRRORED.json"
