[[bug]]
id = "BED-OCCUPIED-PROPERTY-NOT-MIRRORED"
title = "A sleeping resident never sets its bed block's occupied=true"
area = "gameplay"
repro = "client"
severity = "minor"
status = "fixed"
source = "receipts/BreakVillageParity/FINDINGS.md (\"Noticed (not filed)\"): every bed reads FREE while its owner sleeps, in all scenes and in the baseline; vanilla LivingEntity.startSleeping sets the bed's OCCUPIED block state. Solaris derived bed occupancy from its sleepers and never mirrored the property. Also stated in docs/bugs/rows/VILLAGER-BED-USE-SLEEPS-PLAYER-OVER-VILLAGER.toml source. Fix: one mirror pass per tick after the merge in tick/dimension.rs (occupied_beds derived from state.sleepers and sleeping residents; both halves written; a bed an accepted write already targets is skipped, so a same-tick break wins), fix patch docs/bugs/promotions/BED-OCCUPIED-PROPERTY-NOT-MIRRORED.patch, hunk map beside it. Client-visible: promotion needs a scene that reads the bed head's occupied state during sleep and after the wake — see receipts/D123/D123Battle/OWNER-DECISIONS-NEEDED.md item 2. Filed as its own row on 2026-11-24 (review N5)."
regression = ["cargo:mc-core:sleep::tests::a_sleeping_player_marks_the_bed_occupied_and_a_wake_clears_it", "cargo:mc-core:sleep::tests::a_sleeping_resident_marks_the_bed_occupied_and_any_wake_clears_it", "harness:scene-shot:native-bed-occupied-state",
  "harness:scene-shot:native-village-occupied-bed"]
