source = "Seed-24 civilization-seed-qa 20261111T200623-90d4lq2w on 5ae49587, 96,000 sprint ticks: wood was not the blocker (64 birch logs by sprint 1200, 148 at the end), the town furnace at [134,78,-217] stayed empty in all 41 reads while 8 raw iron and 7-13 coal sat in storage, and the House stayed 'White Bed 0/1 awaiting production' behind funded mason, lumber camp, mine and road projects. construction::iron_demand returned only the active project's bill (no iron), and only unemployed residents or shepherds loaded ore; the one unemployed adult died to a zombie at tick 7536, leaving a lumberjack, a miner, a builder and two nitwits. Negative control: Both tests fail with only the fix hunks reverted (receipts/CivSimSeed24/fix-hunks.patch, sha256 434a04ce): the planner test gets iron demand 0 instead of 2 once the funded farm starts, and the miner never loads the furnace (receipts/CivSimSeed24/unit-negative-control.log); fixed tree 109/109 in receipts/CivSimSeed24/unit-fixed.log."
