[[bug]]
id = "STORAGE-L3-SEALED-CORNER-CHEST"
title = "The level-three storage barrel is placed over the corner chest, sealing it: the chest is unreachable from the entrance and an adopted village stops producing stock and building"
area = "gameplay"
repro = "source"
severity = "major"
status = "fixed"
source = "Owner report (issue 1, storage): a settlement with a level-three storage never used its container - the L3 barrel blueprint (crates/mc-core/assets/blueprints/storage.json) sits on the cell of the level-one corner chest, so the chest is walled in with no route from the door. Found by Stage2Edge while tracing the autonomy run that stopped producing stock (wt/Stage2Edge). The fix is 50f1e9a0e; 90e282cec, cited with it in the field note, is a later test-only commit at the top of the stage2/edge branch (Stage2X SLICES.md:92/121), not part of the fix."
regression = ["cargo:mc-core:settlements::blueprints::tests::every_storage_container_is_reachable_from_the_entrance", "cargo:mc-core:villager::building_autonomy_tests::adopted_village_with_resident_shears_produces_stock_and_builds"]
failing_first = "reported"
fix_commit = "patch:cc57c08cd8ee096658ff998a85cb5dadfd3ee6e9d53e72c2fcfe38f430fed1d3"
repro_check = "Production-only patch: reverse docs/bugs/fix-patches/STORAGE-L3-SEALED-CORNER-CHEST.patch (patch:cc57c08c, the only production hunk of 50f1e9a0e; map in docs/bugs/promotions/STORAGE-L3-SEALED-CORNER-CHEST.hunks.md) and keep the reachability test unchanged. Observed red: every_storage_container_is_reachable_from_the_entrance = FAIL in docs/bugs/promotions/STORAGE-L3-SEALED-CORNER-CHEST.json negative_control; restore green in the same receipt. The adopted-village ref in its regression list is green in the control too: it guards the adopted-village path and is not this row's proof."
promotion = "docs/bugs/promotions/STORAGE-L3-SEALED-CORNER-CHEST.json"
