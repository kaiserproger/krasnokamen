[[bug]]
id = "LEDGER-PROMOTE-STAMPS-A-ROW-WHILE-MAIN-MOVES"
title = "A promotion validates the fingerprint it captured at start, not the candidate's current HEAD, so a clean commit landing during a promote is invisible to the row it stamps."
area = "harness"
repro = "source"
severity = "minor"
status = "open"
source = "Two measurements, 2026-11-28. (1) A promote started on main at `221b859f0` while Main was also committing could not reproduce its candidate and refused: `[ledger] refused: the candidate worktree does not reproduce the tree being promoted (HEAD plus uncommitted state)`. (2) A disposable Git repo driven through `_materialize` showed a clean committed HEAD move succeeding on the captured head while the root stayed clean at the newer one (`a9260418851b` vs `87e80c78e13d`), so the refusal in (1) was the dirty-diff mismatch, not the HEAD drift."
failing_first = "not recorded"
regression = []
repro_check = "`_materialize` (tools/harness/ledger.py:1823-1838) resets the control worktree to `expected['head']`, applies the root's current dirty diff and untracked files, and refuses unless `tree_fingerprint` matches the fingerprint captured at promote start. With the diff unchanged, a HEAD that moved during the promote still reproduces `expected`, so the control runs on the captured tree; `_record_promotion` (ledger.py:2283-2297) then flips the row without comparing `expected['head']` with `git rev-parse HEAD` in the root. What a reader cannot tell from the receipt is which tree the row's `fixed` belongs to when main has moved on: either refuse on `expected['head'] != current HEAD`, or record both heads in the receipt."
