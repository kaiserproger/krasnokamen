[[bug]]
id = "EDGE-SLOW-PUMP-HOLDS-JOIN-BEHIND-STALE-OUTPUTS"
title = "An edge pump slower than the tick sits at the oldest retained broadcast output and drains the reliable outbox only through that tick, so every reliable change, a `Joined` too, waits a whole broadcast window of tick periods: below about 3 TPS a join times out at the 10 s deadline"
area = "gameplay"
severity = "major"
status = "open"
source = "Latent; candidate mechanism for Perf1M R3k-4 leg c (receipts/Perf1M/LAPTOP-R3k-4-REPORT.md: four joins admitted at 18:47:41.6 closed with `timed out waiting for join` at 18:47:51.6), whose cause stays open: that run has no pump or per-tick telemetry and its TPS in the window is unknown. CheckpointJoinStall 2026-11-20, from code and a synthetic repro with the real core and pump: crates/mc-edge/src/server/pump.rs routes the outbox only through the output it publishes (core.rs `try_drain_outbox_through`, core/outbox.rs); after `Lagged` the pump resumes at the oldest retained output, so a pump slower than the tick stays `broadcast_cap - 1` outputs behind. Base dc670b3bd repros: 20 TPS, window 256, pump 64 outputs behind at half rate -> `Joined` after 132 ticks (6.6 s); `/tick rate 3`, window 32 -> 34 ticks (11.3 s, past the 10 s deadline). Receipts: receipts/CheckpointJoinStall/repro/m2-repro-base-20tps-and-stallhalt.log and m2-repro-base-3tps.log."
repro = "cargo"
regression = [
  "cargo:mc-edge:server::pump_join_lag_tests::a_slow_pump_does_not_hold_a_join_behind_stale_outputs",
  "cargo:mc-edge:server::pump_join_lag_tests::a_join_lands_at_three_tps_behind_a_slow_pump_without_a_halt",
  "cargo:mc-edge:server::pump_join_lag_tests::a_stale_skip_keeps_reliable_changes_in_order_and_never_drains_ahead",
  "cargo:mc-edge:server::pump_join_lag_tests::a_fresh_output_after_a_long_tick_is_not_stale",
  "cargo:mc-edge:server::pump_join_lag_tests::the_queue_budget_is_exclusive",
  "cargo:mc-edge:server::pump_join_lag_tests::the_newest_output_is_never_stale",
  "cargo:mc-edge:server::admin_tests::explosion_queue_tests::stale_skip_closes_only_recipients_of_skipped_knockback",
  "harness:join-lag-gate:join_behind_slow_pump",
]
failing_first = "reported"
note = "Negative control: row 1 cannot be red independently at client level on pre-fix code — the 10 s stall watch and the 10 s join deadline race there and row 2's fail-closed halt fires first; the harness judges row 1 null then, with that reason in the receipt (025204). Its NC is therefore the shared-fix control (row 2 red on the same control tree whose only delta is stale() returning false) plus the cargo NCs above. Positive: harness:join-lag-gate:join_behind_slow_pump on the gate tree."
