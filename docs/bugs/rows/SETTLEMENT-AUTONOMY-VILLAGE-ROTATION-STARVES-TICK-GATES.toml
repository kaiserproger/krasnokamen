[[bug]]
id = "SETTLEMENT-AUTONOMY-VILLAGE-ROTATION-STARVES-TICK-GATES"
title = "With eight villages pending in the autonomy queue, half of them are only ever stepped on odd ticks, so their `tick % 20 == 0` gates never fire and their natural zones are never proved"
area = "gameplay"
repro = "cargo"
severity = "minor"
status = "open"
source = "Opus round-3 review of wt/D123CivQ (receipts/D123/D123Civ/REVIEW-QUEUENATURAL3-Opus.md, 'Вне рамок'): `autonomy.rs` steps `min(len, VILLAGES_PER_TICK=4)` pending villages per tick by `pop_front` / `push_back`. With 8 pending villages the queue alternates [0..3] on even ticks and [4..7] on odd ticks forever, so villages 4..7 never see `state.tick.is_multiple_of(20)` and neither `prove_natural` nor the `tick % 20` zone-probe gate (`autonomy.rs` ~401, ~417) ever runs for them; other queue lengths whose rotation period shares a factor with 20 (twelve gives period 3 and is fine; sixteen gives period 4 and is not) starve the same way - derive the full set in the proof rather than trusting this sentence. Read from the code; not reproduced. Rare in practice (it needs several generated villages adopted in one session) and predates D123."
failing_first = "cargo"
regression = ["cargo:mc-core:settlements::autonomy::tests::every_pending_village_turns_on_a_gate_tick"]
cause = "The queue rotates by `pop_front`/`push_back` a fixed batch of `VILLAGES_PER_TICK`, so a village's turn is fixed to the tick's parity whenever `pending / batch` is even (eight pending: [0..3] on even ticks, [4..7] on odd). `advance` gates `prove_natural` and the zone probe on `state.tick % 20 == 0`, which only even ticks satisfy: villages 4..7 never prove a natural zone. Fix: `passes_per_tick` steps every pending village on a tick that is a multiple of 20 (the write side of those gates), keeping the bounded batch on every other tick. Observed negative control: with the plain `min(pending, 4)` batch the unit test fails at a queue of 5 pending villages."
fix_commit = "3bf9aa7aa"
repro_check = ["`cargo test -p mc-core --lib settlements::autonomy::tests::every_pending_village_turns_on_a_gate_tick`: simulates the `pop_front`/`push_back` rotation for 1..=16 pending villages over 400 ticks and asserts every village took a turn on a `tick % 20 == 0` tick. Reversal control observed red with the plain `min(pending, VILLAGES_PER_TICK)` batch (queue of 5 starves)."]
