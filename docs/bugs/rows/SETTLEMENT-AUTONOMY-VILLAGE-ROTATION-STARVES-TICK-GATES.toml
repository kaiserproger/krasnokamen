[[bug]]
id = "SETTLEMENT-AUTONOMY-VILLAGE-ROTATION-STARVES-TICK-GATES"
title = "With eight villages pending in the autonomy queue, half of them are only ever stepped on odd ticks, so their `tick % 20 == 0` gates never fire and their natural zones are never proved"
area = "gameplay"
repro = "cargo"
severity = "minor"
status = "open"
source = "Opus round-3 review of wt/D123CivQ (receipts/D123/D123Civ/REVIEW-QUEUENATURAL3-Opus.md, 'Вне рамок'): `autonomy.rs` steps `min(len, VILLAGES_PER_TICK=4)` pending villages per tick by `pop_front` / `push_back`. With 8 pending villages the queue alternates [0..3] on even ticks and [4..7] on odd ticks forever, so villages 4..7 never see `state.tick.is_multiple_of(20)` and neither `prove_natural` nor the `tick % 20` zone-probe gate (`autonomy.rs` ~401, ~417) ever runs for them; other queue lengths whose rotation period shares a factor with 20 (twelve gives period 3 and is fine; sixteen gives period 4 and is not) starve the same way - derive the full set in the proof rather than trusting this sentence. Read from the code; not reproduced. Rare in practice (it needs several generated villages adopted in one session) and predates D123. Cause (measured): The queue rotates by `pop_front`/`push_back` a fixed batch of `VILLAGES_PER_TICK`, so a village's turn is fixed to the tick's parity whenever `pending / batch` is even (eight pending: [0..3] on even ticks, [4..7] on odd). `advance` gates `prove_natural` and the zone probe on `state.tick % 20 == 0`, which only even ticks satisfy: villages 4..7 never prove a natural zone. Fix: each pending village carries a runtime `next_gate` clock - the gates run when the world tick reaches it and it then moves 20 ticks on - so the fixed batch keeps every village fed within a bounded per-tick cost (the earlier gate-tick burst was amended after review round 5)."
failing_first = "reported"
regression = [
  "cargo:mc-core:settlements::autonomy::tests::every_pending_village_gate_steps_within_the_rotation_window",
  "cargo:mc-core:settlements::autonomy::tests::every_pending_village_takes_its_gate_clock_turn",
]

fix_commit = "patch:7b9ddbcbb6e17f4921956268a3e18abb04ee7b30b109ee2a3c4a75cae1d1f932"
repro_check = ["`cargo nextest run -p mc-core --lib every_pending_village_takes_its_gate_clock_turn`: simulates the `pop_front`/`push_back` rotation for 1..=16 pending villages over 400 ticks and asserts every village took a turn on a `tick % 20 == 0` tick. Reversal control observed red with the plain `min(pending, VILLAGES_PER_TICK)` batch (queue of 5 starves)."]
# fix_commit is 44aa3d95a, the commit that is an ancestor of main; b6cd4918b is the same change on a
# side line (its diff against 44aa3d95a for autonomy.rs and autonomy_tests.rs is empty).
# Control shape (Main, 2026-11-28): the current test cannot be the control — its body calls the
# private `super::gate_due` the fix introduces, so reversing the fix leaves a test that does not
# compile rather than one that goes red. The control must drive `autonomy::tick` through state a
# preimage also accepts (generated sites plus villager markers in the queue) and assert two things:
# every pending village's gate runs within the rotation window, and no tick steps more than
# VILLAGES_PER_TICK villages. The clock-only reversal of 44aa3d95a stepped all eight villages
# on tick 0 and failed the batch bound, not the progress assertion. The original starvation
# preimage is 9d1da7f8306e (bcd7ac471^); the retained live fixture has not yet run on that preimage.
