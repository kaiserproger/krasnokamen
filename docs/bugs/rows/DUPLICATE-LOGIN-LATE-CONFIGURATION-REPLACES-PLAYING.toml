[[bug]]
id = "DUPLICATE-LOGIN-LATE-CONFIGURATION-REPLACES-PLAYING"
title = "A connection that finishes configuration after another session of the same profile is already in Play kicks the playing session instead of being refused"
area = "gameplay"
repro = "source"
severity = "major"
status = "fixed"
source = "Breaker finding F7 (slice DUPLICATE-LOGIN 2): a same-profile client held in configuration through a loopback proxy and released after a second client entered Play joined and kicked the playing session (7/7 runs, both orders). Vanilla 26.3 ServerConfigurationPacketListenerImpl.handleConfigurationFinished refuses the late finisher with DUPLICATE_LOGIN_DISCONNECT_MESSAGE; only a newer login (ServerLoginPacketListenerImpl.verifyLoginAndFinishConnectionSetup -> disconnectAllPlayersWithProfile) kicks a session in Play. Custody held in every run. Arbitration lived only in crates/mc-core/src/tick/input/session.rs join."
regression = ["cargo:mc-core:tick::duplicate_login_tests::late_configuration_finisher_is_refused_and_the_player_in_play_keeps_custody", "cargo:mc-core:tick::duplicate_login_tests::second_finisher_is_refused_even_when_it_logged_in_later", "cargo:mc-core:tick::duplicate_login_tests::newer_login_still_kicks_a_session_already_in_play_and_takes_over_custody", "cargo:mc-core:singleplayer_pause::tests::paused_owner_relogin_kicks_the_stale_session_and_joins", "cargo:mc-edge:server::duplicate_login_tests::newer_login_of_the_same_account_kicks_the_session_in_play_and_reaches_play", "cargo:mc-edge:server::duplicate_login_tests::late_configuration_finisher_receives_the_duplicate_login_reason", "cargo:mc-edge:server::duplicate_login_tests::full_server_refuses_a_same_account_login_before_kicking_the_session_in_play"]
failing_first = "reported"
