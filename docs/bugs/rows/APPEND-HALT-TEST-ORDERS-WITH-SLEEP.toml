[[bug]]
id = "APPEND-HALT-TEST-ORDERS-WITH-SLEEP"
title = "`append_failure_halts_tick_without_waiting_for_native_commit` orders the append failure with a 400 ms sleep against a 2 s injected commit delay, so under parallel load the failure can land before the checkpoint handoff and `done_rx::recv` panics with `RecvError`"
area = "harness"
severity = "major"
status = "open"
source = "mc-core lib gate in wt/IntegB (.analysis/validation/20261120T033845-test-u4f1jvf4/test.log:1260-1262): `crates/mc-core/src/native_checkpoint_crash_tests.rs:738` panicked `called Result::unwrap() on an Err value: RecvError` after `crates/mc-core/src/native_checkpoint_crash_tests.rs:721` slept 400 ms hoping the journal had already handed the checkpoint to the delayed native writer; passed in isolation on the same tree (receipt 20261120T040801-test-ipuixbe1)."
repro = "cargo"
regression = ["cargo:mc-core:core::native_checkpoint_crash_tests::append_failure_halts_tick_without_waiting_for_native_commit"]
failing_first = "reported"
fix_commit = "de1a323b435c304dc84450fc2f48b8133bb8f9cf"
repro_check = "The fix de1a323b4 is test-only (native_checkpoint_crash_tests.rs joins the journal thread before the tempdir goes); its commit has no non-test hunks, so the patch-mode control has nothing to reverse and a reversal would only restore a teardown race whose failure is a hidden late panic, never an assertion (README:203-208: crash/timeout cannot be a control). The earlier ordering defect (400 ms sleep vs a 2 s injected commit delay) is now structurally gone: the test waits on entered_rx with a 10 s timeout and joins the writer. Kept open: no honest red exists; the ref is green on every tree (20261120T055005-test-vgedac9p and 20/20 repeats under load)."
