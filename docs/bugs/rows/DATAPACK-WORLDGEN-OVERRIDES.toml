[[bug]]
id = "DATAPACK-WORLDGEN-OVERRIDES"
title = "A selected datapack that carries worldgen this server cannot generate is refused, and the error names every unsupported entry instead of only the first. Only the experimental jigsaw inputs (worldgen structure_set, structure with a supported type, template_pool, processor_list, tags/worldgen/biome, structure .nbt) change generation; any other worldgen or dimension resource (biomes, dimension types, noise settings, features, unsupported structure types) refuses the pack with a bounded list of every such entry. Split from DATAPACK-WORLDGEN-ZIP, whose ZIP loading is implemented."
area = "gameplay"
repro = "manual"
severity = "major"
status = "open"
source = """Split from DATAPACK-WORLDGEN-ZIP. Since the A10 baseline-custody work the experimental jigsaw inputs
apply on restart and every other worldgen/dimension resource fails closed by name (docs/OPERATING.md
Datapacks and command blocks, docs/COMPATIBILITY.md); general custom terrain remains the open gap. The
new-pack skip half of the original report is DATAPACK-NEW-PACK-WORLDGEN-SKIP (open).

Fix in tree: 1d8e57dd8 collects every `ResourceError::Unsupported(entry)` of a pack into one bounded
list (first eight and a count) and refuses the pack once, instead of refusing on the first entry."""
regression = [
  "cargo:mc-core:datapacks::worldgen::tests::unsupported_worldgen_refusal_names_every_entry_and_supported_packs_load",
  "harness:datapack-reload:native-datapack-reload",
]
proving_refs = ["cargo:mc-core:datapacks::worldgen::tests::unsupported_worldgen_refusal_names_every_entry_and_supported_packs_load"]
failing_first = "reported"
fix_commit = "patch:05d3c72bf147c5be1c901d7c01aa9145caba07dad26d7579a5b253e09b0c858a"
repro_check = """RED control (mechanically faithful): in crates/mc-core/src/datapacks.rs replace the collection
           match with the pre-image refusal `Err(Unsupported(entry)) => return Err(entry)` (plus
           `Err(Invalid(error)) => return Err(error)`); `let mut unsupported: Vec<String>` then needs its
           type annotation (the one a/-side line, a type annotation). Artifact
           20261126T131704-test-2kqpijbt: mc-core
           datapacks::worldgen::tests::unsupported_worldgen_refusal_names_every_entry_and_supported_packs_load
           panics at datapacks_worldgen_tests.rs:460 naming only `mod/dimension/a.json`, i.e. the first
           entry — exactly the row's symptom. Green on the candidate: the same ref passes
           (artifact 20261126T133248-test-8j4eyj7d).

Promotion is not ready: the row's `harness:datapack-reload:native-datapack-reload` ref is a real-client
gate (release pin + windowed native client), and a `repro = manual` row needs its receipt; neither was
produced in this pass. The fix patch also has to be committed at
docs/bugs/fix-patches/DATAPACK-WORLDGEN-OVERRIDES.patch before a patch-mode promote (1d8e57dd8 cannot
be reversed whole: its PackSet::open/worldgen::open API is called by later production code)."""
