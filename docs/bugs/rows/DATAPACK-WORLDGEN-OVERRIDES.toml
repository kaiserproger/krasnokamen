[[bug]]
id = "DATAPACK-WORLDGEN-OVERRIDES"
title = "A selected datapack that carries worldgen this server cannot generate is refused, and the error names every unsupported entry instead of only the first. Only the experimental jigsaw inputs (worldgen structure_set, structure with a supported type, template_pool, processor_list, tags/worldgen/biome, structure .nbt) change generation; any other worldgen or dimension resource (biomes, dimension types, noise settings, features, unsupported structure types) refuses the pack with a bounded list of every such entry. Split from DATAPACK-WORLDGEN-ZIP, whose ZIP loading is implemented."
area = "gameplay"
repro = "manual"
severity = "major"
status = "open"
source = "Split from DATAPACK-WORLDGEN-ZIP. Since the A10 baseline-custody work the experimental jigsaw inputs apply on restart and every other worldgen/dimension resource fails closed by name (docs/OPERATING.md Datapacks and command blocks, docs/COMPATIBILITY.md); general custom terrain remains the open gap. The new-pack skip half of the original report is DATAPACK-NEW-PACK-WORLDGEN-SKIP (open)."
regression = ["cargo:mc-core:datapacks::worldgen::tests::unsupported_worldgen_refusal_names_every_entry_and_supported_packs_load", "harness:datapack-reload:native-datapack-reload"]
failing_first = "reported"
repro_check = "Promotion withdrawn (final review 10, B4): patch:d4c9b9eb is deleted. The real fix is 1d8e57dd8, which cannot be reversed whole on this tip (its PackSet::open/worldgen::open API is called by 251276077 at game_clock_upgrade.rs:276, a production call, so a whole reversal is E0425 and a compile failure is not a control; that exclusion is reason (c), a later commit's code depends on it, not (b) test-only). The withdrawn patch's a/-branch `Err(worldgen::ResourceError::Unsupported(_)) => return Ok(())` was a hand re-break and not the pre-image: before the fix the loop ran `worldgen::validate_resource(&relative, &bytes)?` on a Result<usize, String> (1d8e57dd8^ datapacks.rs:722-737) and refused the pack on the first unsupported entry. It also expressed the opposite outcome (ignore the entry and load the pack), so its red was a re-break's assertion. A faithful control is buildable: keep the fix's typed error and write `Err(worldgen::ResourceError::Unsupported(entry)) => return Err(entry)` (mechanically the pre-fix refusal, a named constructor that changes no behaviour), which makes datapacks_worldgen_tests.rs:453 red because the error then names only a.json and not worldgen/biome/b.json. Not re-promoted yet."
fix_commit = "1d8e57dd8"
