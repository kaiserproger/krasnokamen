[[bug]]
id = "DATAPACK-WORLDGEN-OVERRIDES"
title = "A selected or newly appeared datapack that carries worldgen this server cannot generate is refused (selected) or skipped by name (new), instead of its unsupported resources being ignored. Only the experimental jigsaw inputs (worldgen structure_set, structure with a supported type, template_pool, processor_list, tags/worldgen/biome, structure .nbt) change generation; any other worldgen or dimension resource (biomes, dimension types, noise settings, features, unsupported structure types) refuses a selected pack with an error naming every such entry, and a new pack holding one is skipped and named, instead of being ignored. Split from DATAPACK-WORLDGEN-ZIP, whose ZIP loading is implemented."
area = "gameplay"
repro = "manual"
severity = "major"
status = "fixed"
source = "Split from DATAPACK-WORLDGEN-ZIP. Since the A10 baseline-custody work the experimental jigsaw inputs apply on restart and every other worldgen/dimension resource fails closed by name (docs/OPERATING.md Datapacks and command blocks, docs/COMPATIBILITY.md); general custom terrain remains the open gap."
regression = ["cargo:mc-core:datapacks::worldgen::tests::unsupported_worldgen_refusal_names_every_entry_and_supported_packs_load", "cargo:mc-core:datapacks::worldgen::tests::start_skips_a_new_worldgen_pack_it_cannot_prepare_and_loads_the_rest", "harness:datapack-reload:native-datapack-reload"]
fix_commit = "patch:d4c9b9ebd0d80b85ef87099692dd633c50880e2b99777c468d6e525a483af70c"
repro_check = "Fixed in the tip by 1d8e57dd8, which cannot be reversed there: its PackSet::open/worldgen::open rewriting is called by 251276077 (game_clock_upgrade.rs:276), so reversing it leaves E0425 and a compile failure is not a control. The recorded identity is the reversible part of that fix (patch:d4c9b9eb, docs/bugs/promotions/DATAPACK-WORLDGEN-OVERRIDES.patch): PackSet::load no longer collects unsupported worldgen entries and refuses the pack naming them, and worldgen::open no longer validates the trial inputs before admitting a pack. The control at head is red by assertion on datapacks::worldgen::tests::unsupported_worldgen_refusal_names_every_entry_and_supported_packs_load (datapacks_worldgen_tests.rs:453, Option::unwrap on None: the selected pack loaded instead of refusing). The new-pack skip test at :411 stays green in that control because the fix-s prepare-failure path is outside the reversible part and the test exercises it; it is a green regression, not control evidence. Restore receipt: native-datapack-reload on the b675f99e78 pin. Verification: cargo nextest -p mc-core with both refs in the re-break worktree, 1 failed by assertion and 1 passed."
promotion = "docs/bugs/promotions/DATAPACK-WORLDGEN-OVERRIDES.json"
