source = "Split from NATIVE-TOASTS-MISSING (review ReviewD123Client4 B1): the tip scene native-toast drives only the unsecure-server system toast, while vanilla 26.3 shows an advancement toast on every earned advancement. Java oracle frames in receipts/VisualItemsClient/20261111T140325-scene-shot-znvexbrh show the vanilla panel; the native renderer is src/ui/toasts.rs (ToastManager 26.3 parity, client:8deb8fd7) whose advancement kind is only unit-covered (ui::toasts::tests)."
regression = []
failing_first = "not recorded"
repro_check = "No registered check yet. The scene must earn a real advancement for the player (server-side criterion), then assert the advancement panel's own rectangle in the top-right corner: dark navy panel, the advancement sprite region, and the yellow title ink, two seconds after the award and none after the toast's 10 s lifetime. Passing the system toast does not prove this: the two kinds differ in the nine-slice source (gui/sprites/toast/advancement) and in the icon/title layout. The unit tests cover the queue and kind selection, not a frame."
