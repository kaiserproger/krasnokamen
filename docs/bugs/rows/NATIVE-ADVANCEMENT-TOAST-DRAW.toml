repro_check = "The renderer exists (client:8deb8fd7, src/ui/toasts.rs AdvancementToast) but the scene capability does not: toast_scene.json drives only the join-time unsecure-server system toast (check_toasts asserts gui/sprites/toast/system). The row needs a scene that earns a real advancement (mc-core implements the `advancement` command) and asserts the advancement panel's own rectangle, plus a control that shows the panel absent - which means a client reversal pair over the AdvancementToast drawing hunks (or an owner ruling for a capability-add graphical control, the HARNESS-SCENE-SHOT-MISSING-SUBJECT H-10 family). Neither the scene nor its calibration exists yet."
