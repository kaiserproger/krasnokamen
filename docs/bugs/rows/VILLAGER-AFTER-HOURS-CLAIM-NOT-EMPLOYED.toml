[[bug]]
id = "VILLAGER-AFTER-HOURS-CLAIM-NOT-EMPLOYED"
title = "A resident that claims a workstation after work hours stays jobless until the next work period unless it happens to stroll within reach"
area = "gameplay"
repro = "client"
severity = "minor"
status = "fixed"
source = "Breaker finding (BreakVillageParity, ISSUE-1-10 break-it pass of 5557f47b on main 21607d42, agent-run): a farmer workshop certified at day time 11000 (Idle) about 12 blocks from the house of three jobless residents. Seed 7 with Brain.memories dumps (artifact 20261112T060555-scene-shot-5eubuwxv): one resident holds minecraft:job_site at the composter from tick +150 but VillagerData.profession stays minecraft:none at +150, +300 and +450 while it strolls 6-20 blocks away; jobs scene (no dumps) 20261112T055641-scene-shot-5slekruf and 20261112T055702-scene-shot-daa763xe: nobody employed for 450 and 1050 ticks; the same fixture or a 2-resident variant employed a farmer within 150 ticks in 3 other runs (jobsmem 060523-aajt3ztv, latejob 060124-5qz4w6ey, 060140-g80j9ag9). Rate 3/6 not employed. Next morning (time 2500) the profession arrives within 200 ticks. Vanilla 26.3: GoToPotentialJobSite runs in the IDLE, WORK and PLAY activities and walks the villager to its POTENTIAL_JOB_SITE, where AssignProfessionFromJobSite assigns the profession. Source: allocator::acquire sets the route to the claimed job site with navigation_repath_at +40, after which the Idle stroll replaces it; villager/brain.rs awaiting_profession (walk to the job site) requires Activity::Work, and the profession is assigned only within JOB_SITE_REACH. The claim also keeps other jobless residents off that station. Residual of VILLAGER-WORKSTATION-IGNORED-AFTER-WORK-HOURS for bound residents."
regression = ["cargo:mc-core:villager::brain::tests::stroll_swim_tests::jobless_villager_walks_to_an_after_hours_claim_and_is_employed", "harness:scene-shot:native-village-after-hours-job"]
failing_first = "reported"
fix_commit = "patch:7018c1e0edf51288b239b4577b3c51fdad9426023a81e3a5ac4c029d85fa34e8"
promotion = "docs/bugs/promotions/VILLAGER-AFTER-HOURS-CLAIM-NOT-EMPLOYED.json"
