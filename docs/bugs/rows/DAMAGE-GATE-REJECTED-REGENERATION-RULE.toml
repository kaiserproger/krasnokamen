id = "DAMAGE-GATE-REJECTED-REGENERATION-RULE"
title = "The graphical damage fixture sends an unsupported regeneration gamerule"
area = "harness"
repro = "source"
severity = "major"
status = "fixed"
source = "Independent graphical damage QA observed rejection of gamerule natural_regeneration, so later health assertions did not have the intended regeneration-off fixture. The owning native P4 fixture now sends natural_health_regeneration false and requires actual command feedback. The corrected full run observes that feedback, but the full graphical gate still fails physical fall readiness and has no acceptance or ledger promotion."
# Wave 4: the scene cannot observe the guard (see repro_check: both the candidate and the
# ack-wait-reversed trees pass), so the scene ref is not part of the proof; the unit ref is.
regression = ["python:tools.harness.test_native_v2:NativeV2ProbeTests.test_damage_gamerule_fixture_requires_supported_rule_and_ack"]
repro_check = "Wave 4 (2026-11-26): the proof class moves to source. The scene ref is dropped from `regression` because native-v2-p4-damage cannot flip on the ack wait (the candidate and the reversed tree both pass; the fixture commands are ordered by the server either way). The guard's observation is the unit test: with the patch reversed it reds at AssertionError Expected-wait-to-have-been-called-once (0 calls). The test now asserts `steps.wait.assert_called_once()` before reading its arguments, so the reversal is an AssertionError rather than a TypeError (which the ledger refuses). Exact need for a discriminating control (wave 3 design, not implemented): a native_p4 step that sends `gamerule <rule> false` and reads the rule back in the same tick (`gamerule <rule>` chat reply) before the first damage row, asserting the reply is already `false`. With the wait removed the read-back races the command and reports `true`; with it, the ack precedes the read. The scene cannot express that ordering today, which is why the two runs above both pass. Wave 3 (2026-11-25, patch:c09ff708 + the real scene): the candidate native-v2-p4-damage PASSED (artifact 20261124T234236-native-v2-p4-damage-xq727z2i, 309.2 s, server pin 085ed1ac2314) and the reversed ack-wait tree ALSO PASSED (20261124T234755-native-v2-p4-damage-g7htf_29, 339.1 s, control pin 085ed1ac2314-eaafd1ac). The gamerule is applied before the damage rows observe it either way, so the scene is not a discriminator for this hunk; only the fixture-order python ref reds (a proxy). No promotable pair exists from this host yet. negative control receipts/XHarnessGates/neg-damage-regeneration.log (ack wait removed -> both rule subtests red); candidate: no exact revert - 4a74eaca's hunks conflict on HEAD and the current form comes from b0fa3d298 whose hunks also conflict (native_p4.py:233); the control is fix-lines-only (ack wait removed), receipts/XHarnessGates/neg-damage-regeneration.log"
failing_first = "reported"
fix_commit = "patch:c09ff7087e87159e21724dfe361b69bb79d7c1139cb204aee890f975851054ce"
