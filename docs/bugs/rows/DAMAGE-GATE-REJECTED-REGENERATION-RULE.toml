[[bug]]
id = "DAMAGE-GATE-REJECTED-REGENERATION-RULE"
title = "The graphical damage fixture applied its regeneration gamerule without waiting for the server's acknowledgement"
area = "harness"
repro = "source"
severity = "major"
status = "fixed"
source = "Independent graphical damage QA observed the server rejecting `gamerule natural_regeneration` (an unknown rule), so later health rows did not have the intended regeneration-off fixture. The native P4 fixture now sends the supported `natural_health_regeneration` (tools/harness/backends/native_p4.py:497,554,609,662) and `_disable_gamerule` waits for the server's own `Game rule <rule> is now set to false` reply (native_p4.py:409-418). Promoted 2026-11-25 on that acknowledgement guard; the rejected-command half is filed open as `DAMAGE-GATE-REJECTED-REGENERATION-RULE-REMAINDER` because no control restores it. The full graphical damage gate still fails its physical fall readiness check, which this row does not cover."
# Wave 4: the scene cannot observe the guard (see repro_check: both the candidate and the
# ack-wait-reversed trees pass), so the scene ref is not part of the proof; the unit ref is.
regression = ["python:tools.harness.test_native_v2:NativeV2ProbeTests.test_damage_gamerule_fixture_requires_supported_rule_and_ack"]
repro_check = "Source proof, wave 4 (2026-11-26). The fix (patch:c09ff708) adds only the acknowledgement wait to `_disable_gamerule` (docs/bugs/fix-patches/DAMAGE-GATE-REJECTED-REGENERATION-RULE.patch); it neither adds nor restores the rule name. The guard's observation is the unit test: with the wait reversed it reds at AssertionError Expected-wait-to-have-been-called-once (0 calls) (tools/harness/test_native_v2.py:118-131; the promotion recorded the panic at /usr/lib/python3.14/unittest/mock.py:965). The test passes the rule name in itself and only asserts the fixture sends `gamerule <rule> false` for that same argument, so it does not prove the name; the name appears in the fixture source (native_p4.py:609) and nowhere in the receipts. The scene ref is dropped from `regression` because native-v2-p4-damage cannot flip on the ack wait: the candidate (artifact 20261124T234236-native-v2-p4-damage-xq727z2i) and the ack-wait-reversed tree (20261124T234755-native-v2-p4-damage-g7htf_29) both PASS. The discriminating control is the sibling's job: send `gamerule <rule> false`, read the rule back in the same tick, and restore the rejected `natural_regeneration` through the real fixture."
failing_first = "reported"
fix_commit = "patch:c09ff7087e87159e21724dfe361b69bb79d7c1139cb204aee890f975851054ce"
# Pack 13: the commit-mode fix cannot be reversed here (4a74eaca and its successor b0fa3d298 both
# conflict on HEAD), so the row records the ack-wait hunk as it stands in native_p4.py: reversing
# it removes the "Game rule ... is now set to false" wait — the row's recorded fix-lines-only
# control (receipts/XHarnessGates/neg-damage-regeneration.log).
promotion = "docs/bugs/promotions/DAMAGE-GATE-REJECTED-REGENERATION-RULE.json"
