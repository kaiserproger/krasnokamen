[[bug]]
id = "TICK-PHASE-LAPS-CANNOT-SEPARATE-RUN-QUEUE-WAIT"
title = "Tick phase laps are Instant wall time only and the tick thread's run-queue delay (schedstat field 2) is never sampled, so a phase cost can be pure descheduling and no receipt can tell."
area = "harness"
repro = "source"
severity = "minor"
status = "fixed"
source = "receipts/Books/REPORT-R1.md gap G-2 and section F3 (Gregg 5.4.2 off-CPU analysis, 2.5.13 latency analysis; perf). crates/mc-core/src/tick/phase_laps.rs laps are Instant wall times; tools/coreperf/profiles.py has no per-thread CPU field (only lscpu and affinity), although docs/development/performance-windows-and-profiling.md requires per-thread /proc/self/task/*/stat CPU per tick and tools/coreperf/capacity_ladder.py implements it for the capacity ladder only. Without it an optimisation round cannot say whether a win is work removed or waiting redistributed. Verified open on main 5bdc02911 (no schedstat read anywhere). Fix direction: sample /proc/<pid>/task/<tid>/schedstat field 2 for the tick thread about once per second in host_telemetry (about two file reads per second) and add per-thread CPU seconds to the profiles.py receipt; the one-off check is perf stat --per-thread -p <pid> -e task-clock -- sleep 60."
failing_first = "not recorded"
regression = [
"python:tools.coreperf.test_profiles:WindowReceiptFieldsTests.test_receipt_records_the_tick_thread_run_queue_wait",
"python:tools.coreperf.test_profiles:WindowReceiptFieldsTests.test_a_laps_only_phase_receipt_is_refused",
"python:tools.coreperf.test_profiles:WindowReceiptFieldsTests.test_thread_usage_reads_schedstat_field_two_for_a_fixture_process",
"python:tools.coreperf.test_profiles:WindowReceiptFieldsTests.test_a_thread_missing_from_one_sample_is_unavailable",
"python:tools.coreperf.test_profiles:WindowReceiptFieldsTests.test_a_remote_session_reads_threads_over_its_connection",
"python:tools.coreperf.test_profiles:WindowReceiptFieldsTests.test_a_wrapping_server_spawns_the_tick_thread_in_its_child"
]
fix_commit = "695b764e4c37d68bb2e4fd7b8e8492727cd4cbfb"
repro_check = "The path was closed by two commits, both named and both reversed on their own (docs/bugs/README.md, 'Fix in several commits'): 2941bc91f88f537c0bf113c43cbac46717ac2b79 added the per-thread schedstat/CPU sampling and the receipt rollup (its own control red test_receipt_records_the_tick_thread_run_queue_wait, artifact 20261124T174638-ledger-promote-zhlpqvsu, the two helper refs unrunnable under that reversal), and 154914e44e83c78340ebcd7adb18a44ce449b862 made the sample trustworthy (its control red test_a_laps_only_phase_receipt_is_refused at :1227, test_receipt_records_the_tick_thread_run_queue_wait at :1216 and test_a_remote_session_reads_threads_over_its_connection at :1291, while test_a_thread_missing_from_one_sample_is_unavailable was unrunnable in that artifact (KeyError) and test_thread_usage_reads_schedstat_field_two_for_a_fixture_process was green; artifact 20261124T185945-ledger-promote-trka9zr4). tools/coreperf/profiles.py samples every server thread's /proc/<pid>/task/<tid>/schedstat field 2 (nanoseconds waiting on a run queue) and its stat CPU seconds on every measurement poll, sums same-named threads and writes summary.threads with first-to-last CPU seconds, run_queue_wait_ms and both per source tick; summary.tick_thread is the tick thread's row and require_thread_wait refuses a run whose sampling is unusable, so a laps-only receipt cannot pass. A thread absent from either sample, or whose thread count changed, is named unavailable instead of reading a process-lifetime delta as the window. The per-tick fields divide by the source ticks between the two process samples ([first, last)), not by every tick of the window. The sampled pid is the process that owns the mc-core-tick thread, found by walking /proc/<pid>/task/*/children: a --server-wrapper that forks (perf stat --, a launcher) makes processes[server].pid the wrapper, whose own task list has no tick thread. A --remote-host session's pid is the remote unit's MainPID, so server_threads reads that host's /proc over the session's own ssh connection (Remote.thread_listing, parsed by thread_usage_listing) and divides by that host's USER_HZ (Remote.clk_tck), not the reader's; the listing script ends with '; true' so a thread dying during the last read does not abort the run. Control: reversing this commit's non-test hunks reds test_a_remote_session_reads_threads_over_its_connection (test_profiles.py:1303: the pre-image divides by the reader's USER_HZ and never asks the remote host) and test_a_wrapping_server_spawns_the_tick_thread_in_its_child (test_profiles.py:1351: the sample is the wrapper's task list, which has no mc-core-tick); test_receipt_records_the_tick_thread_run_queue_wait, test_a_laps_only_phase_receipt_is_refused, test_a_thread_missing_from_one_sample_is_unavailable and test_thread_usage_reads_schedstat_field_two_for_a_fixture_process stay green in this control because the receipt/divisor/unavailable rules are carried by 2941bc91f and 154914e, and restore is green for all six. In the lkqg99cj control (reversing this commit) test_a_thread_missing_from_one_sample_is_unavailable ran green rather than raising KeyError, so with rows[0] and .get it is runnable under this reversal; its own red belongs to the 154914e reversal, which was NOT re-run in this session, so that red is not claimed here. The phase laps in crates/mc-core/src/tick/phase_laps.rs stay wall time by design: the receipt carries the wait beside them. A real window receipt is prepared as W1 in receipts/D123/D123Harness/PERF-QUEUE.md (Main's schedule), not required for this row's proof."
promotion = "docs/bugs/promotions/TICK-PHASE-LAPS-CANNOT-SEPARATE-RUN-QUEUE-WAIT.json"
