repro_check = "Attempted 2026-11-25 (D123ClientModelJ). The credited model fix is client:78fb611f: the pre-fix dragon_skull.json has a 14-tall head cube, two 3x5x3 horns and a separate jaw bone with a 12x4x16 bar (the row floating jaw bar), the fix a 16-tall head cube, 2x4x6 horns, a 12x5x16 snout and no jaw bone. Three fixture framings were measured on the pinned control 8a7817c8 and fix 78fb611f (receipts 20261124T201033/201137/201215/201613/201644 and the two-view runs): a two-subject front frame, a side profile at four blocks and a single-subject front frame at four blocks. The wearer-band framings show the pre-fix exposed band only as a dark-green strip that the fix also paints dark (the mask that separated them in the first frame, 741 px at (667,399)-(730,421), turned out to be the same pixels in both once measured per channel), and the neutral-black band counts in the best view are 12750 (control) vs 5982 (fix) - 2.1x, too close for a load-proof control. The scene native-worn-head therefore carries the dragon frame as evidence only (its band count is reported by check_worn_head). Missing proof: a view isolating the pre-fix exposed band with a wide margin, e.g. the HeadBreaker third-person zombie/armor_stand angle whose receipts (20261115T023515) show it, with that pair per-pixel ROI. The pins 8a7817c8 and 78fb611f are clean and ready."
