repro_check = "Attempted 2026-11-25 (D123ClientModelJ). The credited model fix is client:78fb611f: the pre-fix dragon_skull.json has a 14-tall head cube, two 3x5x3 horns and a separate jaw bone with a 12x4x16 bar (the row floating jaw bar), the fix a 16-tall head cube, 2x4x6 horns, a 12x5x16 snout and no jaw bone, and applying skull_pose on the static/worn path. Five framings were measured on the pinned control 8a7817c8 and fix 78fb611f (receipts 20261124T201033/201137/201215/201613/201644 and the two-view runs): a two-subject front frame, a side profile at four blocks, a single-subject front frame at four blocks, and a third-person angle at 2.5 blocks (20261124T202958 control / 20261124T203027 fix) which fills the whole frame with the skull and is unusable. The wearer-band pixels are the same dark green in both clients (the first 741-px separation was two overlapping colour predicates), and the best neutral-black band count is 12750 (control) vs 5982 (fix) - 2.1x, too close for a load-proof control. Missing proof: the HeadBreaker third-person angle at about four blocks (their receipts 20261115T023515 show the whole upper body and the exposed band), with a per-pixel ROI derived from that pair; the scene native-worn-head keeps the dragon frame as evidence only. Pins 8a7817c8 and 78fb611f are clean and ready. BLOCKER 2026-11-25: the missing artifact is the HeadBreaker third-person zombie/armour-stand angle (receipts 20261115T023515) as a per-pixel ROI - the lane's own three framings on the pinned pair measured 2.1x band separation (12750 vs 5982), too close to carry a control under load."
