[[bug]]
id = "VILLAGER-BABY-WADES-INTO-HEAD-DEEP-WATER"
title = "Baby villagers route onto the floor of head-deep water, are stranded there and die"
area = "gameplay"
repro = "client"
severity = "major"
status = "open"
source = "Seed-24 civilization-seed-qa .analysis/validation/20261111T230749-civilization-seed-qa-llr1bc4e (server pin 107ddb91): the only newborn f7a21a80 (settlement_birth tick 50318, baby observed at sprint 42000) was seen in client censuses at (73.4,60.9,-229.9) at sprint 48000 and (73.4,60.9,-231.4) at 51000, 58 blocks from the meeting point, on the floor of a pond (world probe receipts/CivSimSeed24/snap3/probe-baby.json: dirt at y=60, water at y=61-62, banks to y=64). server.log line 638: 'resident received lethal damage tick=65504 ... activity=Panic position=[73.85, 61.0, -231.85] attacker_type=Some(\"minecraft:zombie\")'; the checkpoint (receipts/CivSimSeed24/snap3/report.json, tick 115347) holds a tombstone for it at chunk [4,-15], journal LSN 66000. Membership dropped 6 -> 5, so the gate's +2 growth never held. Not an entity-custody loss: the death is logged and the tombstone follows it. Cause: settlements/allocator.rs body_clear lets a route body wade when water is only in its foot row, but a baby (0.975 tall) has its head in that row too, so the floor of any pond passed as a ford. Negative control: Fails with only the allocator.rs fix hunk reverted (receipts/CivSimSeed24/baby-wade-fix-hunks.patch, sha256 ea5ca185): 'head-deep water is a barrier: (0.15, 0.975)', the baby body routes over the floor of two-deep water while the adult body is refused (receipts/CivSimSeed24/baby-wade-negative-control.log); at 615ca404 settlements+villager 848 passed, 0 failed (receipts/CivSimSeed24/suite-615ca404.log)."
failing_first = "reported"
regression = ["cargo:mc-core:settlements::allocator::tests::routes_wade_through_foot_deep_water_but_never_deeper_or_lava"]
fix_commit = "615ca404"
# 2026-11-26 (D123PackReceipts): no real-client ref exists for this symptom. Every profile verdict
# table in tools/harness was searched for a baby route assertion - none names one; the only pond
# scene (`scene-shot:native-village-idle-stroll`) drops two adult villagers into a 4-deep pond and
# asserts they float at the surface, which is swim behaviour, not the allocator's ford decision, so
# it cannot flip with 615ca404. A discriminating fixture must make a BOUND baby walk a route across
# head-deep water (meeting point beyond a 2-deep pond) and assert the baby's cell; building and
# validating it is a new settlement fixture, and the routing code it exercises is
# `crates/mc-core/src/settlements/**` (D123CivSite's scope).
