repro_check = "Prediction itself is NOT lost (debug on client d0337426's parent: one tick after 10.0 the predicted y is 9.96, then 9.9208 - exactly vanilla's 0.04 gravity, move, 0.98 drag). Two contract gaps were fixed in client:d0337426 (control commit 0a4c9a37 differs from it by exactly those hunks): (1) a no-gravity falling block moved on its own stale falling_velocity; it now uses the received velocity, matching FallingBlockEntity.tick where a no-gravity block keeps the server's delta; (2) minecraft_list_entities now exposes predicted_velocity (the client's integrator state), because between position packets the received velocity is the stale base and no automation consumer could model the prediction. Harness side (_vanilla_fall) consumes predicted_velocity when the row has it (test test_a_stale_received_velocity_does_not_change_the_prediction_model). Fence tests: falling_block_predicts_between_packets... and falling_block_freeze_and_no_gravity... pass; falling_block_prediction_tracks_horizontal_query_padding... still fails on motion_spans.len()==1 - that fence was never compiled before this session and the code has never registered a span for a predicted block, so it is a separate aspiration, not this row. Scene: sand_predicts_between_received_updates is the proving assertion; real-client receipts recorded with the promotion."
