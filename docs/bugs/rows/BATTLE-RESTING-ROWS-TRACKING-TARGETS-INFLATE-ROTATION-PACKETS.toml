source = "Accepted cost of the BATTLE-REST-SKIPS-TARGET-FACING fix (Main, 2026-11-18; owner may override). On the A1 battle scene at 1000/side, three base-pin and three fix-pin recordings (receipts/BattleRest/BOUNDS-REST-TAKES.md, BYTES-ATTRIBUTION.md): the pre-registered foot with-target loose turn bound R1 fails in mid (350/345/389 vs 292.4) and in two of three late windows, because a resting soldier now turns each time its target's bearing moves by at least half a wire quantum. Recorded packet payload (.solrec: uncompressed packet id and payload, not network bandwidth): rotate_head frames +63%, move_entity_rot frames 21,488 to 422,532, about +3.9 MB of rotation payload per take, about +5.9% total recorded play payload. Fix direction (after the 2026-11-19 freeze): a battle look-rate cadence or angular hysteresis for standing rows so turns follow the target at a bounded rate, re-measured against R1 and the payload attribution on the same scene. Backlog, not a freeze blocker."
regression = []
