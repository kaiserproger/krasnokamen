[[bug]]
id = "SETTLEMENT-HARVEST-REOPENS-FARM-REPAIR"
title = "A farm's own harvest reopens a construction repair stage that demands seeds no stock can fund, so the project never completes and holds the settlement's only construction slot."
area = "gameplay"
repro = "client"
severity = "major"
status = "open"
source = "Seed-24 civilization-seed-qa 20261124T195404-civilization-seed-qa-j465g34j (pin 985af51e949a, full 96 000-tick observation): the town's farm at [78,68,-320]..[87,72,-314] sat at 'Farm L1 - Building 215/225' from sprint 57 000 to the 96 000 cap while no other project was ever admitted (the House was never planned), and the settlement's only construction slot was held by a borrowed Miner. server.log 2026-11-24T20:16:53 and 20:17:40 report settlement_construction_stalled blueprint=farm stage=3 cause=collecting_material at next=[81,69,-318] and [81,69,-316], recovery=builder_released; 20:21:39 reports settlement_construction_recovery_failed with first_recovery=builder_released. The saved state's structure record settlement-1-229 ends state=running watermark=215 with a final stage {block_count: 12, materials:[{quantity: 12, resource: minecraft:wheat_seeds}], stage: repair, work_units: 12}, while storage held no wheat_seeds at all (it held 58 oak logs, 222 birch logs, 387 cobblestone, 7 white wool, iron, coal, dirt and shears). The farm's 12 crop cells were built and then stood empty; the completion pass treats an emptied authored cell as damage and queues wheat_seeds no stock can fund. The mechanism that emptied them is NOT proven (review M1, receipts/D123/D123Civ/review/REVIEW-wave2-9.md): the native farmer harvests and replants in one set_block (villager/harvest.rs:470,:199), so raw_id never changes and a resident harvest cannot open this stage; the native farmer never plants into empty farmland (harvest.rs:185-200), so 'the farming pass replants' is false. Code-supported candidates: farm L1 has no water in its palette (farm.json:286-319) and dry farmland without a crop turns to dirt (farming.rs:1158-1172); wheat waits for seeds and FOUNDING_STOCK holds none; a crop not on farmland breaks (plants.rs:276-285); dirt in a farmland cell is not clearable (construction.rs:1116-1140), which matches the repair stage counting only the 12 crops; creative observer trampling (farming.rs:540, move_observer). The probe that decides it - the 12 cells' blocks (y68, x 78..87, z -320..-314) in the saved 20261124T195404 world - has not been run; until it is, the row's cause stays open."
failing_first = "reported"
regression = [
  "cargo:mc-core:settlements::construction::fencing_tests::a_harvested_farm_crop_does_not_reopen_a_repair_stage",
  "harness:civilization-seed-qa:new_house",
]
fix_commit = "dde9a9e72bdbe5f6c281c37dce1dfdeb9f813745"
repro_check = "Fix: settlement builds' repair derivation and reopen_emptied skip a cell whose authored block is a farm crop (wheat, carrots, potatoes, beetroots), because a farmer harvests those and the farming pass replants into the same farmland; construction never re-plants them. Negative control: the production hunks reverted alone on this tree make a_harvested_farm_crop_does_not_reopen_a_repair_stage fail in complete() with 'construction did not finish: [\"farm · level 1 · 99%\", \"Remaining materials: minecraft:wheat_seeds: 1\", \"Missing materials: minecraft:wheat_seeds: 1\"]' - .analysis/validation/20261124T203524-test-h5we0792. Green on the candidate: .analysis/validation/20261124T202859-test-ybe194wt. The gate proof is harness:civilization-seed-qa:new_house on a pinned candidate: the farm closes, the slot frees, and the House is admitted and observed. Residual note: a crop cell emptied by a player is also left to the farm's farming, not to construction, and the native farmer today cannot replant empty farmland; if the probe finds dry farmland turned to dirt the farm must regain live soil (water or a free farmland restore) and the crop skip alone does not make the farm productive. The regression test's fixture puts air on intact farmland (construction_fencing_tests.rs:260-264) and does not reproduce the real state, so the fix's behavioural control is the panic in complete() only."
