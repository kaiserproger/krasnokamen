[[bug]]
id = "SETTLEMENT-HARVEST-REOPENS-FARM-REPAIR"
title = "A farm's own harvest reopens a construction repair stage that demands seeds no stock can fund, so the project never completes and holds the settlement's only construction slot."
area = "gameplay"
repro = "client"
severity = "major"
status = "open"
source = "Seed-24 civilization-seed-qa 20261124T195404-civilization-seed-qa-j465g34j (pin 985af51e949a, full 96 000-tick observation): the town's farm at [78,68,-320]..[87,72,-314] sat at 'Farm L1 - Building 215/225' from sprint 57 000 to the 96 000 cap while no other project was ever admitted (the House was never planned), and the settlement's only construction slot was held by a borrowed Miner. server.log 2026-11-24T20:16:53 and 20:17:40 report settlement_construction_stalled blueprint=farm stage=3 cause=collecting_material at next=[81,69,-318] and [81,69,-316], recovery=builder_released; 20:21:39 reports settlement_construction_recovery_failed with first_recovery=builder_released. The saved state's structure record settlement-1-229 ends state=running watermark=215 with a final stage {block_count: 12, materials:[{quantity: 12, resource: minecraft:wheat_seeds}], stage: repair, work_units: 12}, while storage held no wheat_seeds at all (it held 58 oak logs, 222 birch logs, 387 cobblestone, 7 white wool, iron, coal, dirt and shears). The farm's 12 crop cells were built and then stood empty; the completion pass treats an emptied authored cell as damage and queues wheat_seeds no stock can fund. The mechanism that emptied them is NOT proven (review M1, receipts/D123/D123Civ/review/REVIEW-wave2-9.md): the native farmer harvests and replants in one set_block (villager/harvest.rs:470,:199), so raw_id never changes and a resident harvest cannot open this stage; the native farmer never plants into empty farmland (harvest.rs:185-200), so 'the farming pass replants' is false. Code-supported candidates: farm L1 has no water in its palette (farm.json:286-319) and dry farmland without a crop turns to dirt (farming.rs:1158-1172); wheat waits for seeds and FOUNDING_STOCK holds none; a crop not on farmland breaks (plants.rs:276-285); dirt in a farmland cell is not clearable (construction.rs:1116-1140), which matches the repair stage counting only the 12 crops; creative observer trampling (farming.rs:540, move_observer). Two probes settle it (receipts/D123/D123Civ/farm-probe/PROBE.md, read-only `krasnokamen world probe`): on the pre-fix world 20261124T195404 the plot is grass_block at y68 and air at y69 (no farmland, no crop, no water) - the state the broken repair pass froze - while on the post-fix world 20261124T212153 the same plot holds farmland[moisture=7] at y68 and wheat[age=0] in exactly the 12 authored crop cells at y69. So the cause is the repair pass reopening an authored crop cell (it queued 12 wheat_seeds before the crops could stand), not water, lot order or a missing floor: with dde9a9e72b the farm reaches live farmland and 12 planted crops, and the row's remaining work is the real-state regression below. OPEN residual (bounded, not resolved): in the pre-fix world the authored farmland floor cells also differed from the world (farmland vs grass) yet the repair derivation queued only the 12 crop cells, not the floor. The saved receipts expose the stalled stage (repair, 12 wheat_seeds, watermark 215) but not the ledger cells, and the checkpoint's structure record is not exposed by `krasnokamen world probe`; establishing why the floor cells were not scanned (stage index versus watermark, or a skip) needs a record-level reader and is left open rather than guessed. It does not change this row's fix: the crop cell is skipped and the later world shows live farmland and 12 crops. The regression test's fixture puts air on intact farmland (construction_fencing_tests.rs:260-264) and does not reproduce the real state, so the fix's behavioural control is the panic in complete() only."
