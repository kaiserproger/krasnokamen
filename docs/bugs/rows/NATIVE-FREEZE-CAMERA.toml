[[bug]]
id = "NATIVE-FREEZE-CAMERA"
title = "Under server tick freeze, tp updates observed position while native camera frames remain stale; minecraft_wait_ticks times out30s. Original source returned before player.tick when server_frozen and no step budget."
area = "client"
repro = "source"
severity = "major"
status = "open"
source = "/run/media/kaiserroman/games/solaris-work/BUGS.md#NATIVE-FREEZE-CAMERA"
regression = ["harness:entities:native-v2-input-camera", "harness:admin-commands:all"]
proving_assertions = { "harness:entities:native-v2-input-camera" = "frozen_captured_camera_tracks_teleport" }
fix_commit = "client:c6a56f1d"
repro_check = "The registered scene's own assertions do not discriminate: frozen_captured_camera_tracks_teleport reads the reported camera position, which the teleport already updates on the pre-fix client (control 2026-11-23 on client:9a645aa9 passed). c6a56f1d changes the frozen presentation partial (0 -> 1), so the discriminating value is the entity transform the frame draws. Client pair committed: client:d17404d8 (reversal) -> client:4582de0d (re-land, this row's fix_commit; pair patch-id fd943082 equals non_test_patch(c6a56f1d)), and client:7b7da181 reports presented_position (the exact transform the renderer draws) in the entity observation. Witness shape written and measured as a probe: freeze, summon an item with horizontal motion, tick step 1, compare presented_position against the pose before the step (pre-fix: previous tick, post-fix: one stepped tick). Two probe runs hung inside the scene's own frozen capture (20261124T213735-sflu9cno, 20261124T215130-idd3bm3t) while the host ran peer Vulkan scenes, and the same scene on the same client passed in 26 s earlier (20261124T212327-atyfenkb); the probe leg was reverted so the scene stays green (core 7f24720cc). Remaining work: two clean runs (restore 4582de0d/7b7da181, control d17404d8) on a quiet host, then the assertion held threshold from the measured pair."
