[[bug]]
id = "JOURNAL-TMP-NEVER-PRUNED"
title = "Unpublished journal batches (`batch-<lo>-<hi>.bin.tmp`) are never removed: every failed or interrupted append leaves a file nothing prunes, so the world grows silently until an append hits ENOSPC and the core fail-stops."
area = "gameplay"
repro = "source"
severity = "major"
status = "open"
source = "Auditor C, D19 CS341 audit, /var/tmp/w/receipts/CS341/REPORT-C.md finding G-5 (books rule ch. 12.2.4 p. 270 'free up resources in every possible code path', ch. 18.7 p. 374 'clean up files'). Evidence: crates/mc-core/src/journal.rs:576-579 builds `self.dir.join(format!(\"{name}.tmp\"))` and :579-607 writes, sync_all's and renames it; a write/sync error (ENOSPC/EIO) or a stop between create and rename leaves the tmp file; prune_batches_through (journal.rs:982-997) deletes only names that start 'batch-' and end '.bin', and JournalWriter::open (journal.rs:437-448) only calls create_dir_all, so no path ever removes or reports a stale '*.tmp' (journal.rs:7,648 only documents that they are ignored). Not reproduced as a failure; read from source. Repro/test idea: a cargo test in mc-core (a `journal_tests::` fn; note crates/mc-core/src/journal_tests.rs:1364 already pins the current 'tmp is ignored' behaviour, which is what this row changes) that arms the existing WAL_WRITE_FAILURE hook (journal.rs:420-424,590-597, one-shot partial write + injected ENOSPC) for one append, reopens the world (JournalWriter::open) and asserts the journal directory holds no '*.tmp'; plus a second case that leaves a hand-written 'batch-00000000000000000099-00000000000000000099.bin.tmp' and asserts open removes it. Suggested fix: sweep 'journal/*.tmp' in JournalWriter::open and log one line with count and bytes."
regression = ["cargo:mc-core:journal_tests::open_removes_unpublished_batch_leftovers"]
fix_commit = "8bf3987c4"
failing_first = "not recorded"
