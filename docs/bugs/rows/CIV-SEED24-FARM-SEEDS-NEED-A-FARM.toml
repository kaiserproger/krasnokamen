[[bug]]
id = "CIV-SEED24-FARM-SEEDS-NEED-A-FARM"
title = "A settlement without a farm can never fund its first Farm: the Farm's wheat cells cost 12 wheat seeds whose only source is a farm, so stored bread runs out and births stop"
area = "gameplay"
repro = "client"
severity = "major"
status = "open"
source = "Seed-24 civilization-seed-qa .analysis/validation/20261111T233938-civilization-seed-qa-ufgbv77d (server pin 107ddb91, archived under receipts/CivSimLanding/analysis): every 'settlement building list' dialog shows 'Farm: ... Wheat Seeds 0/12 — needs a farm' from the first sprint to the last (transcript.json, 40 Farm entries; e.g. 'Dirt 0/30 — no miner' early and 'Dirt 16/30 — awaiting production' late, seeds 0/12 throughout). The final checkpoint (receipts/CivSimSeed24/snap4/report.json) holds six members (2 lumberjacks, 2 nitwits, builder, miner), no farmer, no Farmer workshop among seven certified buildings, and 4 bread in total; the run's bread fell 13 -> 4 by sprint 21000 and was gone by 27000 (receipts/CivSimSeed24/REPORT.md), so no second birth (missing milestone births; r5 fx4gdz87 the same: bread gone by 42000). Cause in source (21607d42): construction_availability.rs farmer_raw lists wheat_seeds, and missing_explanation reports SourceReason::Farm while caps.farm is false; the farm blueprint's wheat cells cost seeds (docs/settlements/construction.md 'wheat costs seeds'); settlement_builds.rs debit credited loot only for felled trees (forestry::tree), so short grass a builder cleared vanished without its vanilla loot (wheat seeds, 1 in 8). No other seed source exists for a settlement without a farm."
# Negative control (d827661e): with only the settlement_builds.rs debit hunks reverted the regression fails with 'clearing 42 short grass stored no wheat seeds' (receipts/CivSimSeed24/b/seed-loot-negative-control.log; hunks sha256 3217aa68).
failing_first = "reported"
fix_commit = "patch:4932f851798c5f3bda3ad5bbbff94fbbfbe58feff741f1ce0eb85a33f63f1245"
regression = ["cargo:mc-core:settlements::construction::site_tests::street_work_clearing_short_grass_stores_its_vanilla_wheat_seeds", "harness:civilization-seed-qa:first_farm_gets_seeds_from_cleared_ground"]
repro_check = "Real-client assertion added 2026-11-28 (HarnessAsserts): the ref harness:civilization-seed-qa:first_farm_gets_seeds_from_cleared_ground is the named assertion `first_farm_gets_seeds_from_cleared_ground` in the existing civilization-seed-qa run, over the observations that scenario already records. It is new and has not yet been seen in a full scenario run; its red/green are proven on the recorded observation in receipts/HarnessAsserts/REPORT.md."
