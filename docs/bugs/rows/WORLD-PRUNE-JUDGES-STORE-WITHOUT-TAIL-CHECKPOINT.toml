[[bug]]
id = "WORLD-PRUNE-JUDGES-STORE-WITHOUT-TAIL-CHECKPOINT"
title = "world prune does not check that its open/shutdown cycle published a checkpoint covering the crash journal tail"
area = "gameplay"
severity = "minor"
status = "fixed"
source = "Independent review receipts/ReviewPruneFix/REPORT.md (architect-fable, 2026-11-16), finding 1, inferred from code, not reproduced: prune_world (crates/mc-world-tools/src/world_maintenance.rs:115-131) opens and shuts the world down, then judges chunk rows without checking that a checkpoint covering the journal tail was published (core.rs:1442-1467, core_stop.rs:32-41, core/tick_loop.rs:478-480, core/journal.rs:110-133,188-193). If the final checkpoint is refused or the tick thread panics, prune judges a store without the tail and reports success; a chunk changed only in the WAL could then be pruned and regenerated (its WAL edits replay at the next start). Pre-existing before the WORLD-PRUNE-PANICS-ON-CRASH-IMAGE fix for tails without block writes. Fixed by the PruneGuard slice (merge 00e38ed6d, branch head 12a0280ea): prune_stopped refuses through native_checkpoint::require_checkpointed_tail. The fix spans several commits, so fix_commit is patch mode: docs/bugs/fix-patches/WORLD-PRUNE-JUDGES-STORE-WITHOUT-TAIL-CHECKPOINT.patch adds only the guard call, and reversing it removes that call while keeping the scoped manifest read, the guard function and the tests. Only the mc-world-tools ref goes red under that control (receipt wt/PruneGuard .analysis/validation/20261117T194256-test-mefpdc1b: prune returned Ok, pruned 72 of 81); the two mc-core refs unit-test the guard function itself. Committee: Opus approve, Sol amend (negative control only, done) in /var/tmp/w/receipts/PruneGuard/REVIEW-CODE-*.md."
repro = "source"
regression = ["cargo:mc-world-tools:world_maintenance::tests::prune_refuses_a_published_tail_the_checkpoint_does_not_cover", "cargo:mc-core:core::native_checkpoint_crash_tests::shutdown_with_a_refused_final_checkpoint_leaves_the_tail_prune_refuses", "cargo:mc-core:native_checkpoint::tests::checkpointed_tail_guard_reads_published_batch_names"]
failing_first = "not recorded"
fix_commit = "patch:deedd050814b07404bfbfe53461b61f4afe1f9c210da80b9e5afda6e638da514"
promotion = "docs/bugs/promotions/WORLD-PRUNE-JUDGES-STORE-WITHOUT-TAIL-CHECKPOINT.json"
