[[bug]]
id = "SETTLEMENT-RESIDENTS-TRAPPED-IN-PLAZA-BASIN"
title = "Seven of trial-4's eight residents stay in the one-cell water basin beside the bell for 24,000 ticks under a tree crown, so no Builder ever reaches a worksite"
area = "gameplay"
repro = "source"
severity = "major"
