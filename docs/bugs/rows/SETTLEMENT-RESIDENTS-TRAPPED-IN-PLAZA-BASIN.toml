source = "SlotStall native probe on a copy of SpainCulture trial-4 at ab2d945c9 (receipts/SlotStall/README.md, logs/before-trial4.log, logs/dump-trial4.log): residents at (116.3-116.7, 69.6, 7.5) float in water (116,69,7), rimmed by acacia_wood at y=69, with acacia_leaves at (116,72,7) and its neighbours and an acacia trunk at (116,70..73,9); they hold navigation targets and 40-130-node paths but do not move from tick 304106 to 328106. mc-physics step_entity lets a body jump out of fluid only when a 0.6 rise is free of collision; from y=69.6 the 1.95-high body would reach 72.15 and meets the crown at y=72. Not established: whether vanilla frees villagers here, and how the crown came to stand over the basin (lumber replant or natural growth)."
regression = []
failing_first = "not recorded"
repro_check = "Kept open as an entry/provenance question; the lane's decision is recorded in receipts/D123/D123GameplayP/OWNER-DECISIONS-NEEDED.md section 1. Verified at this head: the escape is vanilla-shaped - crates/mc-physics/src/lib.rs:923-940 is vanilla jumpOutOfFluid (a 0.3 blocks/tick impulse only when a 0.6 rise is free of collision AND fluid, so acacia_leaves at y=72 clip it from y=69.6) and crates/mc-core/src/villager/brain/motion.rs:645-664 is the `immersion` predicate and :699-700 is the swim lift it gates (0.8 chance, 0.04 blocks/tick, only while the fluid reaches the swim threshold above the feet, crates/mc-physics/src/lib.rs:1880-1889), which a one-deep basin does not; the vanilla villager's brain behaviour is `Swim(0.8F)` (not `FloatGoal`), with the same threshold. Vanilla evidence (local 26.2 server jar, javap, not committed): FloatGoal.tick rolls the jump control while a mob is in water above getFluidJumpThreshold, and LivingEntity.jumpInLiquid adds exactly +0.04/tick (ldc2_w 0.04) through an ordinary collided Entity.move (the villager's brain behaviour is Swim(0.8F), same jumpInLiquid impulse and threshold), so vanilla has no unstick or teleport for a villager and would leave the same body under the same crown. The divergence is therefore entry (stroll/work targets and pathing into fluid; vanilla RandomStrollGoal/WaterAvoidingRandomStrollGoal pick land positions) plus the crown provenance (lumber replant or natural growth), both owner scope (settlement goal/layout owners; layout rule belongs in docs/settlements/OWNER_DECISIONS.md). A one-cell unstick rule would be a documented non-vanilla deviation, not a parity fix. No regression ref: there is no vanilla-correct assertion to write until the owner picks an option (a: close as vanilla-equal and split entry/geometry; b: accept a non-vanilla unstick; c: leave open)."
