  "cargo:mc-edge:content_import::tests::a_dropped_jvm_child_is_killed",
  "cargo:mc-edge:content_import::tests::a_bounded_child_returns_its_output",
]
proving_refs = ["cargo:mc-edge:content_import::tests::a_stalled_datagen_returns_a_bounded_error"]
proving_assertions = { "cargo:mc-edge:content_import::tests::a_stalled_datagen_returns_a_bounded_error" = "crates/mc-edge/src/content_import_tests.rs:551" }
