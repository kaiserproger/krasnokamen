[[bug]]
id = "SLIME-HOPS-CARRY-NO-WANDER-DIRECTION"
title = "A wandering slime's hops carry no direction outside the walker dwell-phase window, so slimes hop in place and their drift depends on two clocks lining up"
area = "gameplay"
severity = "major"
status = "open"
source = "Integrated L2 20261124T003929-correctness-bvkut2ui on wt/D123Integ1 (main + Civ + Mechanics + Harness + Battle be752a788): `species_tests::every_assigned_species_spawns_locomotes_and_dies_through_native_merge` red at species_tests.rs:177, `slime movement family must execute`, `[0.5, 65.0, 0.5]` unchanged after 90 ticks. Same test red 3/3 on wt/D123Battle head 5f3415769 (receipts 20261124T013933, 20261124T014642, 20261124T015037). Root cause of the lane's SLIME-LOCOMOTION-WALKS-INSTEAD-OF-HOPS fix: between hops `entity_motion::step` zeroes ground traction (vanilla `SlimeMoveControl`), so a slime's only translation is its hop, but the drive it hops with comes from `entity_motion::wander`, whose walker dwell phase returns a zero direction for 80 of every 120 ticks. A hop therefore translates only when the jump clock (`hop_due`, period 10..29) coincides with a wander-window tick; otherwise the slime hops in place and lands exactly where it took off."
repro = "cargo"
regression = ["cargo:mc-core:entity_motion_tests::a_hoppers_wander_heading_survives_the_walker_dwell_phase", "cargo:mc-core:species_tests::every_assigned_species_spawns_locomotes_and_dies_through_native_merge"]
failing_first = "reported"
repro_check = "Reversible in one line: with the hop block disabled (`hops: … && false` in tick/entity_phase/step.rs) the species test passes (receipt 20261124T015619-test-0so1skrz); with it restored the test fails 3/3 (20261124T013933, 20261124T014642, 20261124T015037). A temporary slime trajectory probe over the same fixture (specimen id 1) shows the hops themselves working — y rises to 66.25 and returns to 65.0 at ticks 20, 46 and 70 — and the horizontal position moving only on the hop that falls inside a wander window (x 0.5 -> -0.068 by tick 32), while the later hops leave x/z untouched at -0.0676/0.3054. In the species fixture's own id phase no hop lands in a window, so the slime lands exactly where it took off."
