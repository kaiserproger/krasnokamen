repro_check = "Fixed in 42ae17014 (+0cf289c5c refactor): a merge writes a zero Health into the entity image verbatim (prepare_edit zero_health), apply zeroes the row and starts the corpse clock (command_data/entity.rs). Control: docs/bugs/promotions/DATA-MERGE-HEALTH-ZERO-REFUSED.patch reverses those hunks only (git apply -R --check clean) and data_merge_health_zero_kills_a_living_mob_like_vanilla then fails at its first assertion. Failing first was the reported predicate, not a recorded run: command_summon::authored_fields refused Health <= 0.0 (Invalid Health), and the new test's first assertion is that same command, so the reversal run is the red proof. `summon <mob> {Health:0f}` stays refused: the test asserts the refusal and that the refused summon spawns nothing. Deliberate difference from vanilla, recorded here: vanilla clamps a negative Health to 0 and the mob dies, while this engine refuses a negative Health as `Invalid Health` (the same normaliser refuses it in a merge); the test pins that refusal and that it leaves the mob alive at its old health."
