[[bug]]
id = "LOD-TILE-STAMPED-WITH-POST-SWITCH-DIMENSION-GENERATION"
title = "An LOD tile sampled in the old dimension can be queued after the viewer's dimension switch with the new generation stamp, so the world-queue fence keeps it and a viewer running the native client in the new dimension receives a wrong-dimension tile (the native LOD channel; the Java Distant Horizons presentation has its own path in dh.rs)."
area = "gameplay"
repro = "source"
severity = "minor"
status = "fixing"
source = "receipts/Books/REPORT-R4.md section 1 R4-P5 (OSTEP 32.2 atomicity violations; Bos ch. 2 fetch_add is a total order, not a critical section). The fence added by docs/bugs/fix-patches/DIMENSION-SWITCH-KNOCKBACK-DISCONNECT.patch is WorldSender::reset() = generation.fetch_add(1, AcqRel) and try_send / try_send_chunk_batch stamp the frame with generation.load(Acquire) at enqueue time (crates/mc-edge/src/server/world_queue.rs); reset() is called by the pump on PlayerChange::DimensionChanged. crates/mc-edge/src/lod.rs sends LOD tiles from a tokio task after a spawn_blocking sample of the world, so a task that sampled the overworld can send after reset() and its frame carries the new generation; the session_locked check in lod.rs runs before the send and does not close the window. Consequence is presentational (a wrong-dimension tile in the DH cache), not stateful. Verified open on main 5bdc02911 (generation still loaded at try_send). Fix direction: capture the generation before the blocking work and pass it in (try_send_at(generation, frame)) or re-check the viewer's dimension inside the enqueue critical section. Regression sketch: a WorldQueue unit test where reset() between a captured generation and a send discards the frame."
regression = ["cargo:mc-edge:lod::tests::a_reset_during_the_sample_discards_the_tile"]
failing_first = "not recorded"
fix_commit = "patch:ea201453aa5025dd6d73c236af85e0283bb1e540687300c126d4e60d6370c149"
repro_check = "Fixed in 167dccf8d and 7920fc66b: WorldSender carries the queue generation on the frame (try_send_at), request() captures it before the permit wait, and the blocking sample runs inside sample_tile, which enqueues under the captured value, so a dimension reset during the sample makes the writer discard the tile and release its credit. Patch-mode identity patch:ea201453 carries both commits' non-test hunks; the a/-side keeps the kept test's names ((b)) with the pre-fix bodies (stamp at enqueue, capture after the sample), so the regression reddens at its own TryRecvError::Empty assertion."
promotion = "docs/bugs/promotions/LOD-TILE-STAMPED-WITH-POST-SWITCH-DIMENSION-GENERATION.json"
