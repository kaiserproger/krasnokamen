[[bug]]
id = "PERF-RECEIPT-HAS-NO-CLIENT-OBSERVED-TICK-ARRIVAL"
title = "Rung receipts carry no distribution of client-observed tick arrival: server MSPT excludes pacing sleep by design and the keepalive RTT is a smoothed per-player gauge, so what a player feels is unmeasured."
area = "harness"
repro = "source"
severity = "minor"
status = "open"
source = "receipts/Books/REPORT-R1.md gap G-10 (Gregg 2.5.11 workload characterisation, variance; perf). docs/performance/PROFILES.md 'Windows and metric definitions' defines server-side nearest-rank percentiles from exact source ticks; crates/mc-edge/src/dashboard.rs (around :1180) exposes keepalive RTT as a smoothed gauge; bot reports carry packets and bytes, not arrival intervals. Verified open on main 5bdc02911. Fix direction: record the inter-arrival of a per-tick packet at the bot clients per window and report its p50/p95/p99/max beside MSPT in the rung receipt."
failing_first = "not recorded"
regression = []
repro_check = "Implemented in 2941bc91f, unpromoted (no receipt exists to cite): the protocol bots (crates/mc-test-harness/src/bin/player_scale_bots.rs) time the server clock heartbeat (ClientboundSetTime, one per 20 server ticks) and report per open-loop window tick_arrival.interval_us (p50/p95/p99/max and the bucket histogram of the heartbeat gap) and tick_arrival.tick_period_us (the same gap divided by the game-time delta the heartbeat carries, so a 1 s gap over 20 ticks is 50 ms per tick); a heartbeat that does not advance the tick is not counted. tools/coreperf/profiles.py adds result.client_tick_arrival per window beside the MSPT summary, naming a window the bot report leaves out instead of omitting it. Unit refs exist (tests::tick_period_normalises_a_heartbeat_by_its_game_time_delta, tests::tick_arrival_reports_the_percentiles_of_a_recorded_window) but the row cannot be promoted on them: the required proof is one quiet-window rung receipt whose bot report carries samples > 0, which only a measurement window in Main's schedule can produce (lane rule: quiet -x windows are not convenience runs). The old fallback that modelled the arrival from packet counts is gone with the field."
