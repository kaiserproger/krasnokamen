[[bug]]
id = "JOURNAL-BASELINE-BEHIND-CHECKPOINT-PARKS-TICK"
title = "A generated-chunk baseline queued behind an in-flight checkpoint parks the journal owner: after about 126 more appends (about 6.3 s at 20 TPS) the tick's journal send parks until the multi-second checkpoint commit returns"
area = "gameplay"
severity = "major"
status = "fixed"
source = "Latent; CheckpointJoinStall 2026-11-20, found while triaging Perf1M R3k-4 leg c (receipts/Perf1M/LAPTOP-R3k-4-REPORT.md); not that run's cause (its journal owner logged `stopped` at 18:47:52.316, before checkpoint 77112 committed at 18:47:53.937). crates/mc-core/src/core/journal.rs:869-888: the journal owner hands `RequireGenerated` to the FIFO native writer and blocks on its `durable.recv()`; the native writer runs it only after any earlier checkpoint (journal.rs:916-922), so the owner drains no `Append` while that checkpoint commits. The tick then fills the 128-slot work queue (core.rs:330-350) and parks in `send` (or in `JournalBudget::reserve`, journal_budget.rs:743-753). Perf1M R3k-4 measured periodic checkpoints of 10.8-16.6 s, so a chunk generated early in such a checkpoint at 20 TPS would freeze the world for about 4-10 s (derived from the synthetic repro, not observed in a run). Repro on dc670b3bd: receipts/CheckpointJoinStall/repro/m1-repro.patch (sha256 9c043637d95c0a2b03ff678ba07cddd9643b79413901ff923fbcf976dd9868e4)."
repro = "source"
regression = ["cargo:mc-core:core::journal_backpressure_tests::baseline_behind_held_checkpoint_keeps_tick_admission_draining", "cargo:mc-core:core::journal_backpressure_tests::closed_tick_queue_releases_a_held_baseline_wait", "cargo:mc-core:core::journal_backpressure_tests::refused_baseline_releases_the_hold_without_further_tick_work", "cargo:mc-core:core::journal_backpressure_tests::two_baselines_behind_one_held_checkpoint_keep_their_own_answers", "cargo:mc-core:core::journal_backpressure_tests::writer_death_before_a_queued_baseline_halts_without_tick_work", "cargo:mc-core:core::journal_backpressure_tests::more_than_the_hold_limit_publishes_every_batch_in_order"]
repro_check = "Fix spans e40a26d4e+75a8a7cf9; patch-mode identity docs/bugs/fix-patches/JOURNAL-BASELINE-BEHIND-CHECKPOINT-PARKS-TICK.{patch,md}. The patch carries only the journal.rs scheduling/liveness delta because the API shape the fix added is named by the registered refs: reversing it would make them uncompilable, so the adapted pre-fix form keeps those symbols inert. Reversed control: .analysis/validation/20261123T151216-test-cdgzv60i (symptom test red at its 5 s send deadline, hold-limit test red at its 20 s admission deadline); candidate PASS .analysis/validation/20261123T151109-test-kkkdqjpm (13/13)."
failing_first = "reported"
fix_commit = "patch:c329db74025d9a6e9db290455345922026524b08297fd852ccd2ec235d685869"
promotion = "docs/bugs/promotions/JOURNAL-BASELINE-BEHIND-CHECKPOINT-PARKS-TICK.json"
