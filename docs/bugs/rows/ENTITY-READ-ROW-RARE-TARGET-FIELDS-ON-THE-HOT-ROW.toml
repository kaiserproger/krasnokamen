[[bug]]
id = "ENTITY-READ-ROW-RARE-TARGET-FIELDS-ON-THE-HOT-ROW"
title = "Two Option<[f64; 3]> target fields (32 B each) still sit on the per-entity ReadRow, so every entity's hot snapshot pays 64 bytes for state only a handful of hostile goals read"
area = "gameplay"
severity = "minor"
status = "open"
source = "D123Battle pack 2 review, split out of ENTITY-READ-ROW-248-BYTES-COPIED-PER-ENTITY-TICK part (b): `ReadRow` carries `enderman_target` and `plugin_target` (and the gold/panic scalars beside them) for every admitted entity per tick, while only the few bodies with a plugin or enderman goal read them. The row is now taken by reference (part (a), landed), so the cost is the 64 bytes of fill per entity per tick and the cache footprint of the prepare output, not a copy. Fix shape: move both into the existing rare side vector (`RarePrep`, which already carries enderman/plugin/gold targets) and tighten the 256-byte assertion into a real ratchet."
repro = "source"
regression = []
failing_first = "not recorded"
