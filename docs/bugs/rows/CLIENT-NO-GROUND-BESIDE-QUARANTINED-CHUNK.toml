[[bug]]
id = "CLIENT-NO-GROUND-BESIDE-QUARANTINED-CHUNK"
title = "After a restart beside a chunk the server quarantined, the native client enters play at the teleported position with the floor block and entities received, but never reports on_ground, so the player is pinned in place next to the corrupt chunk."
area = "client"
repro = "client"
severity = "major"
status = "fixed"
source = "D123ClientNativeH 2026-11-25, the NAT-3 measurement of NATIVE-INPLAY-BLOCKED-BY-MISSING-CHUNK: native-v2-corrupt-chunk-near-camera with the refused chunk in the chunk column west of the player (a column the pre-fix loading gate demanded, not the player's own). Receipts 20261125T035800 (plan diagnostics), 20261125T040219 (client block/entity probes), 20261125T034455."
regression = ["harness:entities:native-v2-corrupt-chunk-near-camera", "client:krasnokamen-client:session::observation::destruction_tests::a_player_beside_an_unheld_column_grounds_and_can_sneak", "client:krasnokamen-client:session::observation::destruction_tests::an_unheld_cell_is_solid_in_the_collision_scan", "client:krasnokamen-client:session::observation::destruction_tests::unloaded_eye_keeps_play_frames_and_waits_for_terrain"]
proving_assertions = { "harness:entities:native-v2-corrupt-chunk-near-camera" = "restart_player_grounded" }
repro_check = "Filed 2026-11-25 from the NAT-3 measurement of NATIVE-INPLAY-BLOCKED-BY-MISSING-CHUNK. Measured: the join is healthy (the edge plan serves 80 of 81 chunks around position [192.5, 77.0, -447.5], center (12, -28); the eighty-first is the quarantined column and can never arrive - 20261125T035800), and the client holds its own chunk (its feet block (192, 77, -447) reads loaded air, the floor at 76 reads solid obsidian, 3 nearby entities - 20261125T041303/040219). It never reports on_ground, velocity is 0, y stays exactly 77.0, and a held forward changes nothing (20261125T041303). The predictor runs every tick without a terrain wait (predict_ticks 1245, terrain_waits 0 - 20261125T064310, 20261125T065045) and records no movement_blocked (20261125T043004). Root cause: collision::gather_with_context scanned the body's one-cell margin and returned \"unloaded_collision_neighborhood\" for any cell of an absent chunk (the climb, inside-block and fluid scans did the same), so Player::predict died in choose_pose and Player::tick recorded that as movement_blocked and zeroed the velocity: the player stood frozen on real ground and never grounded. Fix client:cdc99ae89ee58c2e98ec9d8480927b9573194cd9 (on top of client:c084f8c483272f45e44b0a7cb6760b4c69d4e5ae): an unheld cell is a whole solid cube in every scan, exactly as the server's own sampler resolves it (mc-core tick.rs, BlockMaterial::Solid -> FULL_BLOCK), so client and server agree and no corrections follow. That solid material is also a floor - the server's supported stands a body on it - so the cube is filtered by intersects(bounds) like every other shape: an unfiltered one-cell margin cube froze choose_pose beside the column and the player could never sneak (review REVIEW-14-Opus P-M1). The earlier \"never a floor\" reading was wrong and every copy of it is corrected. The fluid solid-face for an unheld cell answers true (the whole-cube rule the falling-water push needs), and the two dead \"unloaded_collision_neighborhood\" branches (navigation gather, falling-block collision) are removed. The waits-for-terrain path (environment() on the player's own column) is unchanged. Behaviour tests, red without the fix (notes/red-pre-fix-collision.log) and the pose leg red without the intersects filter (notes/red-pm1-sneak-pose.log): a player on a delivered floor beside the unheld column grounds with movement_blocked None and can sneak (Pose::Crouching); a step toward the column stops at its face (16.0 - 0.3) and stays grounded; the survival leg of unloaded_eye_keeps_play_frames_and_waits_for_terrain measures the same stop and the same step continuing once the column arrives (it had been a spectator leg, whose collision solve is skipped - review P-M2). The gate now also walks the grounded player one step toward the refused column and asserts zero corrections and a stop at x 192.3 (review p-m5). Evidence, all on core 5f67fd29c934 (server pin 5f67fd29c934-248f0b19): native-v2-corrupt-chunk-near-camera PASSED 3 of 3 with the fixed client pin c084f8c48327 (20261125T104941, 20261125T105120, 20261125T105258; assertions include restart_player_grounded true, refused_column_step_made_no_correction true and refused_column_step_stopped_at_its_face true, the walk measured x 192.5 -> 192.30000001192093 with corrections 0) and FAILED 3 of 3 with the reversed client pin 3671790ee7f9 (20261125T105418, 20261125T105703, 20261125T105918; restart_player_grounded false, every earlier assertion true, the body pinned at [192.5, 77.0, -447.5] with corrections 0)."
fix_commit = "client:cdc99ae89ee58c2e98ec9d8480927b9573194cd9"
promotion = "docs/bugs/promotions/CLIENT-NO-GROUND-BESIDE-QUARANTINED-CHUNK.json"
