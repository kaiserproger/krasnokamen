[[bug]]
id = "CLIENT-NO-GROUND-BESIDE-QUARANTINED-CHUNK"
title = "After a restart beside a chunk the server quarantined, the native client enters play at the teleported position with the floor block and entities received, but never reports on_ground, so the player is pinned in place next to the corrupt chunk."
area = "client"
repro = "client"
severity = "major"
status = "open"
source = "D123ClientNativeH 2026-11-25, the NAT-3 measurement of NATIVE-INPLAY-BLOCKED-BY-MISSING-CHUNK: native-v2-corrupt-chunk-near-camera with the refused chunk in the chunk column west of the player (a column the pre-fix loading gate demanded, not the player's own). Receipts 20261125T035800 (plan diagnostics), 20261125T040219 (client block/entity probes), 20261125T034455."
regression = ["harness:entities:native-v2-corrupt-chunk-near-camera"]
repro_check = "Filed 2026-11-25 from the NAT-3 measurement of NATIVE-INPLAY-BLOCKED-BY-MISSING-CHUNK. Measured: the join is healthy (the edge plan serves 80 of 81 chunks around position [192.5, 77.0, -447.5], center (12, -28); the eighty-first is the quarantined column and can never arrive - 20261125T035800), and the client holds its own chunk (its feet block (192, 77, -447) reads loaded air, the floor at 76 reads solid obsidian, 3 nearby entities - 20261125T041303/040219). It never reports on_ground, velocity is 0, y stays exactly 77.0, and a held forward changes nothing (20261125T041303). movement_blocked is null (20261125T043004) so the local prediction does not error; the remaining reading of Player::predict is its early 'waits for terrain' return, which fires only when the block at/just below the LOCAL prediction position is unloaded - so the open question is whether the local prediction position is the reported (teleport) one. The corrections/local_position mirror added this session returned null (those names are not in the shared observation), so that needs its own observable. Design note: receipts/D123/D123ClientNative/DESIGN-NO-GROUND-BESIDE-QUARANTINE.md. Withdrawn: the earlier claim that the join payload never arrives (it came from observation keys the MCP payload does not carry). Measured on the D123ClientNativeH diagnostic round of the same day (20261125T045348, T050342, T052850, T061924; the refused column unchanged): pose_known true, local_position == server_position == [192.5, 77.0, -447.5], server_frozen false, step_ticks 0, feet_block_loaded true and below_block_loaded true at the probe (the two samples environment() takes), abilities_flying false, movement_blocked null, and every tick stage running (render cpu_session_tick_detail_ms: events 0.24, environment 0.0014, player 0.038-0.147, refresh_scene 0.18, ms). The 433 observations of the run show on_ground true for the first 8 before the disconnect and false for every observation after minecraft_connect at the identical position, so the reconnect path, not the refused column alone, is part of the repro; receipts/D123/D123ClientNative/HANDOFF-16.md carries the connect/reset difference to check next."
