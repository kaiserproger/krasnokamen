[[bug]]
id = "HOT-BACKUP-OFFLINE-STATUS-BEFORE-VERIFY"
title = "The offline `backup` command printed `complete` before the copy had been verified, so a copy that failed verification (and was then withdrawn) had already been announced as complete"
area = "gameplay"
repro = "source"
severity = "minor"
status = "fixed"
source = "Split from HOT-BACKUP-OFFLINE-RESTORE-UNVERIFIED on the independent review of wave 2 (receipts/D123/D123Persist/review/REVIEW-wave2-1.md B1): that row now covers only the proven defect (the second read-only open refusing a good hot copy), because its control's `a/`-side already calls `hot_backup::verify_restorable`, so the red proves a false refusal, not a missing verification. This row owns the reporting half of 92a28e7186: `run_backup` printing `backup of ... complete: N files` and returning `()` before the caller verifies, and `operator_cli.rs`'s `Command::Backup` arm (`verify_written_backup` withdraws the manifest on failure, but only after the earlier `println!`). The fix replaced that with `Ok(manifest.files.len())` and a single final status printed after verification (or the explicit `NOT verified` form when there is no content cache)."
regression = ["cargo:mc-edge:backup::tests::backup_announces_complete_only_after_verification"]
failing_first = "not recorded"
repro_check = ["Control: cargo:mc-edge:backup::tests::backup_announces_complete_only_after_verification. The parent test re-executes the test binary as backup::tests::backup_status_child_reexec with --nocapture, so the real backup command prints to a pipe the parent can read. The child arms the backup copy interruption hook (Step::Copied) to overwrite the copied native/state.redb once it is written and synced, so run_backup succeeds and verify_written_backup refuses the copy and withdraws its manifest. The parent requires a non-zero child exit, stderr naming the withdrawal, and no \"complete\" in the child standard output. Pre-fix, run_backup printed `backup of ... complete: N files` before the caller verified, so the row assertion fails there. The fix patch carries the reporting half of 92a28e7186 only (backup.rs run_backup -> Result<usize> and its final println! replaced by Ok(len), plus the operator_cli.rs Command::Backup arm); the verification half belongs to HOT-BACKUP-OFFLINE-RESTORE-UNVERIFIED. See docs/bugs/fix-patches/HOT-BACKUP-OFFLINE-STATUS-BEFORE-VERIFY.patch and docs/bugs/promotions/HOT-BACKUP-OFFLINE-STATUS-BEFORE-VERIFY.hunks.md."]
fix_commit = "patch:ddc019bdf22ac21be427b0cb1a51bce575609f4801983cfc4ad34d231422dc21"
promotion = "docs/bugs/promotions/HOT-BACKUP-OFFLINE-STATUS-BEFORE-VERIFY.json"
