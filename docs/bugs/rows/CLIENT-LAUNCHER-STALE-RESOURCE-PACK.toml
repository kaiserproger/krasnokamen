[[bug]]
id = "CLIENT-LAUNCHER-STALE-RESOURCE-PACK"
title = "Launcher resource extraction was additive and skipped on a manifest claim, so a stale 26.1.2 pack was never rebuilt and 26.3 assets (sign templates, cushion, sulfur_cube textures) were missing"
area = "client"
repro = "source"
severity = "major"
status = "open"
source = "The launcher wrote the resource pack into the game directory incrementally and treated an existing manifest as proof the pack was current, so upgrading the client left a 26.1.2 pack in place: 26.3 content the client needs (template_sign_* block models, entity/cushion and entity/sulfur_cube textures) never appeared, and the client's model-texture walk fails on the missing files."
regression = ["client:krasnokamen-launcher:bootstrap::tests::a_manifest_claim_does_not_make_a_stale_pack_current", "client:krasnokamen-launcher:bootstrap::tests::a_stale_resource_pack_is_replaced_instead_of_merged", "client:krasnokamen-launcher:bootstrap::tests::an_installation_whose_pack_lost_its_marker_is_not_ready", "client:krasnokamen-launcher:bootstrap::tests::a_failed_pack_swap_keeps_the_previous_pack", "client:krasnokamen-launcher:bootstrap::tests::a_jar_with_the_same_paths_and_other_bytes_invalidates_the_pack", "client:krasnokamen-launcher:bootstrap::tests::pack_entry_digest_is_the_shared_known_answer", "client:krasnokamen-launcher:ui::tests::ordinary_play_runs_the_install_stage_for_a_stale_pack"]
fix_commit = "client-test:8f8e07e9"
client_test_reason = "the launcher's bootstrap decides the resource pack's identity, replaces a stale pack and gates the Play button before any client starts; the harness launches an already-installed client, so no scene assertion can flip on the launcher's pack decision, and the fix's four bootstrap unit tests are the whole observable"
repro_check = "Candidate client:3fa63044 restores a previous pack on failed swap and requires a matching marker before Play; client:8f8e07e9 uses jar SHA-1 and entry digest. Receipts XClientBlocks/27-ready-negative-control.log and 31-jar-identity-negative-control.log show readiness and jar identity controls red; 36-play-negative-control.log shows the real start_play test red. The swap ref stayed green in those controls, but reversing only the swap restore branch fails it in receipts/XClientBlocks/37-swap-negative-control.log and restore passes in 38-swap-restored.log. Real-client upgrade across a pack change remains required. D123PackPairs3 (2026-11-26): not promoable in this session, exact blockers. (1) No harness profile runs the launcher: every scene-shot launches the client binary, and a launcher's install stage is a separate binary's behaviour, so no scene assertion can flip on it; the real upgrade would need a new harness step that seeds a stale pack, runs `krasnokamen-launcher --headless-bootstrap --data-dir DIR --manifest URL` and then a scene against DIR/resources. (2) The client-receipt promotion rule cannot express a launcher fix at all: the control and restore pins must differ by exactly the fix's non-test patch, and a launcher change leaves the client binary identical, so `ledger promote` refuses the pair; the only legal form is `client-test:<sha>` with a `client_test_reason`, which supersedes this row's own 'real-client upgrade remains required' note and is an owner/Main decision. (3) The upgrade needs a real 26.3 release jar plus its manifest served to the launcher (`--manifest`), which no host-local pack or manifest exists for (the harness resource root is a pre-extracted template under qa-armada, not a launcher input)."
