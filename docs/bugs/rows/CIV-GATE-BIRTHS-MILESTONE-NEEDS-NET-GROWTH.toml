[[bug]]
id = "CIV-GATE-BIRTHS-MILESTONE-NEEDS-NET-GROWTH"
title = "The civilization gate can log a birth, capture the baby, and still report `births=false`, because the milestone needs a net-growth observation the run does not always produce."
area = "harness"
repro = "source"
severity = "major"
status = "open"
source = "Exact symptom, D145Gameplay lane, 2026-11-28: run `wt/D145Gameplay/.analysis/validation/20261128T102040-civilization-seed-qa-sdz7erke` on seed 24 at `ac4b6a6a19` produced and captured one audited newborn (`e86ea332-fa21-4422-acd2-964eb7c0f8b3`, settlement 1, server-log tick 8264, captured at sprint 900), but the population maxed at 6 against a baseline of 5 through the 96,000-sprint-tick bound, so the run failed after 6928.9 s with `new_house` and `second_building` reached and only `births` missing. The missing evidence is the second net growth, not a birth and not the baby capture; iron and a new house with bed were independently observed."
failing_first = "reported"
regression = ["python:tools.harness.test_civilization_seed_qa"]
repro_check = "`tools/harness/backends/civilization_seed_qa.py:1300` records `growth_observation` only when `current_population >= baseline + 2`, so one birth above baseline never qualifies; `:1321-1324` then sets the `births` milestone only when **both** `growth_observation` and `baby_observation` exist, and the stall path forces `verdicts['births'] = verdicts['all'] = False` at :1357. A run whose audit log proves a birth and whose capture proves the baby still fails whenever the net-growth observation is absent (population above the baseline the gate recorded), so the milestone name promises a birth witness and the rule requires demography. Either the milestone should be satisfied by the audit birth plus the baby capture, or it must be renamed and its limitation printed with the failure."
