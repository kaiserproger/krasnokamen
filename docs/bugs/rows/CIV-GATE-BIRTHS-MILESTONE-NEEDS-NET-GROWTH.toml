[[bug]]
id = "CIV-GATE-BIRTHS-MILESTONE-NEEDS-NET-GROWTH"
title = "The civilization gate reports `births` as the missing milestone when the documented rule it enforces is +2 net population growth plus a baby, so a run with a real, captured birth reads like a birth failure."
area = "harness"
repro = "source"
severity = "major"
status = "open"
source = "Measured by the D145Gameplay lane on 2026-11-28: run `wt/D145Gameplay/.analysis/validation/20261128T102040-civilization-seed-qa-sdz7erke` on seed 24 at `ac4b6a6a19` logged and captured one audited newborn (`e86ea332-fa21-4422-acd2-964eb7c0f8b3`, settlement 1, server-log tick 8264, captured at sprint 900) and observed iron and a new house with bed, but the population maxed at 6 against a baseline of 5 through the 96,000-sprint-tick bound and the run failed at 6928.9 s naming only `births`."
failing_first = "reported"
regression = []
repro_check = "The rule is correct and documented: `docs/settlements/acceptance-gates.md` in the birth-verdict paragraph requires the checkpoint member census to match the last observed count, every counted birth to have a post-baseline `settlement_birth` event whose provenance tick matches, and the counted births to cover the net population increase. `tools/harness/backends/civilization_seed_qa.py:1300` implements the +2 threshold (`current_population >= baseline_population + 2`) before it records `growth_observation`, `:1321-1324` sets the milestone only when both `growth_observation` and `baby_observation` exist, and `:1357` forces `verdicts['births'] = verdicts['all'] = False` on the stall path. What is wrong is the diagnostic, not the rule: the milestone and the failure text say `births` while the unmet condition is +2 net growth, so an operator reading `missing milestones: births` cannot tell a birthless town from a town that grew by one. Either rename the milestone (for example `population_growth`) or print the measured numbers - baseline, maximum population, observed births - with the failure."
