[[bug]]
id = "LOADER-DOC-CLAIMS-REQUIRED-BUNDLE-FLAG"
title = "A loader doc draft describes a per-bundle `required = true` refusal that neither core nor the Loader implements, so the page still documents the older behaviour"
area = "harness"
repro = "source"
severity = "minor"
status = "open"
source = "Main 2026-11-28 while clearing uncommitted edits in the main checkout: docs/KRASNOKAMEN_LOADER.md carried a rewrite stating 'the native settlements bundle is always offered as optional content' and 'if any plugin bundle is marked required = true, every client must negotiate it'. The draft is kept at receipts/D153/LOADER-DOC-REJECTED.diff and was reverted, because the code has no such flag: `rg -n 'required' crates/mc-core/src/plugin_startup.rs crates/mc-edge/src/plugin_loader.rs` finds no bundle-level required key, and solaris-loader only checks per-permission presence (LoaderHandshake.java:178) plus client permission requests (LoaderPermissionController.java:224). The page therefore still says a deployment with any `[client].bundles` requires Loader."
regression = []

# What the row needs: either the server gains a real bundle `required` key (then the doc rewrite
# lands with its own test) or the page keeps the current wording and the draft is deleted. Do not
# land prose that describes an unimplemented flag.
