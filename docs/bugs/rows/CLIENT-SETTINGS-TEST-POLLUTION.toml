[[bug]]
id = "CLIENT-SETTINGS-TEST-POLLUTION"
title = "A client unit test persisted a hotbar_2 = Mouse(Middle) rebind into the machine's real client-settings.json on every cargo test, so every later game on that host lost the 2 key."
area = "client"
repro = "source"
severity = "major"
status = "open"
source = "receipts/D123/D123Client/review/REVIEW-ReviewD123Client5-Opus-delta.md#b1 (review ReviewD123Client5, blocker B1)"
regression = ["client:krasnokamen-client:local_config::tests::a_test_build_never_writes_the_data_roots_settings_file", "client:krasnokamen-client:controls_tests::controls_native_dispatch_uses_rebound_mouse_button"]
fix_commit = "client:4022844b"
repro_check = "Chain in the code: controls_tests.rs::controls_native_dispatch_uses_rebound_mouse_button sets ui.rebind = Some(\"hotbar_2\") and captures Mouse(Middle); App::capture_binding applies it as the managed setting key_bindings; key_bindings is in UiState::MANAGED_SETTING_KEYS, so Session::apply_client_setting calls save_client_settings, whose path is client_settings_path() - KRASNOKAMEN_CLIENT_SETTINGS or the selected data root (local_config.rs). The test named no path, so a cargo test rewrote the real ~/.local/share/krasnokamen-client/client-settings.json with hotbar_2 = Mouse(Middle); Bindings::action maps one input to one action, so a physical Digit2 press then resolved to no action and every later game lost the 2 key (this is the step HC-2's pair first hit as survival_number_2_moves_hovered). Fix client:4022844b: a test build of save_client_settings saves nothing unless the test names its own path (KRASNOKAMEN_CLIENT_SETTINGS or save_client_settings_to); the release binary is unchanged. Regression local_config::tests::a_test_build_never_writes_the_data_roots_settings_file runs the save in a child process over its own data root and fails when a client-settings.json appears there: with the two guard lines removed it fails at `a unit test rewrote /tmp/krasnokamen-settings-save-<pid>/krasnokamen-client/client-settings.json` (receipts/D123/D123Client/negctl/settings-save-control.log, exit 101) and is green on the fix (negctl/settings-save-restore.log); both ran with XDG_DATA_HOME on a scratch dir, so neither could touch the operator's file. PROMOTION BLOCKER: the ledger has no client fix kind for a test-only change - a client:<sha> fix goes through _promote_client_fix, which needs a graphical ref and a real-client red/green pair whose red is an observed assertion failure; no scene assertion can flip on this fix, because a scene run reads its own per-run settings file (HARNESS-NATIVE-SETTINGS-NOT-INHERITED), so with the guard reverted the same pinned client still passes every scene. Recorded in receipts/D123/OWNER-DECISIONS-NEEDED.md (CL-7)."
