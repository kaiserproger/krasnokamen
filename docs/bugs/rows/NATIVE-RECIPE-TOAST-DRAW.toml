[[bug]]
id = "NATIVE-RECIPE-TOAST-DRAW"
title = "A recipe-unlocked toast is never captured on the native client: the renderer exists but no real-client frame has shown the recipe panel (system/unsecure-server toasts are proven separately by NATIVE-TOASTS-MISSING)"
area = "client"
repro = "client"
severity = "minor"
status = "open"
source = "Split from NATIVE-TOASTS-MISSING (review ReviewD123Client4 B1): the tip scene native-toast drives only the unsecure-server system toast, while vanilla 26.3 shows a recipe toast when a new recipe becomes available. The native renderer is src/ui/toasts.rs (client:8deb8fd7) and the unlock plumbing is the recipe-book notification path (src/inventory.rs, src/inventory/receive.rs, src/session/packets.rs); only ui::toasts::tests covers the kind, no frame exists."
regression = []
failing_first = "not recorded"
repro_check = "No registered check yet. The scene must make a recipe become available through the ordinary server path (item pickup or crafting unlock), then assert the recipe panel's own rectangle: dark navy panel, the recipe sprite region and the title ink two seconds after the unlock and none after the 10 s lifetime. The system toast's nine-slice (gui/sprites/toast/system) differs from the recipe kind's, so the system assertion cannot carry this row. The unit tests cover the queue, not a frame."
