repro_check = "CONTROL (patch mode, kept API). The real commit is `0c6f68d84`; its `command_data.rs` and `command_nbt_path.rs` are the fix's own modules, so reversing their creation would stop the kept refs compiling and they stay compiled but unreferenced by the reversed dispatch (README:250-256). `docs/bugs/promotions/DATA-QUERY.patch` therefore carries the one line the row lacked: the `if root == \"data\" { return crate::command_data::command(...) }` dispatch in `datapacks::command`, whose pre-fix body called the removed `command_blocks::data` partial handler (class (c): only the enclosing signature was rewritten later). Map: `docs/bugs/promotions/DATA-QUERY.hunks.md`.\n\nThe two older refs cannot prove it: they call `query`/`entity`/`block` directly, and the measured dispatch removal left them green (`20261123T212911-test-7u1iawnh`). This pack adds `command_data::tests::data_queries_answer_through_the_native_command_pipeline`, which enters through `command_context::run` (the console's own path) and asserts the answer the console was given (`commands.data.entity.query` carrying `13.5f`) plus one refusal line for an absent target; with the dispatch removed it reds at `command_data_tests.rs:2107` (`shown.len() == 1`, left 0). The graphical gate's `data_get_entity_health_20` is now a bounded observed check instead of a `steps.wait`, because a wait timeout is unrunnable as a control."
