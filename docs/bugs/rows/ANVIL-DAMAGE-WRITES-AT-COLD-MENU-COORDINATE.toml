[[bug]]
id = "ANVIL-DAMAGE-WRITES-AT-COLD-MENU-COORDINATE"
title = "Using an anvil menu can damage the anvil block at the stored menu coordinate after that chunk stopped being resident, writing into the cold overlay."
area = "gameplay"
repro = "source"
severity = "minor"
status = "fixed"
source = "receipts/ArchDesign/DESIGN-RESIDENCY-R14.md (found beyond the R13 vote; read-only audit). On main 3068dfb1b damage_anvil writes the anvil state at the menu coordinate (crates/mc-core/src/tick/stations.rs:143,184) without a residency check. Fix: the DESIGN-RESIDENCY-R14/R16 menu-source check in the three click inputs that pick a handler from the menu coordinate — container_click, container_slot_state and container_button (cold -> close_player_menu, input not applied) — plus the residency check inside damage_anvil. place_recipe, select_bundle_item and beacon::configure are not gated by menu_source_cold; they close the menu or write only resident records (crates/mc-core/src/tick/containers.rs:8-21)."
regression = ["cargo:mc-core:tick::cold_menu_residency_tests::anvil_damage_waits_for_a_resident_menu_coordinate"]
failing_first = "not recorded"
ingress_proof = ["crates/mc-core/src/tick/input/inventory.rs:228 container_click, :486 container_slot_state and :505 container_button close a cold block menu before any handler is selected", "crates/mc-core/src/tick/stations.rs:138-148 damage_anvil discards the damage draw when the menu coordinate is not resident"]
fix_commit = "patch:8e372d8d4cec363cc28da36566b7a397593fce7025890648384cf39ec91155df"
promotion = "docs/bugs/promotions/ANVIL-DAMAGE-WRITES-AT-COLD-MENU-COORDINATE.json"
