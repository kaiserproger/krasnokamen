[[bug]]
id = "EDGE-PUMP-SKIP-FORCES-FULL-RESCAN"
title = "A skipped or rebuilt tick output leaves the plan index without a contiguous entity base, so `entity_interest::prepare` rescans every viewer's whole chunk square on every later publish; once one rescan outlasts a tick the pump skips again; that did not recover for the rest of the R3k-6 leg under that load"
area = "edge"
repro = "source"
severity = "major"
status = "open"
source = "Perf1M R3k-6 leg c-p250k-kill-r3k6 (receipts/Perf1M/LAPTOP-R3k-6-REPORT.md, receipts/Perf1M/LAPTOP-RESULTS-D41/c-p250k-kill-r3k6/run/server.log): at tick 73449 (26 viewers, delta tick 1, a join within 0.5 s) rescans go 3 -> 26 and entities_scanned 2 853 -> 25 041; from then 944 of 948 publishes are full rescans (rescans == viewers, ~1000 entities and ~1000 moves per viewer per publish, plan_us x87-141) with tick delta median 7, up to 19. Before the step the same global rescans happened 36 times, each within 0.5 s of a join, and each recovered within 1-4 publishes while a rescan was cheaper than the tick."
detail = """
Mechanism (code reading):
- `crates/mc-edge/src/fanout.rs:141-162` builds one `TickPlanIndex` per dimension and sets `entity_base` only when some viewer's `previous_entities()` revision equals the new snapshot's `base_revision()` (fallback: equals its `revision()`). A viewer's previous snapshot is the last one it actually planned, so a skipped output leaves no viewer whose previous is the new base.
- `crates/mc-edge/src/plan/entity_interest.rs:56-58` treats that as non-contiguous and `:76-79` runs `entity_candidates::collect`, a full walk of the viewer's `(2*vd+1)^2` loaded chunks, per viewer, per publish.
- The global condition is the first term only: `held_same` (`:66-69`) and `window_same` (`:70-74`) are per viewer, so all viewers flipping in one publish points at the index's base, not at any viewer's own state.
- A join rebuilds the core's entity view set (new player row), which is what makes the base stop matching: in the R3k-6 log all 36 pre-step global rescans fall within 0.5 s of a `join applied` line.
- Once a rescan costs more than a tick (0.78 s at 26 viewers x ~1000 entities vs a 50 ms tick), the pump's own 1.6 s publish budget cannot catch up, it skips, and every later snapshot's base is again unmatched: 944/948 publishes stayed full rescans for the rest of that leg. The fast path does return whenever a viewer's previous revision matches again (`same`, or a contiguous base), which is why the 36 earlier global rescans recovered — what the leg shows is that under this load it did not come back, not that it cannot.
"""
impact = "The edge fan-out stops being incremental exactly when it hurts: full rescans make each publish 0.6-0.9 s, the pump skips ~7 of 8 tick outputs, chunk and move delivery starve, and client admission crawls (65/248 admitted in 25 min in R3k-6, 157/248 in two hours in R3k-5). The per-publish counters that exposed it are `mc_edge::server::plan=debug`."
regression = [
  "cargo:mc-edge:plan::plan_tests::pen_scenario_tests::an_index_given_the_chain_must_not_rescan_after_a_skip",
  "cargo:mc-edge:plan::plan_tests::pen_scenario_tests::a_skipped_window_delivers_what_a_full_rescan_delivers",
  "cargo:mc-edge:plan::plan_tests::pen_scenario_tests::a_skipped_publish_costs_one_rescan_without_the_chain_and_none_with_it",
  "cargo:mc-edge:server::pump_chain_tests::a_skipped_publish_stays_contiguous_through_the_chain",
  "cargo:mc-edge:server::pump_chain_tests::a_lagged_publication_keeps_the_full_rescan_fallback",
]
failing_first = "seen"
plan = "Two layers. (1) History: the pump records every drained or stale-skipped output per dimension as (base_revision, revision, changed ids) — a repeated revision is a no-op, a missing step clears the chain, a broadcast Lagged cuts it — bounded by the tick broadcast capacity. (2) Bridge: for the delivered base the most viewers hold, the fan-out unions the changed ids of the steps and builds the net delta once by comparing the viewer's own base EntityViews against the final snapshot, so spawn, removal, move, appearance and faction state are exactly a rescan of that base. A viewer the chain cannot reach keeps the full rescan, counted as `rescans_gap` (Lagged) or `rescans_no_history`, and a dimension travel forgets the interest so no pre-travel base is ever bridged."
fix_commit = "crates/mc-edge in worktree perf1m-r3k5 (branch wt/Perf1MR3), second cut after the D69 review (receipts/Perf1M/REVIEW-rescan-fix-5406bf8ae-sol.md): links are compact (base/revision/changed ids per dimension, no views, no prebuilt buckets), the net delta against the delivered base is built once at bridge time, a repeated revision is a no-op for the chain, and a dimension travel resets `EntityInterest`; negative controls: removing the stale-branch `history.record` fails the real stale-drain pump test, and `TickPlanIndex::bridge` returning None fails the index chain test at its own assert"
notes = "Two negative controls, both seen red: removing the stale branch's `history.record` fails `a_stale_skipped_drain_keeps_the_viewer_contiguous` (real `next_publication` drain: rescans 2, expected 1), and `TickPlanIndex::bridge` returning None fails `an_index_given_the_chain_must_not_rescan_after_a_skip` at its own assert (rescans 1, 961 scanned). Cost on the pen scene (1 008 entities, 4 drained steps, one viewer): scan alone 731 us; without the chain plan 3 301 us per viewer with rescan 1 / 960 scanned; with the chain the net-delta build is 2 037 us once per base per publish, then plan 4 830 us per viewer with rescan 0 / 0 scanned. The bridged plan is not cheaper in this scene: its rescan is a cheap sweep (731 us of the 3 301), while the framing walk over every changed row is the same in both paths and the bridge pre-pass is extra. Whether the 26+-viewer leg gains is the load A/B Main scheduled, not something this host may measure (D11)."
