[[bug]]
id = "EDGE-PUMP-SKIP-FORCES-FULL-RESCAN"
title = "A skipped or rebuilt tick output leaves the plan index without a contiguous entity base, so `entity_interest::prepare` rescans every viewer's whole chunk square on every later publish; once one rescan outlasts a tick the pump skips again; that did not recover for the rest of the R3k-6 leg under that load"
area = "gameplay"
repro = "source"
severity = "major"
status = "fixed"
source = """Perf1M R3k-6 leg c-p250k-kill-r3k6 (receipts/Perf1M/LAPTOP-R3k-6-REPORT.md, receipts/Perf1M/LAPTOP-RESULTS-D41/c-p250k-kill-r3k6/run/server.log): at tick 73449 (26 viewers, delta tick 1, a join within 0.5 s) rescans go 3 -> 26 and entities_scanned 2 853 -> 25 041; from then 944 of 948 publishes are full rescans with tick delta median 7, up to 19. Before the step the same global rescans happened 36 times, each within 0.5 s of a join, and each recovered within 1-4 publishes while a rescan was cheaper than the tick.

Mechanism (code reading). fanout.rs builds one TickPlanIndex per dimension and sets entity_base only when some viewer's previous revision equals the new snapshot's base_revision; entity_interest.rs treats a missing base as non-contiguous and runs entity_candidates::collect, a full walk of the viewer's (2*vd+1)^2 loaded chunks, per viewer per publish. A join rebuilds the core's entity view set, which is what makes the base stop matching. Once a rescan costs more than a tick (0.78 s at 26 viewers x ~1000 entities vs a 50 ms tick) the pump's own 1.6 s publish budget cannot catch up, it skips, and every later snapshot's base is again unmatched.

Fix now in tree (ported from perf1m-r3k5, nine commits a02a366a5..2d4f3a620): the pump records every output it drains or stale-skips in a per-dimension PublicationHistory bounded by the tick broadcast capacity, and the fan-out bridges the base most viewers hold by unioning the chain's changed ids into one net delta (TickPlanIndex::with_chain); a viewer the chain cannot reach keeps the full rescan, counted as rescans_gap (a broadcast Lagged cut it) or rescans_no_history. A dimension travel forgets the interest so no pre-travel base survives. The per-publish counters are mc_edge::server::plan=debug (rescans, entities_scanned, move tallies)."""
