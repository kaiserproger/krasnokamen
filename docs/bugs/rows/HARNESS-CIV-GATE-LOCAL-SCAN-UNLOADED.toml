source = "civilization-seed-qa artifact wt/D123Gate47/.analysis/validation/20261125T220300-civilization-seed-qa-12zuxr8_ (pin de356989816d): 122 s in, `minecraft_scan_blocks failed: {code: client chunk is not loaded at 144, 79, -224}` while scanning a building 13 blocks from the bell [131,78,-217]. building_blocks only teleported and called minecraft_wait_for_loaded_block for buildings beyond 48 blocks; a local one scanned blind, so a chunk the client had not yet streamed aborted the whole scenario. Fixed on wt/D123CivStock by waiting for every scanned chunk on both paths (event-driven MCP wait, no sleeps); the unit test reds without the wait."
failing_first = "reported"
regression = ["python:tools.harness.test_civilization_seed_qa:CivilizationEvidenceTests.test_local_building_waits_for_its_chunks_before_the_scan"]
