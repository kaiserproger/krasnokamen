repro_check = "REOPENED 2026-11-25 (review M5) and re-proved on 2026-11-25 with a noise-proof predicate: a scene of its own, native-v2-map-markers (tools/harness/backends/native_map_marker_region.py). Shape: one locked scale-zero map held, a placed empty item frame, the second copy inserted by hand, the wait on the frame decoration itself (map_item_data carries colours and markers in separate sections, so a packet counter proves nothing), then the held copy captured again. Guards, all recorded in the run report: a stable pair per side (each capture is the second of two frames whose drift inside the window is at most 40 px; a scene that does not settle in 8 attempts reports inconclusive instead of red), the newest chat line equal, the player decoration read once per capture and equal, the received colour array equal, and one compact blob (area >= 120, 22x28 or larger, fill >= 0.4, not touching the window edge). Measured 3 restore + 3 control runs on server pin 5717cf6e7491-c818e7f5: restore blob 391 px in a 22x28 box (fill 0.635) in all three (20261125T014256/014426/014548), control 0 changed pixels and waypoint_marker_drawn false in all three (20261125T014702/014757/014856). The withdrawn predicate lost the row once: a plain count let a 181 px drift pass on the control (20261124T232147), and the first guarded shape showed the same class of noise (drift 3829-136293 px on the first attempt of every capture), which is why the stable pair exists. The registered native-v2-map-frame-waypoint keeps its model check; its model-side marker count never proved this row's drawn pixels."
proving_assertions = { "harness:entities:native-v2-map-markers" = "waypoint_marker_drawn" }
