[[bug]]
id = "NATIVE-MAP-MARKERS"
title = "The native client receives correct map decorations (frame marker, off-map player) but draws none on a held map, so waypoints, banners and player markers are invisible."
area = "client"
repro = "client"
severity = "major"
status = "open"
source = "Promote gate 20261104T213104-native-v2-map-frame-waypoint-lhku9sjo (promotion-wire-receipts.json, screenshots/map-distant-held-clone.png)"
regression = ["client:krasnokamen-client:ui::packets::held_map_tests::received_map_decorations_face_the_map_and_use_their_atlas_regions", "client:krasnokamen-client:ui::packets::map_lifecycle_tests::received_map_marker_replacements_remove_old_icons_and_omitted_updates_preserve_them", "harness:entities:native-v2-map-frame-waypoint"]
fix_commit = "client:e1b22a5a"
repro_check = "REOPENED 2026-11-25 (review M5 + its re-run): the drawn-marker predicate does not separate reliably. Restore runs measured 395 and 531 changed pixels (20261124T205630, …210350) and the third restore run failed the scene's own model check (map_framed_map_has_exactly_one_frame_waypoint, …232050); control runs measured 0 and 0, and the third control PASSED with 181 pixels in the same region (…232147), above the 150 threshold. So the promotion 20261124T210606-ledger-promote-ftjn0o0f rests on two green controls and one red, the same sampling class review M1 rejected for the kick row. Exact missing proof: a noise-proof predicate — count only inside a sub-region around the frame marker's projection (review m1: interact_entity rotates the player, so the player marker can move into region0) or a threshold justified by at least six measured runs per side with the control's whole distribution below it. fix_commit stays client:e1b22a5a; the pair 864a757fe9 -> 55b8374ed7 is unchanged. The chat-length guard (map_captures_same_chat) is in the scene now and did not fire, so the 181 pixels are not a chat line."
proving_assertions = { "harness:entities:native-v2-map-frame-waypoint" = "waypoint_marker_drawn" }
