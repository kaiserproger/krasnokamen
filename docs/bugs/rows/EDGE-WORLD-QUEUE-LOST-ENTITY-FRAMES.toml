[[bug]]
id = "EDGE-WORLD-QUEUE-LOST-ENTITY-FRAMES"
title = "A world-queue send that fails after planning loses entity frames (AddEntity, data, passengers, leash) while the viewer records them as delivered; only geometry is repaired"
area = "gameplay"
repro = "source"
severity = "major"
status = "fixed"
source = "Rule-5 review of the recorder fix c731c550 (ReviewRecorderOverflow, 2026-11-12, finding F2): pump.rs:398-406 repairs only geometry after a failed world try_send; LOD tiles are a second producer on world_tx (lod.rs:317, LOD on by default config.rs:383), so pump.rs:341-342 'Only the pump sends world packets' is false. Example: a dismount SetPassengers(horse,[]) is lost and the client keeps the rider mounted until the next link change or re-pairing. Fix direction: take LOD tiles off world_tx, or treat a lost entity frame as a re-pair. Race window (review 2026-11-12): the credit is read before the plan of every viewer on the rayon pool and the send follows it, so an LOD tile can take a slot at any time during the whole planning time (possibly milliseconds on a heavy tick), not only between the read and the send; LOD streaming during a login or spawn burst makes a refusal likely there."
regression = ["cargo:mc-edge:server::admin_tests::lost_entity_frames_tests::refused_spawn_frames_are_sent_again_on_the_next_publication", "cargo:mc-edge:server::admin_tests::lost_entity_frames_tests::refused_dismount_is_repaired_by_respawning_the_vehicle", "cargo:mc-edge:server::admin_tests::lost_entity_frames_tests::refused_removal_is_sent_again_on_the_next_publication", "cargo:mc-edge:server::admin_tests::lost_entity_frames_tests::refused_repairs_remove_only_what_the_credit_respawns", "cargo:mc-edge:server::admin_tests::lost_entity_frames_tests::refused_frames_of_the_own_vehicle_are_resent_without_removing_it", "cargo:mc-edge:server::admin_tests::lost_entity_frames_tests::refused_own_entity_data_is_sent_again"]
fix_commit = "patch:87cb7ba485291aa283a807710069088bbf4a191e2a486040f1edbe04109d2082"
failing_first = "reported"
promotion = "docs/bugs/promotions/EDGE-WORLD-QUEUE-LOST-ENTITY-FRAMES.json"
