[[bug]]
id = "SETTLEMENT-ADOPTED-VILLAGE-NO-CERTIFIED-HOUSES"
title = "An adopted generated village certifies no House, so the settlement reports beds=0 and every resident is homeless although the village's houses hold beds."
area = "gameplay"
repro = "client"
severity = "major"
status = "open"
source = "Seed-24 civilization-seed-qa 20261124T192024-civilization-seed-qa-1plri8w2 (pin d38c666a1fda): the claimed, adopted village reports 'Migration A=21.7 (housing=0.00 ...); members=6 beds=0 ... buildings=5' in every snapshot, and its building list holds butcher and mason Workshops, a natural lumber camp, a natural mine, the founding Storage and (later) the farm Workshop - never a House. The saved state at the end of the run has six buildings with no House record and households 1-1 (origin adoption) and 1-2 (origin split), both home [114,72,-278], while the generated village's houses hold beds. Same symptom in run 20261124T170423 (beds=0 at every portal read, housing=0.00)."
failing_first = "reported"
fix_commit = "patch:3fc3d355930ec6cf9835531e8a1e836859f7748b5dcea5afb68932dc5150ece9"
regression = ["cargo:mc-core:settlements::autonomy::tests::an_adopted_house_piece_that_holds_a_workstation_certifies_both", "cargo:mc-core:settlements::autonomy::tests::the_pair_rule_is_only_for_the_generated_caller", "cargo:mc-core:settlements::autonomy::tests::piece_kinds_separates_the_house_the_workstation_and_neither", "cargo:mc-core:settlements::autonomy::tests::a_piece_over_an_unreadable_column_is_classified_later_not_never", "cargo:mc-core:settlements::autonomy::tests::generated_certification_tests::a_real_plains_small_house_box_certifies_as_a_house", "cargo:mc-core:settlements::autonomy::tests::generated_certification_tests::a_real_plains_medium_house_box_certifies_as_a_house", "cargo:mc-core:settlements::autonomy::tests::generated_certification_tests::a_piece_that_holds_its_own_workstation_certifies_as_the_pair", "cargo:mc-core:settlements::autonomy::tests::generated_certification_tests::a_lone_bed_and_door_do_not_make_a_house", "cargo:mc-core:settlements::autonomy::tests::generated_certification_tests::a_real_house_reduced_to_its_furniture_refuses", "cargo:mc-core:settlements::autonomy::tests::generated_certification_tests::a_floor_only_ruin_does_not_certify", "cargo:mc-core:settlements::autonomy::tests::generated_certification_tests::a_stone_floor_with_an_open_bed_does_not_certify", "cargo:mc-core:settlements::autonomy::tests::generated_certification_tests::an_air_box_certifies_nothing", "cargo:mc-core:settlements::autonomy::tests::generated_certification_tests::the_structure_floor_is_the_boundary", "harness:civilization-seed-qa:adopted_houses_certified"]
repro_check = " Corrected by review ReviewD123Civ13 (M1): the adopted seed-24 village has ZERO certified Houses in both gate receipts (hmfdzb8k scenario.json:2630/65114 lists butcher, mason, natural lumber, storage, natural mine; 014328 has no `house level` line), and the earlier `assess_misses=0` listing proved nothing because `assess` returns Ok with unmet requirements - only `inspect` refuses (buildings.rs:408-430). So the symptom is live (cause open: the listing that once claimed certification measured an unplaced world, and the street-classification fix 010608447b is a separate bug, not the cause): no adopted House piece certifies, so no House exists, so new_house cannot pass. House is wanted all run (0 beds <= 5 residents) and funded (white_wool 3->6, shears), yet LumberCamp/Mine - ranked BELOW House - get built, so the House either finds no legal site or fails at funding; autonomous site refusals are not logged (site_refusals::observe only in the order path construction.rs:920 and storage::plan construction_storage.rs:155). Repro must be a real client gate with a graphical ref; promotion uses patch mode for the pair-rule control: `--fix-patch /run/media/kaiserroman/games/solaris-work/receipts/D123/D123Civ/promotions/SETTLEMENT-ADOPTED-VILLAGE-NO-CERTIFIED-HOUSES.patch` (the one-line enable of the generated caller; reversing it makes the two pair tests fail behaviourally). The classification half of the fix is committed in 5e073d9f5c and its control is the recorded manual reversal (30 passed, 3 failed), not this patch. The seed-24 site listing (village_generation_tests::seed24_generated_pieces_show_which_house_assessment_fails, run with --ignored on the real content cache) settles feasibility: the village advertises 117 pieces, 10 of them hold bed heads, every one of those 10 passes assess(House) level 1, and exactly 1 piece holds both beds and a job site - the one the old classifier turned into a workshop-only record. So the fix certifies real generated houses, and the pair rule serves exactly that one piece; the classification (not the assessment) was the defect.Two causes confirmed and fixed under Main's routing (option 2, 'certify both'): (1) a piece that holds beds and its own workstation classified as the workshop only (piece_kind returned at the first job site, so its beds were lost); (2) an unreadable column was memoised as 'no building' for the world's life. piece_kinds now returns House for bed heads and Workshop for a job site, both when a piece has both, and returns None for an unreadable column so the piece is re-queued; certify accepts exactly the House+Workshop pair on one piece's own bounds, and every other different-kind overlap is still refused. Beds stay counted once (house_beds filters House records, allocator.rs:1246-1264) and work points once (the workshop record carries the job slots). Negative control: with the old classification and the pair rule disabled the 3 new tests fail (30 passed, 3 failed); restored, settlements::autonomy::tests is 33/33. The gate proof is a passed civilization-seed-qa receipt showing beds > 0 and House certifications on the adopted village; until then the row stays open. H36 (D123CivH, 2026-11-25): the cause was `assess`'s all-or-nothing envelope over the WHOLE piece box (buildings.rs:300-340, 378-386), not missing blocks - a vanilla jigsaw box keeps its ridge, eaves, door opening and yard non-solid. Adoption now certifies by piece function and substance (`buildings::assess_generated`, generated caller only): paired beds>=1 and a lower door half for a House, a workstation for a Workshop, a container for Storage, plus >=32 solid cells so air, water or loose furniture never certify; `assess` and every builder/operator/construction/discovery caller are unchanged. Watched gate 20261125T114412-civilization-seed-qa-m0ns24g5 on pin 5060bc323f19-42bc4e0a: at claim, before any construction, 5 Houses (e.g. #4294967297 [125,77,-234]-[131,83,-228], #4294967299 [112,70,-283]-[124,77,-273]) and 6 workshops + natural lumber camp + storage certified; beds=6 in every reading (was 0); 0 `adopted piece refused certification` (the pre-fix run 091714 had 10); 1 birth (tick 9537) and 0 building completions; the run failed on the separate stall oracle (unchanged project status and buildings, sprint 15000->39000), not on certification. Promotion needs a passed receipt (README rule 3) and new_house needs a resident-built House project while this fixture already certifies 5 Houses for 5 residents (CIV-B3), so the row stays open. Honest control map: reversing the buildings.rs hunks leaves `the_builder_envelope_still_refuses_a_real_house_box` and `the_strict_callers_still_refuse_the_real_house_box` green (they assert the strict path, which the reversal restores), and the four classification refs green (their fix is 5e073d9f5c/cc1d848f6b), so those six are not regression refs for this revision; the two strict-path tests remain in the suite as explanation, not proof."
