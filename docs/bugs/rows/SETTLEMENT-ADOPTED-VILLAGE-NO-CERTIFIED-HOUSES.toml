[[bug]]
id = "SETTLEMENT-ADOPTED-VILLAGE-NO-CERTIFIED-HOUSES"
title = "An adopted generated village certifies no House, so the settlement reports beds=0 and every resident is homeless although the village's houses hold beds."
area = "gameplay"
repro = "source"
severity = "major"
status = "open"
source = "Seed-24 civilization-seed-qa 20261124T192024-civilization-seed-qa-1plri8w2 (pin d38c666a1fda): the claimed, adopted village reports 'Migration A=21.7 (housing=0.00 ...); members=6 beds=0 ... buildings=5' in every snapshot, and its building list holds butcher and mason Workshops, a natural lumber camp, a natural mine, the founding Storage and (later) the farm Workshop - never a House. The saved state at the end of the run has six buildings with no House record and households 1-1 (origin adoption) and 1-2 (origin split), both home [114,72,-278], while the generated village's houses hold beds. Same symptom in run 20261124T170423 (beds=0 at every portal read, housing=0.00)."
failing_first = "reported"
fix_commit = "5e073d9f5c"
regression = [
  "cargo:mc-core:settlements::autonomy::tests::an_adopted_house_piece_that_holds_a_workstation_certifies_both",
  "cargo:mc-core:settlements::autonomy::tests::a_workshop_certifies_on_a_house_piece_only_on_its_own_bounds",
  "cargo:mc-core:settlements::autonomy::tests::piece_kinds_separates_the_house_the_workstation_and_neither",
  "cargo:mc-core:settlements::autonomy::tests::a_piece_over_an_unreadable_column_is_classified_later_not_never",
]
repro_check = " The seed-24 site listing (village_generation_tests::seed24_generated_pieces_show_which_house_assessment_fails, run with --ignored on the real content cache) settles feasibility: the village advertises 117 pieces, 10 of them hold bed heads, every one of those 10 passes assess(House) level 1, and exactly 1 piece holds both beds and a job site - the one the old classifier turned into a workshop-only record. So the fix certifies real generated houses, and the pair rule serves exactly that one piece; the classification (not the assessment) was the defect.Two causes confirmed and fixed under Main's routing (option 2, 'certify both'): (1) a piece that holds beds and its own workstation classified as the workshop only (piece_kind returned at the first job site, so its beds were lost); (2) an unreadable column was memoised as 'no building' for the world's life. piece_kinds now returns House for bed heads and Workshop for a job site, both when a piece has both, and returns None for an unreadable column so the piece is re-queued; certify accepts exactly the House+Workshop pair on one piece's own bounds, and every other different-kind overlap is still refused. Beds stay counted once (house_beds filters House records, allocator.rs:1246-1264) and work points once (the workshop record carries the job slots). Negative control: with the old classification and the pair rule disabled the 3 new tests fail (30 passed, 3 failed); restored, settlements::autonomy::tests is 33/33. The gate proof is a passed civilization-seed-qa receipt showing beds > 0 and House certifications on the adopted village; until then the row stays open."
