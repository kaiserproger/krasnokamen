[[bug]]
id = "SETTLEMENT-ADOPTED-VILLAGE-NO-CERTIFIED-HOUSES"
title = "An adopted generated village certifies no House, so the settlement reports beds=0 and every resident is homeless although the village's houses hold beds."
area = "gameplay"
repro = "source"
severity = "major"
status = "open"
source = "Seed-24 civilization-seed-qa 20261124T192024-civilization-seed-qa-1plri8w2 (pin d38c666a1fda): the claimed, adopted village reports 'Migration A=21.7 (housing=0.00 ...); members=6 beds=0 ... buildings=5' in every snapshot, and its building list holds butcher and mason Workshops, a natural lumber camp, a natural mine, the founding Storage and (later) the farm Workshop - never a House. The saved state at the end of the run has six buildings with no House record and households 1-1 (origin adoption) and 1-2 (origin split), both home [114,72,-278], while the generated village's houses hold beds. Same symptom in run 20261124T170423 (beds=0 at every portal read, housing=0.00)."
failing_first = "reported"
regression = [
  "cargo:mc-core:settlements::autonomy::tests::generated_village_adopts_once_and_binds_residents",
]
repro_check = "Not yet isolated to one cause; two candidate causes in the adoption/classification path, both consistent with a village that has houses but certifies none. (1) crates/mc-core/src/settlements/autonomy.rs piece_kind returns Workshop as soon as any block in a piece is a job-site POI, so a generated house that also holds a workstation (a butcher's smoker, a library's lectern) is never a House; (2) the same scan does `let id = state.world.block_at(x, y, z)?` per column, so the first unreadable block (a chunk not loaded when the meeting piece binds) makes piece_kind return None for the whole piece. Downstream, allocator.rs house_beds counts Home POIs only inside BuildingKind::House bounds and migration.rs certified_beds filters by that, so both causes give beds=0 and homeless residents. Next step: probe one run's world for the village's house pieces and their templates/bounds (the bed at household home [114,72,-278] proves at least one house exists), then fix the classification (certify a bed-bearing piece as a House, and defer a piece whose bounds are not fully loaded instead of dropping it) with a cargo test on the adoption path. No fix commit yet."
