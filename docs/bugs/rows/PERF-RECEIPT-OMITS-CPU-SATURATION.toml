[[bug]]
id = "PERF-RECEIPT-OMITS-CPU-SATURATION"
title = "Host telemetry parses cpu.stat for usage_usec only, so nr_throttled and throttled_usec under the CPUQuota are never recorded and no receipt can separate 'expensive code' from 'not enough CPU'."
area = "harness"
repro = "source"
severity = "minor"
status = "open"
source = "receipts/Books/REPORT-R1.md gap G-1 and section F3 (Gregg 2.5.9 USE: check saturation, 6.3.10; perf). HostSample (crates/mc-edge/src/host_telemetry.rs) carries cgroup_cpu_usage_usec, cpu_total_ticks, cpu_steal_ticks and RSS; cpu.stat is parsed for usage_usec only, while the Perf1M box runs CPUQuota=800 % with tick, journal, native writer, rayon and tokio threads in 4 logical CPUs (receipts/Perf1M/RECEIPT-8192.md), and docs/development/heavy-commands-and-memory.md already tells the analyst to check nr_throttled. Verified open on main 5bdc02911 (no nr_throttled or throttled_usec in host_telemetry.rs or tools/coreperf). Fix direction: add nr_throttled and throttled_usec deltas to HostSample and to the profiles.py receipt; then read the 8k and 16k phase tables as on-CPU ms plus waiting ms. Additive fields only."
regression = []
failing_first = "not recorded"
