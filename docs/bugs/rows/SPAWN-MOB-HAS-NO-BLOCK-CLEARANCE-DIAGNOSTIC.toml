[[bug]]
id = "SPAWN-MOB-HAS-NO-BLOCK-CLEARANCE-DIAGNOSTIC"
title = "spawn_mob (the /summon, fixture and plugin path) never asks the world whether the new body overlaps a collision box, and natural spawning gates on other bodies only, so a mob placed inside a block is created silently and suffocates at a fixed position with nothing to name the writer."
area = "gameplay"
repro = "source"
severity = "minor"
status = "fixed"
source = "receipts/Books/REPORT-R6.md section 1 G5 (Ericson 11.1 p. 428 degeneracies; 2.7.1 p. 20 log the arguments of failing queries; perf/hygiene). crates/mc-core/src/tick/entity_lifecycle.rs spawn_mob has no clearance test; crates/mc-core/src/natural_spawn.rs SpawnCensus::overlaps refuses a spawn overlapping another body but never asks the world for a block; the Perf1M fixture history (tools/coreperf/profiles.py sand-collapse note) records an animal summoned into sand that suffocated. Vanilla /summon does place a mob inside a block [INFERENCE: report did not re-read Entity.checkSpawnObstruction], so the report deliberately asks for a count or log when the new AABB already overlaps a collision box, not a refusal, which would change a public command. Verified open on main 5bdc02911 (no overlap query in spawn_mob). Fix direction: one sampler query in spawn_mob that counts and logs (tick, slot, type, pos, half width, writer) on overlap; about 10 lines. Related but separate: ENTITY-CROWD-PUSH-INTO-WALL (its cause was the physics band, closed by e282a959b / 7cca1476d; this row is the missing placement diagnostic)."
regression = ["cargo:mc-core:tick::entity_lifecycle_tests::a_body_spawned_inside_a_block_is_created_and_named", "cargo:mc-core:tick::entity_lifecycle_tests::a_body_standing_on_the_collision_box_is_not_reported", "cargo:mc-core:tick::entity_lifecycle_tests::a_wall_mounted_item_frame_is_not_reported", "cargo:mc-core:tick::entity_lifecycle_tests::a_body_spawned_outside_the_resident_world_is_not_reported"]
failing_first = "reported"
fix_commit = "patch:7ca5ea378d79cf6b1b238ce7424ceba5a0b15edd8580beadee5a6310ffc9b2a0"
repro_check = "`TickState::spawn_mob` (`crates/mc-core/src/tick/entity_lifecycle.rs`) is the single creation point for `/summon`, fixtures, plugins and natural spawning. Two commits close it: a6a30c6694 adds the cell scan and one WARN naming tick, slot, type, position, half width, height and writer; 6130efff2 restricts the scan to living bodies (`EntityArchetype::Living`, so hanging entities/items/orbs never report) and decides residency with `has_chunk` while `block_at` only reads the block (cold overlay included). The spawn is never refused (vanilla `/summon` also places a body inside a block). Regression `tick::entity_lifecycle_tests`: inside-a-block reds on the reversed patch (:59), while standing-on-top, wall-mounted item frame (real `item_frame::spawn` on a stone pillar) and non-resident spawns stay green and are not evidence. Patch identity and hunks: `docs/bugs/promotions/SPAWN-MOB-HAS-NO-BLOCK-CLEARANCE-DIAGNOSTIC.{patch,hunks.md}` (`patch:7ca5ea37…`, promotion `20261124T043400-ledger-promote-oitndrch`)."
promotion = "docs/bugs/promotions/SPAWN-MOB-HAS-NO-BLOCK-CLEARANCE-DIAGNOSTIC.json"
