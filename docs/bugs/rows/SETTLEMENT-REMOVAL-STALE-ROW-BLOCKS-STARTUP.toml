[[bug]]
id = "SETTLEMENT-REMOVAL-STALE-ROW-BLOCKS-STARTUP"
title = "A settlement removed after it reached a checkpoint keeps its settlement/<id> native row; the next startup refuses the world with a capture tick mismatch"
area = "gameplay"
severity = "blocker"
status = "fixed"
source = "CoreGeneralist 2026-11-16, found while writing migration-transit disk tests (wt/MigrationTransit mc-world red receipt .analysis/validation/20261116T142745-test-ulbyie48). Reachable path on main: `/settlement remove <name>` (command_execution/settlement.rs:156, allowed for the settlement's owner or an operator), then a checkpoint, then startup. commit_checkpoint_stream (mc-world/src/native/checkpoint.rs) only inserts incoming global rows, so the row core/journal.rs list_stale_settlement_rows omitted stays with its old capture tick and validate_globals refuses it at the next read: `native settlement/1: capture tick mismatch`. Write-up with contributing factors and defense layers: receipts/SettlementRowDelete/WRITEUP.md. The regression failed before the fix at wt/SettlementRowDelete/.analysis/validation/20261116T145232-test-igi5nlbk with `native settlement/1: capture tick mismatch`. Fix 0794f3da9; its minimal reversal patch removes only settlement-row deletion from the native checkpoint, retaining the test module registration."
repro = "cargo"
regression = ["cargo:mc-core:core::settlement_removal_persistence_tests::removed_settlement_row_is_deleted_by_the_next_checkpoint_and_the_world_reopens"]
fix_commit = "patch:04348809d8ab8bd455a4e1807c75114cfc40ac4a275a27cd5b3a1751c6a5fdd6"
failing_first = "reported"
promotion = "docs/bugs/promotions/SETTLEMENT-REMOVAL-STALE-ROW-BLOCKS-STARTUP.json"
