[[bug]]
id = "SPAININTEG-REPORT-UNPORTED-WORK"
title = "The parked wt/SpainInteg branch holds six unported settlements/villager behaviours, and a wholesale merge onto current main conflicts structurally"
area = "gameplay"
repro = "source"
severity = "major"
status = "open"
source = "Owner D142/D143 (2026-11-28): decide explicitly whether wt/SpainInteg is merged in parts or retired. Measured: branch head 99b3bf0154da, base d9c3a591, 22 non-merge commits ahead while main advanced 2123 commits, including the mc-chunk-loader, mc-survival, mc-domain, mc-inventory and mc-placement crate cuts and 173 settlements commits. `git merge wt/SpainInteg` onto main 206fe0626 auto-merged nine files and left 15 conflict hunks in settlements/construction.rs, construction_preparation.rs, construction_stall_tests.rs, construction_terrain_tests.rs and forestry.rs (forestry::lot_has_tree alone takes a different signature because both sides restructured the construction/preparation API); the merge was aborted and no main byte changed. The branch is content-live, not content-stale: its added symbols are absent from main (`released_carry`, `SHUNNED_PRIORITY`, `ROUTE_NODES`, `WALK_NODES`, `fuel_budget`, `furnace_fuel_protection`, `founding_split_*` tests all grep empty on main). Decision recorded: keep the branch as the source patch series and re-port it feature by feature, each with its own focused gate and row. Families: (1) D7 territory terrain, commits d5123e2e1, ccc408d56, 83e97e4e8; (2) founding outposts and daughter split, 7e9ad6c24, 2195981eb, 98eab23e3, a0ae2b282; (3) construction supply, 2e2213ce7, 1fd4bc9f6, ed0697168, 6fb805771; (4) builder shun and stall accounting, 0cd64cdbe, e1d84f9c5; (5) released-carry custody, 18ea1a5c3, 33554901a; (6) villager perimeter route plus harness budget/finalize, 702bb6e41, d8f9990f6, 696379ab6, d46fe2af6. Each family becomes its own fix row when its slice starts; this row is the tracked record so the branch does not hang undecided."
regression = []
