[[bug]]
id = "WAL-BLOCK-STATE-IDS-HAVE-NO-PALETTE-IDENTITY"
title = "The WAL stores block states as raw vanilla state ids with no palette or data-version fingerprint in the batch header or the manifest, so a tail written by one build and replayed by another silently remaps blocks."
area = "gameplay"
repro = "source"
severity = "major"
status = "open"
source = "receipts/Books/REPORT-R5.md section 1 G5 (Petrov ch. 5 p. 91, ch. 3 versioning p. 57-58; silent corruption of the WAL tail). JournalEntry::Block { state: u32 } (crates/mc-core/src/journal.rs) is the vanilla global block-state id from the parsed blocks.json report (crates/mc-world/src/block.rs BlockRegistry::from_report); replay applies it with no identity check (journal/replay.rs, core/recovery.rs, world.rs overlay compares families only, an out-of-range id is stored and fails later at dictionary encode); the batch header and CheckpointManifest carry no fingerprint. The checkpointed store is name-anchored (validate_tables, block dictionary) and block_log rows encode {Name, Properties}, so the WAL tail is the only numeric surface. Scenario: a hard kill leaves a non-empty tail (a checkpoint is only every 1200 ticks), the operator starts the next pin whose blocks.json renumbers states [INFERENCE: vanilla renumbers states between versions], and up to one checkpoint interval of edits replay as the wrong blocks. Verified open on main 5bdc02911 (no fingerprint anywhere in journal.rs or native_checkpoint.rs). Fix direction: NOT decided, a format change (architecture committee, receipts/Books/PERSIST6-SYNTHESIS.md): a palette/registry fingerprint carried with the WAL tail and verified before replay; a missing or mismatching fingerprint with a non-empty tail fails closed (never replayed with a warning); an empty tail does not bind the world to the old palette. Landing (WAL frame v2, ADR 0013): the frame carries the store identity and the block-palette digest; replay refuses a mismatched store or palette naming both, and a v1 frame is refused through the same clean-stop path (no compatibility surface of our own). The per-instance identity the report asked for exists: the store header's `store_uuid` is `Uuid::new_v4()` bytes written once when the store is created (crates/mc-world/src/native.rs:588) and read back on every open (:289), so it is unique per world instance and is not derived from the seed or revision - no new persisted key is needed."
regression = ["cargo:mc-core:journal_tests::recovery_refuses_a_tail_written_under_another_block_palette", "cargo:mc-core:journal_tests::recovery_refuses_a_batch_whose_palette_digest_is_zero"]
fix_commit = "patch:196f4c5887a160d537bf24084387e284aa4176aaebb309c464ccfb31e7b02ad8"
failing_first = "not recorded"
