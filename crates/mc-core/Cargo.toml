[package]
name = "mc-core"
description = "Core model v2 (ADR 0013): data-parallel tick, columnar world state, tick journal (Krasnokamen)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
mc-data = { path = "../mc-data" }
mc-domain = { path = "../mc-domain" }
mc-inventory = { path = "../mc-inventory" }
mc-world = { path = "../mc-world" }
mc-worldgen = { path = "../mc-worldgen" }
mc-physics = { path = "../mc-physics" }
mc-nbt = { path = "../mc-nbt" }
mc-script = { path = "../mc-script" }
mc-loader = { path = "../mc-loader" }
mc-plugin-host = { path = "../mc-plugin-host" }
mc-melee-range = { path = "../mc-melee-range" }
mc-placement = { path = "../mc-placement" }
mc-light = { path = "../mc-light" }
mc-chunk-loader = { path = "../mc-chunk-loader" }
uuid = { workspace = true, features = ["v4"] }
tokio.workspace = true
serde = { workspace = true, features = ["rc"] }
# WAL battle patches pass floats through `serde_json::Value`: parsing must be exact.
serde_json = { workspace = true, features = ["float_roundtrip"] }
zip.workspace = true
regex = { version = "1", default-features = false, features = ["std", "unicode"] }
crc32fast.workspace = true
flate2.workspace = true
rayon.workspace = true
parking_lot.workspace = true
rustc-hash.workspace = true
im = "15.1"
thiserror.workspace = true
tracing.workspace = true
sha2.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "time"] }

[dev-dependencies]
# The ChunkWorld light tests assert that tick admission never rebakes a chunk;
# the counter behind that assertion only exists in this test build.
mc-light = { path = "../mc-light", features = ["light-counters"] }
workspace-features.workspace = true
tracing-subscriber.workspace = true
tempfile = "3"
redb = "=3.1.0"
wit-component = "0.259"
proptest = { workspace = true }

[[bin]]
name = "core-bench"
path = "src/bin/core_bench.rs"
