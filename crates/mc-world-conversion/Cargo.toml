[package]
name = "mc-world-conversion"
description = "Offline Anvil interchange, native census and probes for Krasnokamen worlds."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
mc-core = { path = "../mc-core" }
mc-data = { path = "../mc-data" }
mc-nbt = { path = "../mc-nbt" }
mc-world = { path = "../mc-world" }
mc-plugin-host = { path = "../mc-plugin-host" }
serde.workspace = true
serde_json.workspace = true
uuid = { workspace = true, features = ["v4"] }
flate2.workspace = true
crc32fast.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
tokio.workspace = true
